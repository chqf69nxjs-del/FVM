name: Stage 7 P1 Pressure-Phase Relationship A1

on:
  push:
    branches:
      - agent/stage7-p1-pressure-phase-relationship-a1
    paths:
      - 'src/liquid_gas_transient/hem_pipeline_pressure_phase_relationship.py'
      - 'tests/test_stage7_p1_pressure_phase_relationship.py'
      - 'docs/verification/stage7_p1_pressure_phase_relationship_increment_a1.md'
      - '.github/workflows/stage7-p1-pressure-phase-relationship-a1.yml'
  pull_request:
    paths:
      - 'src/liquid_gas_transient/hem_pipeline_pressure_phase_relationship.py'
      - 'tests/test_stage7_p1_pressure_phase_relationship.py'
      - 'docs/verification/stage7_p1_pressure_phase_relationship_increment_a1.md'
      - '.github/workflows/stage7-p1-pressure-phase-relationship-a1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: stage7-p1-pressure-phase-relationship-a1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: src:tools/verification
  PYTHONDONTWRITEBYTECODE: '1'
  ANALYSIS_SOURCE_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  p1-pressure-phase-relationship-a1:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy matplotlib pytest 'CoolProp==8.0.0'
          python - <<'PY'
          import platform
          import matplotlib
          import numpy
          import pytest
          import CoolProp

          print('python=' + platform.python_version())
          print('numpy=' + numpy.__version__)
          print('matplotlib=' + matplotlib.__version__)
          print('pytest=' + pytest.__version__)
          print('CoolProp=' + CoolProp.__version__)
          PY

      - name: Assert pristine checkout
        run: |
          set -euo pipefail
          echo "checkout_sha=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$ANALYSIS_SOURCE_GIT_SHA"
          status="$(git status --porcelain=v1 --untracked-files=all)"
          printf 'pre_execution_git_status=%s\n' "$status"
          test -z "$status"

      - name: Execute bounded P1 A1 relationship slice
        run: |
          set -euo pipefail
          temporary_output="${RUNNER_TEMP}/stage7-p1-pressure-phase-relationship-a1"
          repository_output="artifacts/stage7-p1-pressure-phase-relationship-a1"
          rm -rf "$temporary_output" "$repository_output"
          python -m liquid_gas_transient.hem_pipeline_pressure_phase_relationship \
            --output-dir "$temporary_output"
          tracked_status="$(git status --porcelain=v1 --untracked-files=no)"
          printf 'post_execution_tracked_git_status=%s\n' "$tracked_status"
          test -z "$tracked_status"
          mkdir -p "$repository_output"
          cp -a "$temporary_output/." "$repository_output/"

      - name: Inspect exact P1 A1 output contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          target = Path('artifacts/stage7-p1-pressure-phase-relationship-a1')
          expected = {
              'relationship_summary.json',
              'cell_lag.csv',
              'front_speed.csv',
              'threshold_sensitivity.csv',
              'front_relationship.png',
              'cell_phase_lag.png',
              'operator_report.md',
              'relationship_manifest.json',
          }
          actual = {path.name for path in target.iterdir() if path.is_file()}
          assert actual == expected, (expected, actual)

          summary = json.loads(
              (target / 'relationship_summary.json').read_text(encoding='utf-8')
          )
          manifest = json.loads(
              (target / 'relationship_manifest.json').read_text(encoding='utf-8')
          )
          assert summary['schema_version'] == 'stage7_p1_pressure_phase_relationship_a1_v1'
          assert summary['scope'] == 'bounded_pressure_to_phase_relationship_postprocessing_only'
          assert summary['model_id'] == 'HEM_EQUILIBRIUM'
          assert summary['relationship_execution_status'] == 'RELATIONSHIP_READY'
          assert summary['relationship_ready'] is True
          assert summary['cell_lag_record_count'] == 32
          assert summary['phase_onset_cell_count'] >= 1
          assert summary['persistent_phase_onset_cell_count'] >= 1
          assert 30 in summary['phase_toggle_cell_indices']
          assert summary['threshold_multipliers'] == [0.1, 1.0, 10.0]
          assert summary['minimum_persistent_phase_samples'] == 2
          assert len(summary['threshold_sensitivity_summary']) == 3
          assert all(summary['gate_results'].values())
          assert summary['physics_or_numerics_changed'] is False

          formal = summary['formal_status']
          assert formal['implemented'] is True
          assert formal['working_vertical_slice'] is False
          assert formal['verified'] is False
          assert formal['accepted'] is False
          assert formal['physically_validated'] is False
          assert formal['design_use_accepted'] is False
          assert formal['production_approved'] is False

          assert manifest['declared_file_count'] == 8
          assert set(manifest['declared_file_names']) == expected
          assert set(manifest['payload_files']) == expected - {'relationship_manifest.json'}
          assert manifest['relationship_sha256'] == summary['relationship_sha256']
          assert manifest['physics_or_numerics_changed'] is False
          for item in manifest['payload_files'].values():
              assert item['size_bytes'] > 0
              assert len(item['sha256']) == 64

          with (target / 'cell_lag.csv').open(encoding='utf-8', newline='') as stream:
              cell_rows = list(csv.DictReader(stream))
          with (target / 'front_speed.csv').open(encoding='utf-8', newline='') as stream:
              speed_rows = list(csv.DictReader(stream))
          with (target / 'threshold_sensitivity.csv').open(encoding='utf-8', newline='') as stream:
              threshold_rows = list(csv.DictReader(stream))
          assert len(cell_rows) == 32
          assert len(threshold_rows) == 96
          assert {row['front_kind'] for row in speed_rows} == {
              'PRESSURE_FRONT',
              'PHASE_FRONT',
          }
          assert (target / 'front_relationship.png').stat().st_size > 0
          assert (target / 'cell_phase_lag.png').stat().st_size > 0
          PY

      - name: Compile and diff checks
        run: |
          set -euo pipefail
          python -m compileall -q src tests
          git diff --check

      - name: Run focused P1 A1 tests
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_stage7_p1_pressure_phase_relationship.py \
            --strict-markers --junitxml=p1-a1-focused.xml

      - name: Run P1 A0 regression
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_stage7_p1_post_crossing_analysis.py \
            --strict-markers --junitxml=p1-a1-a0-regression.xml

      - name: Run existing Gate 6 regression
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_stage7_lco2_hem_pipeline_post_crossing_propagation.py \
            --strict-markers --junitxml=p1-a1-gate6-regression.xml

      - name: Run full repository tests
        run: |
          set -euo pipefail
          python -m pytest -q --strict-markers --junitxml=p1-a1-full-repository.xml

      - name: Assert authoritative JUnit is clean
        run: |
          set -euo pipefail
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          for name in (
              'p1-a1-focused.xml',
              'p1-a1-a0-regression.xml',
              'p1-a1-gate6-regression.xml',
              'p1-a1-full-repository.xml',
          ):
              root = ET.parse(Path(name)).getroot()
              suites = [root] if root.tag == 'testsuite' else list(root.findall('testsuite'))
              totals = {
                  key: sum(int(s.attrib.get(key, 0)) for s in suites)
                  for key in ('tests', 'skipped', 'failures', 'errors')
              }
              print(name, totals)
              assert totals['skipped'] == 0
              assert totals['failures'] == 0
              assert totals['errors'] == 0
          PY

      - name: Upload P1 A1 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stage7-p1-pressure-phase-relationship-a1-${{ github.run_id }}
          path: |
            artifacts/stage7-p1-pressure-phase-relationship-a1
            p1-a1-focused.xml
            p1-a1-a0-regression.xml
            p1-a1-gate6-regression.xml
            p1-a1-full-repository.xml
          if-no-files-found: warn
