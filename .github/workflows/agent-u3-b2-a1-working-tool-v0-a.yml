name: Agent U3 B2 A1 Working Tool v0-A JSON CLI

on:
  workflow_dispatch:
  push:
    branches: [agent/u3-b2-a1-working-tool-v0-a]
    paths:
      - "src/liquid_gas_transient/working_tool/**"
      - "tools/working_tool/run_working_tool_v0_a.py"
      - "tools/verification/u3_b2_a1_working_tool_v0_a_*.py"
      - "examples/working_tool/canonical_a2_case_v0.json"
      - "tests/test_working_tool_v0_a_case_file_cli.py"
      - "docs/verification/stage7_u3_b2_a1_working_tool_v0_a_case_file_cli_spec.md"
      - ".github/workflows/agent-u3-b2-a1-working-tool-v0-a.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: agent-u3-b2-a1-working-tool-v0-a
  cancel-in-progress: true

jobs:
  v0-a-json-cli:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"

      - name: Install fixed dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            'numpy==2.5.1' \
            'CoolProp==8.0.0' \
            'pytest==9.1.1'

      - name: Verify v0-A source scope
        shell: bash
        env:
          W2_CLOSEOUT_HEAD: d9f196d1a4843351b538a17af929f14246d84abf
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --check "${W2_CLOSEOUT_HEAD}" HEAD
          git diff --exit-code "${W2_CLOSEOUT_HEAD}" HEAD -- pyproject.toml
          changed="$(git diff --name-only "${W2_CLOSEOUT_HEAD}" HEAD)"
          forbidden="$(printf '%s\n' "${changed}" | grep -Ev '^(docs/verification/stage7_u3_b2_a1_working_tool_v0_a_|src/liquid_gas_transient/working_tool/(case_io|application|__init__)\.py$|tools/working_tool/run_working_tool_v0_a\.py$|tools/verification/u3_b2_a1_working_tool_v0_a_regression\.py$|examples/working_tool/canonical_a2_case_v0\.json$|tests/test_working_tool_v0_a_case_file_cli\.py$|\.github/workflows/agent-u3-b2-a1-working-tool-v0-a\.yml$)' || true)"
          test -z "${forbidden}" || { printf 'unexpected changed paths:\n%s\n' "${forbidden}"; exit 1; }

      - name: Compile v0-A sources
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src:tools/verification python -m py_compile \
            src/liquid_gas_transient/working_tool/case_io.py \
            src/liquid_gas_transient/working_tool/application.py \
            src/liquid_gas_transient/working_tool/__init__.py \
            tools/working_tool/run_working_tool_v0_a.py \
            tools/verification/u3_b2_a1_working_tool_v0_a_regression.py \
            tests/test_working_tool_v0_a_case_file_cli.py

      - name: Verify repository CLI bootstrap without PYTHONPATH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/u3-b2-a1-working-tool-v0-a
          env -u PYTHONPATH python tools/working_tool/run_working_tool_v0_a.py --help \
            > artifacts/u3-b2-a1-working-tool-v0-a/cli-help.txt
          grep -F -- '--case' artifacts/u3-b2-a1-working-tool-v0-a/cli-help.txt
          grep -F -- '--output-dir' artifacts/u3-b2-a1-working-tool-v0-a/cli-help.txt

      - name: Run retained W0 W1 W2 and v0-A focused tests
        shell: bash
        run: |
          set -euo pipefail
          output=artifacts/u3-b2-a1-working-tool-v0-a
          mkdir -p "${output}"
          PYTHONPATH=src:tools/verification python -m pytest -q \
            tests/test_working_tool_w0_contracts.py \
            tests/test_working_tool_w1_a2_live_backend.py \
            tests/test_working_tool_w2_full_horizon.py \
            tests/test_working_tool_v0_a_case_file_cli.py \
            --junitxml="${output}/pytest.xml" \
            | tee "${output}/pytest.log"

      - name: Verify and download immutable A2 authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          A2_SOURCE_SHA: 947b0f0bf006e8015c3c109e57a8aeb7460cca02
          A2_RUN_ID: "31719604102"
          A2_JOB_ID: "94512927800"
          A2_ARTIFACT_ID: "9189445884"
          A2_ARTIFACT_NAME: u3-b2-a1-increment-9m-a2-31719604102
          A2_ARTIFACT_SHA256: 4678ecd9f919ea513bed16652a1fe5b484d6c664b74209bf7dbaffa2dc0a2b64
        run: |
          set -euo pipefail
          parent_root="${RUNNER_TEMP}/working-tool-v0-a-a2-authority"
          rm -rf "${parent_root}"
          mkdir -p "${parent_root}/artifact"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${A2_RUN_ID}" \
            > "${parent_root}/run.json"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${A2_RUN_ID}/jobs?per_page=100" \
            > "${parent_root}/jobs.json"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${A2_ARTIFACT_ID}" \
            > "${parent_root}/artifact.json"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${A2_ARTIFACT_ID}/zip" \
            > "${parent_root}/artifact.zip"
          test "$(sha256sum "${parent_root}/artifact.zip" | awk '{print $1}')" = "${A2_ARTIFACT_SHA256}"
          unzip -q "${parent_root}/artifact.zip" -d "${parent_root}/artifact"
          (
            cd "${parent_root}/artifact"
            sha256sum -c artifact_sha256.txt
          )
          python - "${parent_root}" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          run = json.loads((root / 'run.json').read_text(encoding='utf-8'))
          jobs = json.loads((root / 'jobs.json').read_text(encoding='utf-8'))
          artifact = json.loads((root / 'artifact.json').read_text(encoding='utf-8'))
          expected_source = os.environ['A2_SOURCE_SHA']
          expected_run = int(os.environ['A2_RUN_ID'])
          expected_job = int(os.environ['A2_JOB_ID'])
          expected_artifact = int(os.environ['A2_ARTIFACT_ID'])
          expected_name = os.environ['A2_ARTIFACT_NAME']
          expected_sha = os.environ['A2_ARTIFACT_SHA256']
          job = next(row for row in jobs['jobs'] if int(row['id']) == expected_job)
          assert int(run['id']) == expected_run
          assert run['head_sha'] == expected_source
          assert run['conclusion'] == 'success'
          assert job['conclusion'] == 'success'
          assert int(artifact['id']) == expected_artifact
          assert artifact['name'] == expected_name
          assert artifact['digest'] == f'sha256:{expected_sha}'
          assert artifact['expired'] is False
          assert artifact['workflow_run']['head_sha'] == expected_source
          authority = {
              'live_metadata_verified': True,
              'source_git_sha': expected_source,
              'workflow_run': expected_run,
              'workflow_job': expected_job,
              'run_conclusion': run['conclusion'],
              'job_conclusion': job['conclusion'],
              'artifact_id': expected_artifact,
              'artifact_name': expected_name,
              'artifact_digest': artifact['digest'],
              'artifact_sha256': expected_sha,
              'archive_sha256': expected_sha,
              'artifact_expired': artifact['expired'],
          }
          (root / 'a2_authority.json').write_text(
              json.dumps(authority, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          echo "V0_A_A2_PARENT_DIR=${parent_root}/artifact" >> "${GITHUB_ENV}"
          echo "V0_A_A2_AUTHORITY_JSON=${parent_root}/a2_authority.json" >> "${GITHUB_ENV}"

      - name: Run authoritative v0-A JSON CLI full-horizon regression
        shell: bash
        run: |
          set -euo pipefail
          output=artifacts/u3-b2-a1-working-tool-v0-a/regression
          rm -rf "${output}"
          PYTHONPATH=src:tools/verification \
            python tools/verification/u3_b2_a1_working_tool_v0_a_regression.py \
              --case examples/working_tool/canonical_a2_case_v0.json \
              --contract docs/verification/stage7_u3_b2_fvm_discharge_coupling_contract_v1.json \
              --b1-contract docs/verification/stage7_u3_b1_critical_state_contract_v1.json \
              --a2-artifact-dir "${V0_A_A2_PARENT_DIR}" \
              --a2-authority-json "${V0_A_A2_AUTHORITY_JSON}" \
              --output-dir "${output}" \
              --source-git-sha "${GITHUB_SHA}" \
            | tee artifacts/u3-b2-a1-working-tool-v0-a/regression-console.log

      - name: Inspect v0-A regression and public-result separation
        shell: bash
        run: |
          set -euo pipefail
          output=artifacts/u3-b2-a1-working-tool-v0-a/regression
          python - "${output}" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          regression = json.loads(
              (root / 'v0_a_behavioral_regression.json').read_text(encoding='utf-8')
          )
          public = json.loads(
              (root / 'public-result' / 'summary.json').read_text(encoding='utf-8')
          )
          assert regression['outcome'] == 'WORKING_TOOL_V0_A_EXACT_A2_BEHAVIORAL_REGRESSION_PASS'
          assert regression['cli_return_code'] == 0
          assert regression['cli_application_gate_passed'] is True
          assert regression['parent_authority_gate_passed'] is True
          assert regression['full_horizon_execution_gate_passed'] is True
          assert regression['manager_and_restoration_gate_passed'] is True
          assert regression['public_result_gate_passed'] is True
          assert regression['exact_a2_behavioral_regression_passed'] is True
          assert all(
              row['exact_match']
              for row in regression['exact_summary_field_comparison'].values()
          )
          assert all(
              row['exact_match']
              for row in regression['exact_csv_comparison'].values()
          )
          assert all(
              row['exact_match']
              for row in regression['exact_npz_array_comparison'].values()
          )
          assert public['case_id'] == 'WORKING-TOOL-V0-A-CANONICAL-A2'
          assert public['accepted_steps'] == 640
          assert public['target_horizon_reached'] is True
          assert public['horizon_time_error_s'] == 0.0
          assert public['verified'] is False
          assert public['accepted'] is False
          assert public['validated'] is False
          assert public['design_use_approved'] is False
          PY
          (
            cd "${output}"
            sha256sum -c artifact_sha256.txt
          )

      - name: Record source metadata and workflow evidence manifest
        if: always()
        shell: bash
        env:
          W2_CLOSEOUT_HEAD: d9f196d1a4843351b538a17af929f14246d84abf
        run: |
          set -euo pipefail
          output=artifacts/u3-b2-a1-working-tool-v0-a
          mkdir -p "${output}"
          printf '%s\n' "${GITHUB_SHA}" > "${output}/source_git_sha.txt"
          git diff --name-only "${W2_CLOSEOUT_HEAD}" HEAD > "${output}/changed_paths.txt"
          (
            cd "${output}"
            find . -type f ! -name workflow_artifact_sha256.txt -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              > workflow_artifact_sha256.txt
          )

      - name: Upload v0-A evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: u3-b2-a1-working-tool-v0-a-${{ github.run_id }}
          path: artifacts/u3-b2-a1-working-tool-v0-a
          if-no-files-found: error
