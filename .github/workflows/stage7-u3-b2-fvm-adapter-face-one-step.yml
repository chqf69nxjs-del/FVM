name: Stage 7 U3 B2 FVM Adapter Face and One-Step Authority

on:
  pull_request:
    paths:
      - "src/liquid_gas_transient/solver.py"
      - "src/liquid_gas_transient/u3_b2_fvm_discharge_adapter.py"
      - "src/liquid_gas_transient/u3_b2_fvm_discharge_adapter_authoritative.py"
      - "tests/test_stage7_u3_b2_fvm_discharge_adapter.py"
      - "docs/verification/stage7_u3_b2_fvm_discharge_adapter.md"
      - "docs/verification/stage7_u3_b2_fvm_discharge_coupling_contract_v1.json"
      - "docs/verification/stage7_u3_b2_fvm_discharge_coupling_event_provenance_contract_v1.json"
      - "docs/verification/stage7_u3_b1_critical_state_contract_v1.json"
      - ".github/workflows/stage7-u3-b2-fvm-adapter-face-one-step.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage7-u3-b2-adapter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: src
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONPYCACHEPREFIX: /tmp/u3-b2-pycache
  MPLBACKEND: Agg
  ANALYSIS_SOURCE_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  REFERENCE_SOURCE_GIT_SHA: 0e2c8188961175b3c2cd56836296e713735bf8d9
  B1_REFERENCE_SOURCE_GIT_SHA: c7c25efae0e53a8b5f5ed164f9135238c6e005e0
  REFERENCE_ARTIFACT_ID: "9007750537"
  REFERENCE_ARTIFACT_ZIP_SHA256: 1816e60920052391cb9ffde9242597b56571c9ed113c60ece8aa9f32cdb8c7cd

jobs:
  u3-b2-fvm-adapter-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout exact Adapter head
        uses: actions/checkout@v7
        with:
          ref: ${{ env.ANALYSIS_SOURCE_GIT_SHA }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"

      - name: Install fixed dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            'numpy==2.5.1' \
            'matplotlib==3.11.1' \
            'pytest==9.1.1' \
            'CoolProp==8.0.0'

      - name: Assert pristine exact-head checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ANALYSIS_SOURCE_GIT_SHA"
          status="$(git status --porcelain=v1 --untracked-files=all)"
          printf 'pre_execution_git_status=%s\n' "$status"
          test -z "$status"
          test -z "$(git ls-files | grep -E '(^|/)(__pycache__/|.*\.py[co]$)' || true)"
          test ! -e .agent_clean_payloads
          test ! -e .github/workflows/agent-u3-b2-clean-materialize.yml

      - name: Verify pinned Reference source identities
        run: |
          set -euo pipefail
          for path in \
            src/liquid_gas_transient/u3_b2_fvm_discharge_reference.py \
            src/liquid_gas_transient/u3_b2_fvm_discharge_reference_authoritative.py \
            tests/test_stage7_u3_b2_fvm_discharge_reference.py
          do
            pinned="$(git rev-parse "$REFERENCE_SOURCE_GIT_SHA:$path")"
            current="$(git rev-parse "HEAD:$path")"
            echo "$path pinned=$pinned current=$current"
            test "$pinned" = "$current"
          done
          for path in \
            src/liquid_gas_transient/u3_b1_critical_state_reference.py \
            src/liquid_gas_transient/u3_b1_critical_state_authoritative.py
          do
            pinned="$(git rev-parse "$B1_REFERENCE_SOURCE_GIT_SHA:$path")"
            current="$(git rev-parse "HEAD:$path")"
            echo "$path pinned=$pinned current=$current"
            test "$pinned" = "$current"
          done

      - name: Compile and diff checks outside repository cache
        run: |
          set -euo pipefail
          rm -rf "$PYTHONPYCACHEPREFIX"
          python -m py_compile \
            src/liquid_gas_transient/solver.py \
            src/liquid_gas_transient/u3_b2_fvm_discharge_adapter.py \
            src/liquid_gas_transient/u3_b2_fvm_discharge_adapter_authoritative.py \
            tests/test_stage7_u3_b2_fvm_discharge_adapter.py
          git diff --check
          tracked_status="$(git status --porcelain=v1 --untracked-files=no)"
          printf 'post_compile_tracked_git_status=%s\n' "$tracked_status"
          test -z "$tracked_status"
          test -z "$(git ls-files | grep -E '(^|/)(__pycache__/|.*\.py[co]$)' || true)"

      - name: Run dedicated B2 Adapter tests
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_stage7_u3_b2_fvm_discharge_adapter.py \
            --strict-markers \
            --junitxml=dedicated_junit.xml

      - name: Run related U3 regressions
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_stage7_u3_b1_critical_state_contract.py \
            tests/test_stage7_u3_b1_critical_state_reference.py \
            tests/test_stage7_u3_b1_critical_state_authoritative.py \
            tests/test_stage7_u3_b1_critical_state_adapter.py \
            tests/test_stage7_u3_b2_fvm_discharge_coupling_contract.py \
            tests/test_stage7_u3_b2_fvm_discharge_coupling_extension_contract.py \
            tests/test_stage7_u3_b2_fvm_discharge_reference.py \
            tests/test_stage7_u3_b2_fvm_discharge_adapter.py \
            --strict-markers \
            --junitxml=related_junit.xml

      - name: Run full repository tests
        run: |
          set -euo pipefail
          python -m pytest -q \
            --strict-markers \
            --junitxml=full_repository_junit.xml

      - name: Assert authoritative JUnit is clean
        run: |
          set -euo pipefail
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          expectations = {
              "dedicated_junit.xml": (10, 10),
              "related_junit.xml": (40, None),
              "full_repository_junit.xml": (960, None),
          }
          for name, (minimum, exact) in expectations.items():
              root = ET.parse(Path(name)).getroot()
              suites = (
                  [root]
                  if root.tag == "testsuite"
                  else list(root.findall("testsuite"))
              )
              totals = {
                  key: sum(int(suite.attrib.get(key, 0)) for suite in suites)
                  for key in ("tests", "skipped", "failures", "errors")
              }
              print(name, totals)
              if exact is not None:
                  assert totals["tests"] == exact
              else:
                  assert totals["tests"] >= minimum
              assert totals["skipped"] == 0
              assert totals["failures"] == 0
              assert totals["errors"] == 0
          PY

      - name: Execute face and one-step authority
        run: |
          set -euo pipefail
          output="artifacts/stage7-u3-b2-fvm-adapter"
          rm -rf "$output"
          python -m liquid_gas_transient.u3_b2_fvm_discharge_adapter_authoritative \
            --contract docs/verification/stage7_u3_b2_fvm_discharge_coupling_contract_v1.json \
            --extension-contract docs/verification/stage7_u3_b2_fvm_discharge_coupling_event_provenance_contract_v1.json \
            --b1-contract docs/verification/stage7_u3_b1_critical_state_contract_v1.json \
            --adapter-source src/liquid_gas_transient/u3_b2_fvm_discharge_adapter.py \
            --output-dir "$output" \
            --source-git-sha "$ANALYSIS_SOURCE_GIT_SHA" \
            --reference-source-git-sha "$REFERENCE_SOURCE_GIT_SHA" \
            --reference-artifact-id "$REFERENCE_ARTIFACT_ID" \
            --reference-artifact-zip-sha256 "$REFERENCE_ARTIFACT_ZIP_SHA256" \
            --dedicated-junit dedicated_junit.xml \
            --related-junit related_junit.xml \
            --full-junit full_repository_junit.xml

      - name: Inspect Adapter authority artifact
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import hashlib
          import json
          import os
          from pathlib import Path

          from PIL import Image

          target = Path("artifacts/stage7-u3-b2-fvm-adapter")
          expected = {
              "summary.json",
              "runtime_and_git_provenance.json",
              "benchmark_contract.json",
              "event_provenance_contract.json",
              "b1_component_contract.json",
              "adapter_face_results.csv",
              "reference_adapter_face_flux_comparison.csv",
              "one_step_conservative_update_comparison.csv",
              "guard_outcomes.csv",
              "locked_checks.csv",
              "reference_adapter_face_flux_parity.png",
              "report.md",
              "dedicated_junit.xml",
              "related_junit.xml",
              "full_repository_junit.xml",
              "artifact_sha256.txt",
          }
          assert {path.name for path in target.iterdir()} == expected

          summary = json.loads((target / "summary.json").read_text(encoding="utf-8"))
          assert summary["schema_version"] == (
              "stage7_u3_b2_fvm_discharge_adapter_authority_v1"
          )
          assert summary["face_row_count"] == 13
          assert summary["face_comparison_count"] == 52
          assert summary["face_comparison_pass_count"] == 52
          assert summary["all_face_formal_outcomes_match"] is True
          assert summary["all_reference_adapter_face_comparisons_passed"] is True
          assert summary["one_step_case_count"] == 1
          assert summary["one_step_comparison_passed"] is True
          assert summary["guard_row_count"] == 7
          assert summary["guard_comparison_pass_count"] == 7
          assert summary["all_guard_outcomes_and_atomicity_passed"] is True
          assert summary["all_locked_adapter_authority_checks_passed"] is True
          assert summary["u3_b2_contract_locked"] is True
          assert summary["u3_b2_reference_implemented"] is True
          assert summary["candidate_u3_b2_fvm_adapter_implemented"] is True
          assert summary["candidate_single_phase_fvm_discharge_mapping_verified"] is True
          assert summary["u3_b2_fvm_adapter_implemented"] is False
          assert summary["single_phase_fvm_discharge_mapping_verified"] is False
          assert summary["u3_b2_finite_pipe_execution_complete"] is False
          assert summary["u3_b2_verification_benchmark_accepted"] is False
          assert summary["physical_validation"] is False
          assert summary["design_use_acceptance"] is False
          assert summary["production_hem_activation_approved"] is False

          provenance = json.loads(
              (target / "runtime_and_git_provenance.json").read_text(
                  encoding="utf-8"
              )
          )
          assert summary["provenance"] == provenance
          assert provenance["source_git_sha"] == os.environ["ANALYSIS_SOURCE_GIT_SHA"]
          assert provenance["reference_source_git_sha"] == os.environ[
              "REFERENCE_SOURCE_GIT_SHA"
          ]
          assert provenance["reference_historical_artifact_id"] == int(
              os.environ["REFERENCE_ARTIFACT_ID"]
          )
          assert provenance["reference_historical_artifact_zip_sha256"] == (
              os.environ["REFERENCE_ARTIFACT_ZIP_SHA256"]
          )
          assert provenance["property_backend_version"] == "8.0.0"
          assert provenance["workflow_run_id"] == int(os.environ["GITHUB_RUN_ID"])
          assert provenance["workflow_run_attempt"] == int(
              os.environ["GITHUB_RUN_ATTEMPT"]
          )
          assert provenance["git_status_porcelain_tracked"] == ""
          assert provenance["adapter_imports_B2_reference"] is False
          assert provenance["reference_used_only_as_comparison_target"] is True

          with (target / "adapter_face_results.csv").open(
              newline="", encoding="utf-8"
          ) as handle:
              faces = list(csv.DictReader(handle))
          assert len(faces) == 13

          with (target / "reference_adapter_face_flux_comparison.csv").open(
              newline="", encoding="utf-8"
          ) as handle:
              comparisons = list(csv.DictReader(handle))
          assert len(comparisons) == 52
          assert all(row["comparison_passed"] == "True" for row in comparisons)

          with (target / "one_step_conservative_update_comparison.csv").open(
              newline="", encoding="utf-8"
          ) as handle:
              one_step = list(csv.DictReader(handle))
          assert len(one_step) == 1
          assert one_step[0]["one_step_comparison_passed"] == "True"

          with (target / "guard_outcomes.csv").open(
              newline="", encoding="utf-8"
          ) as handle:
              guards = list(csv.DictReader(handle))
          assert len(guards) == 7
          assert all(row["guard_comparison_passed"] == "True" for row in guards)

          with Image.open(target / "reference_adapter_face_flux_parity.png") as image:
              description = image.info.get("Description", "")
          assert "U3_B2_13_FACE_52_COMPARISON_MATRIX" in description
          assert "direct_external_face_flux_override" in description
          assert "CoolProp 8.0.0" in description
          assert os.environ["ANALYSIS_SOURCE_GIT_SHA"] in description
          assert f"run={os.environ['GITHUB_RUN_ID']}" in description

          manifest = {}
          for line in (target / "artifact_sha256.txt").read_text(
              encoding="utf-8"
          ).splitlines():
              digest, name = line.split("  ", 1)
              manifest[name] = digest
          assert set(manifest) == expected - {"artifact_sha256.txt"}
          for name, digest in manifest.items():
              assert hashlib.sha256((target / name).read_bytes()).hexdigest() == digest
          PY

      - name: Assert final tracked checkout remains clean
        run: |
          set -euo pipefail
          git diff --check
          tracked_status="$(git status --porcelain=v1 --untracked-files=no)"
          printf 'final_tracked_git_status=%s\n' "$tracked_status"
          test -z "$tracked_status"
          test -z "$(git ls-files | grep -E '(^|/)(__pycache__/|.*\.py[co]$)' || true)"

      - name: Upload B2 Adapter authority evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stage7-u3-b2-adapter-${{ github.run_id }}
          path: |
            artifacts/stage7-u3-b2-fvm-adapter
            dedicated_junit.xml
            related_junit.xml
            full_repository_junit.xml
          if-no-files-found: warn
