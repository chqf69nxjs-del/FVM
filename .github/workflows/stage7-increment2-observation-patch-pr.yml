name: Stage 7 Increment 2 Observation Patch PR

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage7-increment2-observation-patch-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-reviewed-observation-patch:
    name: apply-reviewed-observation-patch-pr
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Extract and run reviewed replacement script
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /python - <<'"'"'PY'"'"'/{capture=1; next}
            capture && /^          PY$/{exit}
            capture {sub(/^          /, ""); print}
          ' .github/workflows/stage7-increment2-observation-patch.yml > /tmp/patch_increment2.py
          test -s /tmp/patch_increment2.py
          python /tmp/patch_increment2.py 2>&1 | tee /tmp/patch_increment2.log

      - name: Commit valid reviewed observation handling
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/patch_increment2.log && cat /tmp/patch_increment2.log || true
          python -m compileall -q src tests
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/liquid_gas_transient/hem_pipeline_depressurization_first_crossing.py \
            tests/test_stage7_lco2_hem_pipeline_depressurization_increment2.py \
            .github/workflows/stage7-pipeline-depressurization-increment2-validation.yml
          if git diff --cached --quiet; then
            echo "Reviewed observation patch produced no valid changes."
            exit 0
          fi
          git commit -m "Retain subthreshold control crossing evidence"
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
