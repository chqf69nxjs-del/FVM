name: Agent U3 B2 Clean Materialize

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]
    paths:
      - ".agent_clean_payloads/**"
      - ".github/workflows/agent-u3-b2-clean-materialize.yml"

permissions:
  contents: write

concurrency:
  group: agent-u3-b2-clean-materialize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize-and-preflight:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
      MPLBACKEND: Agg
    steps:
      - name: Checkout exact head branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Assert clean checkout
        run: |
          set -euo pipefail
          echo "checkout_sha=$(git rev-parse HEAD)"
          status="$(git status --porcelain=v1 --untracked-files=all)"
          printf 'pre_materialization_git_status=%s\n' "$status"
          test -z "$status"

      - name: Decode and verify clean source payloads
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import gzip
          import hashlib
          from pathlib import Path

          payloads = {
              ".agent_clean_payloads/solver.py.gz.b64": {
                  "payload_sha256": "f90729a6a8cccf3f493ccadb97cd167f16604f5b6c2d17c01791604bf88fd11b",
                  "output": "src/liquid_gas_transient/solver.py",
                  "output_sha256": "af21b66cbd029b3fd4fa3aa3bfd0de9a57f0325a261641cfa054ee446dada576",
              },
              ".agent_clean_payloads/u3_b2_fvm_discharge_adapter.py.gz.b64": {
                  "payload_sha256": "2140d0b74a601470e866fc18831be8c8d7c3cbc95d5dcd261d95d2950cbecb3d",
                  "output": "src/liquid_gas_transient/u3_b2_fvm_discharge_adapter.py",
                  "output_sha256": "31d557dd39f27cd5485178dba92adff4439cc6f24b700c718caf3eaacbbdeca5",
              },
              ".agent_clean_payloads/test_stage7_u3_b2_fvm_discharge_adapter.py.gz.b64": {
                  "payload_sha256": "4c62219108b6f4adfe3f6154e946951213a6bc1c56ebe1d76a8e98bd5f504a95",
                  "output": "tests/test_stage7_u3_b2_fvm_discharge_adapter.py",
                  "output_sha256": "4a10e6b288d145f1119935548052d8399aebc23e1f74e543c17e460f895629c6",
              },
          }

          for source_name, metadata in payloads.items():
              source = Path(source_name)
              raw_payload = source.read_bytes()
              payload_sha = hashlib.sha256(raw_payload).hexdigest()
              if payload_sha != metadata["payload_sha256"]:
                  raise RuntimeError(
                      f"encoded payload SHA256 mismatch for {source}: "
                      f"{payload_sha} != {metadata['payload_sha256']}"
                  )
              compact = b"".join(raw_payload.split())
              compressed = base64.b64decode(compact, validate=True)
              content = gzip.decompress(compressed)
              output_sha = hashlib.sha256(content).hexdigest()
              if output_sha != metadata["output_sha256"]:
                  raise RuntimeError(
                      f"source SHA256 mismatch for {source}: "
                      f"{output_sha} != {metadata['output_sha256']}"
                  )
              target = Path(metadata["output"])
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(content)
              print(
                  f"verified {source} -> {target}; bytes={len(content)}; "
                  f"sha256={output_sha}"
              )
          PY

      - name: Compile source and tests
        run: |
          set -euo pipefail
          python -m py_compile \
            src/liquid_gas_transient/solver.py \
            src/liquid_gas_transient/u3_b2_fvm_discharge_adapter.py \
            tests/test_stage7_u3_b2_fvm_discharge_adapter.py

      - name: Install pinned focused-test dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            'numpy==2.5.1' \
            'pytest==9.1.1' \
            'CoolProp==8.0.0'

      - name: Verify Adapter independence
        run: |
          set -euo pipefail
          ! grep -E \
            'from .*u3_b2_fvm_discharge_reference|import .*u3_b2_fvm_discharge_reference' \
            src/liquid_gas_transient/u3_b2_fvm_discharge_adapter.py

      - name: Run dedicated face and one-step preflight
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_stage7_u3_b2_fvm_discharge_adapter.py \
            --strict-markers \
            --junitxml=u3-b2-adapter-materialization-preflight.xml

      - name: Remove temporary materialization inputs
        run: |
          set -euo pipefail
          rm -rf .agent_clean_payloads
          rm -f .github/workflows/agent-u3-b2-clean-materialize.yml
          rm -f u3-b2-adapter-materialization-preflight.xml
          git diff --check
          git status --short

      - name: Commit clean implementation
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement clean U3 B2 FVM Adapter core and focused tests"
          git push origin "HEAD:${TARGET_BRANCH}"
