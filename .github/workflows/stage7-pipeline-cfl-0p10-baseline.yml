name: Stage 7 Pipeline CFL 0.10 Baseline

on:
  push:
    branches:
      - agent/stage7-pipeline-cfl-sensitivity-contract
  pull_request:
  workflow_dispatch:

env:
  PYTHONPATH: src
  MPLBACKEND: Agg
  ANALYSIS_SOURCE_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  validate-cfl-0p10-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e '.[plotting]'
          python -m pip install pytest 'CoolProp==8.0.0'
      - name: Smoke check
        run: |
          python - <<'PY'
          import CoolProp, numpy
          print('CoolProp', CoolProp.__version__)
          print('NumPy', numpy.__version__)
          PY
      - name: Compile and diff checks
        run: |
          python -m compileall -q src tests
          git diff --check
      - name: Run dependency-free CFL contract and baseline tests
        run: |
          python -m pytest -q \
            tests/test_stage7_lco2_hem_pipeline_cfl_sensitivity_contract.py \
            tests/test_stage7_lco2_hem_pipeline_cfl_0p10_baseline.py \
            --strict-markers \
            --junitxml=cfl-baseline-pure.xml
      - name: Replay exact PR82 128-cell CFL 0.10 baseline
        run: |
          python -m liquid_gas_transient.hem_pipeline_cfl_0p10_baseline \
            --output-dir artifacts/stage7-pipeline-cfl-0p10-baseline
      - name: Inspect exact baseline artifact
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(
              'artifacts/stage7-pipeline-cfl-0p10-baseline/'
              'cfl_0p10_baseline_summary.json'
          )
          summary = json.loads(path.read_text(encoding='utf-8'))
          print(json.dumps(summary, indent=2, sort_keys=True))
          assert summary['case_count'] == 3
          assert summary['n_cells'] == 128
          assert summary['dx_m'] == 1.0 / 128.0
          assert summary['cfl'] == 0.10
          assert summary['maximum_steps'] == 8000
          assert summary['all_pr82_rows_reproduced_exactly'] is True
          assert summary['low_cfl_matrix_executed'] is False
          assert summary['CFL_independent_crossing_verified'] is False
          assert summary['Gate_P2_passed'] is False
          assert len(summary['cases']) == 3
          provenance = summary['provenance']
          assert provenance['analysis_model'] == 'HEM'
          assert provenance['property_backend_name'] == 'coolprop_co2'
          assert provenance['property_backend_version'] == '8.0.0'
          assert provenance['source_git_sha'] == os.environ['ANALYSIS_SOURCE_GIT_SHA']
          assert provenance['checkout_git_sha']
          PY
      - name: Run PR77, PR79, PR82, and CFL contract regressions
        run: |
          python -m pytest -q \
            tests/test_stage7_lco2_hem_pipeline_depressurization_increment2.py \
            tests/test_stage7_lco2_hem_pipeline_4mpa_subthreshold_forensics.py \
            tests/test_stage7_lco2_hem_pipeline_4mpa_subthreshold_forensics_contract.py \
            tests/test_stage7_lco2_hem_pipeline_4mpa_mesh_sensitivity.py \
            tests/test_stage7_lco2_hem_pipeline_cfl_sensitivity_contract.py \
            --strict-markers \
            --junitxml=related-stage7.xml
      - name: Run full repository tests
        run: |
          python -m pytest -q --strict-markers --junitxml=full-repository.xml
      - name: Assert no authoritative skips, failures, or errors
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          for name in (
              'cfl-baseline-pure.xml',
              'related-stage7.xml',
              'full-repository.xml',
          ):
              root = ET.parse(Path(name)).getroot()
              suites = [root] if root.tag == 'testsuite' else list(root.findall('testsuite'))
              values = {
                  key: sum(int(s.attrib.get(key, 0)) for s in suites)
                  for key in ('tests', 'skipped', 'failures', 'errors')
              }
              print(name, values)
              assert values['skipped'] == 0
              assert values['failures'] == 0
              assert values['errors'] == 0
          PY
      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stage7-pipeline-cfl-0p10-baseline-${{ github.run_id }}
          path: |
            artifacts/stage7-pipeline-cfl-0p10-baseline
            cfl-baseline-pure.xml
            related-stage7.xml
            full-repository.xml
          if-no-files-found: warn
