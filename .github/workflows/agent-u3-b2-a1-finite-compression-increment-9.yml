name: Agent U3 B2 A1 Finite Compression Increment 9

on:
  push:
    branches: [agent/u3-b2-a1-wave-curve-review]
    paths:
      - ".github/workflows/agent-u3-b2-a1-finite-compression-increment-9.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: agent-u3-b2-a1-finite-compression-increment-9
  cancel-in-progress: true

env:
  PYTHONPATH: src:tools/verification
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONPYCACHEPREFIX: /tmp/u3-b2-a1-finite-compression-inc9-pycache
  SOURCE_SHA: ${{ github.sha }}
  SCOPE_BASE_SHA: e992a4e89721cf32f30cb87e395ae3fe2308a7e8
  PARENT_RUN_ID: "31654235903"
  PARENT_ARTIFACT_ID: "9163799106"
  PARENT_ARTIFACT_NAME: u3-b2-a1-finite-compression-increment-8-31654235903
  PARENT_ARTIFACT_DIGEST: 45d726b422090c8ce00becb7d66a7a44b309678c0a7cb61b4f842dd08086be8b

jobs:
  continue-to-full-two-l-over-c0:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact Increment 9 source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"

      - name: Install fixed dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.5.1' 'CoolProp==8.0.0'

      - name: Verify fixed source identity and full-horizon scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test -f docs/verification/stage7_u3_b2_a1_finite_compression_increment_9_full_horizon_model_review.md
          test -f tools/verification/u3_b2_a1_finite_compression_hugoniot_full_horizon_support.py
          test -f tools/verification/u3_b2_a1_finite_compression_hugoniot_full_horizon_step.py
          test -f tools/verification/u3_b2_a1_finite_compression_hugoniot_full_horizon_engine.py
          test -f tools/verification/u3_b2_a1_finite_compression_hugoniot_full_horizon.py
          python -m py_compile \
            tools/verification/u3_b2_a1_finite_compression_hugoniot_full_horizon_support.py \
            tools/verification/u3_b2_a1_finite_compression_hugoniot_full_horizon_step.py \
            tools/verification/u3_b2_a1_finite_compression_hugoniot_full_horizon_engine.py \
            tools/verification/u3_b2_a1_finite_compression_hugoniot_full_horizon.py
          mapfile -t actual < <(
            git diff --name-only "${SCOPE_BASE_SHA}" HEAD | sort
          )
          mapfile -t expected < <(printf '%s\n' \
            '.github/workflows/agent-u3-b2-a1-finite-compression-increment-9.yml' | sort)
          diff -u \
            <(printf '%s\n' "${expected[@]}") \
            <(printf '%s\n' "${actual[@]}")
          git diff --check "${SCOPE_BASE_SHA}" HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Download authoritative Increment 8 parent artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.PARENT_ARTIFACT_NAME }}
          path: artifacts/parent-increment-8
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.PARENT_RUN_ID }}

      - name: Verify parent GitHub artifact metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          metadata="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PARENT_ARTIFACT_ID}")"
          test "$(jq -r '.id' <<<"${metadata}")" = "${PARENT_ARTIFACT_ID}"
          test "$(jq -r '.name' <<<"${metadata}")" = "${PARENT_ARTIFACT_NAME}"
          test "$(jq -r '.expired' <<<"${metadata}")" = "false"
          test "$(jq -r '.workflow_run.id' <<<"${metadata}")" = "${PARENT_RUN_ID}"
          test "$(jq -r '.workflow_run.head_sha' <<<"${metadata}")" = "55d414ac82b63ae93ce2866148af363dc76fa2cb"
          test "$(jq -r '.digest' <<<"${metadata}")" = "sha256:${PARENT_ARTIFACT_DIGEST}"

      - name: Continue actual FvmSolver to nominal full horizon
        shell: bash
        run: |
          set -euo pipefail
          output=artifacts/u3-b2-a1-finite-compression-increment-9
          rm -rf "${output}"
          python tools/verification/u3_b2_a1_finite_compression_hugoniot_full_horizon.py \
            --contract docs/verification/stage7_u3_b2_fvm_discharge_coupling_contract_v1.json \
            --b1-contract docs/verification/stage7_u3_b1_critical_state_contract_v1.json \
            --model-review-spec docs/verification/stage7_u3_b2_a1_finite_compression_increment_9_full_horizon_model_review.md \
            --parent-artifact-dir artifacts/parent-increment-8 \
            --parent-artifact-digest "${PARENT_ARTIFACT_DIGEST}" \
            --output-dir "${output}" \
            --source-git-sha "${SOURCE_SHA}"

      - name: Inspect Increment 9 evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import hashlib
          import json
          import os
          from pathlib import Path
          import numpy as np

          target = Path(
              "artifacts/u3-b2-a1-finite-compression-increment-9"
          )
          expected = {
              "finite_compression_steps.csv",
              "finite_compression_roots.csv",
              "hugoniot_fixed_scans.csv",
              "hugoniot_density_search.csv",
              "branch_sequence.csv",
              "finite_compression_full_horizon_states.npz",
              "authority_verification.json",
              "stop_evidence.json",
              "summary.json",
              "report.md",
              "artifact_sha256.txt",
          }
          assert {path.name for path in target.iterdir()} == expected
          summary = json.loads(
              (target / "summary.json").read_text(encoding="utf-8")
          )
          assert summary["source_git_sha"] == os.environ["SOURCE_SHA"]
          assert summary["outcome"] == (
              "FINITE_COMPRESSION_INCREMENT_9_FULL_HORIZON_WORKING_SLICE_PASS"
          )
          assert summary["increment_9_full_horizon_gate_passed"] is True
          assert summary["working_vertical_slice_two_l_over_c0_reached"] is True
          assert summary["parent_artifact_verified"] is True
          assert summary["parent_outcome"] == (
              "FINITE_COMPRESSION_INCREMENT_8_HUGONIOT_32_STEP_PASS"
          )
          assert summary["starting_solver_step"] == 524
          assert summary["additional_accepted_steps"] > 0
          assert 524 < summary["final_solver_step"] <= 1000
          assert summary["target_horizon_reached"] is True
          assert summary["final_step_clipped_to_target"] is True
          assert summary["final_solver_time_s"] >= summary[
              "target_two_l_over_c0_time_s"
          ]
          assert abs(summary["horizon_time_error_s"]) <= summary[
              "horizon_time_roundoff_tolerance_s"
          ]
          assert summary["horizon_fraction_reached"] >= 1.0
          assert summary["branch_sequence"] == [
              "FINITE_COMPRESSION_HUGONIOT"
          ] * summary["additional_accepted_steps"]
          assert summary["branch_counts"] == {
              "FINITE_COMPRESSION_HUGONIOT": summary[
                  "additional_accepted_steps"
              ]
          }
          assert summary["branch_transition_count"] == 0
          assert summary["clear_branch_chatter_detected"] is False
          assert summary["minimum_root_requested_chi"] > 1.0e-6
          assert summary["maximum_root_requested_chi"] <= 1.0e-4
          assert summary["maximum_absolute_root_mass_residual_kg_s"] <= 1.0e-8
          assert summary["minimum_root_local_slope_kg_s_Pa"] < 0.0
          assert summary["maximum_root_mach"] < 1.0
          assert summary["minimum_root_velocity_m_s"] >= 0.0
          assert summary["minimum_root_entropy_delta_J_kg_K"] >= -1.0e-7
          assert summary[
              "minimum_root_stagnation_pressure_margin_above_back_pa"
          ] > 0.0
          assert summary["minimum_accepted_dt_s"] > 0.0
          assert summary["final_outlet_velocity_m_s"] >= 0.0
          assert 0.0 <= summary["final_outlet_mach"] < 1.0
          assert summary["final_outlet_phase"] == "liquid"
          assert summary["final_minimum_density_kg_m3"] > 0.0
          assert summary["final_minimum_internal_energy_J_kg"] > 0.0
          assert summary["final_rho_xv_exact_zero"] is True
          assert summary["stop_classification"] is None
          assert summary["stop_reason"] is None
          assert summary["finite_compression_flux_applied"] is True
          assert summary["finite_compression_branch_approved"] is False
          assert summary[
              "multi_step_finite_compression_continuation_authorized"
          ] is False
          assert summary["full_two_l_over_c0_passed"] is False
          assert summary["formal_state_promoted"] is False
          assert summary["u3_b2_finite_pipe_execution_complete"] is False
          assert summary["single_phase_finite_pipe_coupling_verified"] is False
          assert summary["u3_b2_verification_benchmark_accepted"] is False
          assert summary["physical_validation"] is False
          assert summary["design_use_acceptance"] is False
          assert summary["production_hem_activation_approved"] is False

          with (target / "finite_compression_steps.csv").open(
              newline="", encoding="utf-8"
          ) as handle:
              steps = list(csv.DictReader(handle))
          with (target / "finite_compression_roots.csv").open(
              newline="", encoding="utf-8"
          ) as handle:
              roots = list(csv.DictReader(handle))
          with (target / "hugoniot_fixed_scans.csv").open(
              newline="", encoding="utf-8"
          ) as handle:
              scans = list(csv.DictReader(handle))
          with (target / "hugoniot_density_search.csv").open(
              newline="", encoding="utf-8"
          ) as handle:
              density = list(csv.DictReader(handle))
          with (target / "branch_sequence.csv").open(
              newline="", encoding="utf-8"
          ) as handle:
              branches = list(csv.DictReader(handle))
          n = summary["additional_accepted_steps"]
          assert len(steps) == n
          assert len(roots) == n
          assert len(scans) == n * 12
          assert density
          assert len(branches) == n
          assert int(steps[0]["solver_step_count"]) == 525
          assert int(steps[-1]["solver_step_count"]) == summary[
              "final_solver_step"
          ]
          assert int(roots[0]["requested_solver_step"]) == 525
          assert int(roots[-1]["requested_solver_step"]) == summary[
              "final_solver_step"
          ]
          assert steps[-1]["step_clipped_to_target"] == "True"
          assert all(
              row["step_clipped_to_target"] == "False"
              for row in steps[:-1]
          )
          for row in steps:
              assert row["accepted_step"] == "True"
              assert row["step_passed"] == "True"
              assert row["increment_9_per_step_gate_passed"] == "True"
              assert row["branch_classification"] == (
                  "FINITE_COMPRESSION_HUGONIOT"
              )
              assert 1.0e-6 < float(row["root_requested_chi"]) <= 1.0e-4
              assert abs(float(row["root_mass_residual_kg_s"])) <= 1.0e-8
              assert float(row["root_local_slope_kg_s_Pa"]) < 0.0
              assert row["root_hugoniot_identity_accounted_passed"] == "True"
              assert row["root_lax_1_shock_passed"] == "True"
              assert float(row["root_entropy_delta_J_kg_K"]) >= -1.0e-7
              assert row["hugoniot_scan_monotone_nonincreasing"] == "True"
              assert int(row["hugoniot_scan_sign_change_count"]) == 1
              assert row["root_gate_passed"] == "True"
              assert row["rho_xv_exact_zero"] == "True"
              assert row["outlet_phase_after_step"] == "liquid"
              assert float(row["outlet_velocity_after_step_m_s"]) >= 0.0
              assert 0.0 <= float(row["outlet_mach_after_step"]) < 1.0
          for row in roots:
              assert row["root_gate_passed"] == "True"
              assert row["root_b1_formal_outcome"] == (
                  "SUCCESS_UNCHOKED_FACE_MAPPING"
              )
              assert row["root_hugoniot_identity_accounted_passed"] == "True"
              assert row["root_lax_1_shock_passed"] == "True"
              assert row["stagnation_enthalpy_round_trip_passed"] == "True"
              assert row["energy_mass_consistency_passed"] == "True"
              assert row["energy_port_closure_passed"] == "True"

          with np.load(
              target / "finite_compression_full_horizon_states.npz"
          ) as states:
              start = np.asarray(states["U_start"], dtype=float)
              final = np.asarray(states["U_final"], dtype=float)
              assert start.shape == (32, 4)
              assert final.shape == (32, 4)
              assert not np.array_equal(start, final)
              assert int(states["solver_step_before"][0]) == 524
              assert int(states["solver_step_after"][0]) == summary[
                  "final_solver_step"
              ]
              assert float(states["solver_time_after_s"][0]) == summary[
                  "final_solver_time_s"
              ]
              assert float(states["target_time_s"][0]) == summary[
                  "target_two_l_over_c0_time_s"
              ]

          stop = json.loads(
              (target / "stop_evidence.json").read_text(encoding="utf-8")
          )
          assert stop["classification"] is None
          assert stop["reason"] is None

          manifest = {}
          for line in (target / "artifact_sha256.txt").read_text(
              encoding="utf-8"
          ).splitlines():
              digest, name = line.split("  ", 1)
              manifest[name] = digest
          assert set(manifest) == expected - {"artifact_sha256.txt"}
          for name, digest in manifest.items():
              assert hashlib.sha256((target / name).read_bytes()).hexdigest() == digest
          PY

      - name: Upload Increment 9 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: u3-b2-a1-finite-compression-increment-9-${{ github.run_id }}
          path: artifacts/u3-b2-a1-finite-compression-increment-9
          if-no-files-found: warn
