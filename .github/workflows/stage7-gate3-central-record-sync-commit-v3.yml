name: Stage 7 Gate 3 Central Record Sync Commit v3

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  commit-synchronized-records:
    if: github.head_ref == 'agent/stage7-gate3-central-record-sync' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout synchronization branch
        uses: actions/checkout@v7
        with:
          ref: agent/stage7-gate3-central-record-sync
          fetch-depth: 0

      - name: Generate and finish synchronized records
        run: |
          python scripts/stage7_gate3_central_record_sync.py
          python - <<'PY'
          from pathlib import Path

          master_path = Path('docs/verification/MASTER_VERIFICATION_INDEX.md')
          master = master_path.read_text(encoding='utf-8')
          old = (
              'The current active operational gate is Issue #85, followed by the fixed low-CFL execution\n'
              'in Issue #86. Gate P2, mesh-independent accuracy, CFL-independent crossing, near-saturation\n'
              'acoustic continuity, post-crossing propagation, physical Validation, design use, and\n'
              'production HEM activation remain unapproved.'
          )
          new = (
              'Issue #85 is complete with the Gate 3 disposition `NUMERICALLY_EQUIVALENT`. The next\n'
              'controlled numerical gate is the fixed low-CFL execution in Issue #86. Gate P2,\n'
              'mesh-independent accuracy, CFL-independent crossing, near-saturation acoustic continuity,\n'
              'post-crossing propagation, physical Validation, design use, and production HEM activation\n'
              'remain unapproved.'
          )
          if master.count(old) != 1:
              raise RuntimeError('MASTER superseded checkpoint paragraph did not match exactly once')
          master_path.write_text(master.replace(old, new, 1), encoding='utf-8')

          log_path = Path('docs/verification/stage7_execution_log.md')
          log = log_path.read_text(encoding='utf-8')
          if log.count('local_pc_reproduction_checkpoint_completed = false') != 1:
              raise RuntimeError('execution-log local checkpoint flag did not match exactly once')
          log = log.replace(
              'local_pc_reproduction_checkpoint_completed = false',
              'local_pc_reproduction_checkpoint_completed = true\nlocal_pc_reproduction_disposition = NUMERICALLY_EQUIVALENT',
              1,
          )
          old_next = (
              '## Next\n\n'
              '1. complete the local-PC reproduction checkpoint in Issue #85 and classify it as `EXACT`,\n'
              '   `NUMERICALLY_EQUIVALENT`, or `INVESTIGATION_REQUIRED`;\n'
              '2. only after the checkpoint is completed or explicitly dispositioned, execute and accept\n'
              '   the fixed 128-cell 2/3/4 MPa × CFL 0.10/0.05/0.025 matrix in Issue #86;\n'
              '3. retain PRs #52/#53 as later numerical-improvement assets until the first-order temporal\n'
              '   and near-saturation acoustic questions are separated;\n'
              '4. perform the independent near-saturation acoustic-continuity gate before approving any\n'
              '   post-crossing propagation;\n'
              '5. keep production activation, physical Validation, design use, and acoustic/numerical\n'
              '   accuracy approval false until separately established.'
          )
          new_next = (
              '## Next\n\n'
              '1. synchronize the merged PR #91 Gate 3 disposition into the three central records;\n'
              '2. execute the fixed 128-cell 2/3/4 MPa × CFL 0.10/0.05/0.025 matrix in Issue #86, first\n'
              '   requiring the CFL 0.10 rows to reproduce the retained PR #82 baseline exactly;\n'
              '3. keep all CFL 0.05/0.025 results unaccepted until their dedicated review and promotion;\n'
              '4. retain PRs #52/#53 as later numerical-improvement assets until the first-order temporal\n'
              '   and near-saturation acoustic questions are separated;\n'
              '5. perform the independent near-saturation acoustic-continuity gate before approving any\n'
              '   post-crossing propagation;\n'
              '6. keep production activation, physical Validation, design use, and acoustic/numerical\n'
              '   accuracy approval false until separately established.'
          )
          if log.count(old_next) != 1:
              raise RuntimeError('execution-log Next section did not match exactly once')
          log_path.write_text(log.replace(old_next, new_next, 1), encoding='utf-8')
          PY
          git restore .github/workflows/stage7-gate3-central-record-sync-once.yml
          git restore .github/workflows/stage7-gate3-central-record-sync-pr.yml
          git restore scripts/stage7_gate3_central_record_sync.py

      - name: Commit and push central records only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/verification/MASTER_VERIFICATION_INDEX.md \
            docs/verification/stage7_current_gate_snapshot.md \
            docs/verification/stage7_execution_log.md
          git commit -m "Synchronize Stage 7 central records through Gate 3"
          git push origin HEAD:agent/stage7-gate3-central-record-sync
