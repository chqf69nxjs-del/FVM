name: Stage 7 P2 HNE Acoustic Contract A2.4-1

on:
  push:
    branches:
      - agent/stage7-p2-hne-acoustic-contract-a2-4-1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage7-p2-hne-acoustic-contract-a2-4-1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acoustic-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
      ANALYSIS_SOURCE_GIT_SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.5.2' 'pytest==9.1.1'

      - name: Assert source and change envelope
        run: |
          set -euo pipefail
          source_sha="4479d0ed4ee76975564e58cdfd152c2a9e554069"
          test "$(git rev-parse HEAD)" = "$ANALYSIS_SOURCE_GIT_SHA"
          git cat-file -e "${source_sha}^{commit}"
          git diff --name-only "$source_sha" HEAD | sort > /tmp/actual.txt
          printf '%s\n' \
            '.github/workflows/stage7-p2-hne-acoustic-contract-a2-4-1.yml' \
            'docs/verification/stage7_p2_hne_acoustic_contract_a2_4_1.md' \
            'src/liquid_gas_transient/hne_acoustic_contract.py' \
            'tests/test_stage7_p2_hne_acoustic_contract_a2_4_1.py' \
            | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile and clean
        run: |
          set -euo pipefail
          python -m compileall -q src tests
          git diff --check
          find src tests -type d -name __pycache__ -prune -exec rm -rf {} +
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Generate contract evidence
        run: |
          set -euo pipefail
          python -m liquid_gas_transient.hne_acoustic_contract \
            --output-dir artifacts/stage7/p2-hne-acoustic-contract-a2-4-1

      - name: Gate contract evidence
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          p = Path('artifacts/stage7/p2-hne-acoustic-contract-a2-4-1')
          assert {x.name for x in p.iterdir()} == {
              'summary.json', 'regime_contracts.csv',
              'operator_report.md', 'manifest.json'}
          s = json.loads((p / 'summary.json').read_text())
          m = json.loads((p / 'manifest.json').read_text())
          with (p / 'regime_contracts.csv').open(newline='') as f:
              rows = list(csv.DictReader(f))
          assert s['contract_ready'] and not s['failed_gates']
          assert all(s['gate_results'].values())
          assert s['runtime_provenance']['analysis_source_git_sha'] == s['runtime_provenance']['checkout_git_sha']
          assert s['runtime_provenance']['git_status_porcelain'] == ''
          assert [r['regime_id'] for r in rows] == [
              'FROZEN_QUALITY', 'EQUILIBRIUM_MANIFOLD',
              'FINITE_RELAXATION_DISPERSIVE']
          assert all(v is False for v in s['solver_authority'].values())
          assert s['formal_status']['acoustic_contract_ready'] is True
          assert s['formal_status']['hydrodynamic_coupling_allowed'] is False
          assert m['contract_authority_sha256'] == s['contract_authority_sha256']
          assert m['hydrodynamic_coupling_allowed'] is False
          print('contract_sha256=' + s['contract_authority_sha256'])
          PY

      - name: Run focused tests
        run: |
          python -m pytest -q \
            tests/test_stage7_p2_hne_acoustic_contract_a2_4_1.py \
            --strict-markers --junitxml=p2-a2-4-1-focused.xml

      - name: Gate JUnit and tracked checkout
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('p2-a2-4-1-focused.xml').getroot()
          suites = [root] if root.tag == 'testsuite' else list(root.findall('testsuite'))
          totals = {k: sum(int(s.attrib.get(k, 0)) for s in suites)
                    for k in ('tests', 'skipped', 'failures', 'errors')}
          assert totals == {'tests': 6, 'skipped': 0, 'failures': 0, 'errors': 0}
          print(totals)
          PY
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Upload evidence
        uses: actions/upload-artifact@v7
        with:
          name: stage7-p2-hne-acoustic-contract-a2-4-1-${{ github.run_id }}
          path: |
            artifacts/stage7/p2-hne-acoustic-contract-a2-4-1
            p2-a2-4-1-focused.xml
          if-no-files-found: error
          compression-level: 6
