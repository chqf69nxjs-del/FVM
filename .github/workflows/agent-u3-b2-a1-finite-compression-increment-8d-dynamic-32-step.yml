name: Agent U3 B2 A1 Finite Compression Increment 8D Dynamic 32 Step

on:
  push:
    branches: [agent/u3-b2-a1-wave-curve-review]
    paths:
      - ".github/workflows/agent-u3-b2-a1-finite-compression-increment-8d-dynamic-32-step.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: agent-u3-b2-a1-finite-compression-increment-8d-dynamic-32-step
  cancel-in-progress: true

env:
  PYTHONPATH: src:tools/verification
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONPYCACHEPREFIX: /tmp/u3-b2-a1-finite-compression-inc8d-pycache
  SOURCE_SHA: ${{ github.sha }}
  SCOPE_BASE_SHA: 6f533fbd0b30b004392c13809bc36fb0f206001a
  PARENT_RUN_ID: "31663509236"
  PARENT_ARTIFACT_ID: "9167066290"
  PARENT_ARTIFACT_NAME: u3-b2-a1-finite-compression-increment-8c-dynamic-31663509236
  PARENT_ARTIFACT_DIGEST: faa90e1c4968e9cbed1b615726d6080c90ec100b9bf6f6ebb78069e32ba43611

jobs:
  continue-thirty-two-dynamic-hugoniot-steps:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact Increment 8D source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"

      - name: Verify fixed source identity and Increment 8D scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test -f docs/verification/stage7_u3_b2_a1_finite_compression_increment_8d_dynamic_32_step_model_review.md
          test -f tools/verification/u3_b2_a1_finite_compression_guard_front_8_step.py
          test -f tools/verification/u3_b2_a1_finite_compression_guard_front_8_step_dynamic_topology_fix.py
          test -f tools/verification/u3_b2_a1_finite_compression_guard_front_32_step_dynamic_topology.py
          python -m py_compile \
            tools/verification/u3_b2_a1_finite_compression_guard_front_8_step.py \
            tools/verification/u3_b2_a1_finite_compression_guard_front_8_step_dynamic_topology_fix.py \
            tools/verification/u3_b2_a1_finite_compression_guard_front_32_step_dynamic_topology.py
          mapfile -t actual < <(
            git diff --name-only "${SCOPE_BASE_SHA}" HEAD | sort
          )
          mapfile -t expected < <(printf '%s\n' \
            '.github/workflows/agent-u3-b2-a1-finite-compression-increment-8d-dynamic-32-step.yml' | sort)
          diff -u \
            <(printf '%s\n' "${expected[@]}") \
            <(printf '%s\n' "${actual[@]}")
          git diff --check "${SCOPE_BASE_SHA}" HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Install fixed dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'numpy==2.5.1' 'CoolProp==8.0.0'

      - name: Download authoritative Increment 8C parent artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.PARENT_ARTIFACT_NAME }}
          path: artifacts/parent-increment-8c
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.PARENT_RUN_ID }}

      - name: Verify parent GitHub artifact metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          metadata="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PARENT_ARTIFACT_ID}")"
          test "$(jq -r '.id' <<<"${metadata}")" = "${PARENT_ARTIFACT_ID}"
          test "$(jq -r '.name' <<<"${metadata}")" = "${PARENT_ARTIFACT_NAME}"
          test "$(jq -r '.expired' <<<"${metadata}")" = "false"
          test "$(jq -r '.workflow_run.id' <<<"${metadata}")" = "${PARENT_RUN_ID}"
          test "$(jq -r '.workflow_run.head_sha' <<<"${metadata}")" = "c3368b99c7429490feba0b86d1605138f80e29d5"
          test "$(jq -r '.digest' <<<"${metadata}")" = "sha256:${PARENT_ARTIFACT_DIGEST}"

      - name: Run 32 actual dynamic-topology Hugoniot steps
        shell: bash
        run: |
          set -euo pipefail
          output=artifacts/u3-b2-a1-finite-compression-increment-8d
          rm -rf "${output}"
          python tools/verification/u3_b2_a1_finite_compression_guard_front_32_step_dynamic_topology.py \
            --contract docs/verification/stage7_u3_b2_fvm_discharge_coupling_contract_v1.json \
            --b1-contract docs/verification/stage7_u3_b1_critical_state_contract_v1.json \
            --model-review-spec docs/verification/stage7_u3_b2_a1_finite_compression_increment_8d_dynamic_32_step_model_review.md \
            --parent-artifact-dir artifacts/parent-increment-8c \
            --parent-artifact-digest "${PARENT_ARTIFACT_DIGEST}" \
            --output-dir "${output}" \
            --source-git-sha "${SOURCE_SHA}"

      - name: Inspect Increment 8D evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import hashlib
          import json
          import os
          from pathlib import Path

          import numpy as np

          target = Path(
              "artifacts/u3-b2-a1-finite-compression-increment-8d"
          )
          expected = {
              "finite_compression_steps.csv",
              "finite_compression_roots.csv",
              "hugoniot_fixed_scans.csv",
              "guard_front_refinement.csv",
              "root_topology.csv",
              "hugoniot_density_search.csv",
              "branch_sequence.csv",
              "finite_compression_32_step_states.npz",
              "authority_verification.json",
              "stop_evidence.json",
              "step524_checkpoint.json",
              "summary.json",
              "report.md",
              "artifact_sha256.txt",
          }
          assert {path.name for path in target.iterdir()} == expected
          summary = json.loads(
              (target / "summary.json").read_text(encoding="utf-8")
          )
          assert summary["source_git_sha"] == os.environ["SOURCE_SHA"]
          assert summary["outcome"] == (
              "FINITE_COMPRESSION_INCREMENT_8D_DYNAMIC_32_STEP_PASS"
          )
          assert summary["increment_8d_32_step_gate_passed"] is True
          assert summary["parent_artifact_verified"] is True
          assert summary["parent_outcome"] == (
              "FINITE_COMPRESSION_INCREMENT_8C_GUARD_FRONT_8_STEP_PASS"
          )
          assert summary["starting_solver_step"] == 502
          assert summary["requested_accepted_steps"] == 32
          assert summary["accepted_steps_completed"] == 32
          assert summary["final_solver_step"] == 534
          assert summary["starting_solver_time_s"] == 0.0033640121156822815
          assert summary["final_solver_time_s"] > summary["starting_solver_time_s"]
          assert summary["branch_sequence"] == [
              "FINITE_COMPRESSION_HUGONIOT"
          ] * 32
          assert summary["branch_counts"] == {
              "FINITE_COMPRESSION_HUGONIOT": 32
          }
          assert summary["branch_transition_count"] == 0
          assert summary["minimum_root_requested_chi"] > 1.0e-6
          assert summary["maximum_root_requested_chi"] <= 1.0e-4
          assert summary["maximum_absolute_root_mass_residual_kg_s"] <= 1.0e-8
          assert summary["minimum_root_local_slope_kg_s_Pa"] < 0.0
          assert summary["maximum_root_mach"] < 1.0
          assert summary["minimum_root_velocity_m_s"] >= 0.0
          assert summary["minimum_root_entropy_delta_J_kg_K"] >= -1.0e-7
          assert summary["minimum_accepted_dt_s"] > 0.0
          assert summary["final_outlet_velocity_m_s"] >= 0.0
          assert 0.0 <= summary["final_outlet_mach"] < 1.0
          assert summary["final_outlet_phase"] == "liquid"
          assert summary["final_minimum_density_kg_m3"] > 0.0
          assert summary["final_minimum_internal_energy_J_kg"] > 0.0
          assert summary["final_rho_xv_exact_zero"] is True
          assert summary["stop_classification"] is None
          assert summary["stop_reason"] is None
          assert summary["checkpoint_step_524_recorded"] is True
          assert summary["previous_route_step_524_comparison_status"] == (
              "PENDING_SEPARATE_REVIEW"
          )
          assert summary["solver_step_535_authorized"] is False
          assert summary["finite_compression_branch_approved"] is False
          assert summary[
              "multi_step_finite_compression_continuation_authorized"
          ] is False
          assert summary["full_two_l_over_c0_passed"] is False
          assert summary["formal_state_promoted"] is False
          assert summary["u3_b2_finite_pipe_execution_complete"] is False
          assert summary["single_phase_finite_pipe_coupling_verified"] is False
          assert summary["u3_b2_verification_benchmark_accepted"] is False
          assert summary["physical_validation"] is False
          assert summary["design_use_acceptance"] is False
          assert summary["production_hem_activation_approved"] is False

          with (target / "finite_compression_steps.csv").open(
              newline="", encoding="utf-8"
          ) as handle:
              steps = list(csv.DictReader(handle))
          with (target / "finite_compression_roots.csv").open(
              newline="", encoding="utf-8"
          ) as handle:
              roots = list(csv.DictReader(handle))
          assert len(steps) == 32
          assert len(roots) == 32
          assert [int(row["solver_step_count"]) for row in steps] == list(
              range(503, 535)
          )
          assert [int(row["requested_solver_step"]) for row in roots] == list(
              range(503, 535)
          )
          for row in steps:
              assert row["accepted_step"] == "True"
              assert row["step_passed"] == "True"
              assert row["increment_8d_per_step_gate_passed"] == "True"
              assert row["branch_classification"] == (
                  "FINITE_COMPRESSION_HUGONIOT"
              )
              assert row["diagnostic_classification"] == (
                  "FINITE_COMPRESSION_GUARD_FRONT_REFINEMENT_SUPPORTED"
              )
              assert 1.0e-6 < float(row["root_requested_chi"]) <= 1.0e-4
              assert abs(float(row["root_mass_residual_kg_s"])) <= 1.0e-8
              assert float(row["root_local_slope_kg_s_Pa"]) < 0.0
              assert row["root_hugoniot_identity_accounted_passed"] == "True"
              assert row["root_lax_1_shock_passed"] == "True"
              assert row["root_topology_monotone_nonincreasing"] == "True"
              assert int(row["root_topology_sign_change_count"]) == 1
              assert row["failed_b1_state_used_as_root_endpoint"] == "False"
              assert row["failed_b1_state_used_to_construct_flux"] == "False"
              assert row["rho_xv_exact_zero"] == "True"
              assert row["outlet_phase_after_step"] == "liquid"
              assert float(row["outlet_velocity_after_step_m_s"]) >= 0.0
              assert 0.0 <= float(row["outlet_mach_after_step"]) < 1.0
          for row in roots:
              assert row["root_gate_passed"] == "True"
              assert row["root_b1_formal_outcome"] == (
                  "SUCCESS_UNCHOKED_FACE_MAPPING"
              )
              assert row["root_hugoniot_identity_accounted_passed"] == "True"
              assert row["root_lax_1_shock_passed"] == "True"
              assert row[
                  "root_stagnation_enthalpy_round_trip_passed"
              ] == "True"
              assert row["root_energy_mass_consistency_passed"] == "True"
              assert row["root_energy_port_closure_passed"] == "True"

          checkpoint = json.loads(
              (target / "step524_checkpoint.json").read_text(
                  encoding="utf-8"
              )
          )
          assert checkpoint["route"] == "CORRECTED_DYNAMIC_ROOT_TOPOLOGY"
          assert checkpoint["solver_step"] == 524
          assert int(checkpoint["step"]["solver_step_count"]) == 524
          assert int(checkpoint["root"]["requested_solver_step"]) == 524
          assert checkpoint["comparison_status"] == "PENDING_SEPARATE_REVIEW"

          with np.load(
              target / "finite_compression_32_step_states.npz"
          ) as states:
              before = np.asarray(states["U_before"], dtype=float)
              after = np.asarray(states["U_after"], dtype=float)
              assert before.shape == (32, 4)
              assert after.shape == (32, 4)
              assert not np.array_equal(before, after)
              assert int(states["solver_step_before"][0]) == 502
              assert int(states["solver_step_after"][0]) == 534
              assert float(states["solver_time_before_s"][0]) == summary[
                  "starting_solver_time_s"
              ]
              assert float(states["solver_time_after_s"][0]) == summary[
                  "final_solver_time_s"
              ]

          stop = json.loads(
              (target / "stop_evidence.json").read_text(encoding="utf-8")
          )
          assert stop["classification"] is None
          assert stop["reason"] is None

          authority = json.loads(
              (target / "authority_verification.json").read_text(
                  encoding="utf-8"
              )
          )
          assert authority["parent_source_sha"] == (
              "c3368b99c7429490feba0b86d1605138f80e29d5"
          )
          assert authority["parent_run"] == 31663509236
          assert authority["parent_job"] == 94333135976
          assert authority["parent_artifact"] == 9167066290
          assert authority["parent_artifact_sha256"] == (
              "faa90e1c4968e9cbed1b615726d6080c90ec100b9bf6f6ebb78069e32ba43611"
          )
          assert authority["verified"] is True

          manifest = {}
          for line in (target / "artifact_sha256.txt").read_text(
              encoding="utf-8"
          ).splitlines():
              digest, name = line.split("  ", 1)
              manifest[name] = digest
          assert set(manifest) == expected - {"artifact_sha256.txt"}
          for name, digest in manifest.items():
              assert hashlib.sha256((target / name).read_bytes()).hexdigest() == digest
          PY

      - name: Upload Increment 8D evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: u3-b2-a1-finite-compression-increment-8d-dynamic-32-step-${{ github.run_id }}
          path: artifacts/u3-b2-a1-finite-compression-increment-8d
          if-no-files-found: warn
