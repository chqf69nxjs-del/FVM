name: Stage 7 Gate 8 Full CFL Sequence

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: stage7-gate8-full-cfl-sequence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: src
  PYTHONDONTWRITEBYTECODE: '1'
  MPLBACKEND: Agg
  ANALYSIS_SOURCE_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  gate8-full-cfl-sequence:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install fixed dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy matplotlib pytest 'CoolProp==8.0.0'
      - name: Assert pristine checkout
        run: |
          echo "checkout_sha=$(git rev-parse HEAD)"
          status="$(git status --porcelain=v1 --untracked-files=all)"
          printf 'pre_execution_git_status=%s\n' "$status"
          test -z "$status"
      - name: Execute locked Gate 8 full sequence
        run: |
          temporary_output="${RUNNER_TEMP}/stage7-gate8-full-cfl-sequence"
          repository_output="artifacts/stage7-gate8-full-cfl-sequence"
          rm -rf "$temporary_output" "$repository_output"
          python -m liquid_gas_transient.hem_pipeline_post_crossing_cfl_sensitivity_full \
            --output-dir "$temporary_output"
          tracked_status="$(git status --porcelain=v1 --untracked-files=no)"
          printf 'post_execution_tracked_git_status=%s\n' "$tracked_status"
          test -z "$tracked_status"
          mkdir -p "$repository_output"
          cp -a "$temporary_output/." "$repository_output/"
      - name: Inspect Gate 8 full evidence contract
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          target = Path('artifacts/stage7-gate8-full-cfl-sequence')
          summary = json.loads((target / 'summary.json').read_text(encoding='utf-8'))
          assert summary['scope'] == 'verification_only'
          assert summary['case_id'] == 'pipeline_crossing_candidate_p5m5_to_p2m5'
          assert summary['mesh_cells'] == 32
          assert summary['locked_full_cfl_sequence'] == [0.10, 0.05, 0.025]
          assert summary['implemented_cfl_columns'] == [0.10, 0.05, 0.025]
          assert summary['pending_cfl_columns'] == []
          assert summary['gate6_identity_reproduced_exactly'] is True
          assert summary['full_gate8_sequence_executed'] is True
          assert summary['formal_outcome_comparison_complete'] is True
          assert summary['cross_cfl_interpretation_authorized'] is True
          assert 'FIXED_HORIZON_OUTCOME_DIVERGENCE' in summary['cross_cfl_classifications']
          assert 'POST_CROSSING_CFL_REVIEW_INCONCLUSIVE' in summary['cross_cfl_classifications']

          by_cfl = {row['cfl']: row for row in summary['columns']}
          assert set(by_cfl) == {0.10, 0.05, 0.025}

          cfl01 = by_cfl[0.10]
          first = cfl01['first_crossing']
          assert first['outcome'] == 'ACCEPTED_FIRST_CROSSING'
          assert first['crossing_step'] == 125
          assert first['crossing_time_s'] == 7.999325695335248e-4
          assert first['crossing_cell_indices'] == [29]
          assert first['crossing_distances_from_outlet_m'] == [0.078125]
          assert first['maximum_crossing_quality'] == 3.773646403587342e-6
          assert cfl01['continuation_outcome'] == 'COMPLETED_FIXED_CHECKPOINTS'
          assert cfl01['successful_post_crossing_step_count'] == 64
          assert cfl01['reached_checkpoints'] == ['T1', 'T2', 'T3', 'T4']
          assert cfl01['cell30_region_changes'] == 49
          assert cfl01['last_valid_state_sha256'] == '62bbaf5d7014af258180fe29622324a2228a0c5eec507ef10eb6b9f3e411d440'

          cfl005 = by_cfl[0.05]
          assert cfl005['first_crossing']['outcome'] == 'GUARD_FAILURE'
          assert cfl005['first_crossing']['crossing_step'] == 249
          assert cfl005['first_crossing']['crossing_time_s'] == 7.967173062790038e-4
          assert cfl005['first_crossing']['maximum_crossing_quality'] == 1.1006096906989802e-7
          assert cfl005['continuation_outcome'] == 'NOT_STARTED_NO_ACCEPTED_FIRST_CROSSING'
          assert cfl005['reached_checkpoints'] == []

          cfl0025 = by_cfl[0.025]
          assert cfl0025['first_crossing']['outcome']
          assert cfl0025['first_crossing']['outcome'] != 'NOT_EXECUTED_IN_INCREMENT_1'
          if cfl0025['first_crossing']['outcome'] == 'ACCEPTED_FIRST_CROSSING':
              assert cfl0025['continuation_outcome'] in {
                  'COMPLETED_FIXED_CHECKPOINTS',
                  'FAIL_SAFE_STOP',
              }
          else:
              assert cfl0025['continuation_outcome'] == 'NOT_STARTED_NO_ACCEPTED_FIRST_CROSSING'

          provenance = summary['provenance']
          assert provenance['source_git_sha'] == os.environ['ANALYSIS_SOURCE_GIT_SHA']
          assert provenance['checkout_git_sha']
          assert provenance['git_status_porcelain'] == ''
          assert provenance['property_backend_version'] == '8.0.0'

          assert summary['Gate_8_execution_complete'] is True
          for key in (
              'post_crossing_CFL_sensitivity_characterized',
              'CFL_independent_post_crossing_verified',
              'mesh_independent_post_crossing_verified',
              'post_crossing_propagation_approved',
              'phase_chatter_root_cause_approved',
              'chatter_mitigation_authorized',
              'near_saturation_acoustic_continuity_approved',
              'two_phase_acoustic_accuracy_band_approved',
              'Gate_P2_passed',
              'physical_validation',
              'design_use_acceptance',
              'production_hem_activation_approved',
          ):
              assert summary[key] is False

          for name in (
              'cfl_cases.csv',
              'cross_cfl_comparison.csv',
              'physical_checkpoints.csv',
              'cell_29_30_31_history.csv',
              'transition_events.csv',
              'inventory_budget.csv',
              'report.md',
              'front_position_vs_time.png',
              'quality_void_fraction_vs_time.png',
              'cell30_phase_acoustic_margin.png',
              'chatter_frequency_comparison.png',
              'budget_residual_comparison.png',
              'artifact_sha256.txt',
          ):
              assert (target / name).is_file(), name
          PY
      - name: Compile and diff checks
        run: |
          python -m compileall -q src tests
          git diff --check
      - name: Run dedicated Gate 8 full-sequence tests
        run: |
          python -m pytest -q \
            tests/test_stage7_lco2_hem_pipeline_post_crossing_cfl_sensitivity_full.py \
            --strict-markers --junitxml=gate8-full-dedicated.xml
      - name: Run related Stage 7 regressions
        run: |
          python -m pytest -q \
            tests/test_stage7_lco2_hem_pipeline_depressurization_increment2.py \
            tests/test_stage7_lco2_hem_pipeline_post_crossing_propagation.py \
            tests/test_stage7_lco2_hem_pipeline_phase_chatter_diagnosis.py \
            tests/test_stage7_lco2_hem_pipeline_post_crossing_cfl_sensitivity.py \
            tests/test_stage7_lco2_hem_pipeline_post_crossing_cfl_sensitivity_full.py \
            --strict-markers --junitxml=related-stage7.xml
      - name: Run full repository tests
        run: |
          python -m pytest -q --strict-markers --junitxml=full-repository.xml
      - name: Assert authoritative JUnit is clean
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          for name in (
              'gate8-full-dedicated.xml',
              'related-stage7.xml',
              'full-repository.xml',
          ):
              root = ET.parse(Path(name)).getroot()
              suites = [root] if root.tag == 'testsuite' else list(root.findall('testsuite'))
              totals = {
                  key: sum(int(s.attrib.get(key, 0)) for s in suites)
                  for key in ('tests', 'skipped', 'failures', 'errors')
              }
              print(name, totals)
              assert totals['skipped'] == 0
              assert totals['failures'] == 0
              assert totals['errors'] == 0
          PY
      - name: Upload Gate 8 full evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stage7-gate8-full-cfl-sequence-${{ github.run_id }}
          path: |
            artifacts/stage7-gate8-full-cfl-sequence
            gate8-full-dedicated.xml
            related-stage7.xml
            full-repository.xml
          if-no-files-found: warn
