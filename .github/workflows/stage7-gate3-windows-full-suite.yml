name: Stage 7 Gate 3 Windows Full Suite

on:
  push:
    branches:
      - agent/stage7-gate3-numeric-equivalence-capture
  pull_request:
  workflow_dispatch:

env:
  PYTHONPATH: src
  PYTHONDONTWRITEBYTECODE: '1'
  MPLBACKEND: Agg
  ANALYSIS_SOURCE_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  validate-windows-full-suite:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'

      - name: Install pinned Windows runtime
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pytest matplotlib 'numpy==2.5.1' 'CoolProp==8.0.0'

      - name: Report runtime and checkout
        shell: pwsh
        run: |
          python -c "import json, platform, CoolProp, numpy; print(json.dumps({'platform': platform.platform(), 'python': platform.python_version(), 'numpy': numpy.__version__, 'CoolProp': CoolProp.__version__}, indent=2))"
          git rev-parse HEAD
          $status = git status --porcelain=v1 --untracked-files=all
          if ($status) { throw "checkout is dirty before execution: $status" }

      - name: Compile and diff checks
        shell: pwsh
        run: |
          python -m compileall -q src tests
          git diff --check

      - name: Run complete repository suite
        shell: pwsh
        run: |
          $junit = Join-Path $env:RUNNER_TEMP 'stage7-gate3-windows-full-suite.xml'
          $log = Join-Path $env:RUNNER_TEMP 'stage7-gate3-windows-full-suite.log'
          & python -m pytest -q --strict-markers --junitxml=$junit 2>&1 |
            Tee-Object -FilePath $log
          $pytestCode = $LASTEXITCODE
          Write-Host "pytest exit code: $pytestCode"
          if (-not (Test-Path -LiteralPath $junit -PathType Leaf)) {
            throw 'full-suite JUnit XML was not created'
          }
          exit 0

      - name: Require only reviewed Windows exact mismatches
        shell: pwsh
        run: |
          python -m liquid_gas_transient.hem_pipeline_gate3_windows_suite `
            --junit "$env:RUNNER_TEMP\stage7-gate3-windows-full-suite.xml" `
            --output "$env:RUNNER_TEMP\stage7-gate3-windows-full-suite-report.json"

      - name: Assert pristine checkout after execution
        shell: pwsh
        run: |
          $status = git status --porcelain=v1 --untracked-files=all
          if ($status) { throw "checkout is dirty after execution: $status" }

      - name: Upload Windows full-suite evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stage7-gate3-windows-full-suite-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/stage7-gate3-windows-full-suite.xml
            ${{ runner.temp }}/stage7-gate3-windows-full-suite.log
            ${{ runner.temp }}/stage7-gate3-windows-full-suite-report.json
          if-no-files-found: warn
