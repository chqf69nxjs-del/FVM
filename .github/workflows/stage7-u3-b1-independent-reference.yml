name: Stage 7 U3 B1 Independent Reference

on:
  pull_request:
    paths:
      - "src/liquid_gas_transient/u3_b1_critical_state_reference.py"
      - "src/liquid_gas_transient/u3_b1_critical_state_authoritative.py"
      - "src/liquid_gas_transient/u3_b1_critical_state_diagnostic.py"
      - "tests/test_stage7_u3_b1_critical_state_reference.py"
      - "docs/verification/stage7_u3_b1_critical_state_contract_v1.json"
      - "docs/verification/stage7_u3_b1_independent_reference.md"
      - ".github/workflows/stage7-u3-b1-independent-reference.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage7-u3-b1-reference-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: src
  PYTHONDONTWRITEBYTECODE: "1"
  MPLBACKEND: Agg
  ANALYSIS_SOURCE_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  u3-b1-independent-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install fixed dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy matplotlib pytest 'CoolProp==8.0.0'

      - name: Assert pristine checkout
        run: |
          echo "checkout_sha=$(git rev-parse HEAD)"
          status="$(git status --porcelain=v1 --untracked-files=all)"
          printf 'pre_execution_git_status=%s\n' "$status"
          test -z "$status"

      - name: Execute independent B1 reference
        run: |
          output="artifacts/stage7-u3-b1-independent-reference"
          rm -rf "$output"
          python -m liquid_gas_transient.u3_b1_critical_state_diagnostic \
            --contract docs/verification/stage7_u3_b1_critical_state_contract_v1.json \
            --output-dir "$output"
          python -m liquid_gas_transient.u3_b1_critical_state_authoritative \
            --contract docs/verification/stage7_u3_b1_critical_state_contract_v1.json \
            --output-dir "$output" \
            --source-git-sha "$ANALYSIS_SOURCE_GIT_SHA"
          tracked_status="$(git status --porcelain=v1 --untracked-files=no)"
          printf 'post_execution_tracked_git_status=%s\n' "$tracked_status"
          test -z "$tracked_status"

      - name: Inspect independent reference artifact
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          import os
          from pathlib import Path

          target = Path("artifacts/stage7-u3-b1-independent-reference")
          expected = {
              "summary.json",
              "benchmark_contract.json",
              "candidate_states.csv",
              "critical_state_summary.json",
              "back_pressure_sweep.csv",
              "b0_limiting_comparison.csv",
              "scaling_checks.csv",
              "guard_outcomes.csv",
              "conservative_transfer_table.csv",
              "mass_flux_vs_pressure.png",
              "back_pressure_response.png",
              "report.md",
              "artifact_sha256.txt",
              "raw_reference_diagnostic.json",
          }
          assert {path.name for path in target.iterdir()} == expected
          summary = json.loads((target / "summary.json").read_text(encoding="utf-8"))
          assert summary["schema_version"] == "stage7_u3_b1_independent_reference_v1"
          assert summary["case_count"] == 17
          assert summary["physical_case_count"] == 12
          assert summary["guard_case_count"] == 5
          assert summary["success_count"] == 12
          assert summary["guard_count"] == 5
          assert summary["all_expected_outcomes_match"] is True
          assert summary["all_locked_checks_passed"] is True
          assert summary["b0_limit_passed"] is True
          assert summary["unchoked_ordering_passed"] is True
          assert summary["below_critical_plateau_passed"] is True
          assert summary["area_scaling_passed"] is True
          assert summary["Cd_scaling_passed"] is True
          assert summary["critical_pressure_Cd_independence_passed"] is True
          assert summary["u3_b1_contract_locked"] is True
          assert summary["u3_b1_reference_implemented"] is True
          assert summary["u3_b1_adapter_implemented"] is False
          assert summary["u3_b1_component_benchmark_execution_complete"] is False
          assert summary["u3_b1_component_benchmark_accepted"] is False
          assert summary["physical_discharge_boundary_approved"] is False
          assert summary["physical_validation"] is False
          assert summary["design_use_acceptance"] is False
          assert summary["production_hem_activation_approved"] is False
          assert summary["provenance"]["source_git_sha"] == os.environ["ANALYSIS_SOURCE_GIT_SHA"]
          assert summary["provenance"]["property_backend_version"] == "8.0.0"

          critical = json.loads((target / "critical_state_summary.json").read_text(encoding="utf-8"))
          assert set(critical) == {"GAS_CRITICAL|Cd=0.4", "GAS_CRITICAL|Cd=0.8"}
          for row in critical.values():
              assert 0.05 < row["pressure_ratio"] < 1.0
              assert row["effective_mass_flux_kg_m2_s"] > 0.0
              assert row["final_bracket_width_pa"] <= 1.0
              assert row["peak_prominence_relative"] >= 1e-8

          with (target / "candidate_states.csv").open(newline="", encoding="utf-8") as handle:
              candidates = list(csv.DictReader(handle))
          assert len(candidates) > 1000
          assert any(row["admissible"] == "True" for row in candidates)

          with (target / "back_pressure_sweep.csv").open(newline="", encoding="utf-8") as handle:
              sweep = list(csv.DictReader(handle))
          assert len(sweep) == 101

          manifest = {}
          for line in (target / "artifact_sha256.txt").read_text(encoding="utf-8").splitlines():
              digest, name = line.split("  ", 1)
              manifest[name] = digest
          assert set(manifest) == expected - {"artifact_sha256.txt"}
          for name, digest in manifest.items():
              assert hashlib.sha256((target / name).read_bytes()).hexdigest() == digest
          PY

      - name: Compile and diff checks
        run: |
          python -m compileall -q src tests
          git diff --check

      - name: Run dedicated reference tests
        run: |
          python -m pytest -q \
            tests/test_stage7_u3_b1_critical_state_reference.py \
            --strict-markers \
            --junitxml=dedicated_junit.xml

      - name: Run related U3 regressions
        run: |
          python -m pytest -q \
            tests/test_stage7_u3_b0_discharge_reference.py \
            tests/test_stage7_u3_b0_discharge_adapter.py \
            tests/test_stage7_u3_b1_critical_state_contract.py \
            tests/test_stage7_u3_b1_critical_state_reference.py \
            --strict-markers \
            --junitxml=related_junit.xml

      - name: Run full repository tests
        run: |
          python -m pytest -q \
            --strict-markers \
            --junitxml=full_repository_junit.xml

      - name: Assert authoritative JUnit is clean
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          for name in (
              "dedicated_junit.xml",
              "related_junit.xml",
              "full_repository_junit.xml",
          ):
              root = ET.parse(Path(name)).getroot()
              suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
              totals = {
                  key: sum(int(s.attrib.get(key, 0)) for s in suites)
                  for key in ("tests", "skipped", "failures", "errors")
              }
              print(name, totals)
              assert totals["skipped"] == 0
              assert totals["failures"] == 0
              assert totals["errors"] == 0
          PY

      - name: Upload B1 independent-reference evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stage7-u3-b1-reference-${{ github.run_id }}
          path: |
            artifacts/stage7-u3-b1-independent-reference
            dedicated_junit.xml
            related_junit.xml
            full_repository_junit.xml
          if-no-files-found: warn
