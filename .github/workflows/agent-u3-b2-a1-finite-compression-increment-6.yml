name: Agent U3 B2 A1 Finite Compression Increment 6

on:
  push:
    branches: [agent/u3-b2-a1-wave-curve-review]
    paths:
      - ".github/workflows/agent-u3-b2-a1-finite-compression-increment-6.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: agent-u3-b2-a1-finite-compression-increment-6
  cancel-in-progress: true

env:
  PYTHONPATH: src:tools/verification
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONPYCACHEPREFIX: /tmp/u3-b2-a1-finite-compression-inc6-pycache
  SOURCE_SHA: ${{ github.sha }}
  SCOPE_BASE_SHA: d63407497385bc535588ab90ec6f61745a282731
  PARENT_RUN_ID: "31650819553"
  PARENT_ARTIFACT_ID: "9162559698"
  PARENT_ARTIFACT_NAME: u3-b2-a1-weak-compression-bridge-increment-4f-root-topology-31650819553
  PARENT_ARTIFACT_DIGEST: 6f611e1935d2680a04046d1fc7fbb595f19bc99d12ccc274700fd92c086ddb93
  INCREMENT_5_RUN_ID: "31652171734"
  INCREMENT_5_ARTIFACT_ID: "9162985187"
  INCREMENT_5_ARTIFACT_NAME: u3-b2-a1-finite-compression-increment-5-rerun-2-31652171734
  INCREMENT_5_ARTIFACT_DIGEST: 80051eedde6b5a9ea92938d9700ad5fa03eaa5ff3cd54dae3964bb12c1fb1781

jobs:
  apply-one-hugoniot-boundary-step:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact Increment 6 source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"

      - name: Install fixed dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.5.1' 'CoolProp==8.0.0'

      - name: Verify fixed source identity and one-step scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test -f docs/verification/stage7_u3_b2_a1_finite_compression_increment_6_hugoniot_one_step_model_review.md
          test -f tools/verification/u3_b2_a1_finite_compression_hugoniot_one_step.py
          python -m py_compile \
            tools/verification/u3_b2_a1_finite_compression_hugoniot_one_step.py
          mapfile -t actual < <(
            git diff --name-only "${SCOPE_BASE_SHA}" HEAD | sort
          )
          mapfile -t expected < <(printf '%s\n' \
            '.github/workflows/agent-u3-b2-a1-finite-compression-increment-6.yml' | sort)
          diff -u \
            <(printf '%s\n' "${expected[@]}") \
            <(printf '%s\n' "${actual[@]}")
          git diff --check "${SCOPE_BASE_SHA}" HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Download authoritative accepted step-483 artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.PARENT_ARTIFACT_NAME }}
          path: artifacts/parent-step-483
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.PARENT_RUN_ID }}

      - name: Download authoritative Increment 5 artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.INCREMENT_5_ARTIFACT_NAME }}
          path: artifacts/increment-5
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.INCREMENT_5_RUN_ID }}

      - name: Verify GitHub artifact metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          parent="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PARENT_ARTIFACT_ID}")"
          test "$(jq -r '.id' <<<"${parent}")" = "${PARENT_ARTIFACT_ID}"
          test "$(jq -r '.name' <<<"${parent}")" = "${PARENT_ARTIFACT_NAME}"
          test "$(jq -r '.workflow_run.id' <<<"${parent}")" = "${PARENT_RUN_ID}"
          test "$(jq -r '.workflow_run.head_sha' <<<"${parent}")" = "2c1e1e26138b7d3bd3cf0e7f1d2f7a2c11b443c1"
          test "$(jq -r '.digest' <<<"${parent}")" = "sha256:${PARENT_ARTIFACT_DIGEST}"
          inc5="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${INCREMENT_5_ARTIFACT_ID}")"
          test "$(jq -r '.id' <<<"${inc5}")" = "${INCREMENT_5_ARTIFACT_ID}"
          test "$(jq -r '.name' <<<"${inc5}")" = "${INCREMENT_5_ARTIFACT_NAME}"
          test "$(jq -r '.workflow_run.id' <<<"${inc5}")" = "${INCREMENT_5_RUN_ID}"
          test "$(jq -r '.workflow_run.head_sha' <<<"${inc5}")" = "c4a0f92e4b418c2cc91c53639bff50b8d3af69b5"
          test "$(jq -r '.digest' <<<"${inc5}")" = "sha256:${INCREMENT_5_ARTIFACT_DIGEST}"

      - name: Run actual Hugoniot one-step review
        shell: bash
        run: |
          set -euo pipefail
          output=artifacts/u3-b2-a1-finite-compression-increment-6
          rm -rf "${output}"
          python tools/verification/u3_b2_a1_finite_compression_hugoniot_one_step.py \
            --contract docs/verification/stage7_u3_b2_fvm_discharge_coupling_contract_v1.json \
            --b1-contract docs/verification/stage7_u3_b1_critical_state_contract_v1.json \
            --model-review-spec docs/verification/stage7_u3_b2_a1_finite_compression_increment_6_hugoniot_one_step_model_review.md \
            --parent-artifact-dir artifacts/parent-step-483 \
            --parent-artifact-digest "${PARENT_ARTIFACT_DIGEST}" \
            --increment-5-artifact-dir artifacts/increment-5 \
            --increment-5-artifact-digest "${INCREMENT_5_ARTIFACT_DIGEST}" \
            --output-dir "${output}" \
            --source-git-sha "${SOURCE_SHA}"

      - name: Inspect Increment 6 evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import hashlib
          import json
          import os
          from pathlib import Path
          import numpy as np

          target = Path(
              "artifacts/u3-b2-a1-finite-compression-increment-6"
          )
          expected = {
              "recomputed_isentropic_scan.csv",
              "recomputed_hugoniot_scan.csv",
              "recomputed_hugoniot_density_search.csv",
              "hugoniot_root_evidence.csv",
              "finite_compression_one_step.csv",
              "authority_verification.json",
              "root_authority_comparison.json",
              "finite_compression_one_step_states.npz",
              "summary.json",
              "report.md",
              "artifact_sha256.txt",
          }
          assert {path.name for path in target.iterdir()} == expected
          summary = json.loads(
              (target / "summary.json").read_text(encoding="utf-8")
          )
          assert summary["source_git_sha"] == os.environ["SOURCE_SHA"]
          assert summary["outcome"] == (
              "FINITE_COMPRESSION_INCREMENT_6_HUGONIOT_ONE_STEP_PASS"
          )
          assert summary["increment_6_one_step_gate_passed"] is True
          assert summary["pre_step_gate_passed"] is True
          assert summary["post_step_gate_passed"] is True
          assert summary["parent_artifact_verified"] is True
          assert summary["increment_5_artifact_verified"] is True
          assert summary["increment_5_outcome"] == (
              "FINITE_COMPRESSION_HUGONIOT_ROOT_SUPPORTED_FOR_ONE_STEP_REVIEW"
          )
          assert summary["increment_5_reproduction_outcome"] == (
              "FINITE_COMPRESSION_HUGONIOT_ROOT_SUPPORTED_FOR_ONE_STEP_REVIEW"
          )
          assert summary["root_authority_comparison_passed"] is True
          assert summary["solver_step_before"] == 483
          assert summary["solver_step_after"] == 484
          assert summary["accepted_dt_s"] > 0.0
          assert summary["solver_time_after_s"] == (
              summary["solver_time_before_s"] + summary["accepted_dt_s"]
          )
          assert summary["branch_classification"] == (
              "FINITE_COMPRESSION_HUGONIOT"
          )
          assert summary["finite_compression_model"] == (
              "GENERAL_EOS_HUGONIOT"
          )
          assert summary["root_requested_chi"] > 1.0e-6
          assert summary["root_requested_chi"] <= 1.0e-4
          assert abs(summary["root_mass_residual_kg_s"]) <= 1.0e-8
          assert summary["root_local_slope_kg_s_Pa"] < 0.0
          assert summary["root_hugoniot_identity_accounted_passed"] is True
          assert summary["root_lax_1_shock_passed"] is True
          assert summary["root_entropy_delta_J_kg_K"] >= -1.0e-7
          assert summary["outlet_velocity_after_step_m_s"] >= 0.0
          assert 0.0 <= summary["outlet_mach_after_step"] < 1.0
          assert summary["outlet_phase_after_step"] == "liquid"
          assert summary["minimum_density_after_step_kg_m3"] > 0.0
          assert summary["minimum_internal_energy_after_step_J_kg"] > 0.0
          assert summary["rho_xv_exact_zero_after_step"] is True
          assert summary["finite_compression_flux_applied"] is True
          assert summary["finite_compression_branch_approved"] is False
          assert summary[
              "multi_step_finite_compression_continuation_authorized"
          ] is False
          assert summary["full_two_l_over_c0_passed"] is False
          assert summary["formal_state_promoted"] is False
          assert summary["u3_b2_finite_pipe_execution_complete"] is False
          assert summary["single_phase_finite_pipe_coupling_verified"] is False
          assert summary["u3_b2_verification_benchmark_accepted"] is False
          assert summary["physical_validation"] is False
          assert summary["design_use_acceptance"] is False
          assert summary["production_hem_activation_approved"] is False

          comparison = json.loads(
              (target / "root_authority_comparison.json").read_text(
                  encoding="utf-8"
              )
          )
          assert comparison["passed"] is True
          assert all(item["passed"] for item in comparison["checks"].values())

          with (target / "finite_compression_one_step.csv").open(
              newline="", encoding="utf-8"
          ) as handle:
              step_rows = list(csv.DictReader(handle))
          assert len(step_rows) == 1
          row = step_rows[0]
          assert row["accepted_step"] == "True"
          assert row["step_passed"] == "True"
          assert int(row["solver_step_count"]) == 484
          assert row["branch_classification"] == (
              "FINITE_COMPRESSION_HUGONIOT"
          )
          assert row["finite_compression_flux_applied"] == "True"
          assert row["finite_compression_branch_approved"] == "False"

          with np.load(
              target / "finite_compression_one_step_states.npz"
          ) as states:
              before = np.asarray(states["U_before"], dtype=float)
              after = np.asarray(states["U_after"], dtype=float)
              assert before.shape == (32, 4)
              assert after.shape == (32, 4)
              assert not np.array_equal(before, after)
              assert int(states["solver_step_before"][0]) == 483
              assert int(states["solver_step_after"][0]) == 484
              assert float(states["accepted_dt_s"][0]) > 0.0

          manifest = {}
          for line in (target / "artifact_sha256.txt").read_text(
              encoding="utf-8"
          ).splitlines():
              digest, name = line.split("  ", 1)
              manifest[name] = digest
          assert set(manifest) == expected - {"artifact_sha256.txt"}
          for name, digest in manifest.items():
              assert hashlib.sha256((target / name).read_bytes()).hexdigest() == digest
          PY

      - name: Upload Increment 6 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: u3-b2-a1-finite-compression-increment-6-${{ github.run_id }}
          path: artifacts/u3-b2-a1-finite-compression-increment-6
          if-no-files-found: warn
