name: Apply U3 B1 adapter report source provenance

on:
  push:
    branches:
      - agent/u3-b1-critical-state-adapter-clean
    paths:
      - .github/workflows/apply-u3-b1-adapter-report-source-provenance.yml

permissions:
  contents: write

concurrency:
  group: u3-b1-adapter-report-source-provenance
  cancel-in-progress: true

jobs:
  apply-report-source-provenance:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Adapter branch
        uses: actions/checkout@v7
        with:
          ref: agent/u3-b1-critical-state-adapter-clean
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"

      - name: Add Adapter source SHA to report
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          adapter = Path("src/liquid_gas_transient/u3_b1_critical_state_adapter.py")
          source = adapter.read_text(encoding="utf-8")
          if 'f"- adapter source SHA: {source_git_sha}"' not in source:
              replace_once(
                  adapter,
                  '''        f"- property backend: CoolProp {property_provider.version}",\n        f"- reference resolution: {reference_resolution_mode}",\n''',
                  '''        f"- property backend: CoolProp {property_provider.version}",\n        f"- adapter source SHA: {source_git_sha}",\n        f"- reference resolution: {reference_resolution_mode}",\n''',
              )

          tests = Path("tests/test_stage7_u3_b1_critical_state_adapter.py")
          text = tests.read_text(encoding="utf-8")
          if 'assert "adapter source SHA: test-adapter-sha" in report' not in text:
              replace_once(
                  tests,
                  '''    assert "property backend: CoolProp analytic" in report\n    assert "reference resolution: recomputed_from_pinned_source_sha" in report\n''',
                  '''    assert "property backend: CoolProp analytic" in report\n    assert "adapter source SHA: test-adapter-sha" in report\n    assert "reference resolution: recomputed_from_pinned_source_sha" in report\n''',
              )
          PY

      - name: Run targeted regression
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
          MPLBACKEND: Agg
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pytest==9.1.1'
          python -m pytest -q \
            tests/test_stage7_u3_b1_critical_state_adapter.py \
            --strict-markers
          git diff --check
          test -z "$(find src tests -type d -name __pycache__ -print -quit)"

      - name: Commit source and test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/liquid_gas_transient/u3_b1_critical_state_adapter.py \
            tests/test_stage7_u3_b1_critical_state_adapter.py
          if git diff --cached --quiet; then
            echo "Adapter report source provenance already present."
            exit 0
          fi
          git commit -m "Record Adapter source SHA in U3 B1 report"
          git push origin HEAD:agent/u3-b1-critical-state-adapter-clean
