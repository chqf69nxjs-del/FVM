name: Stage 7 Gate 4 Central Record Publisher

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  actions: read
  contents: write

jobs:
  publish-clean-central-records:
    if: github.head_ref == 'agent/stage7-gate4-central-record-sync' && github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download validated Gate 4 central records
        uses: actions/download-artifact@v7
        with:
          name: stage7-gate4-central-records-30367104281
          path: gate4-central-records
          github-token: ${{ github.token }}
          repository: chqf69nxjs-del/FVM
          run-id: 30367104281

      - name: Install validated central records
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          source_root = Path('gate4-central-records')
          target_root = Path('docs/verification')
          required = {
              'MASTER_VERIFICATION_INDEX.md': 'CFL_SENSITIVITY_OBSERVED',
              'stage7_current_gate_snapshot.md': 'low-CFL result accepted = true',
              'stage7_execution_log.md': 'Gate_4_execution = COMPLETE',
          }
          for name, marker in required.items():
              matches = list(source_root.rglob(name))
              assert len(matches) == 1, (name, matches)
              destination = target_root / name
              shutil.copyfile(matches[0], destination)
              text = destination.read_text(encoding='utf-8')
              assert marker in text, (name, marker)
          PY
          git diff --check

      - name: Publish clean three-file branch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/verification/MASTER_VERIFICATION_INDEX.md \
            docs/verification/stage7_current_gate_snapshot.md \
            docs/verification/stage7_execution_log.md
          git diff --cached --check
          python - <<'PY'
          import subprocess
          expected = [
              'docs/verification/MASTER_VERIFICATION_INDEX.md',
              'docs/verification/stage7_current_gate_snapshot.md',
              'docs/verification/stage7_execution_log.md',
          ]
          actual = subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only'], text=True
          ).splitlines()
          assert actual == expected, (actual, expected)
          PY
          git commit -m 'Synchronize Stage 7 central records through Gate 4'
          git push --force origin HEAD:refs/heads/agent/stage7-gate4-central-records-clean
