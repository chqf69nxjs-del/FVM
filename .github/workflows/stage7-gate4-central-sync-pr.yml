name: Stage 7 Gate 4 Central Record Sync PR

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  synchronize-central-records:
    if: github.head_ref == 'agent/stage7-gate4-central-record-sync' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout synchronization branch
        uses: actions/checkout@v7
        with:
          ref: agent/stage7-gate4-central-record-sync
          fetch-depth: 0

      - name: Extract and execute reviewed synchronization payload
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          text = Path('.github/workflows/stage7-gate4-central-sync-once.yml').read_text(encoding='utf-8')
          tail = text.split('PATCH_GZIP_BASE64: >-', 1)[1]
          block = tail.split('\n        run: |', 1)[0]
          payload = ''.join(line.strip() for line in block.splitlines())
          code = gzip.decompress(base64.b64decode(payload))
          exec(compile(code, 'stage7_gate4_central_sync.py', 'exec'))
          PY

      - name: Validate and push clean three-file synchronization
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'CFL_SENSITIVITY_OBSERVED' docs/verification/MASTER_VERIFICATION_INDEX.md
          grep -q 'low-CFL result accepted = true' docs/verification/stage7_current_gate_snapshot.md
          grep -q 'Gate_4_execution = COMPLETE' docs/verification/stage7_execution_log.md
          rm -f .github/workflows/stage7-gate4-central-sync-once.yml
          rm -f .github/workflows/stage7-gate4-central-sync-pr.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          changed="$(git diff --cached --name-only)"
          printf '%s\n' "$changed"
          expected=$'.github/workflows/stage7-gate4-central-sync-once.yml\n.github/workflows/stage7-gate4-central-sync-pr.yml\ndocs/verification/MASTER_VERIFICATION_INDEX.md\ndocs/verification/stage7_current_gate_snapshot.md\ndocs/verification/stage7_execution_log.md'
          test "$changed" = "$expected"
          git commit -m 'Synchronize Stage 7 central records through Gate 4'
          git push origin HEAD:agent/stage7-gate4-central-record-sync
