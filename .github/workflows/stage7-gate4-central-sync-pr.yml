name: Stage 7 Gate 4 Central Record Publisher

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  actions: read
  contents: write

jobs:
  publish-clean-central-records:
    if: github.head_ref == 'agent/stage7-gate4-central-record-sync' && github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Download validated Gate 4 central records
        uses: actions/download-artifact@v7
        with:
          name: stage7-gate4-central-records-30367104281
          path: gate4-central-records
          github-token: ${{ github.token }}
          repository: chqf69nxjs-del/FVM
          run-id: 30367104281

      - name: Install validated central records
        run: |
          set -euo pipefail
          find gate4-central-records -maxdepth 6 -type f -print
          master="$(find gate4-central-records -type f -name MASTER_VERIFICATION_INDEX.md -print -quit)"
          snapshot="$(find gate4-central-records -type f -name stage7_current_gate_snapshot.md -print -quit)"
          log="$(find gate4-central-records -type f -name stage7_execution_log.md -print -quit)"
          test -n "$master"
          test -n "$snapshot"
          test -n "$log"
          cp "$master" docs/verification/MASTER_VERIFICATION_INDEX.md
          cp "$snapshot" docs/verification/stage7_current_gate_snapshot.md
          cp "$log" docs/verification/stage7_execution_log.md
          git diff --check
          grep -q 'CFL_SENSITIVITY_OBSERVED' docs/verification/MASTER_VERIFICATION_INDEX.md
          grep -q 'low-CFL result accepted = true' docs/verification/stage7_current_gate_snapshot.md
          grep -q 'Gate_4_execution = COMPLETE' docs/verification/stage7_execution_log.md

      - name: Publish clean three-file branch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/verification/MASTER_VERIFICATION_INDEX.md \
            docs/verification/stage7_current_gate_snapshot.md \
            docs/verification/stage7_execution_log.md
          git diff --cached --check
          changed="$(git diff --cached --name-only)"
          test "$changed" = $'docs/verification/MASTER_VERIFICATION_INDEX.md\ndocs/verification/stage7_current_gate_snapshot.md\ndocs/verification/stage7_execution_log.md'
          git commit -m 'Synchronize Stage 7 central records through Gate 4'
          git push --force origin HEAD:refs/heads/agent/stage7-gate4-central-records-clean
