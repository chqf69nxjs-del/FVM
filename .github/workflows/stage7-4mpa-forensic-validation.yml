name: Stage 7 4 MPa Forensic Validation

on:
  push:
    branches:
      - agent/stage7-pipeline-4mpa-subthreshold-forensics
  pull_request:
  workflow_dispatch:

env:
  PYTHONPATH: src
  MPLBACKEND: Agg

jobs:
  validate-4mpa-forensics:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e '.[plotting]'
          python -m pip install pytest 'CoolProp==8.0.0'

      - name: Smoke check
        run: |
          python - <<'PY'
          import CoolProp
          import matplotlib
          import numpy
          print('CoolProp', CoolProp.__version__)
          print('matplotlib', matplotlib.__version__)
          print('numpy', numpy.__version__)
          PY

      - name: Compile and diff checks
        run: |
          python -m compileall -q src tests
          git diff --check

      - name: Run dependency-free forensic tests
        run: |
          python -m pytest -q \
            tests/test_stage7_lco2_hem_pipeline_4mpa_subthreshold_forensics.py \
            -m 'not coolprop_installed' \
            --strict-markers \
            --junitxml=forensic-pure.xml

      - name: Run installed-CoolProp forensic tests
        run: |
          python -m pytest -q \
            tests/test_stage7_lco2_hem_pipeline_4mpa_subthreshold_forensics.py \
            -m coolprop_installed \
            --strict-markers \
            --junitxml=forensic-coolprop.xml

      - name: Generate authoritative forensic artifacts
        run: |
          python -m liquid_gas_transient.hem_pipeline_4mpa_subthreshold_forensics \
            --output-dir artifacts/stage7-4mpa-forensics
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('artifacts/stage7-4mpa-forensics/4mpa_forensic_summary.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          print(json.dumps(data, indent=2, sort_keys=True))
          assert data['baseline_reproduced_exactly'] is True
          assert data['PR77_observation_reclassified'] is False
          assert data['Gate_P2_passed'] is False
          assert data['local_state_record_count'] == 210
          assert data['saturation_margin_record_count'] == 70
          assert data['flux_decomposition_record_count'] == 70
          assert data['perturbation_record_count'] == 81
          PY

      - name: Run related Stage 7 regression tests
        run: |
          python -m pytest -q \
            tests/test_stage7_lco2_hem_pipeline_depressurization_increment2.py \
            tests/test_stage7_lco2_hem_pipeline_depressurization_boundary_increment1.py \
            tests/test_stage7_lco2_hem_liquid_to_two_phase_first_crossing_case_ab.py \
            --strict-markers \
            --junitxml=related-stage7.xml

      - name: Run full repository tests
        run: |
          python -m pytest -q --strict-markers --junitxml=full-repository.xml

      - name: Assert authoritative tests were not skipped or failed
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for name in (
              'forensic-pure.xml',
              'forensic-coolprop.xml',
              'related-stage7.xml',
              'full-repository.xml',
          ):
              root = ET.parse(Path(name)).getroot()
              suites = [root] if root.tag == 'testsuite' else list(root.findall('testsuite'))
              skipped = sum(int(s.attrib.get('skipped', 0)) for s in suites)
              failures = sum(int(s.attrib.get('failures', 0)) for s in suites)
              errors = sum(int(s.attrib.get('errors', 0)) for s in suites)
              print(name, 'skipped=', skipped, 'failures=', failures, 'errors=', errors)
              assert skipped == 0
              assert failures == 0
              assert errors == 0
          PY

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stage7-4mpa-forensic-validation-${{ github.run_id }}
          path: |
            artifacts/stage7-4mpa-forensics
            forensic-pure.xml
            forensic-coolprop.xml
            related-stage7.xml
            full-repository.xml
          if-no-files-found: warn
