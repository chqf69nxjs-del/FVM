name: Stage 7 Pipeline Boundary Record Sync

on:
  push:
    branches:
      - agent/sync-stage7-pipeline-boundary-records
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage7-pipeline-boundary-record-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synchronize-records:
    name: synchronize-records
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Update central Stage 7 records
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          master_path = Path("docs/verification/MASTER_VERIFICATION_INDEX.md")
          log_path = Path("docs/verification/stage7_execution_log.md")
          master = master_path.read_text(encoding="utf-8")
          log = log_path.read_text(encoding="utf-8")

          marker = "## Pipeline-depressurization prototype and boundary — PRs #73–#75"
          if marker not in master:
              def replace_once(text: str, old: str, new: str, label: str) -> str:
                  count = text.count(old)
                  if count != 1:
                      raise RuntimeError(f"{label}: expected exactly one match, found {count}")
                  return text.replace(old, new, 1)

              master = replace_once(
                  master,
                  "- recorded development `main`: `628800530851b0cb677bc0a6bedcb85a13a303d1`",
                  "- recorded development `main`: `9982c52bc4c26fac991972f0a8156c857e4bf21f`",
                  "master recorded main",
              )
              master = replace_once(
                  master,
                  "- first repeatable crossing Case A and matched liquid Case B: `FROZEN; MERGED` in PR #72\n- first-order liquid-to-open-two-phase software crossing: `VERIFIED`",
                  "- first repeatable crossing Case A and matched liquid Case B: `FROZEN; MERGED` in PR #72\n- minimal LCO2 pipeline-depressurization prototype specification: `SPECIFIED; MERGED` in PR #74\n- prescribed-subcooled outlet boundary Increment 1: `IMPLEMENTED; SOFTWARE-VERIFIED; MERGED` in PR #75\n- boundary-path preflight: `195 / 195 ACCEPTED LIQUID_CANDIDATE`\n- first-order liquid-to-open-two-phase software crossing: `VERIFIED`",
                  "master current-state additions",
              )
              master = replace_once(
                  master,
                  "- active physical-model gate: narrow LCO2 pipeline-depressurization prototype specification",
                  "- active physical-model gate: Increment 2 fixed 5→2/3/4 MPa pipeline short-run matrix",
                  "master active gate",
              )
              master = replace_once(
                  master,
                  "The merged HEM verification path now supports guarded real-fluid state evaluation,\nexplicit phase classification, an equilibrium sound-speed candidate, quality projection,\nmixed liquid/open-two-phase accepted-state evaluation, direct raw transition detection,\nan actual first-order Rusanov/CFL liquid-to-open-two-phase crossing, synchronized\npost-crossing recovery, vapor-budget closure, and a repeatable matched Case A/B software\nverification pair. A pipeline-depressurization prototype and physical Validation remain\nunestablished.",
                  "The merged HEM verification path now supports guarded real-fluid state evaluation,\nexplicit phase classification, an equilibrium sound-speed candidate, quality projection,\nmixed liquid/open-two-phase accepted-state evaluation, direct raw transition detection,\nan actual first-order Rusanov/CFL liquid-to-open-two-phase crossing, synchronized\npost-crossing recovery, vapor-budget closure, a repeatable matched Case A/B software\nverification pair, a fixed minimal pipeline-depressurization specification, and a verified\nprescribed-subcooled outlet boundary constructor. The pipeline FVM transient and physical\nValidation remain unestablished.",
                  "master overview paragraph",
              )
              master = replace_once(
                  master,
                  "| PR #72 | repeated first-crossing Case A/B freeze | `VERIFIED; FROZEN; MERGED` | merge `628800530851b0cb677bc0a6bedcb85a13a303d1` |",
                  "| PR #72 | repeated first-crossing Case A/B freeze | `VERIFIED; FROZEN; MERGED` | merge `628800530851b0cb677bc0a6bedcb85a13a303d1` |\n| PR #73 | first-crossing central-record synchronization | `MERGED` | merge `3e55b3fae88d813437654c144d0157de5b6d398f` |\n| PR #74 | minimal LCO2 pipeline-depressurization prototype specification | `SPECIFIED; MERGED` | merge `49b34bf955a5dd1f0d106f2e81f55aff3bd24add` |\n| PR #75 | prescribed-subcooled outlet boundary Increment 1 | `IMPLEMENTED; SOFTWARE-VERIFIED; MERGED` | merge `9982c52bc4c26fac991972f0a8156c857e4bf21f` |",
                  "master milestone rows",
              )

              pipeline_section = '''## Pipeline-depressurization prototype and boundary — PRs #73–#75

### PR #73 — central synchronization through frozen Case A/B

PR #73 synchronized the master index and execution log through PR #72. It changed only the
two central verification documents. Merge:
`3e55b3fae88d813437654c144d0157de5b6d398f`.

### PR #74 — minimal pipeline-depressurization prototype specification

PR #74 fixed the first controlled pipeline-depressurization problem:

```text
pipe length / diameter / cells: 1.0 m / 0.10 m / 32
initial state:                  5 MPa / 5 K subcooling, u=0, q=0
left boundary:                 reflective
right boundary:                prescribed pressure + 5 K subcooling
flux / CFL:                    existing first-order Rusanov / 0.10
friction / heat / gravity:     none / none / none
fixed outlet paths:            5→2, 5→3, and 5→4 MPa
```

The specification requires direct raw `rho/e` transition detection before projection,
first-accepted-crossing stop, explicit endpoint/forbidden/reverse-flow/backend outcomes,
crossing/projection cell agreement, second-projection no-op, and separate boundary and
projection vapor accounting. It forbids tuning schedules, algorithms, or tolerances to
manufacture a crossing.

```text
merge:                       49b34bf955a5dd1f0d106f2e81f55aff3bd24add
validated head:              8640d6f73421ec3d4b7bf64b20e09f7445d32149
workflow run:                30135136669
artifact ID:                 8612546071
artifact SHA256:             5b2e391e32b984eab82c6e5d316add05c54f9e2ecc411580523e1f4323b1b69b
specification tests:         9 passed, 0 skipped
frozen Case A/B tests:      14 passed, 0 skipped
full repository:           651 passed, 0 skipped
```

### PR #75 — prescribed-subcooled outlet boundary Increment 1

PR #75 implemented the boundary-construction layer without executing an FVM time step:

- pressure-plus-positive-subcooling state provider using CoolProp `P,T -> rho,e`;
- strict phase, equilibrium-quality, void-fraction, acoustic, round-trip, and mixed-EOS
  acceptance checks;
- right-side `outlet_only` adapter with copied adjacent interior velocity;
- conservative ghost construction using boundary equilibrium quality, never interior quality;
- explicit reflective fallback diagnostics for reverse flow;
- atomic fail-fast behavior before ghost-cell mutation;
- fixed 65-point preflight for every 5→2/3/4 MPa boundary path.

Real CoolProp 8.0.0 preflight result:

```text
requested / accepted samples:       195 / 195
LIQUID_CANDIDATE samples:           195
q_eq = 0 / alpha = 0 samples:       195 / 195
endpoint / open-two-phase samples:  0 / 0
guard or backend failures:          0
pipeline FVM time step:             not executed
```

Authoritative validation:

```text
merge:                             9982c52bc4c26fac991972f0a8156c857e4bf21f
validated implementation head:    c94458933741866812286ea1e77bd288f7c4e0a2
workflow run:                      30137665050
artifact ID:                       8613415710
artifact SHA256:                   27f43c28566868fd13ec69e207cba3c5ac12e6795627c6045ac9d28b496ef5e0
dependency-free boundary tests:    18 passed, 0 skipped
installed-CoolProp boundary tests:  6 passed, 0 skipped
prototype specification tests:      9 passed, 0 skipped
frozen Case A/B tests:              14 passed, 0 skipped
full repository:                   675 passed, 0 skipped
```

The boundary remains a prescribed numerical boundary. It is not a finite tank, valve,
orifice, release-rate, or external flashing model.

'''
              master = replace_once(
                  master,
                  "## Current technical conclusion\n",
                  pipeline_section + "## Current technical conclusion\n",
                  "master pipeline section insertion",
              )
              master = replace_once(
                  master,
                  "- a repeatable crossing Case A and exact matched-time all-liquid Case B are frozen;\n- the current first-order liquid-to-open-two-phase crossing path is software-verified.",
                  "- a repeatable crossing Case A and exact matched-time all-liquid Case B are frozen;\n- the current first-order liquid-to-open-two-phase crossing path is software-verified;\n- the minimal 1.0 m / 32-cell pipeline-depressurization prototype is specified;\n- the right prescribed-subcooled outlet constructor and 195-sample path preflight are software-verified.",
                  "master technical conclusion additions",
              )
              master = replace_once(
                  master,
                  "pipeline depressurization:                      not implemented",
                  "pipeline depressurization:                      boundary verified; FVM transient not executed",
                  "master unsupported pipeline claim",
              )
              old_next = '''1. retain frozen Case A/B as the first-order crossing regression control;
2. define a narrow pipeline-depressurization prototype before implementing it;
3. start with one straight pipe, all-liquid initial state, one controlled depressurization
   boundary, no friction, no heat transfer, and no internal interface;
4. stop the first prototype at the first accepted crossing and capture the same transition,
   projection, accepted-state, and budget evidence used by the frozen regression pair;
5. keep saturated-endpoint landing fail-fast until endpoint acoustic closure is established;
6. after the minimal prototype is stable, extend to short two-phase-region growth and
   assess mesh/time-step sensitivity;
7. retain PRs #52/#53 as later numerical-improvement assets and do not connect them until
   the first-order pipeline prototype is stable;
8. keep production activation, physical Validation, design use, and acoustic accuracy
   approval false until separately established.'''
              new_next = '''1. retain frozen Case A/B as the first-order crossing regression control;
2. connect the verified PR #75 boundary constructor to the fixed PR #74 1.0 m / 32-cell
   first-order Rusanov prototype;
3. execute the fixed 5→2, 5→3, and 5→4 MPa short-run matrix with CFL 0.10 and no friction,
   heat transfer, gravity, or internal interface;
4. stop each formal run at the first accepted crossing or an explicit fail-fast outcome;
5. retain raw transition, projection, accepted-state, second-projection, boundary transport,
   internal projection source, and total vapor-budget evidence separately;
6. keep saturated-endpoint landing and reverse-flow fallback fail-fast for prototype
   acceptance;
7. after the minimal prototype is stable, extend to short two-phase-region growth and assess
   mesh/time-step sensitivity;
8. retain PRs #52/#53 as later numerical-improvement assets until the first-order pipeline
   prototype is stable;
9. keep production activation, physical Validation, design use, and acoustic accuracy
   approval false until separately established.'''
              master = replace_once(master, old_next, new_next, "master next gates")
              master_path.write_text(master, encoding="utf-8")

          if marker not in log:
              def replace_once_log(text: str, old: str, new: str, label: str) -> str:
                  count = text.count(old)
                  if count != 1:
                      raise RuntimeError(f"{label}: expected exactly one match, found {count}")
                  return text.replace(old, new, 1)

              log_section = '''## 2026-07-25 — Pipeline-depressurization specification and boundary Increment 1

### PR #73 — first-crossing central-record synchronization

Status: `MERGED`. Merge commit:
`3e55b3fae88d813437654c144d0157de5b6d398f`.

Only the master verification index and execution log changed. The frozen Case A/B pair was
recorded as the first-order crossing regression control.

### PR #74 — minimal pipeline-depressurization prototype specification

Status: `SPECIFIED; VALIDATED; MERGED`. Merge commit:
`49b34bf955a5dd1f0d106f2e81f55aff3bd24add`.

The fixed verification-only prototype uses one 1.0 m x 0.10 m horizontal pipe with 32 cells,
a uniform stationary 5 MPa / 5 K-subcooled liquid initial state, reflective left boundary,
and a prescribed right boundary closed by `T_b = T_sat(p_b) - 5 K`. The existing first-order
Rusanov flux and CFL 0.10 are retained; friction, heat transfer, gravity, and internal
interfaces are disabled.

```text
fixed outlet paths:          5→2, 5→3, and 5→4 MPa
formal stop:                 first accepted crossing
preflight samples:           65 per path
endpoint / forbidden:        explicit fail-fast
reverse flow:                explicit fallback diagnostic and prototype rejection
boundary vapor transport:    separate from projection vapor source
schedule/algorithm tuning:   forbidden
```

Authoritative validation:

```text
validated head:            8640d6f73421ec3d4b7bf64b20e09f7445d32149
workflow run:              30135136669
artifact ID:               8612546071
artifact SHA256:           5b2e391e32b984eab82c6e5d316add05c54f9e2ecc411580523e1f4323b1b69b
specification tests:       9 passed, 0 skipped
frozen Case A/B tests:    14 passed, 0 skipped
full repository:         651 passed, 0 skipped
failures / errors:          0 / 0
```

### PR #75 — prescribed-subcooled outlet boundary Increment 1

Status: `IMPLEMENTED; SOFTWARE-VERIFIED; MERGED`. Merge commit:
`9982c52bc4c26fac991972f0a8156c857e4bf21f`.

The increment implemented only boundary construction and preflight. No pipeline FVM time
step was executed.

```text
state closure:               p_b(t), T_sat(p_b)-5 K, CoolProp P,T -> rho,e
required region:             LIQUID_CANDIDATE
right boundary policy:       outlet_only
velocity policy:             copy adjacent interior velocity
ghost quality:               equilibrium quality from boundary rho/e
interior quality copy:       forbidden
reverse flow:                reflective fallback with explicit counter
mutation policy:             validate completely before ghost write
```

The real CoolProp 8.0.0 preflight accepted all 195 fixed samples:

```text
5→2 MPa:                    65 / 65 accepted liquid candidates
5→3 MPa:                    65 / 65 accepted liquid candidates
5→4 MPa:                    65 / 65 accepted liquid candidates
endpoint samples:           0
open-two-phase samples:     0
guard/backend failures:     0
q_eq / alpha:               0 / 0 for all samples
```

Authoritative validation:

```text
validated implementation head: c94458933741866812286ea1e77bd288f7c4e0a2
workflow run:                  30137665050
artifact ID:                   8613415710
artifact SHA256:               27f43c28566868fd13ec69e207cba3c5ac12e6795627c6045ac9d28b496ef5e0
dependency-free tests:         18 passed, 0 skipped
installed-CoolProp tests:       6 passed, 0 skipped
prototype specification:        9 passed, 0 skipped
frozen Case A/B:                14 passed, 0 skipped
full repository:               675 passed, 0 skipped
failures / errors:               0 / 0
```

Post-normalization permanent CoolProp Wave, Controlled Pressure Ramp, Boundary Reflection,
and Internal Valve regressions all passed before merge.

'''
              log = replace_once_log(
                  log,
                  "## Current technical conclusion — 2026-07-25\n",
                  log_section + "## Current technical conclusion — 2026-07-25\n",
                  "execution log pipeline section insertion",
              )
              log = replace_once_log(
                  log,
                  "The HEM verification path on recorded development `main`\n`628800530851b0cb677bc0a6bedcb85a13a303d1` now supports:",
                  "The HEM verification path on recorded development `main`\n`9982c52bc4c26fac991972f0a8156c857e4bf21f` now supports:",
                  "execution log recorded main",
              )
              log = replace_once_log(
                  log,
                  "- a deterministic repeated Case A crossing and exact matched-time all-liquid Case B;\n- a frozen first-order software-regression pair for liquid-to-open-two-phase crossing.",
                  "- a deterministic repeated Case A crossing and exact matched-time all-liquid Case B;\n- a frozen first-order software-regression pair for liquid-to-open-two-phase crossing;\n- a fixed minimal 1.0 m / 32-cell pipeline-depressurization specification;\n- a software-verified prescribed-subcooled outlet constructor and 195-sample boundary preflight.",
                  "execution log technical conclusion additions",
              )
              log = replace_once_log(
                  log,
                  "pipeline depressurization:                      not implemented",
                  "pipeline depressurization:                      boundary verified; FVM transient not executed",
                  "execution log unsupported pipeline claim",
              )
              old_log_next = '''1. retain frozen Case A/B as the first-order crossing regression control;
2. define a narrow LCO2 pipeline-depressurization prototype before implementation;
3. start with one straight pipe, all-liquid initial state, one controlled depressurization
   boundary, no friction, no heat transfer, and no internal interface;
4. stop the first prototype at the first accepted crossing and retain raw, projection,
   accepted-state, repeatability, and budget evidence;
5. keep endpoint landing fail-fast until a saturated-endpoint acoustic closure is
   separately established;
6. only after the minimal prototype is stable, extend to short two-phase-region growth and
   assess mesh and time-step sensitivity;
7. retain PRs #52/#53 as later numerical-improvement assets until the first-order pipeline
   prototype is stable;
8. keep production activation, physical Validation, design use, and acoustic accuracy
   approval false until separately established.'''
              new_log_next = '''1. retain frozen Case A/B as the first-order crossing regression control;
2. connect the verified PR #75 boundary to the fixed PR #74 1.0 m / 32-cell first-order
   Rusanov prototype;
3. run the fixed 5→2, 5→3, and 5→4 MPa matrix with CFL 0.10 and no friction, heat transfer,
   gravity, or internal interface;
4. stop on the first accepted crossing or an explicit endpoint, forbidden-transition,
   reverse-flow, guard, backend, or no-crossing-within-horizon outcome;
5. retain raw transition, projection, accepted-state, second-projection, boundary vapor
   transport, internal projection source, and total budget evidence separately;
6. only after the minimal prototype is stable, extend to short two-phase-region growth and
   assess mesh and time-step sensitivity;
7. retain PRs #52/#53 as later numerical-improvement assets until the first-order pipeline
   prototype is stable;
8. keep production activation, physical Validation, design use, and acoustic accuracy
   approval false until separately established.'''
              log = replace_once_log(log, old_log_next, new_log_next, "execution log next")
              log_path.write_text(log, encoding="utf-8")

          # Final integrity checks are also idempotent on the second workflow run.
          master = master_path.read_text(encoding="utf-8")
          log = log_path.read_text(encoding="utf-8")
          expected = [
              "9982c52bc4c26fac991972f0a8156c857e4bf21f",
              "49b34bf955a5dd1f0d106f2e81f55aff3bd24add",
              "Increment 2 fixed 5→2/3/4 MPa pipeline short-run matrix",
              "boundary verified; FVM transient not executed",
          ]
          for value in expected:
              if value not in master:
                  raise RuntimeError(f"master missing expected value: {value}")
              if value not in log and value != "Increment 2 fixed 5→2/3/4 MPa pipeline short-run matrix":
                  raise RuntimeError(f"execution log missing expected value: {value}")
          if master.count(marker) != 1 or log.count(marker) != 1:
              raise RuntimeError("pipeline synchronization section must appear exactly once")
          if "physical_validation = false" not in master or "physical_validation = false" not in log:
              raise RuntimeError("approval boundary was not retained")
          PY

          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'docs/verification/MASTER_VERIFICATION_INDEX.md\ndocs/verification/stage7_execution_log.md' || {
            echo "Unexpected changed-file scope" >&2
            exit 1
          }

      - name: Commit synchronized records
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/verification/MASTER_VERIFICATION_INDEX.md \
            docs/verification/stage7_execution_log.md
          if git diff --cached --quiet; then
            echo "Central records are already synchronized."
            exit 0
          fi
          git commit -m "Synchronize Stage 7 pipeline boundary records"
          git push origin HEAD:${{ github.ref_name }}
