name: Agent U3 B2 A1 Finite Compression Increment 9I Root Schema Rerun

on:
  push:
    branches: [agent/u3-b2-a1-wave-curve-review]
    paths:
      - ".github/workflows/agent-u3-b2-a1-finite-compression-increment-9i-root-schema-rerun.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: agent-u3-b2-a1-finite-compression-increment-9i-root-schema-rerun
  cancel-in-progress: true

env:
  PYTHONPATH: src:tools/verification
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONPYCACHEPREFIX: /tmp/u3-b2-a1-finite-compression-inc9i-schema-pycache
  SOURCE_SHA: ${{ github.sha }}
  SCOPE_BASE_SHA: 45879e3dea3575c560e5c95073b55149f1d3dbf8
  PARENT_RUN_ID: "31669680994"
  PARENT_ARTIFACT_ID: "9169230736"
  PARENT_ARTIFACT_NAME: u3-b2-a1-finite-compression-increment-9h-rerun-31669680994
  PARENT_ARTIFACT_DIGEST: a627e2b1720429f79fd80699cb117ddc74c7b931d78c482c27aee98933ece42b

jobs:
  rerun-dynamic-seeded-to-full-horizon:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact corrected Increment 9I source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"

      - name: Verify narrow parent-root schema correction scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test -f docs/verification/stage7_u3_b2_a1_finite_compression_increment_9i_dynamic_seeded_final_horizon_model_review.md
          test -f docs/verification/stage7_u3_b2_a1_finite_compression_increment_9i_parent_root_schema_correction.md
          test -f tools/verification/u3_b2_a1_finite_compression_dynamic_seeded_final_horizon.py
          test -f tools/verification/u3_b2_a1_finite_compression_dynamic_seeded_final_horizon_root_schema_fix.py
          python -m py_compile \
            tools/verification/u3_b2_a1_finite_compression_dynamic_seeded_final_horizon.py \
            tools/verification/u3_b2_a1_finite_compression_dynamic_seeded_final_horizon_root_schema_fix.py
          mapfile -t actual < <(
            git diff --name-only "${SCOPE_BASE_SHA}" HEAD | sort
          )
          mapfile -t expected < <(printf '%s\n' \
            '.github/workflows/agent-u3-b2-a1-finite-compression-increment-9i-root-schema-rerun.yml' | sort)
          diff -u \
            <(printf '%s\n' "${expected[@]}") \
            <(printf '%s\n' "${actual[@]}")
          git diff --check "${SCOPE_BASE_SHA}" HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Install fixed dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'numpy==2.5.1' 'CoolProp==8.0.0'

      - name: Download authoritative Increment 9H parent artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.PARENT_ARTIFACT_NAME }}
          path: artifacts/parent-increment-9h
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.PARENT_RUN_ID }}

      - name: Verify parent GitHub artifact metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          metadata="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PARENT_ARTIFACT_ID}")"
          test "$(jq -r '.id' <<<"${metadata}")" = "${PARENT_ARTIFACT_ID}"
          test "$(jq -r '.name' <<<"${metadata}")" = "${PARENT_ARTIFACT_NAME}"
          test "$(jq -r '.workflow_run.id' <<<"${metadata}")" = "${PARENT_RUN_ID}"
          test "$(jq -r '.workflow_run.head_sha' <<<"${metadata}")" = "8e2825d0a6708dd287276181eee55f9459b04ce1"
          test "$(jq -r '.digest' <<<"${metadata}")" = "sha256:${PARENT_ARTIFACT_DIGEST}"

      - name: Continue corrected actual FvmSolver to nominal full horizon
        shell: bash
        run: |
          set -euo pipefail
          output=artifacts/u3-b2-a1-finite-compression-increment-9i-rerun
          rm -rf "${output}"
          python tools/verification/u3_b2_a1_finite_compression_dynamic_seeded_final_horizon_root_schema_fix.py \
            --contract docs/verification/stage7_u3_b2_fvm_discharge_coupling_contract_v1.json \
            --b1-contract docs/verification/stage7_u3_b1_critical_state_contract_v1.json \
            --model-review-spec docs/verification/stage7_u3_b2_a1_finite_compression_increment_9i_dynamic_seeded_final_horizon_model_review.md \
            --parent-artifact-dir artifacts/parent-increment-9h \
            --parent-artifact-digest "${PARENT_ARTIFACT_DIGEST}" \
            --output-dir "${output}" \
            --source-git-sha "${SOURCE_SHA}"

      - name: Inspect corrected Increment 9I evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import hashlib
          import json
          import os
          from pathlib import Path
          import numpy as np

          target = Path(
              "artifacts/u3-b2-a1-finite-compression-increment-9i-rerun"
          )
          expected = {
              "finite_compression_steps.csv",
              "finite_compression_roots.csv",
              "hugoniot_fixed_scans.csv",
              "guard_front_refinement.csv",
              "root_topology.csv",
              "hugoniot_density_search.csv",
              "branch_sequence.csv",
              "finite_compression_full_horizon_states.npz",
              "authority_verification.json",
              "dynamic_seeded_authority.json",
              "parent_root_schema_correction.json",
              "stop_evidence.json",
              "summary.json",
              "report.md",
              "artifact_sha256.txt",
          }
          assert {path.name for path in target.iterdir()} == expected
          summary = json.loads(
              (target / "summary.json").read_text(encoding="utf-8")
          )
          assert summary["source_git_sha"] == os.environ["SOURCE_SHA"]
          assert summary["outcome"] == (
              "FINITE_COMPRESSION_INCREMENT_9I_DYNAMIC_SEEDED_FULL_HORIZON_WORKING_SLICE_PASS"
          )
          assert summary["increment_9i_full_horizon_gate_passed"] is True
          assert summary[
              "working_vertical_slice_two_l_over_c0_reached"
          ] is True
          assert summary["parent_artifact_verified"] is True
          assert summary["parent_outcome"] == (
              "FINITE_COMPRESSION_INCREMENT_9H_SEEDED_ISLAND_ONE_STEP_PASS"
          )
          assert summary["parent_root_schema_correction_applied"] is True
          assert summary["parent_root_schema_source_key"] == "pressure_pa"
          assert summary["parent_root_schema_target_key"] == "root_pressure_pa"
          assert summary["parent_root_schema_value_changed"] is False
          assert summary["starting_solver_step"] == 636
          assert summary["additional_accepted_steps"] > 0
          assert 636 < summary["final_solver_step"] <= 650
          assert summary["target_horizon_reached"] is True
          assert summary["final_step_clipped_to_target"] is True
          assert summary["final_solver_time_s"] >= summary[
              "target_two_l_over_c0_time_s"
          ]
          assert abs(summary["horizon_time_error_s"]) <= summary[
              "horizon_time_roundoff_tolerance_s"
          ]
          assert summary["horizon_fraction_reached"] >= 1.0
          assert summary["branch_sequence"] == [
              "FINITE_COMPRESSION_HUGONIOT"
          ] * summary["additional_accepted_steps"]
          assert summary["branch_transition_count"] == 0
          assert summary["clear_branch_chatter_detected"] is False
          assert summary["dynamic_seeded_interval_applied"] is True
          assert summary["dynamic_seeded_interval_lower_factor"] == 0.70
          assert summary["dynamic_seeded_interval_upper_factor"] == 1.60
          assert summary["dynamic_seeded_interval_node_count_per_step"] == 257
          assert summary["dynamic_seeded_interval_step_count"] == summary[
              "additional_accepted_steps"
          ]
          assert summary["minimum_root_requested_chi"] > 1.0e-6
          assert summary["maximum_root_requested_chi"] <= 1.0e-4
          assert summary["maximum_absolute_root_mass_residual_kg_s"] <= 1.0e-8
          assert summary["minimum_root_local_slope_kg_s_Pa"] < 0.0
          assert summary["maximum_root_mach"] < 1.0
          assert summary["minimum_root_velocity_m_s"] >= 0.0
          assert summary["minimum_root_entropy_delta_J_kg_K"] >= -1.0e-7
          assert summary[
              "minimum_root_stagnation_pressure_margin_above_back_pa"
          ] > 0.0
          assert summary["minimum_accepted_dt_s"] > 0.0
          assert summary["final_outlet_velocity_m_s"] >= 0.0
          assert 0.0 <= summary["final_outlet_mach"] < 1.0
          assert summary["final_outlet_phase"] == "liquid"
          assert summary["final_minimum_density_kg_m3"] > 0.0
          assert summary["final_minimum_internal_energy_J_kg"] > 0.0
          assert summary["final_rho_xv_exact_zero"] is True
          assert summary["stop_classification"] is None
          assert summary["stop_reason"] is None
          assert summary["finite_compression_branch_approved"] is False
          assert summary["full_two_l_over_c0_passed"] is False
          assert summary["formal_state_promoted"] is False
          assert summary["u3_b2_finite_pipe_execution_complete"] is False
          assert summary["single_phase_finite_pipe_coupling_verified"] is False
          assert summary["u3_b2_verification_benchmark_accepted"] is False
          assert summary["physical_validation"] is False
          assert summary["design_use_acceptance"] is False
          assert summary["production_hem_activation_approved"] is False

          with (target / "finite_compression_steps.csv").open(
              newline="", encoding="utf-8"
          ) as handle:
              steps = list(csv.DictReader(handle))
          with (target / "finite_compression_roots.csv").open(
              newline="", encoding="utf-8"
          ) as handle:
              roots = list(csv.DictReader(handle))
          n = summary["additional_accepted_steps"]
          assert len(steps) == n
          assert len(roots) == n
          assert int(steps[0]["solver_step_count"]) == 637
          assert int(steps[-1]["solver_step_count"]) == summary[
              "final_solver_step"
          ]
          assert steps[-1]["step_clipped_to_target"] == "True"
          assert all(
              row["increment_9d_per_step_gate_passed"] == "True"
              for row in steps
          )
          assert all(
              row["root_gate_passed"] == "True"
              and row["root_b1_formal_outcome"] == (
                  "SUCCESS_UNCHOKED_FACE_MAPPING"
              )
              for row in roots
          )

          with (target / "hugoniot_fixed_scans.csv").open(
              newline="", encoding="utf-8"
          ) as handle:
              scans = list(csv.DictReader(handle))
          seeded = [
              row for row in scans
              if row.get("row_role") == "DYNAMIC_SEEDED_INTERVAL"
          ]
          assert len(seeded) == n * 257
          assert all(
              row["dynamic_seeded_classification"] in {
                  "ADMISSIBLE_SUCCESS",
                  "EXCLUDED_B1_UNAVAILABLE",
                  "EXCLUDED_LOCAL_INADMISSIBLE",
              }
              for row in seeded
          )

          with np.load(
              target / "finite_compression_full_horizon_states.npz"
          ) as states:
              assert states["U_before"].shape == (32, 4)
              assert states["U_after"].shape == (32, 4)
              assert int(states["solver_step_before"][0]) == 636
              assert int(states["solver_step_after"][0]) == summary[
                  "final_solver_step"
              ]
              assert float(states["solver_time_after_s"][0]) == summary[
                  "final_solver_time_s"
              ]

          correction = json.loads(
              (target / "parent_root_schema_correction.json").read_text(
                  encoding="utf-8"
              )
          )
          assert correction["numerical_value_changed"] is False
          assert correction["accepted_state_changed"] is False
          assert correction["root_changed"] is False
          assert correction["b1_behavior_changed"] is False
          assert correction["local_admissibility_rule_changed"] is False
          assert correction["dynamic_seeded_interval_rule_changed"] is False
          assert correction["root_tolerance_or_chi_scope_changed"] is False
          assert correction["flux_or_solver_update_changed"] is False

          manifest = {}
          for line in (target / "artifact_sha256.txt").read_text(
              encoding="utf-8"
          ).splitlines():
              digest, name = line.split("  ", 1)
              manifest[name] = digest
          assert set(manifest) == expected - {"artifact_sha256.txt"}
          for name, digest in manifest.items():
              assert hashlib.sha256((target / name).read_bytes()).hexdigest() == digest
          PY

      - name: Upload corrected Increment 9I evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: u3-b2-a1-finite-compression-increment-9i-root-schema-${{ github.run_id }}
          path: artifacts/u3-b2-a1-finite-compression-increment-9i-rerun
          if-no-files-found: warn
