name: Stage 7 Gate 9 D1 Instrumentation Scaffold

on:
  pull_request:
    paths:
      - "src/liquid_gas_transient/hem_pipeline_crossing_depth_diagnosis.py"
      - "tests/test_stage7_lco2_hem_gate9_instrumentation_scaffold.py"
      - "docs/verification/stage7_gate9_d1_instrumentation_scaffold.md"
      - ".github/workflows/stage7-gate9-instrumentation-scaffold.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage7-gate9-d1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: src
  PYTHONDONTWRITEBYTECODE: "1"
  MPLBACKEND: Agg

jobs:
  gate9-d1-read-only-instrumentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install fixed dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy matplotlib pytest 'CoolProp==8.0.0'

      - name: Assert pristine checkout
        run: |
          status="$(git status --porcelain=v1 --untracked-files=all)"
          printf 'pre_execution_git_status=%s\n' "$status"
          test -z "$status"

      - name: Execute D1 diagnostic-off/on identity pair
        run: |
          temporary_output="${RUNNER_TEMP}/stage7-gate9-d1"
          repository_output="artifacts/stage7-gate9-d1"
          rm -rf "$temporary_output" "$repository_output"
          python -m liquid_gas_transient.hem_pipeline_crossing_depth_diagnosis \
            --output-dir "$temporary_output"
          tracked_status="$(git status --porcelain=v1 --untracked-files=no)"
          printf 'post_execution_tracked_git_status=%s\n' "$tracked_status"
          test -z "$tracked_status"
          mkdir -p "$repository_output"
          cp -a "$temporary_output/." "$repository_output/"

      - name: Inspect D1 evidence contract
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          target = Path('artifacts/stage7-gate9-d1')
          summary = json.loads((target / 'summary.json').read_text(encoding='utf-8'))
          assert summary['schema_version'] == 'stage7_gate9_d1_instrumentation_scaffold_v1'
          assert summary['scope'] == 'verification_only_read_only_instrumentation_scaffold'
          assert summary['case_id'] == 'pipeline_crossing_candidate_p5m5_to_p2m5'
          assert summary['cfl'] == 0.10
          assert summary['focused_cells'] == [28, 29, 30, 31]
          assert summary['focused_interfaces'] == [
              '27|28', '28|29', '29|30', '30|31', 'RIGHT_BOUNDARY'
          ]
          assert summary['captured_stages'] == [
              'PRE_STEP_ACCEPTED',
              'RAW_POST_FVM',
              'FINAL_ACCEPTED_IF_AVAILABLE',
          ]
          assert summary['pending_stages'] == [
              'POST_FIRST_PROJECTION_IF_AVAILABLE',
              'POST_SECOND_PROJECTION_IF_AVAILABLE',
          ]
          assert summary['cell_stage_record_count'] == 125 * 4 * 3
          assert summary['interface_flux_record_count'] == 0
          assert summary['acoustic_attempt_record_count'] == 0
          assert summary['diagnostic_status'] == 'D1_CAPTURE_COMPLETE'
          assert summary['diagnostic_failures'] == []
          assert summary['solver_state_preserved'] is True
          assert summary['retained_history_sha256_before'] == summary['retained_history_sha256_after']
          assert summary['interface_capture_status'] == 'PENDING_D2_RUSANOV_DECOMPOSITION'
          assert summary['acoustic_capture_status'] == 'PENDING_D3_ACOUSTIC_ATTEMPT_HOOKS'
          assert summary['candidate_summary']['candidate_step'] == 125
          assert summary['candidate_summary']['candidate_time_s'] == 7.999325695335248e-4
          assert summary['candidate_summary']['candidate_cells'] == [29]
          assert summary['candidate_summary']['maximum_candidate_q_equilibrium'] == 3.773646403587342e-6
          assert summary['candidate_summary']['formal_outcome'] == 'ACCEPTED_FIRST_CROSSING'
          assert summary['production_solver_changed'] is False
          assert summary['rusanov_flux_changed'] is False
          assert summary['sound_speed_formula_changed'] is False
          assert summary['phase_classifier_changed'] is False
          assert summary['quality_projection_changed'] is False
          assert summary['crossing_threshold_changed'] is False
          assert summary['boundary_changed'] is False
          assert summary['Gate_9_execution_complete'] is False
          assert summary['physical_validation'] is False
          assert summary['design_use_acceptance'] is False
          assert summary['production_hem_activation_approved'] is False

          with (target / 'focused_interface_flux_decomposition.csv').open(
              newline='', encoding='utf-8'
          ) as handle:
              assert 'normalized_reconstruction_residual' in next(csv.reader(handle))
          with (target / 'acoustic_attempt_history.csv').open(
              newline='', encoding='utf-8'
          ) as handle:
              assert 'halving_index' in next(csv.reader(handle))
          PY

      - name: Compile and diff checks
        run: |
          python -m compileall -q src tests
          git diff --check

      - name: Run dedicated D1 tests
        run: |
          python -m pytest -q \
            tests/test_stage7_lco2_hem_gate9_instrumentation_scaffold.py \
            --strict-markers \
            --junitxml=gate9-d1-dedicated.xml

      - name: Run related Stage 7 regressions
        run: |
          python -m pytest -q \
            tests/test_stage7_gate9_contract.py \
            tests/test_stage7_lco2_hem_pipeline_depressurization_increment2.py \
            tests/test_stage7_lco2_hem_gate9_instrumentation_scaffold.py \
            --strict-markers \
            --junitxml=related-stage7.xml

      - name: Run full repository tests
        run: |
          python -m pytest -q --strict-markers --junitxml=full-repository.xml

      - name: Assert authoritative JUnit is clean
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          for name in (
              'gate9-d1-dedicated.xml',
              'related-stage7.xml',
              'full-repository.xml',
          ):
              root = ET.parse(Path(name)).getroot()
              suites = [root] if root.tag == 'testsuite' else list(root.findall('testsuite'))
              totals = {
                  key: sum(int(s.attrib.get(key, 0)) for s in suites)
                  for key in ('tests', 'skipped', 'failures', 'errors')
              }
              print(name, totals)
              assert totals['skipped'] == 0
              assert totals['failures'] == 0
              assert totals['errors'] == 0
          PY

      - name: Upload D1 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stage7-gate9-d1-${{ github.run_id }}
          path: |
            artifacts/stage7-gate9-d1
            gate9-d1-dedicated.xml
            related-stage7.xml
            full-repository.xml
          if-no-files-found: warn
