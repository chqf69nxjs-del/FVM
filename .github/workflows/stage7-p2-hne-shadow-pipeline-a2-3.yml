name: Stage 7 P2 HNE Shadow Pipeline A2.3

on:
  push:
    branches:
      - agent/stage7-p2-hne-shadow-pipeline-a2-3
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage7-p2-hne-shadow-pipeline-a2-3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p2-hne-shadow-pipeline-a2-3:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
      ANALYSIS_SOURCE_GIT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.5.2' 'pytest==9.1.1'

      - name: Assert frozen A2 authority and A2.3 change envelope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ANALYSIS_SOURCE_GIT_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python - <<'PY'
          import subprocess

          source_a2_sha = "b45156f349ddc9754d481c285a8e1efde5d74d22"
          subprocess.check_call(["git", "cat-file", "-e", source_a2_sha + "^{commit}"])
          expected = {
              ".github/workflows/stage7-p2-hne-shadow-pipeline-a2-3.yml",
              "docs/verification/stage7_p2_hne_shadow_pipeline_a2_3.md",
              "src/liquid_gas_transient/hne_shadow_pipeline.py",
              "tests/test_stage7_p2_hne_shadow_pipeline_a2_3.py",
          }
          actual = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", source_a2_sha, "HEAD"],
                  text=True,
              ).splitlines()
          )
          assert actual == expected, (
              "P2-A2.3 changed files outside the shadow-integration envelope: "
              f"expected={sorted(expected)} actual={sorted(actual)}"
          )
          print("p2_a2_authority_sha=" + source_a2_sha)
          print("p2_a2_3_change_envelope=confirmed")
          PY

      - name: Compile and diff checks
        run: |
          set -euo pipefail
          python -m compileall -q src tests
          git diff --check
          find src tests -type d -name __pycache__ -prune -exec rm -rf {} +
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Generate finite-pipeline shadow evidence from a clean checkout
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          rm -rf artifacts/stage7/p2-hne-shadow-pipeline-a2-3
          python -m liquid_gas_transient.hne_shadow_pipeline \
            --output-dir artifacts/stage7/p2-hne-shadow-pipeline-a2-3

      - name: Gate A2.3 evidence and closed coupling authority
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          target = Path("artifacts/stage7/p2-hne-shadow-pipeline-a2-3")
          expected = {
              "summary.json",
              "case_summary.csv",
              "step_history.csv",
              "cell_history.csv",
              "operator_report.md",
              "manifest.json",
          }
          actual = {path.name for path in target.iterdir() if path.is_file()}
          assert actual == expected, (sorted(expected), sorted(actual))

          summary = json.loads((target / "summary.json").read_text(encoding="utf-8"))
          manifest = json.loads((target / "manifest.json").read_text(encoding="utf-8"))
          assert summary["a2_3_shadow_ready"] is True
          assert summary["execution_status"] == (
              "A2_3_FINITE_PIPELINE_SHADOW_READY_WITH_COUPLING_GATE_CLOSED"
          )
          assert all(summary["gate_results"].values())
          assert summary["failed_gates"] == []
          assert summary["provenance"]["analysis_source_git_sha"] == (
              summary["provenance"]["checkout_git_sha"]
          )
          assert summary["provenance"]["git_status_porcelain"] == ""
          assert summary["physical_hne_claim_allowed"] is False
          assert summary["hydrodynamic_coupling_allowed"] is False
          assert summary["coupling_contract"]["p_hne_to_flux"] is False
          assert summary["coupling_contract"]["c_hne_to_flux_or_cfl"] is False
          assert summary["formal_status"]["finite_pipeline_shadow_integration"] is True
          for key in (
              "hydrodynamic_coupling_allowed",
              "physical_hne_vertical_slice",
              "working_vertical_slice",
              "verified",
              "accepted",
              "physically_validated",
              "design_use_accepted",
              "production_approved",
          ):
              assert summary["formal_status"][key] is False

          by_id = {row["case_id"]: row for row in summary["case_summary"]}
          assert by_id["TAU_NEAR_ZERO"]["maximum_absolute_q_lag_final"] <= 1.0e-15
          assert by_id["TAU_FINITE"]["maximum_absolute_q_lag_final"] > 1.0e-8
          assert by_id["TAU_FROZEN"]["frozen_source_matches_no_phase_change"] is True
          for row in by_id.values():
              assert row["baseline_shadow_full_trajectory_bitwise_equal"] is True
              assert row["hydrodynamic_state_unchanged_from_initial"] is True
              assert row["mass_momentum_energy_conserved"] is True

          assert manifest["declared_file_count"] == 6
          assert manifest["declared_file_names"] == [
              "summary.json",
              "case_summary.csv",
              "step_history.csv",
              "cell_history.csv",
              "operator_report.md",
              "manifest.json",
          ]
          assert manifest["analysis_sha256"] == summary["analysis_sha256"]
          assert manifest["a2_3_shadow_ready"] is True
          assert manifest["hydrodynamic_coupling_allowed"] is False
          assert set(manifest["payload_files"]) == expected - {"manifest.json"}
          print("a2_3_analysis_sha256=" + summary["analysis_sha256"])
          print("a2_3_evidence_provenance=clean")
          print("a2_3_coupling_gate=closed")
          PY

      - name: Run focused A2.3 tests
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_stage7_p2_hne_shadow_pipeline_a2_3.py \
            --strict-markers \
            --junitxml=p2-a2-3-focused.xml

      - name: Assert focused JUnit is clean
        run: |
          set -euo pipefail
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("p2-a2-3-focused.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
          totals = {
              key: sum(int(s.attrib.get(key, 0)) for s in suites)
              for key in ("tests", "skipped", "failures", "errors")
          }
          print(totals)
          assert totals == {
              "tests": 5,
              "skipped": 0,
              "failures": 0,
              "errors": 0,
          }
          PY

      - name: Assert pristine tracked checkout after execution
        run: |
          set -euo pipefail
          status="$(git status --porcelain=v1 --untracked-files=no)"
          printf 'post_test_tracked_git_status=%s\n' "$status"
          test -z "$status"

      - name: Upload P2-A2.3 evidence
        uses: actions/upload-artifact@v7
        with:
          name: stage7-p2-hne-shadow-pipeline-a2-3-${{ github.run_id }}
          path: |
            artifacts/stage7/p2-hne-shadow-pipeline-a2-3
            p2-a2-3-focused.xml
          if-no-files-found: error
          compression-level: 6
