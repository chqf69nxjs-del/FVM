name: Stage 7 PR 77 Review Validation

on:
  pull_request:
  push:
    branches:
      - agent/stage7-pipeline-depressurization-first-crossing
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage7-pr77-review-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-pr77-review-fixes:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: src
      MPLBACKEND: Agg
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e '.[plotting]'
          python -m pip install pytest 'CoolProp==8.0.0'

      - name: Smoke check
        run: |
          python - <<'PY'
          import CoolProp
          import CoolProp.CoolProp as CP
          import numpy as np
          rho = CP.PropsSI('Dmass', 'P', 5.0e6, 'T', 280.0, 'CO2')
          print('CoolProp:', CoolProp.__version__)
          print('rho:', rho)
          assert CoolProp.__version__ == '8.0.0'
          assert np.isfinite(rho) and rho > 0.0
          PY

      - name: Compile and diff checks
        run: |
          python -m compileall -q src tests
          git diff --check

      - name: Run dependency-free PR 77 tests
        run: |
          mkdir -p artifacts/junit
          python -m pytest -q \
            tests/test_stage7_lco2_hem_pipeline_depressurization_increment2.py \
            -m 'not coolprop_installed' \
            --strict-markers \
            --junitxml=artifacts/junit/pr77-pure.xml

      - name: Run installed-CoolProp PR 77 tests including repeatability
        run: |
          python -m pytest -q \
            tests/test_stage7_lco2_hem_pipeline_depressurization_increment2.py \
            -m coolprop_installed \
            --strict-markers \
            --junitxml=artifacts/junit/pr77-coolprop.xml

      - name: Generate authoritative artifact bundle
        run: |
          mkdir -p artifacts/pr77
          python -m liquid_gas_transient.hem_pipeline_depressurization_first_crossing \
            --output-dir artifacts/pr77 \
            | tee artifacts/pr77/runner_stdout.txt

      - name: Validate artifact config and observation contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          contract = json.loads(Path(
              'docs/verification/stage7_lco2_hem_pipeline_depressurization_increment2_observation_contract_v1.json'
          ).read_text(encoding='utf-8'))
          payload = json.loads(Path(
              'artifacts/pr77/stage7_lco2_hem_pipeline_depressurization_increment2.json'
          ).read_text(encoding='utf-8'))

          assert payload['gate_p2_passed'] is False
          assert payload['gate_p2_rule'] == contract['gate_decision']['gate_rule']
          assert payload['four_mpa_control_outcome'] == 'GUARD_FAILURE'
          assert payload['four_mpa_control_remained_all_liquid'] is False
          fixed = contract['fixed_problem']
          for key in (
              'pressure_drop_evidence_relative',
              'crossing_evidence_min_quality',
              'accepted_state_quality_tolerance',
              'mass_budget_relative_tolerance',
              'mass_budget_absolute_tolerance_kg',
              'momentum_budget_relative_tolerance',
              'momentum_budget_absolute_tolerance_kg_m_s',
              'energy_budget_relative_tolerance',
              'energy_budget_absolute_tolerance_J',
              'vapor_budget_absolute_tolerance_kg',
          ):
              assert payload['config'][key] == fixed[key]
          assert payload['config']['phase_config'] == fixed['phase_config']
          assert payload['config']['projection_config'] == fixed['projection_config']
          print(json.dumps(payload['outcome_counts'], indent=2, sort_keys=True))
          PY

      - name: Run related pre-existing Stage 7 tests
        run: |
          python -m pytest -q \
            tests/test_stage7_lco2_hem_pipeline_depressurization_spec.py \
            tests/test_stage7_lco2_hem_pipeline_depressurization_boundary_increment1.py \
            tests/test_stage7_lco2_hem_liquid_to_two_phase_minimal_fvm_dry_run.py \
            tests/test_stage7_lco2_hem_liquid_to_two_phase_projected_fvm_dry_run.py \
            tests/test_stage7_lco2_hem_liquid_to_two_phase_first_crossing_case_ab.py \
            --strict-markers \
            --junitxml=artifacts/junit/pr77-related.xml

      - name: Run full repository tests
        run: |
          python -m pytest -q \
            --strict-markers \
            --junitxml=artifacts/junit/full-repository.xml

      - name: Assert no skipped or failed tests
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for path in sorted(Path('artifacts/junit').glob('*.xml')):
              root = ET.parse(path).getroot()
              cases = root.findall('.//testcase')
              skipped = root.findall('.//skipped')
              failures = root.findall('.//failure')
              errors = root.findall('.//error')
              print(path.name, len(cases), len(skipped), len(failures), len(errors))
              assert cases
              assert not skipped
              assert not failures
              assert not errors
          PY

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stage7-pr77-review-validation-${{ github.run_id }}
          path: artifacts
          if-no-files-found: error
          retention-days: 14
