name: Stage 7 Gate 9 D4 Event Alignment

on:
  pull_request:
    paths:
      - "src/liquid_gas_transient/hem_gate9_event_alignment.py"
      - "tests/test_stage7_lco2_hem_gate9_event_alignment.py"
      - "docs/verification/stage7_gate9_d4_event_alignment.md"
      - ".github/workflows/stage7-gate9-event-alignment.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage7-gate9-d4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: src
  PYTHONDONTWRITEBYTECODE: "1"
  MPLBACKEND: Agg
  ANALYSIS_SOURCE_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  gate9-d4-event-alignment:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install fixed dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy matplotlib pytest 'CoolProp==8.0.0'

      - name: Assert pristine checkout
        run: |
          echo "checkout_sha=$(git rev-parse HEAD)"
          status="$(git status --porcelain=v1 --untracked-files=all)"
          printf 'pre_execution_git_status=%s\n' "$status"
          test -z "$status"

      - name: Execute D4 diagnostic OFF/ON identity pair
        run: |
          temporary_output="${RUNNER_TEMP}/stage7-gate9-d4"
          repository_output="artifacts/stage7-gate9-d4"
          rm -rf "$temporary_output" "$repository_output"
          python -m liquid_gas_transient.hem_gate9_event_alignment \
            --output-dir "$temporary_output"
          tracked_status="$(git status --porcelain=v1 --untracked-files=no)"
          printf 'post_execution_tracked_git_status=%s\n' "$tracked_status"
          test -z "$tracked_status"
          mkdir -p "$repository_output"
          cp -a "$temporary_output/." "$repository_output/"

      - name: Inspect D4 evidence contract
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          target = Path('artifacts/stage7-gate9-d4')
          summary = json.loads((target / 'summary.json').read_text(encoding='utf-8'))
          assert summary['schema_version'] == 'stage7_gate9_d4_event_alignment_increment1_v1'
          assert summary['scope'] == 'verification_only_event_aligned_d1_d2_d3_integration'
          assert summary['case_id'] == 'pipeline_crossing_candidate_p5m5_to_p2m5'
          assert summary['cfl'] == 0.10
          assert summary['property_backend_name'] == 'coolprop_co2'
          assert summary['property_backend_design_status'] == (
              'VERIFICATION_ONLY_NOT_APPROVED_FOR_DESIGN_USE'
          )
          assert summary['candidate_step'] == 125
          assert summary['candidate_time_s'] == 7.999325695335248e-4
          assert summary['window_steps'] == list(range(117, 126))
          assert summary['available_pre_step_count'] == 8
          assert summary['available_post_step_count'] == 0
          assert summary['post_window_status'] == 'NOT_AVAILABLE_DUE_TO_FORMAL_STOP'
          assert summary['focused_cells'] == [28, 29, 30, 31]
          assert summary['captured_exact_stages'] == [
              'PRE_STEP_ACCEPTED',
              'RAW_POST_FVM',
              'POST_FIRST_PROJECTION',
              'POST_SECOND_PROJECTION',
              'FINAL_ACCEPTED',
          ]
          assert summary['exact_cell_stage_record_count'] == 180
          assert summary['d1_cell_stage_record_count'] == 108
          assert summary['interface_flux_record_count'] == 45
          assert summary['aligned_acoustic_record_count'] > 0
          assert summary['all_acoustic_records_have_step_cell_stage'] is True
          assert summary['rusanov_reconstruction_guard_passed'] is True
          assert summary['diagnostic_off_on_identity'] is True
          assert summary['forced_post_guard_continuation'] is False
          assert summary['Gate_9_execution_complete'] is False
          assert summary['physical_validation'] is False
          assert summary['design_use_acceptance'] is False

          with (target / 'event_aligned_exact_cell_stage_history.csv').open(
              newline='', encoding='utf-8'
          ) as handle:
              exact = list(csv.DictReader(handle))
          with (target / 'event_aligned_interface_flux_history.csv').open(
              newline='', encoding='utf-8'
          ) as handle:
              interfaces = list(csv.DictReader(handle))
          with (target / 'event_aligned_acoustic_history.csv').open(
              newline='', encoding='utf-8'
          ) as handle:
              acoustic = list(csv.DictReader(handle))
          assert len(exact) == 180
          assert len(interfaces) == 45
          assert acoustic
          assert all(row['absolute_step'] and row['cell_index'] and row['stage'] for row in acoustic)
          PY

      - name: Compile and diff checks
        run: |
          python -m compileall -q src tests
          git diff --check

      - name: Run dedicated D4 tests
        run: |
          python -m pytest -q \
            tests/test_stage7_lco2_hem_gate9_event_alignment.py \
            --strict-markers \
            --junitxml=gate9-d4-dedicated.xml

      - name: Run related Stage 7 regressions
        run: |
          python -m pytest -q \
            tests/test_stage7_gate9_contract.py \
            tests/test_stage7_lco2_hem_pipeline_depressurization_increment2.py \
            tests/test_stage7_lco2_hem_gate9_instrumentation_scaffold.py \
            tests/test_stage7_lco2_hem_gate9_rusanov_decomposition.py \
            tests/test_stage7_lco2_hem_gate9_acoustic_attempt_diagnostics.py \
            tests/test_stage7_lco2_hem_gate9_event_alignment.py \
            --strict-markers \
            --junitxml=related-stage7.xml

      - name: Run full repository tests
        run: |
          python -m pytest -q --strict-markers --junitxml=full-repository.xml

      - name: Assert authoritative JUnit is clean
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          for name in (
              'gate9-d4-dedicated.xml',
              'related-stage7.xml',
              'full-repository.xml',
          ):
              root = ET.parse(Path(name)).getroot()
              suites = [root] if root.tag == 'testsuite' else list(root.findall('testsuite'))
              totals = {
                  key: sum(int(s.attrib.get(key, 0)) for s in suites)
                  for key in ('tests', 'skipped', 'failures', 'errors')
              }
              print(name, totals)
              assert totals['skipped'] == 0
              assert totals['failures'] == 0
              assert totals['errors'] == 0
          PY

      - name: Upload D4 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stage7-gate9-d4-${{ github.run_id }}
          path: |
            artifacts/stage7-gate9-d4
            gate9-d4-dedicated.xml
            related-stage7.xml
            full-repository.xml
          if-no-files-found: warn
