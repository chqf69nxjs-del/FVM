name: Stage 7 Increment 2 Line Patch PR

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage7-increment2-line-patch-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-line-patch:
    name: apply-line-patch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact line-based replacements
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def block(lines):
              return "\n".join(lines) + "\n"

          def replace_exact(path, old, new):
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old in text:
                  target.write_text(text.replace(old, new, 1), encoding="utf-8")
                  return
              if new in text:
                  return
              raise RuntimeError(f"anchor missing: {path}\n{old}")

          source = "src/liquid_gas_transient/hem_pipeline_depressurization_first_crossing.py"
          old = block([
              '            "all_fixed_cases_completed": bool(',
              '                self.cases',
              '                and all(case.completed_without_guard_failure for case in self.cases)',
              '            ),',
              '            "two_mpa_candidate_outcome": (',
          ])
          new = block([
              '            "all_fixed_cases_completed": bool(',
              '                self.cases',
              '                and all(case.completed_without_guard_failure for case in self.cases)',
              '            ),',
              '            "fixed_matrix_explicit_outcomes_retained": bool(',
              '                self.cases and all(case.step_count > 0 for case in self.cases)',
              '            ),',
              '            "gate_p2_passed": bool(',
              '                self.cases',
              '                and all(case.completed_without_guard_failure for case in self.cases)',
              '            ),',
              '            "subthreshold_crossing_case_ids": [',
              '                case.case.case_id',
              '                for case in self.cases',
              '                if case.outcome == "GUARD_FAILURE"',
              '                and case.crossing_step is not None',
              '                and 0.0 < case.maximum_crossing_quality',
              '                < self.config.crossing_evidence_min_quality',
              '            ],',
              '            "two_mpa_candidate_outcome": (',
          ])
          replace_exact(source, old, new)

          threshold = block([
              '                if max_raw_q < cfg.crossing_evidence_min_quality:',
              '                    raise HEMPipelineDepressurizationError(',
              '                        "crossing quality evidence is below the fixed minimum"',
              '                    )',
          ])
          assignments = block([
              '                crossing_step = step_index',
              '                crossing_time = float(solver.t)',
              '                crossing_cells = current_crossing',
              '                crossing_distances = tuple(',
              '                    float(cfg.length_m - grid.cell_centers[index])',
              '                    for index in crossing_cells',
              '                )',
              '                maximum_crossing_quality = max_raw_q',
          ])
          replace_exact(source, threshold + assignments, assignments + threshold)

          test_path = "tests/test_stage7_lco2_hem_pipeline_depressurization_increment2.py"
          replace_exact(
              test_path,
              block([
                  '    assert summary["all_fixed_cases_completed"] is True',
                  '    assert summary["algorithms_or_tolerances_tuned"] is False',
              ]),
              block([
                  '    assert summary["all_fixed_cases_completed"] is False',
                  '    assert summary["fixed_matrix_explicit_outcomes_retained"] is True',
                  '    assert summary["gate_p2_passed"] is False',
                  '    assert summary["outcome_counts"]["ACCEPTED_FIRST_CROSSING"] == 2',
                  '    assert summary["outcome_counts"]["GUARD_FAILURE"] == 1',
                  '    assert summary["subthreshold_crossing_case_ids"] == [',
                  '        "pipeline_liquid_control_p5m5_to_p4m5"',
                  '    ]',
                  '    assert summary["algorithms_or_tolerances_tuned"] is False',
              ]),
          )
          replace_exact(
              test_path,
              block([
                  '    for case in result.cases:',
                  '        assert case.outcome in {',
                  '            "ACCEPTED_FIRST_CROSSING",',
                  '            "NO_CROSSING_WITHIN_HORIZON",',
                  '        }',
                  '        assert len(case.preflight.records) == 65',
              ]),
              block([
                  '    by_id = {case.case.case_id: case for case in result.cases}',
                  '    assert by_id[',
                  '        "pipeline_crossing_candidate_p5m5_to_p2m5"',
                  '    ].outcome == "ACCEPTED_FIRST_CROSSING"',
                  '    assert by_id[',
                  '        "pipeline_moderate_diagnostic_p5m5_to_p3m5"',
                  '    ].outcome == "ACCEPTED_FIRST_CROSSING"',
                  '    control = by_id["pipeline_liquid_control_p5m5_to_p4m5"]',
                  '    assert control.outcome == "GUARD_FAILURE"',
                  '    assert "below the fixed minimum" in control.failure_reason',
                  '    assert control.crossing_step == control.step_count',
                  '    assert control.crossing_cell_indices',
                  '    assert 0.0 < control.maximum_crossing_quality < (',
                  '        control.config.crossing_evidence_min_quality',
                  '    )',
                  '    control_step = control.steps[-1]',
                  '    assert control_step.crossing_cell_indices == (',
                  '        control_step.first_projection_cell_indices',
                  '    )',
                  '    assert control_step.second_projection_cell_indices == ()',
                  '',
                  '    for case in result.cases:',
                  '        assert len(case.preflight.records) == 65',
              ]),
          )
          replace_exact(
              test_path,
              block([
                  '    assert payload["pipeline_depressurization_executed"] is True',
                  '    assert payload["algorithms_or_tolerances_tuned"] is False',
              ]),
              block([
                  '    assert payload["pipeline_depressurization_executed"] is True',
                  '    assert payload["all_fixed_cases_completed"] is False',
                  '    assert payload["fixed_matrix_explicit_outcomes_retained"] is True',
                  '    assert payload["gate_p2_passed"] is False',
                  '    assert payload["outcome_counts"]["ACCEPTED_FIRST_CROSSING"] == 2',
                  '    assert payload["outcome_counts"]["GUARD_FAILURE"] == 1',
                  '    assert payload["algorithms_or_tolerances_tuned"] is False',
              ]),
          )

          workflow = ".github/workflows/stage7-pipeline-depressurization-increment2-validation.yml"
          replace_exact(
              workflow,
              block([
                  '          assert payload["all_fixed_cases_completed"] is True',
                  '          assert payload["two_mpa_candidate_outcome"] in {',
                  '              "ACCEPTED_FIRST_CROSSING",',
                  '              "NO_CROSSING_WITHIN_HORIZON",',
                  '          }',
              ]),
              block([
                  '          assert payload["all_fixed_cases_completed"] is False',
                  '          assert payload["fixed_matrix_explicit_outcomes_retained"] is True',
                  '          assert payload["gate_p2_passed"] is False',
                  '          assert payload["outcome_counts"]["ACCEPTED_FIRST_CROSSING"] == 2',
                  '          assert payload["outcome_counts"]["GUARD_FAILURE"] == 1',
                  '          assert payload["subthreshold_crossing_case_ids"] == [',
                  '              "pipeline_liquid_control_p5m5_to_p4m5"',
                  '          ]',
                  '          assert payload["two_mpa_candidate_outcome"] == "ACCEPTED_FIRST_CROSSING"',
              ]),
          )
          replace_exact(
              workflow,
              block([
                  '          for case in payload["cases"]:',
                  '              assert case["outcome"] in {',
                  '                  "ACCEPTED_FIRST_CROSSING",',
                  '                  "NO_CROSSING_WITHIN_HORIZON",',
                  '              }',
                  '              assert case["preflight_accepted_sample_count"] == 65',
                  '              assert case["reverse_flow_fallback_count"] == 0',
              ]),
              block([
                  '          by_id = {case["case_id"]: case for case in payload["cases"]}',
                  '          assert by_id[',
                  '              "pipeline_crossing_candidate_p5m5_to_p2m5"',
                  '          ]["outcome"] == "ACCEPTED_FIRST_CROSSING"',
                  '          assert by_id[',
                  '              "pipeline_moderate_diagnostic_p5m5_to_p3m5"',
                  '          ]["outcome"] == "ACCEPTED_FIRST_CROSSING"',
                  '          control = by_id["pipeline_liquid_control_p5m5_to_p4m5"]',
                  '          assert control["outcome"] == "GUARD_FAILURE"',
                  '          assert "below the fixed minimum" in control["failure_reason"]',
                  '          assert control["crossing_cell_indices"]',
                  '          assert 0.0 < control["maximum_crossing_quality"] < 1.0e-6',
                  '          for case in payload["cases"]:',
                  '              assert case["preflight_accepted_sample_count"] == 65',
                  '              assert case["reverse_flow_fallback_count"] == 0',
              ]),
          )
          PY
          python -m compileall -q src tests
          git diff --check

      - name: Commit line-based observation patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/liquid_gas_transient/hem_pipeline_depressurization_first_crossing.py \
            tests/test_stage7_lco2_hem_pipeline_depressurization_increment2.py \
            .github/workflows/stage7-pipeline-depressurization-increment2-validation.yml
          if git diff --cached --quiet; then
            echo "Line-based observation patch already applied."
            exit 0
          fi
          git commit -m "Retain fixed subthreshold control crossing"
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
