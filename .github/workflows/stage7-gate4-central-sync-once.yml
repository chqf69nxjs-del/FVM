        run: |
          python3 - <<'PY2'
          import base64, gzip, os
          payload = ''.join(os.environ['PATCH_GZIP_BASE64'].split())
          code = gzip.decompress(base64.b64decode(payload))
          exec(compile(code, 'stage7_gate4_central_sync.py', 'exec'))
          PY2

      - name: Validate and commit clean three-file synchronization
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'CFL_SENSITIVITY_OBSERVED' docs/verification/MASTER_VERIFICATION_INDEX.md
          grep -q 'low-CFL result accepted = true' docs/verification/stage7_current_gate_snapshot.md
          grep -q 'Gate_4_execution = COMPLETE' docs/verification/stage7_execution_log.md
          rm -f .github/workflows/stage7-gate4-central-sync-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          changed="$(git diff --cached --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'docs/verification/MASTER_VERIFICATION_INDEX.md\ndocs/verification/stage7_current_gate_snapshot.md\ndocs/verification/stage7_execution_log.md'
          git commit -m 'Synchronize Stage 7 central records through Gate 4'
          git push origin HEAD:agent/stage7-gate4-central-record-sync
