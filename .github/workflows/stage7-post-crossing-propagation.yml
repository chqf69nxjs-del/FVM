name: Stage 7 Post-Crossing Propagation Review

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: stage7-post-crossing-propagation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: src
  PYTHONDONTWRITEBYTECODE: '1'
  MPLBACKEND: Agg
  ANALYSIS_SOURCE_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  gate6-post-crossing-propagation:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install fixed dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy matplotlib pytest 'CoolProp==8.0.0'
      - name: Assert pristine checkout
        run: |
          echo "checkout_sha=$(git rev-parse HEAD)"
          status="$(git status --porcelain=v1 --untracked-files=all)"
          printf 'pre_execution_git_status=%s\n' "$status"
          test -z "$status"
      - name: Execute fixed Gate 6 continuation
        run: |
          temporary_output="${RUNNER_TEMP}/stage7-post-crossing-propagation"
          repository_output="artifacts/stage7-post-crossing-propagation"
          rm -rf "$temporary_output" "$repository_output"
          python -m liquid_gas_transient.hem_pipeline_post_crossing_propagation \
            --output-dir "$temporary_output"
          tracked_status="$(git status --porcelain=v1 --untracked-files=no)"
          printf 'post_execution_tracked_git_status=%s\n' "$tracked_status"
          test -z "$tracked_status"
          mkdir -p "$repository_output"
          cp -a "$temporary_output/." "$repository_output/"
      - name: Inspect Gate 6 evidence contract
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          target = Path('artifacts/stage7-post-crossing-propagation')
          summary = json.loads((target / 'summary.json').read_text(encoding='utf-8'))
          assert summary['scope'] == 'verification_only'
          assert summary['case_id'] == 'pipeline_crossing_candidate_p5m5_to_p2m5'
          assert summary['baseline_reproduced_exactly'] is True
          baseline = summary['baseline']
          assert baseline['outcome'] == 'ACCEPTED_FIRST_CROSSING'
          assert baseline['step_count'] == 125
          assert baseline['final_time_s'] == 7.999325695335248e-4
          assert baseline['crossing_step'] == 125
          assert baseline['crossing_time_s'] == 7.999325695335248e-4
          assert baseline['crossing_cell_indices'] == [29]
          assert baseline['crossing_distances_from_outlet_m'] == [0.078125]
          assert baseline['maximum_crossing_quality'] == 3.773646403587342e-6
          assert baseline['final_state_sha256'] == '170ce66c02a320d50389d0cf26fed78f21042f83dec6f64a0978e451cd91e361'
          assert baseline['run_signature_sha256'] == '28a5f8b1fd43f6208807bd15d96eaf09a568349007a1994273717aa264505fea'
          assert summary['fixed_continuation_offsets'] == [1, 4, 16, 64]
          assert summary['outcome'] in {
              'COMPLETED_FIXED_CHECKPOINTS',
              'FAIL_SAFE_STOP',
          }
          if summary['outcome'] == 'COMPLETED_FIXED_CHECKPOINTS':
              assert summary['reached_continuation_offsets'] == [1, 4, 16, 64]
              assert summary['successful_post_crossing_step_count'] == 64
          else:
              assert summary['failure_category']
              assert summary['failure_reason']
              assert 'POST_CROSSING_GUARD_LIMIT_REACHED' in summary['classifications']
          provenance = summary['provenance']
          assert provenance['source_git_sha'] == os.environ['ANALYSIS_SOURCE_GIT_SHA']
          assert provenance['checkout_git_sha']
          assert provenance['git_status_porcelain'] == ''
          assert provenance['property_backend_version'] == '8.0.0'
          for key in (
              'Gate_6_execution_complete',
              'post_crossing_propagation_approved',
              'near_saturation_acoustic_continuity_approved',
              'two_phase_acoustic_accuracy_band_approved',
              'CFL_independent_crossing_verified',
              'mesh_independent_crossing_verified',
              'Gate_P2_passed',
              'physical_validation',
              'design_use_acceptance',
              'production_hem_activation_approved',
          ):
              assert summary[key] is False
          for name in (
              'checkpoints.csv',
              'cell_history.csv',
              'transition_events.csv',
              'inventory_vapor_budget.csv',
              'report.md',
              'artifact_sha256.txt',
              'phase_region_space_time.png',
              'quality_void_fraction_space_time.png',
              'pressure_sound_speed_space_time.png',
              'inventory_residual.png',
          ):
              assert (target / name).is_file(), name
          PY
      - name: Compile and diff checks
        run: |
          python -m compileall -q src tests
          git diff --check
      - name: Run dedicated Gate 6 tests
        run: |
          python -m pytest -q \
            tests/test_stage7_lco2_hem_pipeline_post_crossing_propagation.py \
            --strict-markers --junitxml=gate6-dedicated.xml
      - name: Run related Stage 7 regressions
        run: |
          python -m pytest -q \
            tests/test_stage7_lco2_hem_liquid_to_two_phase_projected_fvm_dry_run.py \
            tests/test_stage7_lco2_hem_pipeline_depressurization_increment2.py \
            tests/test_stage7_lco2_hem_near_saturation_acoustic_continuity.py \
            tests/test_stage7_lco2_hem_pipeline_post_crossing_propagation.py \
            --strict-markers --junitxml=related-stage7.xml
      - name: Run full repository tests
        run: |
          python -m pytest -q --strict-markers --junitxml=full-repository.xml
      - name: Assert authoritative JUnit is clean
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          for name in ('gate6-dedicated.xml', 'related-stage7.xml', 'full-repository.xml'):
              root = ET.parse(Path(name)).getroot()
              suites = [root] if root.tag == 'testsuite' else list(root.findall('testsuite'))
              totals = {
                  key: sum(int(s.attrib.get(key, 0)) for s in suites)
                  for key in ('tests', 'skipped', 'failures', 'errors')
              }
              print(name, totals)
              assert totals['skipped'] == 0
              assert totals['failures'] == 0
              assert totals['errors'] == 0
          PY
      - name: Upload Gate 6 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stage7-post-crossing-propagation-${{ github.run_id }}
          path: |
            artifacts/stage7-post-crossing-propagation
            gate6-dedicated.xml
            related-stage7.xml
            full-repository.xml
          if-no-files-found: warn
