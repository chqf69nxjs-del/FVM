name: Gate 2 Central Record Sync Temp

on:
  push:
    branches:
      - agent/stage7-central-record-sync-pr77-pr84
    paths:
      - .github/gate2_sync.py
  pull_request:
    branches:
      - main
    paths:
      - .github/gate2_sync.py

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/stage7-central-record-sync-pr77-pr84
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Synchronize central records
        run: python .github/gate2_sync.py
      - name: Validate synchronized records
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path

          master = Path('docs/verification/MASTER_VERIFICATION_INDEX.md').read_text(encoding='utf-8')
          snapshot = Path('docs/verification/stage7_current_gate_snapshot.md').read_text(encoding='utf-8')
          log = Path('docs/verification/stage7_execution_log.md').read_text(encoding='utf-8')
          combined = '\n'.join((master, snapshot, log))

          for sha in (
              '5657d26b3f37443ef63971245dce66ddd72c681e',
              'e40562e03657dec526f84b3911cbf181973462fa',
              '08d34069b45083537e1d5c4035993d3fc5c01de5',
              '827d99bce97cea2785aa3334b3f5e950389c9aad',
          ):
              assert sha in combined, sha

          assert '## Current state — 2026-07-26' in master
          assert '## Boundary-driven pipeline continuation — PRs #77, #79, #82, and #84' in master
          assert '## Status — 2026-07-26' in snapshot
          assert 'active operational gate:           local-PC reproduction checkpoint — Issue #85' in snapshot
          assert 'next numerical execution gate:     fixed low-CFL matrix — Issue #86' in snapshot
          assert '## 2026-07-25 to 2026-07-26 — Boundary-driven pipeline continuation' in log
          assert 'low_cfl_matrix_executed = false' in log
          assert 'Gate P2 passed = false' in snapshot
          assert 'physical Validation:               NOT ESTABLISHED' in snapshot
          assert 'production HEM activation:         NOT APPROVED' in snapshot
          PY
      - name: Commit synchronized documents
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            docs/verification/MASTER_VERIFICATION_INDEX.md \
            docs/verification/stage7_current_gate_snapshot.md \
            docs/verification/stage7_execution_log.md
          git commit -m 'Synchronize Stage 7 central records through PR #84'
          git push origin HEAD:agent/stage7-central-record-sync-pr77-pr84
