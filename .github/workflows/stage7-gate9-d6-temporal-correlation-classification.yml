name: Stage 7 Gate 9 D6 Temporal Correlation Classification

on:
  pull_request:
    paths:
      - "src/liquid_gas_transient/hem_gate9_temporal_correlation_classification.py"
      - "tests/test_stage7_lco2_hem_gate9_temporal_correlation_classification.py"
      - "docs/verification/stage7_gate9_d6_temporal_correlation_classification.md"
      - ".github/workflows/stage7-gate9-d6-temporal-correlation-classification.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: stage7-gate9-d6-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: src
  PYTHONDONTWRITEBYTECODE: "1"
  MPLBACKEND: Agg
  ANALYSIS_SOURCE_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  D5_ARTIFACT_ID: "8855725551"
  D5_ARTIFACT_ZIP_SHA256: "6b4f8f8076d9e7b61d4edb91c2653b2a010a05ee231c45b4c61dae9da6216850"

jobs:
  gate9-d6-temporal-correlation-classification:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install fixed dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy matplotlib pytest 'CoolProp==8.0.0'

      - name: Assert pristine checkout
        run: |
          echo "checkout_sha=$(git rev-parse HEAD)"
          status="$(git status --porcelain=v1 --untracked-files=all)"
          printf 'pre_execution_git_status=%s\n' "$status"
          test -z "$status"

      - name: Download and verify authoritative D5 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d5_zip="${RUNNER_TEMP}/stage7-gate9-d5-${D5_ARTIFACT_ID}.zip"
          d5_root="${RUNNER_TEMP}/stage7-gate9-d5"
          rm -rf "$d5_zip" "$d5_root"
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${D5_ARTIFACT_ID}/zip" \
            > "$d5_zip"
          actual_sha="$(sha256sum "$d5_zip" | awk '{print $1}')"
          printf 'd5_artifact_zip_sha256=%s\n' "$actual_sha"
          test "$actual_sha" = "$D5_ARTIFACT_ZIP_SHA256"
          mkdir -p "$d5_root"
          unzip -q "$d5_zip" -d "$d5_root"
          test -d "$d5_root/artifacts/stage7-gate9-d5"

      - name: Execute D6 classification from fixed D5 evidence
        run: |
          output="artifacts/stage7-gate9-d6"
          rm -rf "$output"
          python -m liquid_gas_transient.hem_gate9_temporal_correlation_classification \
            --d5-artifact-dir "${RUNNER_TEMP}/stage7-gate9-d5/artifacts/stage7-gate9-d5" \
            --output-dir "$output"
          tracked_status="$(git status --porcelain=v1 --untracked-files=no)"
          printf 'post_execution_tracked_git_status=%s\n' "$tracked_status"
          test -z "$tracked_status"

      - name: Inspect D6 evidence contract
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          import os
          from pathlib import Path

          target = Path("artifacts/stage7-gate9-d6")
          expected_files = {
              "summary.json",
              "label_evidence.csv",
              "temporal_order_evidence.csv",
              "mechanism_rank_comparison.csv",
              "threshold_classification_evidence.csv",
              "report.md",
              "artifact_sha256.txt",
          }
          assert {path.name for path in target.iterdir()} == expected_files

          summary = json.loads(
              (target / "summary.json").read_text(encoding="utf-8")
          )
          assert summary["schema_version"] == (
              "stage7_gate9_d6_temporal_correlation_classification_v1"
          )
          assert summary["input_d5_artifact_id"] == 8855725551
          assert summary["input_d5_artifact_zip_sha256"] == os.environ[
              "D5_ARTIFACT_ZIP_SHA256"
          ]
          assert summary["input_d5_internal_digest_verified"] is True
          assert summary["label_count"] == 12
          assert summary["assigned_label_count"] == 7
          assert summary["not_assigned_label_count"] == 5
          assert summary["mechanism_comparison_record_count"] == 15
          assert summary["temporal_order_record_count"] == 3
          assert summary["threshold_evidence_record_count"] == 3
          assert summary["assigned_labels"] == [
              "CANDIDATE_TIME_POSITION_STABLE_ACROSS_CFL",
              "CROSSING_DEPTH_CFL_SENSITIVE",
              "CROSSING_DEPTH_SEQUENCE_NON_MONOTONE",
              "SATURATION_MARGIN_DISPLACEMENT_CORRELATED",
              "PROJECTION_ACTIVITY_POSTDATES_RAW_CROSSING",
              "THRESHOLD_CLASSIFICATION_DISCONTINUITY_OBSERVED",
              "CROSSING_DEPTH_REVIEW_INCONCLUSIVE",
          ]
          assert summary["not_assigned_labels"] == [
              "CANDIDATE_STEP_OVERSHOOT_CORRELATED",
              "RUSANOV_DISSIPATION_CORRELATED",
              "BOUNDARY_FLUX_IMBALANCE_CORRELATED",
              "ACOUSTIC_BRANCH_SELECTION_CORRELATED",
              "MULTI_FACTOR_CROSSING_DEPTH",
          ]
          assert summary[
              "D6_temporal_correlation_classification_complete"
          ] is True
          assert summary["Gate_9_execution_complete"] is True
          assert summary[
              "crossing_depth_CFL_sensitivity_characterized"
          ] is True
          assert summary["crossing_depth_root_cause_approved"] is False
          assert summary["threshold_change_authorized"] is False
          assert summary["flux_change_authorized"] is False
          assert summary["sound_speed_change_authorized"] is False
          assert summary["projection_change_authorized"] is False
          assert summary["physical_validation"] is False
          assert summary["design_use_acceptance"] is False
          assert summary["production_hem_activation_approved"] is False
          assert summary["provenance"]["source_git_sha"] == os.environ[
              "ANALYSIS_SOURCE_GIT_SHA"
          ]
          assert summary["provenance"][
              "git_status_porcelain_tracked"
          ] == ""

          with (target / "label_evidence.csv").open(
              newline="", encoding="utf-8"
          ) as handle:
              labels = {row["label"]: row for row in csv.DictReader(handle)}
          assert (
              labels["CANDIDATE_STEP_OVERSHOOT_CORRELATED"]["numerator"],
              labels["CANDIDATE_STEP_OVERSHOOT_CORRELATED"]["denominator"],
          ) == ("2", "3")
          assert (
              labels["RUSANOV_DISSIPATION_CORRELATED"]["numerator"],
              labels["RUSANOV_DISSIPATION_CORRELATED"]["denominator"],
          ) == ("12", "18")
          assert (
              labels["BOUNDARY_FLUX_IMBALANCE_CORRELATED"]["numerator"],
              labels["BOUNDARY_FLUX_IMBALANCE_CORRELATED"]["denominator"],
          ) == ("6", "9")
          assert (
              labels["SATURATION_MARGIN_DISPLACEMENT_CORRELATED"]["numerator"],
              labels["SATURATION_MARGIN_DISPLACEMENT_CORRELATED"]["denominator"],
          ) == ("12", "12")

          manifest = {}
          for line in (target / "artifact_sha256.txt").read_text(
              encoding="utf-8"
          ).splitlines():
              digest, name = line.split("  ", 1)
              manifest[name] = digest
          assert set(manifest) == expected_files - {"artifact_sha256.txt"}
          for name, expected in manifest.items():
              actual = hashlib.sha256((target / name).read_bytes()).hexdigest()
              assert actual == expected, name
          PY

      - name: Compile and diff checks
        run: |
          python -m compileall -q src tests
          git diff --check

      - name: Run dedicated D6 tests
        run: |
          python -m pytest -q \
            tests/test_stage7_lco2_hem_gate9_temporal_correlation_classification.py \
            --strict-markers \
            --junitxml=gate9-d6-dedicated.xml

      - name: Run related Stage 7 regressions
        run: |
          python -m pytest -q \
            tests/test_stage7_gate9_contract.py \
            tests/test_stage7_lco2_hem_pipeline_post_crossing_cfl_sensitivity_full.py \
            tests/test_stage7_lco2_hem_gate9_instrumentation_scaffold.py \
            tests/test_stage7_lco2_hem_gate9_rusanov_decomposition.py \
            tests/test_stage7_lco2_hem_gate9_acoustic_attempt_diagnostics.py \
            tests/test_stage7_lco2_hem_gate9_event_alignment.py \
            tests/test_stage7_lco2_hem_gate9_refined_event_alignment.py \
            tests/test_stage7_lco2_hem_gate9_three_cfl_integration.py \
            tests/test_stage7_lco2_hem_gate9_temporal_correlation_classification.py \
            --strict-markers \
            --junitxml=related-stage7.xml

      - name: Run full repository tests
        run: |
          python -m pytest -q \
            --strict-markers \
            --junitxml=full-repository.xml

      - name: Assert authoritative JUnit is clean
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          for name in (
              "gate9-d6-dedicated.xml",
              "related-stage7.xml",
              "full-repository.xml",
          ):
              root = ET.parse(Path(name)).getroot()
              suites = (
                  [root]
                  if root.tag == "testsuite"
                  else list(root.findall("testsuite"))
              )
              totals = {
                  key: sum(int(s.attrib.get(key, 0)) for s in suites)
                  for key in ("tests", "skipped", "failures", "errors")
              }
              print(name, totals)
              assert totals["skipped"] == 0
              assert totals["failures"] == 0
              assert totals["errors"] == 0
          PY

      - name: Upload D6 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stage7-gate9-d6-${{ github.run_id }}
          path: |
            artifacts/stage7-gate9-d6
            gate9-d6-dedicated.xml
            related-stage7.xml
            full-repository.xml
          if-no-files-found: warn
