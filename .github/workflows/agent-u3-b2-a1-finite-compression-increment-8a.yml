name: Agent U3 B2 A1 Finite Compression Increment 8A

on:
  push:
    branches: [agent/u3-b2-a1-wave-curve-review]
    paths:
      - ".github/workflows/agent-u3-b2-a1-finite-compression-increment-8a.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: agent-u3-b2-a1-finite-compression-increment-8a
  cancel-in-progress: true

env:
  PYTHONPATH: src:tools/verification
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONPYCACHEPREFIX: /tmp/u3-b2-a1-finite-compression-inc8a-pycache
  SOURCE_SHA: ${{ github.sha }}
  SCOPE_BASE_SHA: 17421c5718004b2e961a352b83d35bd6828a64fa
  PARENT_RUN_ID: "31661720453"
  PARENT_ARTIFACT_ID: "9166412782"
  PARENT_ARTIFACT_NAME: u3-b2-a1-finite-compression-increment-8-rerun-31661720453
  PARENT_ARTIFACT_DIGEST: d1d704997ec5e8fd038a0645b31e598939528cd9295de8762c06aaf3b81081d8

jobs:
  diagnose-step493-root-topology:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact Increment 8A source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"

      - name: Install fixed dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.5.1' 'CoolProp==8.0.0'

      - name: Verify fixed diagnostic scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test -f docs/verification/stage7_u3_b2_a1_finite_compression_increment_8a_step493_root_topology_diagnostic_model_review.md
          test -f tools/verification/u3_b2_a1_finite_compression_step493_root_topology_diagnostic.py
          python -m py_compile \
            tools/verification/u3_b2_a1_finite_compression_step493_root_topology_diagnostic.py
          mapfile -t actual < <(
            git diff --name-only "${SCOPE_BASE_SHA}" HEAD | sort
          )
          mapfile -t expected < <(printf '%s\n' \
            '.github/workflows/agent-u3-b2-a1-finite-compression-increment-8a.yml' | sort)
          diff -u \
            <(printf '%s\n' "${expected[@]}") \
            <(printf '%s\n' "${actual[@]}")
          git diff --check "${SCOPE_BASE_SHA}" HEAD

      - name: Download authoritative corrected Increment 8 stop artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.PARENT_ARTIFACT_NAME }}
          path: artifacts/parent-increment-8-stop
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.PARENT_RUN_ID }}

      - name: Verify parent metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          metadata="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PARENT_ARTIFACT_ID}")"
          test "$(jq -r '.id' <<<"${metadata}")" = "${PARENT_ARTIFACT_ID}"
          test "$(jq -r '.name' <<<"${metadata}")" = "${PARENT_ARTIFACT_NAME}"
          test "$(jq -r '.expired' <<<"${metadata}")" = "false"
          test "$(jq -r '.workflow_run.id' <<<"${metadata}")" = "${PARENT_RUN_ID}"
          test "$(jq -r '.workflow_run.head_sha' <<<"${metadata}")" = "9fd7ac6bcb6eefcf12099028da2fc731ae96dd3c"
          test "$(jq -r '.digest' <<<"${metadata}")" = "sha256:${PARENT_ARTIFACT_DIGEST}"

      - name: Diagnose step-493 root topology without advancing solver
        shell: bash
        run: |
          set -euo pipefail
          output=artifacts/u3-b2-a1-finite-compression-increment-8a
          rm -rf "${output}"
          python tools/verification/u3_b2_a1_finite_compression_step493_root_topology_diagnostic.py \
            --contract docs/verification/stage7_u3_b2_fvm_discharge_coupling_contract_v1.json \
            --b1-contract docs/verification/stage7_u3_b1_critical_state_contract_v1.json \
            --model-review-spec docs/verification/stage7_u3_b2_a1_finite_compression_increment_8a_step493_root_topology_diagnostic_model_review.md \
            --parent-artifact-dir artifacts/parent-increment-8-stop \
            --parent-artifact-digest "${PARENT_ARTIFACT_DIGEST}" \
            --output-dir "${output}" \
            --source-git-sha "${SOURCE_SHA}"

      - name: Inspect diagnostic classification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import hashlib
          import json
          import os
          from pathlib import Path
          import numpy as np

          target = Path(
              "artifacts/u3-b2-a1-finite-compression-increment-8a"
          )
          expected = {
              "step493_hugoniot_fixed_scan.csv",
              "step493_guard_front_refinement.csv",
              "step493_root_topology.csv",
              "step493_hugoniot_density_search.csv",
              "step493_selected_root.csv",
              "step493_state_identity.npz",
              "authority_verification.json",
              "summary.json",
              "report.md",
              "artifact_sha256.txt",
          }
          assert {path.name for path in target.iterdir()} == expected
          summary = json.loads(
              (target / "summary.json").read_text(encoding="utf-8")
          )
          classified = {
              "FINITE_COMPRESSION_GUARD_FRONT_REFINEMENT_SUPPORTED",
              "ROOT_RETURNED_TO_WEAK_COMPRESSION_SCOPE",
              "ROOT_LIES_INSIDE_B1_UNAVAILABLE_DOMAIN",
              "FINITE_COMPRESSION_DIAGNOSTIC_CAP_REQUIRED",
          }
          assert summary["source_git_sha"] == os.environ["SOURCE_SHA"]
          assert summary["outcome"] in classified
          assert summary["diagnostic_classification_complete"] is True
          assert summary["parent_artifact_verified"] is True
          assert summary["solver_step_loaded"] == 493
          assert summary["next_requested_solver_step"] == 494
          assert summary["state_unchanged"] is True
          assert summary["fvm_step_494_attempted"] is False
          assert summary["fixed_scan_node_count"] == 12
          assert summary["fixed_sign_change_count"] == 0
          assert summary[
              "fixed_success_residual_monotone_nonincreasing"
          ] is True
          assert summary["root_topology_monotone_nonincreasing"] is True
          assert summary["finite_compression_branch_approved"] is False
          assert summary["full_two_l_over_c0_passed"] is False
          assert summary["formal_state_promoted"] is False

          if summary["outcome"] == (
              "FINITE_COMPRESSION_GUARD_FRONT_REFINEMENT_SUPPORTED"
          ):
              assert summary["actual_continuation_supported"] is True
              assert summary["guard_front_refinement_applied"] is True
              assert summary["guard_front_iterations"] == 48
              assert summary["root_topology_sign_change_count"] == 1
              assert summary["selected_root_present"] is True
              assert 1.0e-6 < summary["selected_root_chi"] <= 1.0e-4
              assert abs(summary["selected_root_residual_kg_s"]) <= 1.0e-8
              assert summary["selected_root_gate_passed"] is True
          else:
              assert summary["actual_continuation_supported"] is False

          with np.load(target / "step493_state_identity.npz") as states:
              before = np.asarray(states["U_before"], dtype=float)
              after = np.asarray(states["U_after"], dtype=float)
              assert before.shape == (32, 4)
              assert np.array_equal(before, after)
              assert int(states["solver_step_before"][0]) == 493
              assert int(states["solver_step_after"][0]) == 493

          manifest = {}
          for line in (target / "artifact_sha256.txt").read_text(
              encoding="utf-8"
          ).splitlines():
              digest, name = line.split("  ", 1)
              manifest[name] = digest
          assert set(manifest) == expected - {"artifact_sha256.txt"}
          for name, digest in manifest.items():
              assert hashlib.sha256((target / name).read_bytes()).hexdigest() == digest
          PY

      - name: Upload Increment 8A evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: u3-b2-a1-finite-compression-increment-8a-${{ github.run_id }}
          path: artifacts/u3-b2-a1-finite-compression-increment-8a
          if-no-files-found: warn
