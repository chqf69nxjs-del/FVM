name: Stage 7 4 MPa Forensic Final Validation

on:
  push:
    branches:
      - agent/stage7-pipeline-4mpa-subthreshold-forensics
  pull_request:
  workflow_dispatch:

env:
  PYTHONPATH: src
  MPLBACKEND: Agg

jobs:
  validate-4mpa-forensics-final:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e '.[plotting]'
          python -m pip install pytest 'CoolProp==8.0.0'
      - name: Smoke check
        run: |
          python - <<'PY'
          import CoolProp, matplotlib, numpy
          print('CoolProp', CoolProp.__version__)
          print('matplotlib', matplotlib.__version__)
          print('numpy', numpy.__version__)
          PY
      - name: Compile and diff checks
        run: |
          python -m compileall -q src tests
          git diff --check
      - name: Run dependency-free forensic tests
        run: |
          python -m pytest -q \
            tests/test_stage7_lco2_hem_pipeline_4mpa_subthreshold_forensics.py \
            tests/test_stage7_lco2_hem_pipeline_4mpa_subthreshold_forensics_contract.py \
            -m 'not coolprop_installed' --strict-markers \
            --junitxml=forensic-pure.xml
      - name: Run installed-CoolProp forensic tests
        run: |
          python -m pytest -q \
            tests/test_stage7_lco2_hem_pipeline_4mpa_subthreshold_forensics.py \
            tests/test_stage7_lco2_hem_pipeline_4mpa_subthreshold_forensics_contract.py \
            -m coolprop_installed --strict-markers \
            --junitxml=forensic-coolprop.xml
      - name: Generate authoritative forensic artifacts
        run: |
          python -m liquid_gas_transient.hem_pipeline_4mpa_subthreshold_forensics \
            --output-dir artifacts/stage7-4mpa-forensics
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path(
              'artifacts/stage7-4mpa-forensics/4mpa_forensic_summary.json'
          ).read_text(encoding='utf-8'))
          print(json.dumps(summary, indent=2, sort_keys=True))
          assert summary['baseline_reproduced_exactly'] is True
          assert summary['diagnostic_categories'] == [
              'THERMODYNAMIC_TWO_PHASE_SUPPORTED',
              'NEAR_SATURATION_PROPERTY_SENSITIVE',
              'MULTI_FACTOR_EVIDENCE',
          ]
          assert summary['perturbation_sensitivity'] == 'WEAKLY_RESOLVED'
          assert summary['Gate_P2_passed'] is False
          PY
      - name: Run related Stage 7 regressions
        run: |
          python -m pytest -q \
            tests/test_stage7_lco2_hem_pipeline_depressurization_increment2.py \
            tests/test_stage7_lco2_hem_pipeline_depressurization_boundary_increment1.py \
            tests/test_stage7_lco2_hem_liquid_to_two_phase_first_crossing_case_ab.py \
            --strict-markers --junitxml=related-stage7.xml
      - name: Run full repository tests
        run: python -m pytest -q --strict-markers --junitxml=full-repository.xml
      - name: Assert no authoritative skips or failures
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for name in ('forensic-pure.xml','forensic-coolprop.xml','related-stage7.xml','full-repository.xml'):
              root = ET.parse(Path(name)).getroot()
              suites = [root] if root.tag == 'testsuite' else list(root.findall('testsuite'))
              values = {
                  key: sum(int(s.attrib.get(key, 0)) for s in suites)
                  for key in ('tests','skipped','failures','errors')
              }
              print(name, values)
              assert values['skipped'] == 0
              assert values['failures'] == 0
              assert values['errors'] == 0
          PY
      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stage7-4mpa-forensic-final-${{ github.run_id }}
          path: |
            artifacts/stage7-4mpa-forensics
            forensic-pure.xml
            forensic-coolprop.xml
            related-stage7.xml
            full-repository.xml
          if-no-files-found: warn
