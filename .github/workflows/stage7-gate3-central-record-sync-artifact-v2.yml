name: Stage 7 Gate 3 Central Record Sync Artifact v2

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  build-synchronized-records:
    if: github.head_ref == 'agent/stage7-gate3-central-record-sync'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout synchronization branch
        uses: actions/checkout@v7
        with:
          ref: agent/stage7-gate3-central-record-sync

      - name: Generate synchronized central records
        run: python scripts/stage7_gate3_central_record_sync.py

      - name: Upload synchronized central records
        uses: actions/upload-artifact@v7
        with:
          name: stage7-gate3-central-record-sync-v2-${{ github.run_id }}
          path: |
            docs/verification/MASTER_VERIFICATION_INDEX.md
            docs/verification/stage7_current_gate_snapshot.md
            docs/verification/stage7_execution_log.md
          if-no-files-found: error
