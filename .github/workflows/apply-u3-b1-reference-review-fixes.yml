name: Apply U3 B1 reference review fixes

on:
  push:
    branches:
      - agent/u3-b1-independent-reference
    paths:
      - .github/workflows/apply-u3-b1-reference-review-fixes.yml

permissions:
  contents: write

jobs:
  apply-review-fixes:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: agent/u3-b1-independent-reference
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply review fixes and regression tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          reference = Path("src/liquid_gas_transient/u3_b1_critical_state_reference.py")
          replace_once(
              reference,
              '        phase = str(self._PhaseSI("P", pressure_pa, "T", temperature, "CO2"))\n',
              '''        phase = str(\n            self._PhaseSI(\n                "P",\n                pressure_pa,\n                "SMASS",\n                entropy_J_kg_K,\n                "CO2",\n            )\n        )\n''',
          )
          replace_once(
              reference,
              '''def write_plots(\n    output_dir: Path,\n    candidate_records: list[dict[str, Any]],\n    sweep_rows: list[dict[str, Any]],\n) -> None:\n''',
              '''def plot_provenance_text(\n    case_name: str,\n    backend_version: str,\n    source_git_sha: str,\n) -> str:\n    return (\n        f"case={case_name} | "\n        "model=U3 B1 single-phase isentropic critical-state reference | "\n        f"backend=CoolProp | version={backend_version} | "\n        f"source={source_git_sha[:12]}"\n    )\n\n\ndef write_plots(\n    output_dir: Path,\n    candidate_records: list[dict[str, Any]],\n    sweep_rows: list[dict[str, Any]],\n    *,\n    backend_version: str,\n    source_git_sha: str,\n) -> None:\n''',
          )
          replace_once(
              reference,
              '    plt.title("U3 B1 single-phase mass-flux path")\n',
              '''    plt.title(\n        "U3 B1 single-phase mass-flux path\\n"\n        + plot_provenance_text(\n            "GAS_CRITICAL / Cd=0.8", backend_version, source_git_sha\n        ),\n        fontsize=9,\n    )\n''',
          )
          replace_once(
              reference,
              '    plt.title("U3 B1 back-pressure response")\n',
              '''    plt.title(\n        "U3 B1 back-pressure response\\n"\n        + plot_provenance_text(\n            "GAS_CRITICAL sweep / Cd=0.8", backend_version, source_git_sha\n        ),\n        fontsize=9,\n    )\n''',
          )
          replace_once(
              reference,
              '    write_plots(output_dir, candidate_records, sweep_rows)\n',
              '''    write_plots(\n        output_dir,\n        candidate_records,\n        sweep_rows,\n        backend_version=provider.version,\n        source_git_sha=source_git_sha,\n    )\n''',
          )

          authoritative = Path(
              "src/liquid_gas_transient/u3_b1_critical_state_authoritative.py"
          )
          replace_once(
              authoritative,
              '        return [row], summary\n',
              '''        b0_placeholder = {\n            "measure": "aggregate_check_construction_failure",\n            "reference_value": "",\n            "b0_value": "",\n            "relative_error": "",\n            "tolerance": "finite locked metrics",\n            "passed": False,\n            "formal_message": f"{type(exc).__name__}: {exc}",\n        }\n        return [b0_placeholder, row], summary\n''',
          )

          reference_tests = Path(
              "tests/test_stage7_u3_b1_critical_state_reference.py"
          )
          replace_once(
              reference_tests,
              '''    CandidateState,\n    ReferenceInput,\n    UpstreamState,\n''',
              '''    CandidateState,\n    CoolPropProvider,\n    ReferenceInput,\n    UpstreamState,\n''',
          )
          replace_once(
              reference_tests,
              '''    load_contract,\n    normalize_phase,\n)\n''',
              '''    load_contract,\n    normalize_phase,\n    plot_provenance_text,\n)\n''',
          )
          test_text = reference_tests.read_text(encoding="utf-8")
          if "test_coolprop_candidate_phase_uses_pressure_entropy_coordinates" in test_text:
              raise RuntimeError("reference regression tests already present")
          test_text += '''\n\ndef test_coolprop_candidate_phase_uses_pressure_entropy_coordinates() -> None:\n    provider = object.__new__(CoolPropProvider)\n    provider.version = "fake"\n    phase_calls: list[tuple[object, ...]] = []\n\n    def props(output: str, *args: object) -> float:\n        values = {\n            "T": 280.0,\n            "DMASS": 12.0,\n            "HMASS": 190000.0,\n            "SMASS": 1000.0,\n        }\n        return values[output]\n\n    def phase(*args: object) -> str:\n        phase_calls.append(args)\n        return "gas"\n\n    provider._PropsSI = props\n    provider._PhaseSI = phase\n    candidate = provider.isentropic_candidate(8.0e5, 1000.0)\n\n    assert candidate.phase == "gas"\n    assert phase_calls == [("P", 8.0e5, "SMASS", 1000.0, "CO2")]\n\n\ndef test_plot_provenance_contains_required_fields() -> None:\n    text = plot_provenance_text(\n        "GAS_CRITICAL / Cd=0.8",\n        "8.0.0",\n        "0123456789abcdef",\n    )\n    assert "case=GAS_CRITICAL / Cd=0.8" in text\n    assert "model=U3 B1 single-phase isentropic critical-state reference" in text\n    assert "backend=CoolProp" in text\n    assert "version=8.0.0" in text\n    assert "source=0123456789ab" in text\n'''
          reference_tests.write_text(test_text, encoding="utf-8")

          authoritative_tests = Path(
              "tests/test_stage7_u3_b1_critical_state_authoritative.py"
          )
          replace_once(
              authoritative_tests,
              '''from pathlib import Path\n\nfrom liquid_gas_transient.u3_b1_critical_state_authoritative import critical_search\n''',
              '''from pathlib import Path\nfrom types import SimpleNamespace\n\nimport pytest\n\nimport liquid_gas_transient.u3_b1_critical_state_authoritative as authoritative\nfrom liquid_gas_transient.u3_b1_critical_state_authoritative import critical_search\n''',
          )
          replace_once(authoritative_tests, '\n\nimport pytest\n', '\n')
          test_text = authoritative_tests.read_text(encoding="utf-8")
          if "test_locked_check_fail_safe_retains_b0_and_check_rows" in test_text:
              raise RuntimeError("authoritative regression test already present")
          test_text += '''\n\ndef test_locked_check_fail_safe_retains_b0_and_check_rows(\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    def fail_locked_checks(*args: object, **kwargs: object) -> object:\n        raise ZeroDivisionError("synthetic zero denominator")\n\n    monkeypatch.setattr(\n        authoritative,\n        "_ORIGINAL_LOCKED_CHECKS",\n        fail_locked_checks,\n    )\n    contract = {\n        "benchmark_cases": [\n            {"case_id": "unit", "expected_outcome": "SUCCESS_UNIT"}\n        ]\n    }\n    results = [SimpleNamespace(case_id="unit", formal_outcome="SUCCESS_UNIT")]\n\n    rows, summary = authoritative.locked_checks_fail_safe(contract, results)\n\n    assert any(row.get("measure") for row in rows)\n    assert any(row.get("check") for row in rows)\n    assert all(row["passed"] is False for row in rows)\n    assert summary["all_expected_outcomes_match"] is True\n    assert summary["all_locked_checks_passed"] is False\n'''
          authoritative_tests.write_text(test_text, encoding="utf-8")
          PY

      - name: Run targeted review regressions
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pytest -q \
            tests/test_stage7_u3_b1_critical_state_reference.py \
            tests/test_stage7_u3_b1_critical_state_authoritative.py \
            --strict-markers
          git diff --check
          test -z "$(find src tests -type d -name __pycache__ -print -quit)"

      - name: Commit source and tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/liquid_gas_transient/u3_b1_critical_state_reference.py \
            src/liquid_gas_transient/u3_b1_critical_state_authoritative.py \
            tests/test_stage7_u3_b1_critical_state_reference.py \
            tests/test_stage7_u3_b1_critical_state_authoritative.py
          git commit -m "Address U3 B1 reference review feedback"
          git push origin HEAD:agent/u3-b1-independent-reference
