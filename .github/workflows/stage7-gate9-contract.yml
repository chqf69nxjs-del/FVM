name: Stage 7 Gate 9 Contract

on:
  pull_request:
    paths:
      - "docs/verification/stage7_gate9_*.md"
      - "docs/verification/stage7_gate9_*.json"
      - "tests/test_stage7_gate9_contract.py"
      - ".github/workflows/stage7-gate9-contract.yml"
  workflow_dispatch:

concurrency:
  group: stage7-gate9-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  validate-gate9-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install contract test dependency
        run: python -m pip install pytest

      - name: Validate JSON syntax
        run: |
          python -m json.tool \
            docs/verification/stage7_gate9_execution_contract_v0p1.json \
            >/dev/null
          python -m json.tool \
            docs/verification/stage7_gate9_literature_registry_v0p1.json \
            >/dev/null

      - name: Run dependency-free Gate 9 contract tests
        run: |
          python -m pytest -q tests/test_stage7_gate9_contract.py \
            --strict-markers \
            --junitxml=gate9-contract.xml

      - name: Assert clean JUnit result
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("gate9-contract.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
          totals = {
              key: sum(int(s.attrib.get(key, 0)) for s in suites)
              for key in ("tests", "skipped", "failures", "errors")
          }
          print(totals)
          assert totals["tests"] >= 6
          assert totals["skipped"] == 0
          assert totals["failures"] == 0
          assert totals["errors"] == 0
          PY

      - name: Compile and diff checks
        run: |
          python -m compileall -q tests
          git diff --check

      - name: Upload JUnit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stage7-gate9-contract-${{ github.run_id }}
          path: gate9-contract.xml
          if-no-files-found: error
