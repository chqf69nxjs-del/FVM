name: Agent U3 B2 A1 Finite Compression Increment 8B Ubuntu22

on:
  push:
    branches: [agent/u3-b2-a1-wave-curve-review]
    paths:
      - ".github/workflows/agent-u3-b2-a1-finite-compression-increment-8b-ubuntu22.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: agent-u3-b2-a1-finite-compression-increment-8b-ubuntu22
  cancel-in-progress: true

env:
  PYTHONPATH: src:tools/verification
  PYTHONDONTWRITEBYTECODE: "1"
  SOURCE_SHA: ${{ github.sha }}
  SCOPE_BASE_SHA: ff9ac6dcda41fb1cdeb819cc6265c971e2735369
  PARENT_RUN_ID: "31661720453"
  PARENT_ARTIFACT_NAME: u3-b2-a1-finite-compression-increment-8-rerun-31661720453
  PARENT_ARTIFACT_DIGEST: d1d704997ec5e8fd038a0645b31e598939528cd9295de8762c06aaf3b81081d8
  DIAGNOSTIC_RUN_ID: "31662145018"
  DIAGNOSTIC_ARTIFACT_NAME: u3-b2-a1-finite-compression-increment-8a-31662145018
  DIAGNOSTIC_ARTIFACT_DIGEST: 457e4ad3a2c432d532e483fdc94d8e5f62b9ac600387fb6b3215322858acc6d2

jobs:
  one-step:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"

      - name: Verify narrow fallback scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          python -m py_compile tools/verification/u3_b2_a1_finite_compression_guard_front_one_step.py
          mapfile -t actual < <(git diff --name-only "${SCOPE_BASE_SHA}" HEAD | sort)
          mapfile -t expected < <(printf '%s\n' \
            '.github/workflows/agent-u3-b2-a1-finite-compression-increment-8b-ubuntu22.yml' | sort)
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${actual[@]}")

      - name: Install dependencies
        run: python -m pip install 'numpy==2.5.1' 'CoolProp==8.0.0'

      - name: Download step-493 parent
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.PARENT_ARTIFACT_NAME }}
          path: artifacts/parent-step493
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.PARENT_RUN_ID }}

      - name: Download Increment 8A authority
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.DIAGNOSTIC_ARTIFACT_NAME }}
          path: artifacts/increment-8a
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.DIAGNOSTIC_RUN_ID }}

      - name: Run actual step 493 to 494
        shell: bash
        run: |
          set -euo pipefail
          output=artifacts/u3-b2-a1-finite-compression-increment-8b-ubuntu22
          rm -rf "${output}"
          python tools/verification/u3_b2_a1_finite_compression_guard_front_one_step.py \
            --contract docs/verification/stage7_u3_b2_fvm_discharge_coupling_contract_v1.json \
            --b1-contract docs/verification/stage7_u3_b1_critical_state_contract_v1.json \
            --model-review-spec docs/verification/stage7_u3_b2_a1_finite_compression_increment_8b_guard_front_one_step_model_review.md \
            --parent-artifact-dir artifacts/parent-step493 \
            --parent-artifact-digest "${PARENT_ARTIFACT_DIGEST}" \
            --diagnostic-artifact-dir artifacts/increment-8a \
            --diagnostic-artifact-digest "${DIAGNOSTIC_ARTIFACT_DIGEST}" \
            --output-dir "${output}" \
            --source-git-sha "${SOURCE_SHA}"
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path(
              'artifacts/u3-b2-a1-finite-compression-increment-8b-ubuntu22/summary.json'
          ).read_text())
          assert summary['outcome'] == 'FINITE_COMPRESSION_INCREMENT_8B_GUARD_FRONT_ONE_STEP_PASS'
          assert summary['solver_step_after'] == 494
          assert summary['increment_8b_one_step_gate_passed'] is True
          assert summary['root_authority_comparison_passed'] is True
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: u3-b2-a1-finite-compression-increment-8b-ubuntu22-${{ github.run_id }}
          path: artifacts/u3-b2-a1-finite-compression-increment-8b-ubuntu22
          if-no-files-found: warn
