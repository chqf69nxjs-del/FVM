name: Agent U3 B2 Adapter Record Sync Push Executor
# generation: 2 — explicit push trigger

on:
  push:
    branches: [agent/u3-b2-adapter-record-sync]
    paths:
      - ".github/workflows/agent-u3-b2-adapter-record-sync-push.yml"

permissions:
  contents: write

concurrency:
  group: agent-u3-b2-adapter-record-sync-push
  cancel-in-progress: true

jobs:
  synchronize-records:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Checkout synchronization branch
        uses: actions/checkout@v7
        with:
          ref: agent/u3-b2-adapter-record-sync
          fetch-depth: 0

      - name: Extract section-aware synchronizer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path(
              ".github/workflows/agent-u3-b2-adapter-record-sync-pr-trigger.yml"
          ).read_text(encoding="utf-8")
          opening = "          python - <<'PY'\n"
          closing = "\n          PY\n"
          start = source.index(opening) + len(opening)
          end = source.index(closing, start)
          lines = source[start:end].splitlines()
          extractor = "\n".join(
              line[10:] if line.startswith("          ") else line for line in lines
          ) + "\n"
          Path("/tmp/extract_u3_b2_sync.py").write_text(
              extractor, encoding="utf-8"
          )
          compile(extractor, "/tmp/extract_u3_b2_sync.py", "exec")
          print(f"extractor_lines={len(lines)}")
          PY

      - name: Apply and inspect central-record synchronization
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python /tmp/extract_u3_b2_sync.py
          python /tmp/u3_b2_adapter_record_sync.py
          git diff --check
          python - <<'PY'
          import subprocess

          expected = {
              ".github/workflows/agent-u3-b2-adapter-record-sync-bootstrap.yml",
              ".github/workflows/agent-u3-b2-adapter-record-sync-pr-trigger.yml",
              ".github/workflows/agent-u3-b2-adapter-record-sync-push.yml",
              "docs/verification/MASTER_VERIFICATION_INDEX.md",
              "docs/verification/stage7_current_gate_snapshot.md",
              "docs/verification/stage7_execution_log.md",
          }
          actual = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          assert actual == expected, (sorted(actual), sorted(expected))
          PY

      - name: Commit clean documentation-only synchronization
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/agent-u3-b2-adapter-record-sync-bootstrap.yml \
            .github/workflows/agent-u3-b2-adapter-record-sync-pr-trigger.yml \
            .github/workflows/agent-u3-b2-adapter-record-sync-push.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Synchronize U3 B2 Adapter authority records"
          git push origin HEAD:agent/u3-b2-adapter-record-sync
