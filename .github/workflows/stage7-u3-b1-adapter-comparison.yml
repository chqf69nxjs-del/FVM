name: Stage 7 U3 B1 Adapter Comparison

on:
  pull_request:
    paths:
      - "src/liquid_gas_transient/u3_b1_critical_state_adapter.py"
      - "tests/test_stage7_u3_b1_critical_state_adapter.py"
      - "tests/conftest.py"
      - "pyproject.toml"
      - "docs/verification/stage7_u3_b1_adapter_comparison.md"
      - "docs/verification/stage7_u3_b1_critical_state_contract_v1.json"
      - ".github/workflows/stage7-u3-b1-adapter-comparison.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage7-u3-b1-adapter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: src
  PYTHONDONTWRITEBYTECODE: "1"
  MPLBACKEND: Agg
  ANALYSIS_SOURCE_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  REFERENCE_RESOLUTION_MODE: "recomputed_from_pinned_source_sha"
  REFERENCE_SOURCE_GIT_SHA: "c7c25efae0e53a8b5f5ed164f9135238c6e005e0"
  REFERENCE_WORKFLOW_RUN_ID: "31051697864"
  REFERENCE_ARTIFACT_ID: "8951665941"
  REFERENCE_ARTIFACT_ZIP_SHA256: "b3ba4ed848c9d01a9c1232efa8fa97b46e80bf61185c151f2f6acde6440a4f94"
  U3_B1_REQUIRE_REFERENCE_ARTIFACT: "1"

jobs:
  u3-b1-adapter-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"

      - name: Install fixed dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'numpy==2.5.1' \
            'matplotlib==3.11.1' \
            'pytest==9.1.1' \
            'CoolProp==8.0.0'

      - name: Assert pristine checkout
        run: |
          echo "checkout_sha=$(git rev-parse HEAD)"
          status="$(git status --porcelain=v1 --untracked-files=all)"
          printf 'pre_execution_git_status=%s\n' "$status"
          test -z "$status"

      - name: Recreate and verify authoritative B1 reference from pinned source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reference_archive="${RUNNER_TEMP}/u3-b1-reference-source-${REFERENCE_SOURCE_GIT_SHA}.tar.gz"
          reference_source_root="${RUNNER_TEMP}/u3-b1-reference-source"
          reference_dir="${RUNNER_TEMP}/u3-b1-reference-artifact"
          rm -rf "$reference_archive" "$reference_source_root" "$reference_dir"

          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/tarball/${REFERENCE_SOURCE_GIT_SHA}" \
            > "$reference_archive"
          mkdir -p "$reference_source_root"
          tar -xzf "$reference_archive" -C "$reference_source_root"
          reference_source="$(
            find "$reference_source_root" \
              -mindepth 1 -maxdepth 1 -type d -print -quit
          )"
          test -n "$reference_source"
          test -f "$reference_source/src/liquid_gas_transient/u3_b1_critical_state_authoritative.py"
          test -f "$reference_source/docs/verification/stage7_u3_b1_critical_state_contract_v1.json"

          (
            cd "$reference_source"
            GITHUB_SHA="$REFERENCE_SOURCE_GIT_SHA" \
            PYTHONPATH=src \
            PYTHONDONTWRITEBYTECODE=1 \
            MPLBACKEND=Agg \
              python -m liquid_gas_transient.u3_b1_critical_state_authoritative \
                --contract docs/verification/stage7_u3_b1_critical_state_contract_v1.json \
                --output-dir "$reference_dir" \
                --source-git-sha "$REFERENCE_SOURCE_GIT_SHA"
          )

          REFERENCE_DIR="$reference_dir" python - <<'PY'
          import hashlib
          import json
          import math
          import os
          from pathlib import Path

          target = Path(os.environ["REFERENCE_DIR"])
          required = {
              "summary.json",
              "benchmark_contract.json",
              "conservative_transfer_table.csv",
              "critical_state_summary.json",
              "artifact_sha256.txt",
          }
          assert required <= {path.name for path in target.iterdir()}

          summary = json.loads((target / "summary.json").read_text(encoding="utf-8"))
          assert summary["schema_version"] == "stage7_u3_b1_independent_reference_v1"
          assert summary["case_count"] == 17
          assert summary["physical_case_count"] == 12
          assert summary["guard_case_count"] == 5
          assert summary["success_count"] == 12
          assert summary["guard_count"] == 5
          assert summary["all_expected_outcomes_match"] is True
          assert summary["all_locked_checks_passed"] is True
          assert summary["provenance"]["source_git_sha"] == os.environ["REFERENCE_SOURCE_GIT_SHA"]
          assert summary["provenance"]["checkout_git_sha"] == os.environ["REFERENCE_SOURCE_GIT_SHA"]
          assert summary["provenance"]["property_backend"] == "CoolProp"
          assert summary["provenance"]["property_backend_version"] == "8.0.0"

          critical = json.loads(
              (target / "critical_state_summary.json").read_text(encoding="utf-8")
          )
          assert set(critical) == {"GAS_CRITICAL|Cd=0.4", "GAS_CRITICAL|Cd=0.8"}
          for row in critical.values():
              assert math.isclose(
                  float(row["pressure_ratio"]),
                  0.5468849014513074,
                  rel_tol=0.0,
                  abs_tol=1.0e-13,
              )
              assert math.isclose(
                  float(row["pressure_pa"]),
                  546884.9014513075,
                  rel_tol=0.0,
                  abs_tol=1.0e-7,
              )
              assert math.isclose(
                  float(row["ideal_mass_flux_kg_m2_s"]),
                  2757.298423561355,
                  rel_tol=0.0,
                  abs_tol=1.0e-9,
              )
              assert float(row["final_bracket_width_pa"]) <= 1.0
              assert float(row["peak_prominence_relative"]) >= 1.0e-8
          assert math.isclose(
              float(critical["GAS_CRITICAL|Cd=0.8"]["effective_mass_flux_kg_m2_s"]),
              2205.838738849084,
              rel_tol=0.0,
              abs_tol=1.0e-9,
          )
          assert math.isclose(
              float(critical["GAS_CRITICAL|Cd=0.4"]["effective_mass_flux_kg_m2_s"]),
              1102.919369424542,
              rel_tol=0.0,
              abs_tol=1.0e-9,
          )

          manifest = {}
          for line in (target / "artifact_sha256.txt").read_text(encoding="utf-8").splitlines():
              digest, name = line.split("  ", 1)
              manifest[name] = digest
          for name, expected in manifest.items():
              path = target / name
              assert path.is_file(), name
              assert hashlib.sha256(path.read_bytes()).hexdigest() == expected, name
          PY

          echo "U3_B1_REFERENCE_ARTIFACT_DIR=$reference_dir" >> "$GITHUB_ENV"

      - name: Assert adapter-reference implementation independence
        run: |
          ! grep -E \
            'from .*u3_b1_critical_state_reference|import .*u3_b1_critical_state_reference' \
            src/liquid_gas_transient/u3_b1_critical_state_adapter.py

      - name: Execute verification-only adapter comparison
        run: |
          output="artifacts/stage7-u3-b1-adapter-comparison"
          rm -rf "$output"
          python -m liquid_gas_transient.u3_b1_critical_state_adapter \
            --contract docs/verification/stage7_u3_b1_critical_state_contract_v1.json \
            --reference-artifact-dir "$U3_B1_REFERENCE_ARTIFACT_DIR" \
            --reference-artifact-id "$REFERENCE_ARTIFACT_ID" \
            --reference-artifact-zip-sha256 "$REFERENCE_ARTIFACT_ZIP_SHA256" \
            --reference-resolution-mode "$REFERENCE_RESOLUTION_MODE" \
            --reference-source-git-sha "$REFERENCE_SOURCE_GIT_SHA" \
            --output-dir "$output" \
            --source-git-sha "$ANALYSIS_SOURCE_GIT_SHA"
          tracked_status="$(git status --porcelain=v1 --untracked-files=no)"
          printf 'post_execution_tracked_git_status=%s\n' "$tracked_status"
          test -z "$tracked_status"

      - name: Inspect adapter comparison artifact
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          import os
          from pathlib import Path

          target = Path("artifacts/stage7-u3-b1-adapter-comparison")
          expected_files = {
              "summary.json",
              "benchmark_contract.json",
              "adapter_cases.csv",
              "reference_adapter_comparison.csv",
              "locked_checks.csv",
              "guard_outcomes.csv",
              "conservative_transfer_comparison.csv",
              "critical_state_summary.json",
              "report.md",
              "mass_flux_reference_vs_adapter.png",
              "critical_pressure_reference_vs_adapter.png",
              "reference_adapter_residuals.png",
              "artifact_sha256.txt",
          }
          assert {path.name for path in target.iterdir()} == expected_files

          summary = json.loads((target / "summary.json").read_text(encoding="utf-8"))
          assert summary["schema_version"] == "stage7_u3_b1_critical_state_adapter_comparison_v1"
          assert summary["reference_resolution_mode"] == os.environ["REFERENCE_RESOLUTION_MODE"]
          assert summary["reference_source_git_sha"] == os.environ["REFERENCE_SOURCE_GIT_SHA"]
          assert summary["reference_artifact_provenance_role"] == "historical_authoritative_evidence"
          assert summary["reference_artifact_id"] == int(os.environ["REFERENCE_ARTIFACT_ID"])
          assert summary["reference_artifact_zip_sha256"] == os.environ["REFERENCE_ARTIFACT_ZIP_SHA256"]
          assert summary["case_count"] == 17
          assert summary["success_count"] == 12
          assert summary["guard_count"] == 5
          assert summary["comparison_count"] == 77
          assert summary["comparison_pass_count"] == 77
          assert summary["all_formal_outcomes_match"] is True
          assert summary["all_reference_adapter_comparisons_passed"] is True
          assert summary["all_locked_adapter_checks_passed"] is True
          assert summary["exact_zero_identities_retained"] is True
          assert summary["b0_limit_passed"] is True
          assert summary["unchoked_ordering_passed"] is True
          assert summary["below_critical_plateau_passed"] is True
          assert summary["area_scaling_passed"] is True
          assert summary["Cd_scaling_passed"] is True
          assert summary["critical_pressure_Cd_independence_passed"] is True
          assert summary["critical_state_keys"] == ["GAS_CRITICAL|Cd=0.4", "GAS_CRITICAL|Cd=0.8"]
          assert summary["static_pressure_force_included"] is False
          assert summary["production_fvm_connected"] is False
          assert summary["u3_b1_contract_locked"] is True
          assert summary["u3_b1_reference_implemented"] is True
          assert summary["u3_b1_adapter_implemented"] is True
          assert summary["u3_b1_component_benchmark_execution_complete"] is True
          assert summary["u3_b1_component_benchmark_accepted"] is True
          assert summary["physical_discharge_boundary_approved"] is False
          assert summary["two_phase_critical_discharge_accuracy_approved"] is False
          assert summary["integrated_blowdown_model_approved"] is False
          assert summary["physical_validation"] is False
          assert summary["design_use_acceptance"] is False
          assert summary["production_hem_activation_approved"] is False
          assert summary["provenance"]["source_git_sha"] == os.environ["ANALYSIS_SOURCE_GIT_SHA"]
          assert summary["provenance"]["property_backend"] == "CoolProp"
          assert summary["provenance"]["property_backend_version"] == "8.0.0"

          report = (target / "report.md").read_text(encoding="utf-8")
          assert "property backend: CoolProp 8.0.0" in report
          assert "reference resolution: recomputed_from_pinned_source_sha" in report
          assert f"pinned reference source SHA: {os.environ['REFERENCE_SOURCE_GIT_SHA']}" in report

          with (target / "reference_adapter_comparison.csv").open(
              newline="", encoding="utf-8"
          ) as handle:
              rows = list(csv.DictReader(handle))
          assert len(rows) == 77
          assert all(row["formal_outcome_match"] == "True" for row in rows)
          assert all(row["comparison_passed"] == "True" for row in rows)
          assert sum(row["measure"] == "critical_pressure_pa" for row in rows) == 9

          critical = json.loads(
              (target / "critical_state_summary.json").read_text(encoding="utf-8")
          )
          expected_critical_keys = {"GAS_CRITICAL|Cd=0.4", "GAS_CRITICAL|Cd=0.8"}
          assert set(critical["adapter"]) == expected_critical_keys
          assert set(critical["reference"]) == expected_critical_keys

          manifest = {}
          for line in (target / "artifact_sha256.txt").read_text(encoding="utf-8").splitlines():
              digest, name = line.split("  ", 1)
              manifest[name] = digest
          assert set(manifest) == expected_files - {"artifact_sha256.txt"}
          for name, expected in manifest.items():
              actual = hashlib.sha256((target / name).read_bytes()).hexdigest()
              assert actual == expected, name
          PY

      - name: Compile and diff checks
        run: |
          python -m compileall -q src tests
          git diff --check

      - name: Run dedicated adapter tests
        run: |
          python -m pytest -q \
            tests/test_stage7_u3_b1_critical_state_adapter.py \
            --strict-markers \
            --junitxml=u3-b1-adapter-dedicated.xml

      - name: Run related U3 regressions
        run: |
          python -m pytest -q \
            tests/test_stage7_u3_b0_discharge_reference.py \
            tests/test_stage7_u3_b0_discharge_adapter.py \
            tests/test_stage7_u3_b1_critical_state_contract.py \
            tests/test_stage7_u3_b1_critical_state_reference.py \
            tests/test_stage7_u3_b1_critical_state_authoritative.py \
            tests/test_stage7_u3_b1_critical_state_adapter.py \
            --strict-markers \
            --junitxml=related-stage7.xml

      - name: Run full repository tests
        run: |
          python -m pytest -q \
            --strict-markers \
            --junitxml=full-repository.xml

      - name: Assert authoritative JUnit is clean
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          for name in (
              "u3-b1-adapter-dedicated.xml",
              "related-stage7.xml",
              "full-repository.xml",
          ):
              root = ET.parse(Path(name)).getroot()
              suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
              totals = {
                  key: sum(int(s.attrib.get(key, 0)) for s in suites)
                  for key in ("tests", "skipped", "failures", "errors")
              }
              print(name, totals)
              assert totals["skipped"] == 0
              assert totals["failures"] == 0
              assert totals["errors"] == 0
          PY

      - name: Upload U3 B1 adapter comparison evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stage7-u3-b1-adapter-${{ github.run_id }}
          path: |
            artifacts/stage7-u3-b1-adapter-comparison
            u3-b1-adapter-dedicated.xml
            related-stage7.xml
            full-repository.xml
          if-no-files-found: warn
