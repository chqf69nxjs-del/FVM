name: Agent U3 B2 A1 Working Tool v0-B

on:
  workflow_dispatch:
  push:
    branches: [agent/u3-b2-a1-working-tool-v0-b]
    paths:
      - "src/liquid_gas_transient/working_tool/operation_policy.py"
      - "src/liquid_gas_transient/working_tool/output_size.py"
      - "tests/test_working_tool_v0_b_operation_policy.py"
      - "docs/verification/stage7_u3_b2_a1_working_tool_v0_b_output_storage_operation_policy_spec.md"
      - ".github/workflows/agent-u3-b2-a1-working-tool-v0-b.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: agent-u3-b2-a1-working-tool-v0-b
  cancel-in-progress: true

jobs:
  a1-operation-policy:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"

      - name: Install fixed dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            'numpy==2.5.1' \
            'CoolProp==8.0.0' \
            'pytest==9.1.1'

      - name: Verify A1 source scope and protected v0-A paths
        shell: bash
        env:
          V0_A_BASELINE: ec700d91d136469161be6dc1d1e1f1b6513798bb
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --check "${V0_A_BASELINE}" HEAD
          git diff --exit-code "${V0_A_BASELINE}" HEAD -- \
            src/liquid_gas_transient/working_tool/__init__.py \
            src/liquid_gas_transient/working_tool/application.py \
            src/liquid_gas_transient/working_tool/backend.py \
            src/liquid_gas_transient/working_tool/case_io.py \
            src/liquid_gas_transient/working_tool/case_schema.py \
            src/liquid_gas_transient/working_tool/output.py \
            src/liquid_gas_transient/working_tool/results.py \
            src/liquid_gas_transient/working_tool/runtime.py \
            tools/working_tool/run_working_tool_v0_a.py
          changed="$(git diff --name-only "${V0_A_BASELINE}" HEAD)"
          forbidden="$(printf '%s\n' "${changed}" | grep -Ev '^(docs/verification/stage7_u3_b2_a1_working_tool_v0_b_output_storage_operation_policy_spec\.md$|src/liquid_gas_transient/working_tool/(operation_policy|output_size)\.py$|tests/test_working_tool_v0_b_operation_policy\.py$|\.github/workflows/agent-u3-b2-a1-working-tool-v0-b\.yml$)' || true)"
          test -z "${forbidden}" || {
            printf 'unexpected changed paths:\n%s\n' "${forbidden}"
            exit 1
          }

      - name: Compile A1 sources and tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m py_compile \
            src/liquid_gas_transient/working_tool/operation_policy.py \
            src/liquid_gas_transient/working_tool/output_size.py \
            tests/test_working_tool_v0_b_operation_policy.py

      - name: Run A1 focused tests
        shell: bash
        run: |
          set -euo pipefail
          output=artifacts/u3-b2-a1-working-tool-v0-b-a1
          mkdir -p "${output}"
          PYTHONPATH=src python -m pytest -q \
            tests/test_working_tool_v0_b_operation_policy.py \
            --junitxml="${output}/pytest.xml" \
            | tee "${output}/pytest.log"

      - name: Record focused evidence
        if: always()
        shell: bash
        env:
          V0_A_BASELINE: ec700d91d136469161be6dc1d1e1f1b6513798bb
        run: |
          set -euo pipefail
          output=artifacts/u3-b2-a1-working-tool-v0-b-a1
          mkdir -p "${output}"
          printf '%s\n' "${GITHUB_SHA}" > "${output}/source_git_sha.txt"
          printf '%s\n' "A1_FOCUSED_NON_AUTHORITATIVE" > "${output}/evidence_class.txt"
          git diff --name-only "${V0_A_BASELINE}" HEAD \
            > "${output}/changed_paths.txt"
          (
            cd "${output}"
            find . -type f ! -name artifact_sha256.txt -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              > artifact_sha256.txt
          )

      - name: Upload A1 focused evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: u3-b2-a1-working-tool-v0-b-a1-${{ github.run_id }}
          path: artifacts/u3-b2-a1-working-tool-v0-b-a1
          if-no-files-found: error
