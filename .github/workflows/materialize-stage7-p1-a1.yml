name: Materialize Stage 7 P1-A1 Source Bundle

on:
  push:
    branches:
      - agent/stage7-p1-pressure-phase-relationship-a1
    paths:
      - 'tools/p1_a1_payload_*.txt'
      - 'tools/materialize_stage7_p1_a1.py'
      - '.github/workflows/materialize-stage7-p1-a1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-stage7-p1-a1
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Materialize reviewed A1 bundle
        run: |
          set -euo pipefail
          python tools/materialize_stage7_p1_a1.py
          python -m compileall -q \
            src/liquid_gas_transient/hem_pipeline_pressure_phase_relationship.py \
            tests/test_stage7_p1_pressure_phase_relationship.py
          git diff --check
          test ! -e tools/p1_a1_payload_01.txt
          test ! -e tools/p1_a1_payload_02.txt
          test ! -e tools/p1_a1_payload_03.txt
          test ! -e tools/materialize_stage7_p1_a1.py
          test ! -e .github/workflows/materialize-stage7-p1-a1.yml
          test -f src/liquid_gas_transient/hem_pipeline_pressure_phase_relationship.py
          test -f tests/test_stage7_p1_pressure_phase_relationship.py
          test -f docs/verification/stage7_p1_pressure_phase_relationship_increment_a1.md
          test -f .github/workflows/stage7-p1-pressure-phase-relationship-a1.yml
      - name: Commit materialized A1 increment
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add P1 A1 pressure-phase relationship analysis'
          git push origin HEAD:agent/stage7-p1-pressure-phase-relationship-a1
