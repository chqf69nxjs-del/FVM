name: Stage 7 Pipeline CFL Sensitivity Contract

on:
  push:
    branches:
      - agent/stage7-pipeline-cfl-sensitivity-contract
  pull_request:
  workflow_dispatch:

env:
  PYTHONPATH: src

jobs:
  validate-cfl-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install contract dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e . pytest
      - name: Compile and diff checks
        run: |
          python -m compileall -q src tests
          git diff --check
      - name: Run dependency-free CFL contract tests
        run: |
          python -m pytest -q \
            tests/test_stage7_lco2_hem_pipeline_cfl_sensitivity_contract.py \
            --strict-markers \
            --junitxml=cfl-contract.xml
      - name: Inspect machine-readable contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('docs/verification/stage7_lco2_hem_pipeline_cfl_sensitivity_contract_v1.json')
          contract = json.loads(path.read_text(encoding='utf-8'))
          assert contract['status'] == 'CONTRACT_IMPLEMENTED_EXECUTION_NOT_YET_ACCEPTED'
          assert contract['fixed_matrix']['n_cells'] == 128
          assert contract['fixed_matrix']['cfl_values'] == [0.10, 0.05, 0.025]
          assert contract['fixed_matrix']['maximum_steps'] == {
              '0.100': 8000,
              '0.050': 16000,
              '0.025': 32000,
          }
          assert contract['execution_status']['low_cfl_matrix_executed'] is False
          assert contract['approval_boundary']['CFL_independent_crossing_verified'] is False
          PY
      - name: Assert no skipped, failed, or errored contract tests
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('cfl-contract.xml').getroot()
          suites = [root] if root.tag == 'testsuite' else list(root.findall('testsuite'))
          values = {
              key: sum(int(s.attrib.get(key, 0)) for s in suites)
              for key in ('tests', 'skipped', 'failures', 'errors')
          }
          print(values)
          assert values['skipped'] == 0
          assert values['failures'] == 0
          assert values['errors'] == 0
          PY
      - name: Upload contract evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stage7-pipeline-cfl-contract-${{ github.run_id }}
          path: |
            docs/verification/stage7_lco2_hem_pipeline_cfl_sensitivity_contract_v1.json
            docs/verification/stage7_lco2_hem_pipeline_cfl_sensitivity_implementation_status.md
            cfl-contract.xml
          if-no-files-found: warn
