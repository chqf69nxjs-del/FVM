name: Stage 7 P2 HNE Acoustic Authority Gate

on:
  push:
    branches:
      - agent/stage7-p2-hne-acoustic-authority-gate
  pull_request:
    branches:
      - agent/stage7-p2-hne-finite-relaxation-dispersion-a2-4-4
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage7-p2-hne-acoustic-authority-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acoustic-authority-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
      ANALYSIS_SOURCE_GIT_SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.5.2' 'pytest==9.1.1'

      - name: Assert source and change envelope
        run: |
          set -euo pipefail
          source_sha="b844741da4775f2e2970cbbe92a6b8be35fd3c79"
          test "$(git rev-parse HEAD)" = "$ANALYSIS_SOURCE_GIT_SHA"
          git cat-file -e "${source_sha}^{commit}"
          git diff --name-only "$source_sha" HEAD | sort > /tmp/actual.txt
          printf '%s\n' \
            '.github/workflows/stage7-p2-hne-acoustic-authority-gate.yml' \
            'docs/verification/stage7_p2_hne_acoustic_authority_gate.md' \
            'src/liquid_gas_transient/hne_acoustic_authority_analysis.py' \
            'src/liquid_gas_transient/hne_acoustic_authority_artifacts.py' \
            'src/liquid_gas_transient/hne_acoustic_authority_gate.py' \
            'src/liquid_gas_transient/hne_acoustic_authority_jacobian.py' \
            'src/liquid_gas_transient/hne_acoustic_authority_types.py' \
            'tests/test_stage7_p2_hne_acoustic_authority_gate.py' \
            | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile and clean
        run: |
          set -euo pipefail
          python -m compileall -q src tests
          git diff --check
          find src tests -type d -name __pycache__ -prune -exec rm -rf {} +
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Generate authority-gate evidence
        run: |
          python -m liquid_gas_transient.hne_acoustic_authority_gate \
            --output-dir artifacts/stage7/p2-hne-acoustic-authority-gate

      - name: Gate authority evidence
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          p = Path('artifacts/stage7/p2-hne-acoustic-authority-gate')
          expected = {
              'summary.json',
              'case_summary.csv',
              'jacobian_eigenvalues.csv',
              'operator_report.md',
              'manifest.json',
          }
          assert {x.name for x in p.iterdir()} == expected
          s = json.loads((p / 'summary.json').read_text())
          m = json.loads((p / 'manifest.json').read_text())
          with (p / 'case_summary.csv').open(newline='') as f:
              cases = list(csv.DictReader(f))
          with (p / 'jacobian_eigenvalues.csv').open(newline='') as f:
              eigen = list(csv.DictReader(f))

          assert s['source_a2_4_4']['head_sha'] == 'b844741da4775f2e2970cbbe92a6b8be35fd3c79'
          assert s['source_a2_4_4']['workflow_run_id'] == 32626761290
          assert s['source_a2_4_4']['artifact_id'] == 9489909447
          assert s['source_a2_4_4']['artifact_sha256'] == '0164a54af61696aa6c955a4f5854589f4ad9b164c095d914e3f30446c865a4b2'
          assert s['source_a2_4_4']['analysis_sha256'] == '1357f0c768df7834a84d8c3d00dbb27e7524d7c9df9c6e1e744b23aca3b326cd'
          assert s['runtime_provenance']['analysis_source_git_sha'] == s['runtime_provenance']['checkout_git_sha']
          assert s['runtime_provenance']['git_status_porcelain'] == ''
          assert s['acoustic_authority_gate_passed'] is True
          assert s['failed_gates'] == []
          assert all(s['gate_results'].values())
          assert len(cases) == 12
          assert len(eigen) == 96
          assert s['legacy_a2_equilibrium_map']['authority'] == 'QUARANTINED_NOT_USED_FOR_P2_A3_1_CANDIDATE'
          assert s['legacy_a2_equilibrium_map']['maximum_qeq_difference_on_equilibrium_cases'] > 1.0e-2
          assert all(float(row['candidate_frozen_c2_m2_s2']) > 0.0 for row in cases)
          assert all(float(row['jacobian_relative_error']) <= 1.0e-5 for row in cases)
          assert all(float(row['numerical_eigenvalue_max_abs_error']) <= 1.0e-3 for row in cases)
          assert all(row['all_eigenvalues_real'] == 'True' for row in cases)
          assert all(int(row['repeated_velocity_mode_nullity']) == 2 for row in cases)
          assert s['formal_status']['acoustic_authority_gate_passed'] is True
          assert s['formal_status']['limited_p2_a3_1_implementation_authorized'] is True
          assert s['formal_status']['hydrodynamic_coupling_implemented'] is False
          assert s['authority_grant']['candidate_pressure_to_interior_euler_flux_in_p2_a3_1'] is True
          assert s['authority_grant']['candidate_frozen_c_to_interior_rusanov_in_p2_a3_1'] is True
          assert s['authority_grant']['candidate_frozen_c_to_interior_cfl_in_p2_a3_1'] is True
          assert s['authority_grant']['equilibrium_c_to_solver'] is False
          assert s['authority_grant']['finite_relaxation_phase_speed_to_solver'] is False
          assert s['authority_grant']['hne_boundary_characteristics'] is False
          assert s['authority_grant']['hne_critical_discharge'] is False
          assert all(value is False for value in s['current_solver_effect'].values())
          assert s['formal_status']['physically_validated'] is False
          assert s['formal_status']['design_use_accepted'] is False
          assert s['formal_status']['production_approved'] is False
          assert m['analysis_sha256'] == s['analysis_sha256']
          assert m['acoustic_authority_gate_passed'] is True
          assert m['limited_p2_a3_1_implementation_authorized'] is True
          assert m['hydrodynamic_coupling_active'] is False
          print('analysis_sha256=' + s['analysis_sha256'])
          PY

      - name: Run focused tests
        run: |
          python -m pytest -q \
            tests/test_stage7_p2_hne_acoustic_authority_gate.py \
            --strict-markers --junitxml=p2-acoustic-authority-gate-focused.xml

      - name: Gate JUnit and tracked checkout
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('p2-acoustic-authority-gate-focused.xml').getroot()
          suites = [root] if root.tag == 'testsuite' else list(root.findall('testsuite'))
          totals = {
              key: sum(int(suite.attrib.get(key, 0)) for suite in suites)
              for key in ('tests', 'skipped', 'failures', 'errors')
          }
          assert totals == {'tests': 10, 'skipped': 0, 'failures': 0, 'errors': 0}
          print(totals)
          PY
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Upload evidence
        uses: actions/upload-artifact@v7
        with:
          name: stage7-p2-hne-acoustic-authority-gate-${{ github.run_id }}
          path: |
            artifacts/stage7/p2-hne-acoustic-authority-gate
            p2-acoustic-authority-gate-focused.xml
          if-no-files-found: error
          compression-level: 6
