name: Agent U3 B2 Adapter Bootstrap

on:
  push:
    branches:
      - agent/u3-b2-fvm-adapter-face-one-step
    paths:
      - ".agent_payloads/**"
      - ".github/workflows/agent-u3-b2-adapter-bootstrap.yml"
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - ".agent_payloads/**"
      - ".github/workflows/agent-u3-b2-adapter-bootstrap.yml"

permissions:
  contents: write

concurrency:
  group: agent-u3-b2-adapter-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout bootstrap commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Materialize verified implementation
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p src/liquid_gas_transient tests docs/verification .github/workflows

          python - <<'PY'
          from __future__ import annotations

          import base64
          import gzip
          import hashlib
          from pathlib import Path

          payloads = {
              ".agent_payloads/u3_b2_fvm_discharge_adapter.py.gz": (
                  "src/liquid_gas_transient/u3_b2_fvm_discharge_adapter.py",
                  "5c333c6c4ca035332276a16cbf05d4fa68f3ad99a2b9768ff3fee6a0a0b98d9a",
              ),
              ".agent_payloads/u3_b2_fvm_discharge_adapter_authoritative.py.gz": (
                  "src/liquid_gas_transient/u3_b2_fvm_discharge_adapter_authoritative.py",
                  "ca51efdbea54ee09c012ba45dc702f39e175ecb5fdc03632db78f8bba267a7bc",
              ),
              ".agent_payloads/solver.py.gz": (
                  "src/liquid_gas_transient/solver.py",
                  "cb0b9745efcae9704edbba71b994ee77b6de4ca3935dc643e3dc9ba79b1282d8",
              ),
              ".agent_payloads/test_stage7_u3_b2_fvm_discharge_adapter.py.gz": (
                  "tests/test_stage7_u3_b2_fvm_discharge_adapter.py",
                  "1f9df44251110115b7d76fd9c0602e6db4f85acc5791f68fc8bdc299e4c262e2",
              ),
              ".agent_payloads/stage7_u3_b2_fvm_discharge_adapter.md.gz": (
                  "docs/verification/stage7_u3_b2_fvm_discharge_adapter.md",
                  "ecb99efc4c44e13a683bd9046ba8a6e40cab79b320614654e8de225afb801c48",
              ),
              ".agent_payloads/stage7-u3-b2-fvm-adapter-face-one-step.yml.gz": (
                  ".github/workflows/stage7-u3-b2-fvm-adapter-face-one-step.yml",
                  "684157cdf137fac7bb50ce87d99b817eadc8aad28fd7079b8b1cdc3b5cb98ea8",
              ),
          }

          def decode_payload(source: Path) -> tuple[bytes, str]:
              raw = source.read_bytes()
              attempts: list[tuple[str, bytes]] = [("binary-gzip", raw)]
              compact = b"".join(raw.split())
              try:
                  decoded = base64.b64decode(compact, validate=True)
              except Exception:
                  decoded = b""
              if decoded:
                  attempts.append(("base64-wrapped-gzip", decoded))
              failures: list[str] = []
              for mode, candidate in attempts:
                  try:
                      return gzip.decompress(candidate), mode
                  except Exception as exc:
                      failures.append(f"{mode}: {type(exc).__name__}: {exc}")
              prefix = raw[:24].hex()
              raise RuntimeError(
                  f"cannot decode {source}; bytes={len(raw)} prefix={prefix}; "
                  + " | ".join(failures)
              )

          for source_name, (target_name, expected_sha) in payloads.items():
              source = Path(source_name)
              target = Path(target_name)
              content, mode = decode_payload(source)
              actual_sha = hashlib.sha256(content).hexdigest()
              if actual_sha != expected_sha:
                  raise RuntimeError(
                      f"SHA256 mismatch for {source}: {actual_sha} != {expected_sha}"
                  )
              target.write_bytes(content)
              print(
                  f"materialized {source} -> {target} via {mode}; "
                  f"bytes={len(content)} sha256={actual_sha}"
              )
          PY

          python -m py_compile \
            src/liquid_gas_transient/u3_b2_fvm_discharge_adapter.py \
            src/liquid_gas_transient/u3_b2_fvm_discharge_adapter_authoritative.py \
            src/liquid_gas_transient/solver.py \
            tests/test_stage7_u3_b2_fvm_discharge_adapter.py

          rm -rf .agent_payloads
          rm -f .github/workflows/agent-u3-b2-adapter-bootstrap.yml

          git diff --check
          git status --short

      - name: Commit materialized implementation
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement U3 B2 FVM Adapter face and one-step verification"
          git push origin "HEAD:${TARGET_BRANCH}"
