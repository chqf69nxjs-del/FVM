name: Agent U3 B2 Characteristic Port 2L Over c0

on:
  push:
    branches: [agent/u3-b2-momentum-control-volume-review]
    paths:
      - "tools/verification/u3_b2_characteristic_port_diagnostic.py"
      - "tools/verification/u3_b2_characteristic_port_root_robustness.py"
      - "tools/verification/u3_b2_characteristic_port_root_robustness_v4.py"
      - "tools/verification/u3_b2_characteristic_port_dynamic_short_model.py"
      - "tools/verification/u3_b2_characteristic_port_dynamic_short_hook.py"
      - "tools/verification/u3_b2_characteristic_port_dynamic_short_metrics.py"
      - "tools/verification/u3_b2_characteristic_port_two_l_over_c0.py"
      - ".github/workflows/agent-u3-b2-characteristic-port-two-l-over-c0.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: agent-u3-b2-characteristic-port-two-l-over-c0
  cancel-in-progress: true

env:
  PYTHONPATH: src:tools/verification
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONPYCACHEPREFIX: /tmp/u3-b2-characteristic-two-l-over-c0-pycache
  SOURCE_SHA: ${{ github.sha }}
  GH_TOKEN: ${{ github.token }}

jobs:
  two-l-over-c0:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact model-review source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"

      - name: Install fixed dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            'numpy==2.5.1' \
            'CoolProp==8.0.0'

      - name: Verify review-only source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python -m py_compile \
            tools/verification/u3_b2_characteristic_port_diagnostic.py \
            tools/verification/u3_b2_characteristic_port_root_robustness.py \
            tools/verification/u3_b2_characteristic_port_root_robustness_v4.py \
            tools/verification/u3_b2_characteristic_port_dynamic_short_model.py \
            tools/verification/u3_b2_characteristic_port_dynamic_short_hook.py \
            tools/verification/u3_b2_characteristic_port_dynamic_short_metrics.py \
            tools/verification/u3_b2_characteristic_port_two_l_over_c0.py
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Execute B2-10A evolving-cell A1 full 2L over c0 diagnostic
        shell: bash
        run: |
          set -euo pipefail
          output=artifacts/u3-b2-characteristic-port-two-l-over-c0
          rm -rf "${output}"
          python tools/verification/u3_b2_characteristic_port_two_l_over_c0.py \
            --contract docs/verification/stage7_u3_b2_fvm_discharge_coupling_contract_v1.json \
            --b1-contract docs/verification/stage7_u3_b1_critical_state_contract_v1.json \
            --output-dir "${output}" \
            --source-git-sha "${SOURCE_SHA}"

      - name: Inspect model-review horizon evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import hashlib
          import json
          import os
          from pathlib import Path

          target = Path("artifacts/u3-b2-characteristic-port-two-l-over-c0")
          expected = {
              "summary.json",
              "horizon_steps.csv",
              "report.md",
              "artifact_sha256.txt",
          }
          assert {path.name for path in target.iterdir()} == expected

          summary = json.loads((target / "summary.json").read_text(encoding="utf-8"))
          assert summary["scope"] == (
              "model_review_only_two_l_over_c0_no_contract_or_production_change"
          )
          assert summary["source_git_sha"] == os.environ["SOURCE_SHA"]
          assert summary["two_l_over_c0_horizon_gate_passed"] is True
          assert summary["fixed_method"]["case"] == (
              "B2-10A_FINITE_PIPE_LIQUID_INVENTORY_CLOSURE"
          )
          assert summary["fixed_method"]["horizon_multiplier"] == 2.0
          assert summary["fixed_method"]["cells"] == 32
          assert summary["fixed_method"]["cfl"] == 0.10
          assert summary["fixed_method"]["new_physics_tolerance_introduced"] is False
          case = summary["case_summary"]
          assert case["two_l_over_c0_horizon_case_passed"] is True
          assert case["stop_reason"] is None
          assert case["accepted_steps_completed"] > 4
          assert case["accepted_steps_completed"] <= 10000
          assert case["final_solver_time_s"] >= case["target_two_l_over_c0_time_s"]
          assert case["horizon_fraction_reached"] >= 1.0
          assert case["all_connected_scans_monotone"] is True
          assert case["all_connected_scans_have_one_sign_change"] is True
          assert case["all_roots_subsonic"] is True
          assert case["all_outlet_phases_passed"] is True
          assert case["all_rho_xv_exact_zero"] is True
          assert case["any_reverse_velocity_detected"] is False
          assert case["any_reverse_flow_guard_triggered"] is False
          assert case["acoustic_timing_validation_performed"] is False
          assert summary["formal_state_promoted"] is False
          assert summary["u3_b2_finite_pipe_execution_complete"] is False
          assert summary["single_phase_finite_pipe_coupling_verified"] is False
          assert summary["u3_b2_verification_benchmark_accepted"] is False
          assert summary["physical_validation"] is False
          assert summary["design_use_acceptance"] is False
          assert summary["production_hem_activation_approved"] is False

          with (target / "horizon_steps.csv").open(
              newline="", encoding="utf-8"
          ) as handle:
              rows = list(csv.DictReader(handle))
          assert len(rows) == case["accepted_steps_completed"]
          assert all(row["accepted_step"] == "True" for row in rows)
          assert all(row["step_passed"] == "True" for row in rows)
          assert all(row["guard_status"] == "NOT_TRIGGERED" for row in rows)
          assert all(row["reverse_flow_guard_triggered"] == "False" for row in rows)
          assert all(row["reverse_velocity_detected"] == "False" for row in rows)
          assert all(row["rho_xv_exact_zero"] == "True" for row in rows)
          assert all(row["outlet_phase_passed"] == "True" for row in rows)
          assert all(row["connected_scan_residual_monotone"] == "True" for row in rows)
          assert all(row["connected_scan_sign_change_count"] == "1" for row in rows)
          assert all(0.0 <= float(row["root_mach"]) < 1.0 for row in rows)
          assert all(0 <= int(row["halving_count"]) <= 12 for row in rows)
          assert rows[-1]["reached_two_way_two_l_over_c0"] == "True"

          manifest = {}
          for line in (target / "artifact_sha256.txt").read_text(
              encoding="utf-8"
          ).splitlines():
              digest, name = line.split("  ", 1)
              manifest[name] = digest
          assert set(manifest) == expected - {"artifact_sha256.txt"}
          for name, digest in manifest.items():
              assert hashlib.sha256((target / name).read_bytes()).hexdigest() == digest
          PY

      - name: Upload model-review horizon evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: u3-b2-characteristic-port-two-l-over-c0-${{ github.run_id }}
          path: artifacts/u3-b2-characteristic-port-two-l-over-c0
          if-no-files-found: warn

      - name: Record horizon diagnostic receipt
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          body="$(cat <<EOF
          ## U3 B2 A1 B2-10A full 2L/c0 horizon receipt

          \`\`\`text
          source:
          ${SOURCE_SHA}

          workflow run:
          ${GITHUB_RUN_ID}

          job status:
          ${JOB_STATUS}
          \`\`\`

          MODEL_REVIEW_ONLY. B2-10A was advanced with the evolving-cell A1 characteristic-compatible pipe-side port to the nominal full \`2L/c0\` horizon. The run retains the existing root, conservation, phase, energy-decomposition, reverse-flow, and restriction-reaction checks. Probe series are observation-only and do not constitute acoustic timing validation. No B1/B2 Contract, physics tolerance, production Adapter, solver, finite-pipe formal state, Physical Validation, design-use status, or production activation was changed.
          EOF
          )"
          gh api "repos/${GITHUB_REPOSITORY}/issues/135/comments" -f body="${body}" >/dev/null
