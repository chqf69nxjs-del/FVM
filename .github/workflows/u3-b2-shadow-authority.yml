name: U3 B2 Shadow Authority Exact Source

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [agent/u3-b2-shadow-base]
    paths:
      - ".github/workflows/u3-b2-shadow-authority.yml"

permissions:
  contents: read

concurrency:
  group: u3-b2-shadow-authority-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PYTHONPATH: src
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONPYCACHEPREFIX: /tmp/u3-b2-shadow-pycache
  MPLBACKEND: Agg
  SOURCE_SHA: 732b7259ac3738c47f7eb7cbd23d8e49195a0d7b
  REFERENCE_SOURCE_GIT_SHA: 0e2c8188961175b3c2cd56836296e713735bf8d9
  B1_REFERENCE_SOURCE_GIT_SHA: c7c25efae0e53a8b5f5ed164f9135238c6e005e0
  B1_ADAPTER_SOURCE_GIT_SHA: 5939f152180fbc6ce9a638eeca670b34e1a6650f
  REFERENCE_ARTIFACT_ID: "9007750537"
  REFERENCE_ARTIFACT_ZIP_SHA256: 1816e60920052391cb9ffde9242597b56571c9ed113c60ece8aa9f32cdb8c7cd

jobs:
  shadow-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout exact final candidate source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"

      - name: Install fixed dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            'numpy==2.5.1' \
            'matplotlib==3.11.1' \
            'pytest==9.1.1' \
            'CoolProp==8.0.0' \
            pillow

      - name: Verify exact source and locked upstream identities
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          for path in \
            src/liquid_gas_transient/u3_b2_fvm_discharge_reference.py \
            src/liquid_gas_transient/u3_b2_fvm_discharge_reference_authoritative.py \
            tests/test_stage7_u3_b2_fvm_discharge_reference.py
          do
            pinned="$(git rev-parse "$REFERENCE_SOURCE_GIT_SHA:$path")"
            current="$(git rev-parse "HEAD:$path")"
            echo "$path pinned=$pinned current=$current"
            test "$pinned" = "$current"
          done
          for path in \
            src/liquid_gas_transient/u3_b1_critical_state_reference.py \
            src/liquid_gas_transient/u3_b1_critical_state_authoritative.py
          do
            pinned="$(git rev-parse "$B1_REFERENCE_SOURCE_GIT_SHA:$path")"
            current="$(git rev-parse "HEAD:$path")"
            echo "$path pinned=$pinned current=$current"
            test "$pinned" = "$current"
          done
          b1_adapter_path=src/liquid_gas_transient/u3_b1_critical_state_adapter.py
          pinned="$(git rev-parse "$B1_ADAPTER_SOURCE_GIT_SHA:$b1_adapter_path")"
          current="$(git rev-parse "HEAD:$b1_adapter_path")"
          echo "$b1_adapter_path pinned=$pinned current=$current"
          test "$pinned" = "$current"

      - name: Compile and static checks outside repository cache
        working-directory: source
        run: |
          set -euo pipefail
          rm -rf "$PYTHONPYCACHEPREFIX"
          python -m py_compile \
            src/liquid_gas_transient/solver.py \
            src/liquid_gas_transient/u3_b2_fvm_discharge_adapter.py \
            src/liquid_gas_transient/u3_b2_fvm_discharge_adapter_authoritative.py \
            tests/test_stage7_u3_b2_fvm_discharge_adapter.py
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
          test -z "$(git ls-files | grep -E '(^|/)(__pycache__/|.*\.py[co]$)' || true)"
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('src/liquid_gas_transient/u3_b2_fvm_discharge_adapter.py')
          tree = ast.parse(path.read_text(encoding='utf-8'))
          imported = []
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imported.extend(alias.name for alias in node.names)
              elif isinstance(node, ast.ImportFrom):
                  imported.append(node.module or '')
          assert not any('u3_b2_fvm_discharge_reference' in name for name in imported)
          PY

      - name: Run dedicated B2 Adapter tests
        id: dedicated
        continue-on-error: true
        working-directory: source
        run: |
          python -m pytest -q \
            tests/test_stage7_u3_b2_fvm_discharge_adapter.py \
            --strict-markers \
            --junitxml=dedicated_junit.xml

      - name: Run related U3 regressions
        id: related
        continue-on-error: true
        working-directory: source
        run: |
          python -m pytest -q \
            tests/test_stage7_u3_b1_critical_state_contract.py \
            tests/test_stage7_u3_b1_critical_state_reference.py \
            tests/test_stage7_u3_b1_critical_state_authoritative.py \
            tests/test_stage7_u3_b1_critical_state_adapter.py \
            tests/test_stage7_u3_b2_fvm_discharge_coupling_contract.py \
            tests/test_stage7_u3_b2_fvm_discharge_coupling_extension_contract.py \
            tests/test_stage7_u3_b2_fvm_discharge_reference.py \
            tests/test_stage7_u3_b2_fvm_discharge_adapter.py \
            --strict-markers \
            --junitxml=related_junit.xml

      - name: Run full repository tests
        id: full
        continue-on-error: true
        working-directory: source
        run: |
          python -m pytest -q \
            --strict-markers \
            --junitxml=full_repository_junit.xml

      - name: Assert test outcomes and authoritative JUnit
        if: always()
        working-directory: source
        env:
          DEDICATED_OUTCOME: ${{ steps.dedicated.outcome }}
          RELATED_OUTCOME: ${{ steps.related.outcome }}
          FULL_OUTCOME: ${{ steps.full.outcome }}
        run: |
          set -euo pipefail
          test "$DEDICATED_OUTCOME" = success
          test "$RELATED_OUTCOME" = success
          test "$FULL_OUTCOME" = success
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          expectations = {
              'dedicated_junit.xml': (11, 11),
              'related_junit.xml': (40, None),
              'full_repository_junit.xml': (960, None),
          }
          for name, (minimum, exact) in expectations.items():
              root = ET.parse(Path(name)).getroot()
              suites = [root] if root.tag == 'testsuite' else list(root.findall('testsuite'))
              totals = {
                  key: sum(int(suite.attrib.get(key, 0)) for suite in suites)
                  for key in ('tests', 'skipped', 'failures', 'errors')
              }
              print(name, totals)
              if exact is not None:
                  assert totals['tests'] == exact
              else:
                  assert totals['tests'] >= minimum
              assert totals['skipped'] == 0
              assert totals['failures'] == 0
              assert totals['errors'] == 0
          PY

      - name: Execute exact-source face and one-step authority
        working-directory: source
        run: |
          set -euo pipefail
          output=artifacts/stage7-u3-b2-shadow-authority
          rm -rf "$output"
          python -m liquid_gas_transient.u3_b2_fvm_discharge_adapter_authoritative \
            --contract docs/verification/stage7_u3_b2_fvm_discharge_coupling_contract_v1.json \
            --extension-contract docs/verification/stage7_u3_b2_fvm_discharge_coupling_event_provenance_contract_v1.json \
            --b1-contract docs/verification/stage7_u3_b1_critical_state_contract_v1.json \
            --adapter-source src/liquid_gas_transient/u3_b2_fvm_discharge_adapter.py \
            --output-dir "$output" \
            --source-git-sha "$SOURCE_SHA" \
            --reference-source-git-sha "$REFERENCE_SOURCE_GIT_SHA" \
            --reference-artifact-id "$REFERENCE_ARTIFACT_ID" \
            --reference-artifact-zip-sha256 "$REFERENCE_ARTIFACT_ZIP_SHA256" \
            --dedicated-junit dedicated_junit.xml \
            --related-junit related_junit.xml \
            --full-junit full_repository_junit.xml

      - name: Complete shadow provenance and SHA256 manifest
        working-directory: source
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import importlib.metadata
          import json
          import os
          import subprocess
          from pathlib import Path

          target = Path('artifacts/stage7-u3-b2-shadow-authority')
          source_paths = {
              'parent_contract_source_sha256': Path(
                  'docs/verification/stage7_u3_b2_fvm_discharge_coupling_contract_v1.json'
              ),
              'extension_contract_source_sha256': Path(
                  'docs/verification/stage7_u3_b2_fvm_discharge_coupling_event_provenance_contract_v1.json'
              ),
              'b1_component_contract_source_sha256': Path(
                  'docs/verification/stage7_u3_b1_critical_state_contract_v1.json'
              ),
          }
          artifact_paths = {
              'parent_contract_artifact_sha256': target / 'benchmark_contract.json',
              'extension_contract_artifact_sha256': target / 'event_provenance_contract.json',
              'b1_component_contract_artifact_sha256': target / 'b1_component_contract.json',
          }

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          checkout_sha = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True
          ).strip()
          assert checkout_sha == os.environ['SOURCE_SHA']
          b1_path = 'src/liquid_gas_transient/u3_b1_critical_state_adapter.py'
          b1_pinned = subprocess.check_output(
              ['git', 'rev-parse', f"{os.environ['B1_ADAPTER_SOURCE_GIT_SHA']}:{b1_path}"],
              text=True,
          ).strip()
          b1_current = subprocess.check_output(
              ['git', 'rev-parse', f'HEAD:{b1_path}'], text=True
          ).strip()
          assert b1_pinned == b1_current

          provenance_path = target / 'runtime_and_git_provenance.json'
          provenance = json.loads(provenance_path.read_text(encoding='utf-8'))
          provenance.update(
              {
                  'checkout_git_sha': checkout_sha,
                  'adapter_source_git_sha': os.environ['SOURCE_SHA'],
                  'b1_adapter_source_git_sha': os.environ['B1_ADAPTER_SOURCE_GIT_SHA'],
                  'b1_adapter_pinned_blob_sha': b1_pinned,
                  'b1_adapter_checkout_blob_sha': b1_current,
                  'matplotlib_version': importlib.metadata.version('matplotlib'),
                  'pytest_version': importlib.metadata.version('pytest'),
                  'coolprop_version': importlib.metadata.version('CoolProp'),
                  'shadow_authority': True,
                  'official_pr_authority_replacement': False,
                  **{key: sha256(path) for key, path in source_paths.items()},
                  **{key: sha256(path) for key, path in artifact_paths.items()},
              }
          )
          provenance_path.write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )

          summary_path = target / 'summary.json'
          summary = json.loads(summary_path.read_text(encoding='utf-8'))
          summary['provenance'] = provenance
          summary['shadow_authority'] = True
          summary['official_pr_authority_replacement'] = False
          for key in (*source_paths, *artifact_paths):
              summary[key] = provenance[key]
          summary_path.write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )

          report_path = target / 'report.md'
          report = report_path.read_text(encoding='utf-8').rstrip()
          report += (
              '\n\n## Shadow authority provenance\n\n'
              'このrunはexact sourceに対する追加Verificationであり、'
              'PR #144の正式Authorityを置換しない。\n\n'
              '```text\n'
              f"source SHA: {checkout_sha}\n"
              f"workflow run ID: {os.environ.get('GITHUB_RUN_ID', '0')}\n"
              'official PR authority replacement: false\n'
              '```\n'
          )
          report_path.write_text(report, encoding='utf-8')

          names = sorted(
              path.name
              for path in target.iterdir()
              if path.is_file() and path.name != 'artifact_sha256.txt'
          )
          (target / 'artifact_sha256.txt').write_text(
              ''.join(f"{sha256(target / name)}  {name}\n" for name in names),
              encoding='utf-8',
          )
          PY

      - name: Inspect shadow authority artifact
        working-directory: source
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import hashlib
          import json
          from pathlib import Path
          from PIL import Image

          target = Path('artifacts/stage7-u3-b2-shadow-authority')
          expected = {
              'summary.json',
              'runtime_and_git_provenance.json',
              'benchmark_contract.json',
              'event_provenance_contract.json',
              'b1_component_contract.json',
              'adapter_face_results.csv',
              'reference_adapter_face_flux_comparison.csv',
              'one_step_conservative_update_comparison.csv',
              'guard_outcomes.csv',
              'locked_checks.csv',
              'reference_adapter_face_flux_parity.png',
              'report.md',
              'dedicated_junit.xml',
              'related_junit.xml',
              'full_repository_junit.xml',
              'artifact_sha256.txt',
          }
          assert {path.name for path in target.iterdir()} == expected
          summary = json.loads((target / 'summary.json').read_text(encoding='utf-8'))
          assert summary['schema_version'] == 'stage7_u3_b2_fvm_discharge_adapter_authority_v1'
          assert summary['face_row_count'] == 13
          assert summary['face_comparison_count'] == 52
          assert summary['face_comparison_pass_count'] == 52
          assert summary['all_face_formal_outcomes_match'] is True
          assert summary['all_reference_adapter_face_comparisons_passed'] is True
          assert summary['one_step_case_count'] == 1
          assert summary['one_step_comparison_passed'] is True
          assert summary['guard_row_count'] == 7
          assert summary['guard_comparison_pass_count'] == 7
          assert summary['all_guard_outcomes_and_atomicity_passed'] is True
          assert summary['all_locked_adapter_authority_checks_passed'] is True
          assert summary['candidate_u3_b2_fvm_adapter_implemented'] is True
          assert summary['candidate_single_phase_fvm_discharge_mapping_verified'] is True
          assert summary['u3_b2_fvm_adapter_implemented'] is False
          assert summary['single_phase_fvm_discharge_mapping_verified'] is False
          assert summary['u3_b2_finite_pipe_execution_complete'] is False
          assert summary['u3_b2_verification_benchmark_accepted'] is False
          assert summary['physical_validation'] is False
          assert summary['design_use_acceptance'] is False
          assert summary['production_hem_activation_approved'] is False
          assert summary['shadow_authority'] is True
          assert summary['official_pr_authority_replacement'] is False

          with (target / 'reference_adapter_face_flux_comparison.csv').open(
              newline='', encoding='utf-8'
          ) as handle:
              face_rows = list(csv.DictReader(handle))
          assert len(face_rows) == 52
          assert all(row['comparison_passed'].lower() == 'true' for row in face_rows)

          with (target / 'guard_outcomes.csv').open(newline='', encoding='utf-8') as handle:
              guard_rows = list(csv.DictReader(handle))
          assert len(guard_rows) == 7
          assert all(row['guard_comparison_passed'].lower() == 'true' for row in guard_rows)

          with Image.open(target / 'reference_adapter_face_flux_parity.png') as image:
              image.verify()

          report = (target / 'report.md').read_text(encoding='utf-8')
          assert '## 結果' in report
          assert '## 未承認の範囲' in report
          assert 'official PR authority replacement: false' in report

          manifest = (target / 'artifact_sha256.txt').read_text(encoding='utf-8').splitlines()
          covered = set()
          for line in manifest:
              digest, name = line.split('  ', 1)
              actual = hashlib.sha256((target / name).read_bytes()).hexdigest()
              assert actual == digest
              covered.add(name)
          assert covered == expected - {'artifact_sha256.txt'}
          PY
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Write shadow receipt
        if: always()
        working-directory: source
        env:
          JOB_STATUS: ${{ job.status }}
          DEDICATED_OUTCOME: ${{ steps.dedicated.outcome }}
          RELATED_OUTCOME: ${{ steps.related.outcome }}
          FULL_OUTCOME: ${{ steps.full.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          receipt = {
              'schema_version': 'u3_b2_shadow_authority_receipt_v1',
              'source_git_sha': os.environ['SOURCE_SHA'],
              'workflow_run_id': int(os.environ.get('GITHUB_RUN_ID', '0')),
              'workflow_run_attempt': int(os.environ.get('GITHUB_RUN_ATTEMPT', '1')),
              'job_status_at_receipt': os.environ.get('JOB_STATUS'),
              'dedicated_outcome': os.environ.get('DEDICATED_OUTCOME'),
              'related_outcome': os.environ.get('RELATED_OUTCOME'),
              'full_outcome': os.environ.get('FULL_OUTCOME'),
              'created_at_utc': datetime.now(timezone.utc).isoformat(),
              'shadow_authority': True,
              'official_pr_authority_replacement': False,
          }
          Path('shadow_authority_receipt.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Upload shadow authority evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage7-u3-b2-shadow-authority-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            source/artifacts/stage7-u3-b2-shadow-authority
            source/shadow_authority_receipt.json
            source/dedicated_junit.xml
            source/related_junit.xml
            source/full_repository_junit.xml
