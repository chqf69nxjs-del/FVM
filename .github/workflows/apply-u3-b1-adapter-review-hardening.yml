name: Apply U3 B1 adapter review hardening

on:
  push:
    branches:
      - agent/u3-b1-critical-state-adapter-clean
    paths:
      - .github/workflows/apply-u3-b1-adapter-review-hardening.yml

permissions:
  contents: write

concurrency:
  group: u3-b1-adapter-review-hardening
  cancel-in-progress: true

jobs:
  apply-review-hardening:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Adapter branch
        uses: actions/checkout@v7
        with:
          ref: agent/u3-b1-critical-state-adapter-clean
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply contract-coordinate and plot-provenance fixes
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          adapter = Path("src/liquid_gas_transient/u3_b1_critical_state_adapter.py")
          adapter_text = adapter.read_text(encoding="utf-8")
          if "def plot_provenance_text(" not in adapter_text:
              replace_once(
                  adapter,
                  '            phase=str(self._phase_si("P", pressure_pa, "T", temperature, "CO2")),\n',
                  '''            phase=str(\n                self._phase_si(\n                    "P",\n                    pressure_pa,\n                    "SMASS",\n                    entropy_J_kg_K,\n                    "CO2",\n                )\n            ),\n''',
              )
              replace_once(
                  adapter,
                  '''def _write_plots(\n    output_dir: Path,\n    results: list[AdapterResult],\n    reference_rows: list[dict[str, str]],\n    comparisons: list[dict[str, Any]],\n) -> None:\n''',
                  '''def plot_provenance_text(\n    case_name: str,\n    backend_version: str,\n    source_git_sha: str,\n) -> str:\n    return (\n        f"case={case_name} | "\n        "model=U3 B1 verification adapter comparison | "\n        f"backend=CoolProp | version={backend_version} | "\n        f"source={source_git_sha[:12]}"\n    )\n\n\ndef _write_plots(\n    output_dir: Path,\n    results: list[AdapterResult],\n    reference_rows: list[dict[str, str]],\n    comparisons: list[dict[str, Any]],\n    *,\n    backend_version: str,\n    source_git_sha: str,\n) -> None:\n''',
              )
              replace_once(
                  adapter,
                  '    ax.set_title("U3 B1 effective mass-flux comparison")\n',
                  '''    ax.set_title(\n        "U3 B1 effective mass-flux comparison\\n"\n        + plot_provenance_text(\n            "17-case mass-flux matrix", backend_version, source_git_sha\n        ),\n        fontsize=9,\n    )\n''',
              )
              replace_once(
                  adapter,
                  '    ax.set_title("U3 B1 critical-pressure comparison")\n',
                  '''    ax.set_title(\n        "U3 B1 critical-pressure comparison\\n"\n        + plot_provenance_text(\n            "9-case critical-pressure matrix", backend_version, source_git_sha\n        ),\n        fontsize=9,\n    )\n''',
              )
              replace_once(
                  adapter,
                  '    ax.set_title("U3 B1 reference-adapter residuals")\n',
                  '''    ax.set_title(\n        "U3 B1 reference-adapter residuals\\n"\n        + plot_provenance_text(\n            "77-row comparison matrix", backend_version, source_git_sha\n        ),\n        fontsize=9,\n    )\n''',
              )
              replace_once(
                  adapter,
                  '    _write_plots(output_dir, results, reference_rows, comparisons)\n',
                  '''    _write_plots(\n        output_dir,\n        results,\n        reference_rows,\n        comparisons,\n        backend_version=property_provider.version,\n        source_git_sha=source_git_sha,\n    )\n''',
              )

          tests = Path("tests/test_stage7_u3_b1_critical_state_adapter.py")
          test_text = tests.read_text(encoding="utf-8")
          if "test_adapter_candidate_phase_uses_pressure_entropy_coordinates" not in test_text:
              replace_once(
                  tests,
                  ')\n\nCONTRACT = Path("docs/verification/stage7_u3_b1_critical_state_contract_v1.json")\n',
                  ''')\n\nfrom liquid_gas_transient.u3_b1_critical_state_adapter import (\n    CoolPropStateProvider,\n    plot_provenance_text,\n)\n\nCONTRACT = Path("docs/verification/stage7_u3_b1_critical_state_contract_v1.json")\n''',
              )
              test_text = tests.read_text(encoding="utf-8")
              test_text += '''\n\nclass FakeCandidateAbstractState:\n    def __init__(self) -> None:\n        self.updates: list[tuple[object, ...]] = []\n\n    def update(self, *args: object) -> None:\n        self.updates.append(args)\n\n    def T(self) -> float:\n        return 280.0\n\n    def rhomass(self) -> float:\n        return 12.0\n\n    def hmass(self) -> float:\n        return 190000.0\n\n    def smass(self) -> float:\n        return 1000.0\n\n\ndef test_adapter_candidate_phase_uses_pressure_entropy_coordinates() -> None:\n    provider = object.__new__(CoolPropStateProvider)\n    candidate_state = FakeCandidateAbstractState()\n    phase_calls: list[tuple[object, ...]] = []\n    provider._candidate = candidate_state\n    provider._PSmass_INPUTS = "PSMASS_INPUT"\n    provider._phase_si = lambda *args: phase_calls.append(args) or "gas"\n\n    candidate = provider.isentropic_state(8.0e5, 1000.0)\n\n    assert candidate.phase == "gas"\n    assert candidate_state.updates == [("PSMASS_INPUT", 8.0e5, 1000.0)]\n    assert phase_calls == [("P", 8.0e5, "SMASS", 1000.0, "CO2")]\n\n\ndef test_adapter_plot_provenance_contains_required_fields() -> None:\n    text = plot_provenance_text(\n        "77-row comparison matrix",\n        "8.0.0",\n        "0123456789abcdef",\n    )\n    assert "case=77-row comparison matrix" in text\n    assert "model=U3 B1 verification adapter comparison" in text\n    assert "backend=CoolProp" in text\n    assert "version=8.0.0" in text\n    assert "source=0123456789ab" in text\n'''
              tests.write_text(test_text, encoding="utf-8")
          PY

      - name: Run targeted hardening tests
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
          MPLBACKEND: Agg
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pytest -q \
            tests/test_stage7_u3_b1_critical_state_adapter.py \
            --strict-markers
          git diff --check
          test -z "$(find src tests -type d -name __pycache__ -print -quit)"

      - name: Commit source and tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/liquid_gas_transient/u3_b1_critical_state_adapter.py \
            tests/test_stage7_u3_b1_critical_state_adapter.py
          if git diff --cached --quiet; then
            echo "Hardening changes already present."
            exit 0
          fi
          git commit -m "Harden U3 B1 adapter contract interpretation"
          git push origin HEAD:agent/u3-b1-critical-state-adapter-clean
