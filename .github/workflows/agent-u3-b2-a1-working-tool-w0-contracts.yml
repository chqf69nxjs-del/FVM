name: Agent U3 B2 A1 Working Tool W0 Contracts

on:
  workflow_dispatch:
  push:
    branches: [agent/u3-b2-a1-working-tool-w0]
    paths:
      - "src/liquid_gas_transient/working_tool/**"
      - "tests/test_working_tool_w0_contracts.py"
      - "tools/verification/u3_b2_a1_working_tool_w0_contract_check.py"
      - "docs/verification/stage7_u3_b2_a1_working_tool_w0_*.md"
      - ".github/workflows/agent-u3-b2-a1-working-tool-w0-contracts.yml"

permissions:
  contents: read

concurrency:
  group: agent-u3-b2-a1-working-tool-w0-contracts
  cancel-in-progress: true

env:
  PYTHONPATH: src
  PYTHONDONTWRITEBYTECODE: "1"
  A2_PARENT_HEAD: a7e362d72b8fef627803bd7b9e8cf3595b0e5282

jobs:
  w0-contracts:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"

      - name: Install fixed dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'numpy==2.5.1' 'pytest==9.1.1'

      - name: Verify W0 source scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "${A2_PARENT_HEAD}" HEAD
          changed="$(git diff --name-only "${A2_PARENT_HEAD}" HEAD)"
          forbidden="$(printf '%s\n' "${changed}" | grep -Ev '^(docs/verification/stage7_u3_b2_a1_working_tool_w0_|src/liquid_gas_transient/working_tool/|tests/test_working_tool_w0_contracts.py$|tools/verification/u3_b2_a1_working_tool_w0_contract_check.py$|\.github/workflows/agent-u3-b2-a1-working-tool-w0-contracts.yml$)' || true)"
          test -z "${forbidden}" || { printf 'unexpected changed paths:\n%s\n' "${forbidden}"; exit 1; }

      - name: Compile W0 sources
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile src/liquid_gas_transient/working_tool/*.py
          python -m py_compile tools/verification/u3_b2_a1_working_tool_w0_contract_check.py

      - name: Run focused W0 tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/w0-contracts
          python -m pytest -q tests/test_working_tool_w0_contracts.py \
            --junitxml=artifacts/w0-contracts/pytest.xml \
            | tee artifacts/w0-contracts/pytest.log

      - name: Run W0 contract harness
        shell: bash
        run: |
          set -euo pipefail
          python tools/verification/u3_b2_a1_working_tool_w0_contract_check.py \
            | tee artifacts/w0-contracts/contract-check.json

      - name: Record source metadata
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "${GITHUB_SHA}" > artifacts/w0-contracts/source_git_sha.txt
          git diff --name-only "${A2_PARENT_HEAD}" HEAD > artifacts/w0-contracts/changed_paths.txt
          sha256sum artifacts/w0-contracts/* > artifacts/w0-contracts/sha256.txt

      - name: Upload W0 evidence
        uses: actions/upload-artifact@v7

        # manual CI trigger
        with:
          name: u3-b2-a1-working-tool-w0-${{ github.run_id }}
          path: artifacts/w0-contracts
          if-no-files-found: error
