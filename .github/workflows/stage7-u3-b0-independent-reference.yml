name: Stage 7 U3 B0 Independent Reference

on:
  pull_request:
    paths:
      - "src/liquid_gas_transient/u3_b0_discharge_reference.py"
      - "tests/test_stage7_u3_b0_discharge_reference.py"
      - "docs/verification/stage7_u3_b0_discharge_boundary_contract_v1.json"
      - ".github/workflows/stage7-u3-b0-independent-reference.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage7-u3-b0-reference-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: src
  PYTHONDONTWRITEBYTECODE: "1"
  MPLBACKEND: Agg
  ANALYSIS_SOURCE_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  u3-b0-independent-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install fixed dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy matplotlib pytest 'CoolProp==8.0.0'

      - name: Assert pristine checkout
        run: |
          echo "checkout_sha=$(git rev-parse HEAD)"
          status="$(git status --porcelain=v1 --untracked-files=all)"
          printf 'pre_execution_git_status=%s\n' "$status"
          test -z "$status"

      - name: Execute independent B0 reference
        run: |
          output="artifacts/stage7-u3-b0-independent-reference"
          rm -rf "$output"
          python -m liquid_gas_transient.u3_b0_discharge_reference \
            --contract docs/verification/stage7_u3_b0_discharge_boundary_contract_v1.json \
            --output-dir "$output" \
            --source-git-sha "$ANALYSIS_SOURCE_GIT_SHA"
          tracked_status="$(git status --porcelain=v1 --untracked-files=no)"
          printf 'post_execution_tracked_git_status=%s\n' "$tracked_status"
          test -z "$tracked_status"

      - name: Inspect reference evidence contract
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          import os
          from pathlib import Path

          target = Path("artifacts/stage7-u3-b0-independent-reference")
          expected_files = {
              "summary.json",
              "benchmark_contract.json",
              "benchmark_cases.csv",
              "property_scope_history.csv",
              "conservative_flux_budget.csv",
              "guard_outcomes.csv",
              "report.md",
              "mass_flow_vs_pressure_drop.png",
              "area_and_Cd_scaling.png",
              "energy_transfer_residual.png",
              "artifact_sha256.txt",
          }
          assert {path.name for path in target.iterdir()} == expected_files

          summary = json.loads((target / "summary.json").read_text(encoding="utf-8"))
          assert summary["schema_version"] == "stage7_u3_b0_independent_reference_v1"
          assert summary["contract_schema_version"] == "stage7_u3_b0_discharge_boundary_contract_v1"
          assert summary["contract_status"] == "LOCKED_BEFORE_RESULTS"
          assert summary["issue"] == 109
          assert summary["case_count"] == 10
          assert summary["success_count"] == 7
          assert summary["guard_count"] == 3
          assert summary["exact_zero_identities_retained"] is True
          assert summary["u3_b0_contract_locked"] is True
          assert summary["u3_b0_reference_implemented"] is True
          assert summary["u3_b0_adapter_implemented"] is False
          assert summary["u3_b0_component_benchmark_execution_complete"] is False
          assert summary["u3_component_benchmark_accepted"] is False
          assert summary["physical_discharge_boundary_approved"] is False
          assert summary["two_phase_critical_discharge_accuracy_approved"] is False
          assert summary["integrated_blowdown_model_approved"] is False
          assert summary["physical_validation"] is False
          assert summary["design_use_acceptance"] is False
          assert summary["production_hem_activation_approved"] is False
          assert summary["provenance"]["source_git_sha"] == os.environ["ANALYSIS_SOURCE_GIT_SHA"]
          assert summary["provenance"]["coolprop_version"] == "8.0.0"

          expected_outcomes = {
              "B0-01_CLOSED_ELEMENT": "SUCCESS_CLOSED",
              "B0-02_ZERO_PRESSURE_DROP": "SUCCESS_ZERO_PRESSURE_DROP",
              "B0-03_SUBCOOLED_LIQUID_LIMIT": "SUCCESS_FORWARD_LIQUID_DISCHARGE",
              "B0-04A_AREA_SCALING_LOW": "SUCCESS_FORWARD_LIQUID_DISCHARGE",
              "B0-04B_AREA_SCALING_HIGH": "SUCCESS_FORWARD_LIQUID_DISCHARGE",
              "B0-05A_CD_SCALING_LOW": "SUCCESS_FORWARD_LIQUID_DISCHARGE",
              "B0-05B_CD_SCALING_HIGH": "SUCCESS_FORWARD_LIQUID_DISCHARGE",
              "G-01_REVERSE_PRESSURE": "REVERSE_PRESSURE_NOT_SUPPORTED",
              "G-02_OPENING_OUTSIDE_RANGE": "OPENING_OUTSIDE_UNIT_INTERVAL",
              "G-03_SINGLE_PHASE_SCOPE_FAILURE": "UPSTREAM_STATE_OUTSIDE_DECLARED_PHASE_SCOPE",
          }
          assert summary["formal_outcomes"] == expected_outcomes

          with (target / "benchmark_cases.csv").open(newline="", encoding="utf-8") as handle:
              rows = {row["case_id"]: row for row in csv.DictReader(handle)}
          for case_id in ("B0-01_CLOSED_ELEMENT", "B0-02_ZERO_PRESSURE_DROP"):
              assert float(rows[case_id]["mass_flow_rate_kg_s"]) == 0.0
              assert float(rows[case_id]["momentum_stream_transfer_outward_N"]) == 0.0
              assert float(rows[case_id]["energy_transfer_outward_W"]) == 0.0

          area_ratio = (
              float(rows["B0-04B_AREA_SCALING_HIGH"]["mass_flow_rate_kg_s"])
              / float(rows["B0-04A_AREA_SCALING_LOW"]["mass_flow_rate_kg_s"])
          )
          cd_ratio = (
              float(rows["B0-05B_CD_SCALING_HIGH"]["mass_flow_rate_kg_s"])
              / float(rows["B0-05A_CD_SCALING_LOW"]["mass_flow_rate_kg_s"])
          )
          assert abs(area_ratio - 2.0) <= 1e-12
          assert abs(cd_ratio - 2.0) <= 1e-12

          manifest = {}
          for line in (target / "artifact_sha256.txt").read_text(encoding="utf-8").splitlines():
              digest, name = line.split("  ", 1)
              manifest[name] = digest
          assert set(manifest) == expected_files - {"artifact_sha256.txt"}
          for name, expected in manifest.items():
              actual = hashlib.sha256((target / name).read_bytes()).hexdigest()
              assert actual == expected, name
          PY

      - name: Compile and diff checks
        run: |
          python -m compileall -q src tests
          git diff --check

      - name: Run dedicated U3 B0 reference tests
        run: |
          python -m pytest -q \
            tests/test_stage7_u3_b0_discharge_reference.py \
            --strict-markers \
            --junitxml=u3-b0-reference-dedicated.xml

      - name: Run related contract and boundary regressions
        run: |
          python -m pytest -q \
            tests/test_stage7_u3_b0_discharge_reference.py \
            tests/test_stage7_lco2_hem_technical_report_contract.py \
            --strict-markers \
            --junitxml=related-stage7.xml

      - name: Run full repository tests
        run: |
          python -m pytest -q \
            --strict-markers \
            --junitxml=full-repository.xml

      - name: Assert authoritative JUnit is clean
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          for name in (
              "u3-b0-reference-dedicated.xml",
              "related-stage7.xml",
              "full-repository.xml",
          ):
              root = ET.parse(Path(name)).getroot()
              suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
              totals = {
                  key: sum(int(s.attrib.get(key, 0)) for s in suites)
                  for key in ("tests", "skipped", "failures", "errors")
              }
              print(name, totals)
              assert totals["skipped"] == 0
              assert totals["failures"] == 0
              assert totals["errors"] == 0
          PY

      - name: Upload U3 B0 reference evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stage7-u3-b0-reference-${{ github.run_id }}
          path: |
            artifacts/stage7-u3-b0-independent-reference
            u3-b0-reference-dedicated.xml
            related-stage7.xml
            full-repository.xml
          if-no-files-found: warn
