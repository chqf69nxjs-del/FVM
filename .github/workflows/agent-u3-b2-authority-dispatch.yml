name: Agent U3 B2 Authority Dispatcher

on:
  push:
    branches: [agent/u3-b2-authority-dispatcher]
    paths:
      - ".github/workflows/agent-u3-b2-authority-dispatch.yml"

permissions:
  actions: write
  contents: write

concurrency:
  group: agent-u3-b2-authority-dispatcher
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: macos-15
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: agent/u3-b2-fvm-adapter-clean
      TARGET_SHA: 732b7259ac3738c47f7eb7cbd23d8e49195a0d7b
      TARGET_WORKFLOW: stage7-u3-b2-fvm-adapter-face-one-step.yml
    steps:
      - name: Checkout dispatcher branch
        uses: actions/checkout@v7
        with:
          ref: agent/u3-b2-authority-dispatcher
          fetch-depth: 0

      - name: Verify exact target branch head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(gh api \
            repos/${GITHUB_REPOSITORY}/git/ref/heads/${TARGET_BRANCH} \
            --jq '.object.sha')"
          printf 'target_branch=%s\ntarget_sha=%s\n' "$TARGET_BRANCH" "$actual"
          test "$actual" = "$TARGET_SHA"

      - name: Capture existing dispatch runs
        shell: bash
        run: |
          set -euo pipefail
          gh run list \
            --workflow "$TARGET_WORKFLOW" \
            --branch "$TARGET_BRANCH" \
            --event workflow_dispatch \
            --limit 50 \
            --json databaseId \
            > "$RUNNER_TEMP/u3_b2_before_runs.json"

      - name: Dispatch official final-head authority
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run "$TARGET_WORKFLOW" --ref "$TARGET_BRANCH"

      - name: Resolve dispatched run identity
        shell: bash
        run: |
          set -euo pipefail
          selected="$RUNNER_TEMP/u3_b2_selected_run.json"
          rm -f "$selected"
          for attempt in $(seq 1 60)
          do
            gh run list \
              --workflow "$TARGET_WORKFLOW" \
              --branch "$TARGET_BRANCH" \
              --event workflow_dispatch \
              --limit 50 \
              --json databaseId,headSha,status,conclusion,url,event,createdAt \
              > "$RUNNER_TEMP/u3_b2_after_runs.json"
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          target_sha = os.environ["TARGET_SHA"]
          before = {
              int(row["databaseId"])
              for row in json.loads(
                  (temp / "u3_b2_before_runs.json").read_text(encoding="utf-8")
              )
          }
          after = json.loads(
              (temp / "u3_b2_after_runs.json").read_text(encoding="utf-8")
          )
          candidates = [
              row
              for row in after
              if int(row["databaseId"]) not in before
              and row.get("headSha") == target_sha
          ]
          if not candidates:
              raise SystemExit(1)
          candidates.sort(key=lambda row: int(row["databaseId"]), reverse=True)
          (temp / "u3_b2_selected_run.json").write_text(
              json.dumps(candidates[0], indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
            if test -s "$selected"
            then
              cat "$selected"
              break
            fi
            sleep 5
          done
          test -s "$selected"

      - name: Commit dispatch receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agent_receipts
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          run = json.loads(
              (temp / "u3_b2_selected_run.json").read_text(encoding="utf-8")
          )
          receipt = {
              "schema_version": "u3_b2_authority_dispatch_receipt_v1",
              "target_branch": os.environ["TARGET_BRANCH"],
              "target_source_git_sha": os.environ["TARGET_SHA"],
              "workflow_file": os.environ["TARGET_WORKFLOW"],
              "workflow_run_id": int(run["databaseId"]),
              "workflow_run_url": run["url"],
              "initial_status": run["status"],
              "initial_conclusion": run.get("conclusion"),
              "dispatched_at_utc": datetime.now(timezone.utc).isoformat(),
              "claim_boundary": "dispatch receipt only; not authority acceptance",
          }
          Path(".agent_receipts/u3_b2_authority_dispatch.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agent_receipts/u3_b2_authority_dispatch.json
          git commit -m "Record U3 B2 final-head authority dispatch"
          git push origin HEAD:agent/u3-b2-authority-dispatcher
