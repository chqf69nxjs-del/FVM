name: Stage 7 P2 HNE Limited Interior Coupling A3.1

on:
  push:
    branches:
      - agent/stage7-p2-hne-limited-interior-coupling-a3-1
  pull_request:
    branches:
      - agent/stage7-p2-hne-acoustic-authority-gate
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage7-p2-hne-limited-interior-coupling-a3-1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  limited-interior-coupling:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
      ANALYSIS_SOURCE_GIT_SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.5.2' 'pytest==9.1.1'

      - name: Assert source and change envelope
        run: |
          set -euo pipefail
          source_sha="d4c1daf4db9c6e367a75d77c6660f417a9aee061"
          test "$(git rev-parse HEAD)" = "$ANALYSIS_SOURCE_GIT_SHA"
          git cat-file -e "${source_sha}^{commit}"
          git diff --name-only "$source_sha" HEAD | sort > /tmp/actual.txt
          printf '%s\n' \
            '.github/workflows/stage7-p2-hne-limited-interior-coupling-a3-1.yml' \
            'docs/verification/stage7_p2_hne_limited_interior_coupling_a3_1.md' \
            'src/liquid_gas_transient/hne_limited_interior_coupling.py' \
            'src/liquid_gas_transient/hne_limited_interior_coupling_facade.py' \
            'tests/test_stage7_p2_hne_limited_interior_coupling_a3_1.py' \
            | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile and clean
        run: |
          set -euo pipefail
          python -m compileall -q src tests
          git diff --check
          find src tests -type d -name __pycache__ -prune -exec rm -rf {} +
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Generate P2-A3.1 coupling evidence
        run: |
          set -euo pipefail
          python -m liquid_gas_transient.hne_limited_interior_coupling_facade \
            --output-dir artifacts/stage7/p2-hne-limited-interior-coupling-a3-1

      - name: Gate P2-A3.1 evidence
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          p = Path('artifacts/stage7/p2-hne-limited-interior-coupling-a3-1')
          expected = {
              'summary.json',
              'case_summary.csv',
              'pulse_step_history.csv',
              'operator_report.md',
              'manifest.json',
          }
          assert {x.name for x in p.iterdir()} == expected
          s = json.loads((p / 'summary.json').read_text())
          m = json.loads((p / 'manifest.json').read_text())
          report = (p / 'operator_report.md').read_text()
          with (p / 'case_summary.csv').open(newline='') as f:
              cases = list(csv.DictReader(f))
          with (p / 'pulse_step_history.csv').open(newline='') as f:
              pulse = list(csv.DictReader(f))

          assert s['source_acoustic_authority_gate']['head_sha'] == \
              'd4c1daf4db9c6e367a75d77c6660f417a9aee061'
          assert s['source_acoustic_authority_gate']['workflow_run_id'] == 32629047962
          assert s['property_backend_name'] == 'surrogate_lco2'
          assert s['p2_a3_1_limited_interior_coupling_ready'] is True
          assert s['failed_gates'] == []
          assert all(s['gate_results'].values())
          assert s['runtime_provenance']['analysis_source_git_sha'] == \
              s['runtime_provenance']['checkout_git_sha']
          assert s['runtime_provenance']['git_status_porcelain'] == ''
          assert len(cases) == 4
          assert len(pulse) > 2
          by_id = {row['case_id']: row for row in cases}

          uniform = by_id['UNIFORM_NONEQUILIBRIUM_INTERIOR_COUPLING']
          assert uniform['primitive_pressure_matches_candidate'] == 'True'
          assert uniform['primitive_c_matches_candidate_frozen_c'] == 'True'
          assert uniform['cfl_dt_matches_candidate_frozen_c'] == 'True'
          assert uniform['rusanov_smax_matches_candidate_frozen_c'] == 'True'
          assert uniform['uniform_state_bitwise_preserved'] == 'True'

          frozen = by_id['TAU_INFINITY_FROZEN_LIMIT']
          assert frozen['trajectory_bitwise_equal_to_no_phase_change'] == 'True'
          assert frozen['candidate_final_state_sha256'] == \
              frozen['reference_final_state_sha256']

          equilibrium = by_id['TAU_NEAR_ZERO_EQUILIBRIUM_LIMIT']
          assert float(equilibrium['maximum_equilibrium_quality_error']) <= 1.0e-15
          assert equilibrium[
              'hydrodynamic_state_unchanged_by_uniform_step_and_relaxation'
          ] == 'True'
          assert equilibrium['candidate_pressure_recovers_equilibrium_pressure'] == 'True'
          assert equilibrium['candidate_temperature_recovers_equilibrium_temperature'] == 'True'

          wave = by_id['SMALL_AMPLITUDE_PRESSURE_PULSE']
          assert wave['wave_speed_within_focused_tolerance'] == 'True'
          assert float(wave['relative_wave_speed_error']) <= 0.20
          assert float(wave['left_right_speed_symmetry_relative_error']) <= 0.05
          assert wave['pulse_remained_inside_domain'] == 'True'

          assert s['formal_status']['limited_interior_hne_hydrodynamic_coupling'] is True
          assert s['formal_status']['working_vertical_slice'] is True
          assert s['formal_status']['finite_pipeline_hne_coupling'] is False
          assert s['existing_production_default_path_modified'] is False
          assert s['boundary_characteristics_authorized'] is False
          assert s['critical_discharge_authorized'] is False
          assert s['discharge_feedback_authorized'] is False
          assert s['physically_validated'] is False
          assert s['formal_status']['verified'] is False
          assert s['formal_status']['accepted'] is False
          assert s['formal_status']['design_use_accepted'] is False
          assert s['formal_status']['production_approved'] is False
          assert m['analysis_sha256'] == s['analysis_sha256']
          assert m['p2_a3_1_limited_interior_coupling_ready'] is True
          assert m['existing_production_default_path_modified'] is False
          assert m['boundary_characteristics_authorized'] is False
          assert m['critical_discharge_authorized'] is False
          assert m['discharge_feedback_authorized'] is False
          assert f"Property backend: `{s['property_backend_name']}`" in report
          assert f"Next action: `{s['next_action']}`" in report
          assert 'STOP: P2-A3.1 gates failed' not in report
          print('formal_outcome=' + s['formal_outcome'])
          print('analysis_sha256=' + s['analysis_sha256'])
          PY

      - name: Run authority and coupling focused tests
        run: |
          python -m pytest -q \
            tests/test_stage7_p2_hne_acoustic_authority_gate.py \
            tests/test_stage7_p2_hne_limited_interior_coupling_a3_1.py \
            --strict-markers --junitxml=p2-a3-1-focused.xml

      - name: Gate JUnit and tracked checkout
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse('p2-a3-1-focused.xml').getroot()
          suites = [root] if root.tag == 'testsuite' else list(root.findall('testsuite'))
          totals = {
              key: sum(int(suite.attrib.get(key, 0)) for suite in suites)
              for key in ('tests', 'skipped', 'failures', 'errors')
          }
          assert totals == {'tests': 19, 'skipped': 0, 'failures': 0, 'errors': 0}
          print(totals)
          PY
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Upload evidence
        uses: actions/upload-artifact@v7
        with:
          name: stage7-p2-hne-limited-interior-coupling-a3-1-${{ github.run_id }}
          path: |
            artifacts/stage7/p2-hne-limited-interior-coupling-a3-1
            p2-a3-1-focused.xml
          if-no-files-found: error
          compression-level: 6
