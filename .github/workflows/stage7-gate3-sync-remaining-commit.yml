name: Stage 7 Gate 3 Sync Remaining Records

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  synchronize-remaining-records:
    if: github.head_ref == 'agent/stage7-gate3-central-record-sync' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout synchronization branch
        uses: actions/checkout@v7
        with:
          ref: agent/stage7-gate3-central-record-sync
          fetch-depth: 0

      - name: Update remaining central records
        run: python scripts/stage7_gate3_sync_remaining.py

      - name: Commit and push MASTER and execution log
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/verification/MASTER_VERIFICATION_INDEX.md \
            docs/verification/stage7_execution_log.md
          git commit -m "Synchronize remaining Stage 7 records through Gate 3"
          git push origin HEAD:agent/stage7-gate3-central-record-sync
