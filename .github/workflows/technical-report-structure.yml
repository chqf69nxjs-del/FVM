name: Technical Report Structure

on:
  pull_request:
    paths:
      - "docs/technical_report/**"
      - "tests/test_lco2_fvm_hem_technical_report_contract.py"
      - ".github/workflows/technical-report-structure.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-report-structure:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Validate report contract JSON
        run: >-
          python -m json.tool
          docs/technical_report/lco2_fvm_hem_technical_report_contract_v0p1.json
          >/dev/null

      - name: Run report structure tests
        run: >-
          python -m pytest -q
          tests/test_lco2_fvm_hem_technical_report_contract.py
          --strict-markers
          --junitxml=technical-report-structure.xml

      - name: Assert clean JUnit result
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("technical-report-structure.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
          totals = {
              key: sum(int(s.attrib.get(key, 0)) for s in suites)
              for key in ("tests", "skipped", "failures", "errors")
          }
          print(totals)
          assert totals["tests"] >= 6
          assert totals["skipped"] == 0
          assert totals["failures"] == 0
          assert totals["errors"] == 0
          PY

      - name: Compile and diff checks
        run: |
          python -m compileall -q tests
          git diff --check

      - name: Upload JUnit evidence
        uses: actions/upload-artifact@v7
        with:
          name: technical-report-structure-${{ github.run_id }}
          path: technical-report-structure.xml
          if-no-files-found: error
