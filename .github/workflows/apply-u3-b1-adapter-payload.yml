name: Apply U3 B1 adapter implementation payload

on:
  push:
    branches:
      - agent/u3-b1-critical-state-adapter
    paths:
      - .github/workflows/apply-u3-b1-adapter-payload.yml

permissions:
  contents: write

jobs:
  apply-payload:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout adapter branch
        uses: actions/checkout@v7
        with:
          ref: agent/u3-b1-critical-state-adapter
          fetch-depth: 0

      - name: Decode and apply implementation payload
        shell: bash
        run: |
          cat > "${RUNNER_TEMP}/u3-b1-adapter-payload.b64" <<'PAYLOAD'
[... ELLIPSIZATION ...]
PAYLOAD
          base64 --decode "${RUNNER_TEMP}/u3-b1-adapter-payload.b64" > "${RUNNER_TEMP}/u3-b1-adapter-payload.tgz"
          echo "0711e34cc26dbeb17792f6e38ec142063600a0b3d507205a7ccd3b7357e34084  ${RUNNER_TEMP}/u3-b1-adapter-payload.tgz" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/u3-b1-adapter-payload.tgz" -C .

      - name: Validate staged implementation
        shell: bash
        run: |
          python -m compileall -q src tests
          git diff --check
          test "$(grep -R '__REF_' -l .github/workflows/stage7-u3-b1-adapter-comparison.yml | wc -l)" -eq 1

      - name: Commit implementation to adapter branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/liquid_gas_transient/u3_b1_critical_state_adapter.py \
            tests/test_stage7_u3_b1_critical_state_adapter.py \
            tests/conftest.py \
            pyproject.toml \
            docs/verification/stage7_u3_b1_adapter_comparison.md \
            .github/workflows/stage7-u3-b1-adapter-comparison.yml
          git commit -m "Add U3 B1 verification adapter comparison"
          git push origin HEAD:agent/u3-b1-critical-state-adapter
