name: Temporary U3 B2 Cancel Superseded Runs

on:
  pull_request:
    paths:
      - ".github/workflows/stage7-u3-b2-cancel-superseded-runs.yml"

permissions:
  actions: write
  contents: read

concurrency:
  group: temporary-u3-b2-cancel-superseded-runs
  cancel-in-progress: true

jobs:
  cancel-superseded-runs:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Cancel explicit superseded and duplicate runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          targets=(
            31196895738
            31196895668
            31196895251
            31196895722
            31169415081
            31202674533
            31202673443
            31202672846
            31202672954
            31202672765
            31196897626
            31196898157
            31196896570
            31196896629
            31196895955
            31202674654
            31202674699
            31202674967
            31202674664
            31202674674
            31202675079
            31202674912
            31202675493
            31202675250
            31202674682
            31202675501
            31202674822
            31202675049
            31202674605
            31203278768
            31203278834
            31203278640
            31203277191
            31203277169
            31203277224
            31203277261
            31203277226
            31203277205
            31203277164
            31203277868
          )

          : > /tmp/cancelled.txt
          : > /tmp/not_cancelled.txt
          for run_id in "${targets[@]}"; do
            code="$(
              curl -sS \
                -o /tmp/cancel-response.json \
                -w '%{http_code}' \
                -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel"
            )"
            case "$code" in
              202)
                echo "$run_id" | tee -a /tmp/cancelled.txt
                ;;
              *)
                echo "$run_id:$code" | tee -a /tmp/not_cancelled.txt
                ;;
            esac
          done

          echo 'cancelled:'
          cat /tmp/cancelled.txt
          echo 'not_cancelled_or_already_terminal:'
          cat /tmp/not_cancelled.txt
          echo 'retained_authority_run=31202674732'

      - name: Assert retained authority run was not targeted
        run: |
          ! grep -Fx '31202674732' /tmp/cancelled.txt
          echo 'retained_authority_run=31202674732'
