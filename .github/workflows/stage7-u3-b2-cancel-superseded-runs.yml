name: Temporary U3 B2 Cancel Superseded Runs

on:
  pull_request:
    paths:
      - ".github/workflows/stage7-u3-b2-cancel-superseded-runs.yml"

permissions:
  actions: write
  contents: read

concurrency:
  group: temporary-u3-b2-cancel-superseded-runs
  cancel-in-progress: true

jobs:
  cancel-superseded-runs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Cancel explicit superseded and duplicate runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          targets=(
            31196895738
            31196895668
            31196895251
            31196895722
            31169415081
            31202674533
            31202673443
            31202672846
            31202672954
            31202672765
            31202674732
            31196897626
            31196898157
            31196896570
            31196896629
            31196895955
            31202674654
            31202674699
            31202674967
            31202674664
            31202674674
            31202675079
            31202674912
            31202675493
            31202675250
            31202674682
            31202675501
            31202674822
            31202675049
            31202674605
            31203278768
            31203278834
            31203278640
            31203277191
            31203277169
            31203277224
            31203277261
            31203277226
            31203277205
            31203277164
            31203277868
            31203548510
            31203548737
            31203547692
            31203547697
            31203547790
            31203547387
            31203547565
            31203547651
            31203547678
            31203547653
            31203547881
            31203547736
            31203547892
            31203547922
            31203547758
            31203989762
            31203989756
            31203989722
            31203989758
            31203989780
            31203989908
            31203990002
            31204072385
            31204071655
            31204071548
            31204071526
            31204071573
            31204071599
            31204071522
            31204071533
            31204071598
            31204071570
            31204071606
            31204072016
            31204071528
            31204071527
            31204071648
          )

          : > /tmp/cancelled.txt
          : > /tmp/not_cancelled.txt

          cancel_run() {
            local run_id="$1"
            test "$run_id" = "31203989733" && return 0
            test "$run_id" = "$GITHUB_RUN_ID" && return 0
            local code
            code="$(
              curl -sS \
                -o /tmp/cancel-response.json \
                -w '%{http_code}' \
                -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel"
            )"
            case "$code" in
              202)
                echo "$run_id" | tee -a /tmp/cancelled.txt
                ;;
              *)
                echo "$run_id:$code" | tee -a /tmp/not_cancelled.txt
                ;;
            esac
          }

          for run_id in "${targets[@]}"; do
            cancel_run "$run_id"
          done

          # Opening this temporary control PR launches unrelated repository-wide
          # pull-request workflows. Cancel every nonterminal run for this
          # temporary head branch except this control run itself.
          while IFS= read -r run_id; do
            test -n "$run_id" || continue
            cancel_run "$run_id"
          done < <(
            curl -sS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?event=pull_request&branch=agent/u3-b2-reference-authority-trigger&per_page=100" \
              | jq -r '.workflow_runs[] | select(.status != "completed") | .id'
          )

          echo 'cancelled:'
          cat /tmp/cancelled.txt
          echo 'not_cancelled_or_already_terminal:'
          cat /tmp/not_cancelled.txt
          echo 'retained_authority_run=31203989733'

      - name: Assert retained authority run was not targeted
        run: |
          ! grep -Fx '31203989733' /tmp/cancelled.txt
          echo 'retained_authority_run=31203989733'
