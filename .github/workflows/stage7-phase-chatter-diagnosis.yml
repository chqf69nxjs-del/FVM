name: Stage 7 Boundary-Adjacent Phase Chatter Diagnosis

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: stage7-phase-chatter-diagnosis-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: src
  PYTHONDONTWRITEBYTECODE: '1'
  MPLBACKEND: Agg
  ANALYSIS_SOURCE_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  gate7-phase-chatter-diagnosis:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install fixed dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy matplotlib pytest 'CoolProp==8.0.0'
      - name: Assert pristine checkout
        run: |
          echo "checkout_sha=$(git rev-parse HEAD)"
          status="$(git status --porcelain=v1 --untracked-files=all)"
          printf 'pre_execution_git_status=%s\n' "$status"
          test -z "$status"
      - name: Execute fixed Gate 7 diagnosis
        run: |
          temporary_output="${RUNNER_TEMP}/stage7-phase-chatter-diagnosis"
          repository_output="artifacts/stage7-phase-chatter-diagnosis"
          rm -rf "$temporary_output" "$repository_output"
          python -m liquid_gas_transient.hem_pipeline_phase_chatter_diagnosis \
            --output-dir "$temporary_output"
          tracked_status="$(git status --porcelain=v1 --untracked-files=no)"
          printf 'post_execution_tracked_git_status=%s\n' "$tracked_status"
          test -z "$tracked_status"
          mkdir -p "$repository_output"
          cp -a "$temporary_output/." "$repository_output/"
      - name: Inspect Gate 7 evidence contract
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          target = Path('artifacts/stage7-phase-chatter-diagnosis')
          summary = json.loads((target / 'summary.json').read_text(encoding='utf-8'))
          assert summary['scope'] == 'verification_only'
          assert summary['case_id'] == 'pipeline_crossing_candidate_p5m5_to_p2m5'
          assert summary['focus_cells'] == [29, 30, 31]
          assert summary['chatter_cell'] == 30
          assert summary['fixed_post_crossing_steps'] == 64
          assert summary['gate6_final_state_reproduced_exactly'] is True
          assert summary['final_state_sha256'] == '62bbaf5d7014af258180fe29622324a2228a0c5eec507ef10eb6b9f3e411d440'
          assert summary['cell30_toggle_count'] == 49
          assert summary['focused_cell_record_count'] == 576
          assert summary['interface_flux_record_count'] == 192
          assert summary['transition_event_record_count'] == 49
          assert 'STABLE_FRONT_SEPARATED_FROM_CHATTER' in summary['classifications']
          assert 'CHATTER_REVIEW_INCONCLUSIVE' in summary['classifications']
          provenance = summary['provenance']
          assert provenance['source_git_sha'] == os.environ['ANALYSIS_SOURCE_GIT_SHA']
          assert provenance['checkout_git_sha']
          assert provenance['git_status_porcelain'] == ''
          assert provenance['property_backend_version'] == '8.0.0'
          for key in (
              'Gate_7_execution_complete',
              'phase_chatter_root_cause_approved',
              'chatter_mitigation_authorized',
              'post_crossing_propagation_approved',
              'near_saturation_acoustic_continuity_approved',
              'two_phase_acoustic_accuracy_band_approved',
              'CFL_independent_crossing_verified',
              'mesh_independent_crossing_verified',
              'Gate_P2_passed',
              'physical_validation',
              'design_use_acceptance',
              'production_hem_activation_approved',
          ):
              assert summary[key] is False
          for name in (
              'cell_29_30_31_history.csv',
              'cell_30_transition_events.csv',
              'interface_flux_history.csv',
              'saturation_margin_history.csv',
              'report.md',
              'artifact_sha256.txt',
              'phase_margin_sound_speed.png',
              'interface_flux_boundary_pressure.png',
              'projection_quality.png',
          ):
              assert (target / name).is_file(), name
          PY
      - name: Compile and diff checks
        run: |
          python -m compileall -q src tests
          git diff --check
      - name: Run dedicated Gate 7 tests
        run: |
          python -m pytest -q \
            tests/test_stage7_lco2_hem_pipeline_phase_chatter_diagnosis.py \
            --strict-markers --junitxml=gate7-dedicated.xml
      - name: Run related Stage 7 regressions
        run: |
          python -m pytest -q \
            tests/test_stage7_lco2_hem_pipeline_depressurization_increment2.py \
            tests/test_stage7_lco2_hem_near_saturation_acoustic_continuity.py \
            tests/test_stage7_lco2_hem_pipeline_post_crossing_propagation.py \
            tests/test_stage7_lco2_hem_pipeline_phase_chatter_diagnosis.py \
            --strict-markers --junitxml=related-stage7.xml
      - name: Run full repository tests
        run: |
          python -m pytest -q --strict-markers --junitxml=full-repository.xml
      - name: Assert authoritative JUnit is clean
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          for name in ('gate7-dedicated.xml', 'related-stage7.xml', 'full-repository.xml'):
              root = ET.parse(Path(name)).getroot()
              suites = [root] if root.tag == 'testsuite' else list(root.findall('testsuite'))
              totals = {
                  key: sum(int(s.attrib.get(key, 0)) for s in suites)
                  for key in ('tests', 'skipped', 'failures', 'errors')
              }
              print(name, totals)
              assert totals['skipped'] == 0
              assert totals['failures'] == 0
              assert totals['errors'] == 0
          PY
      - name: Upload Gate 7 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stage7-phase-chatter-diagnosis-${{ github.run_id }}
          path: |
            artifacts/stage7-phase-chatter-diagnosis
            gate7-dedicated.xml
            related-stage7.xml
            full-repository.xml
          if-no-files-found: warn
