name: Agent U3 B2 Review Fix Executor

on:
  push:
    branches: [agent/u3-b2-review-fix-executor]
    paths:
      - ".github/workflows/agent-u3-b2-review-fix-executor.yml"

permissions:
  contents: write

concurrency:
  group: agent-u3-b2-review-fix-executor
  cancel-in-progress: true

jobs:
  apply-review-fixes:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPYCACHEPREFIX: ${{ runner.temp }}/u3-b2-review-fix-pycache
      TARGET_BRANCH: agent/u3-b2-fvm-adapter-clean
    steps:
      - name: Checkout target PR branch
        uses: actions/checkout@v7
        with:
          ref: agent/u3-b2-fvm-adapter-clean
          fetch-depth: 0

      - name: Fetch retained review-fix definition
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            +refs/heads/agent/u3-b2-review-fix-payload:refs/remotes/origin/agent/u3-b2-review-fix-payload
          git show \
            origin/agent/u3-b2-review-fix-payload:.github/workflows/agent-u3-b2-review-feedback-fixes.yml \
            > "$RUNNER_TEMP/agent-u3-b2-review-feedback-fixes.yml"
          python - <<'PY'
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          source = (temp / "agent-u3-b2-review-feedback-fixes.yml").read_text(
              encoding="utf-8"
          )
          opening = "          python - <<'PY'\n"
          closing = "\n          PY\n"
          start = source.index(opening) + len(opening)
          end = source.index(closing, start)
          lines = source[start:end].splitlines()
          script = "\n".join(
              line[10:] if line.startswith("          ") else line for line in lines
          ) + "\n"
          old = "history = solver.run(t_end=candidate_dt, max_steps=2, sample_every=1)"
          new = "history = solver.run(t_end=candidate_dt, max_steps=3, sample_every=1)"
          if script.count(old) != 1:
              raise RuntimeError("expected one max_steps=2 review-test occurrence")
          script = script.replace(old, new, 1)
          target = temp / "u3_b2_review_fix.py"
          target.write_text(script, encoding="utf-8")
          compile(script, str(target), "exec")
          print(f"extracted_lines={len(lines)}")
          PY

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install focused dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.5.1' 'pytest==9.1.1'

      - name: Apply and verify review fixes
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python "$RUNNER_TEMP/u3_b2_review_fix.py"
          python -m py_compile \
            src/liquid_gas_transient/solver.py \
            src/liquid_gas_transient/u3_b2_fvm_discharge_adapter_authoritative.py \
            tests/test_stage7_u3_b2_fvm_discharge_adapter.py
          git diff --check
          python -m pytest -q \
            tests/test_stage7_u3_b2_fvm_discharge_adapter.py \
            -k 'adapter_does_not_import or solver_without_hook or run_history_records or inventory_orientation' \
            --strict-markers
          grep -q 'accepted_dt = self.step(candidate_dt)' \
            src/liquid_gas_transient/solver.py
          grep -q 'dedicated_junit.xml": (11, 11)' \
            .github/workflows/stage7-u3-b2-fvm-adapter-face-one-step.yml
          grep -q '## 結果' \
            src/liquid_gas_transient/u3_b2_fvm_discharge_adapter_authoritative.py
          python - <<'PY'
          import subprocess

          expected = {
              '.github/workflows/stage7-u3-b2-fvm-adapter-face-one-step.yml',
              'docs/verification/stage7_u3_b2_fvm_discharge_adapter.md',
              'src/liquid_gas_transient/solver.py',
              'src/liquid_gas_transient/u3_b2_fvm_discharge_adapter_authoritative.py',
              'tests/test_stage7_u3_b2_fvm_discharge_adapter.py',
          }
          actual = set(
              subprocess.check_output(
                  ['git', 'diff', '--name-only'], text=True
              ).splitlines()
          )
          assert actual == expected, (sorted(actual), sorted(expected))
          PY

      - name: Commit clean review fixes to PR branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/agent-u3-b2-review-fix-bridge.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Address U3 B2 Adapter review feedback"
          git push origin "HEAD:${TARGET_BRANCH}"
