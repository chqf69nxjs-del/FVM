name: Agent U3 B2 Review Fix Executor

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [agent/u3-b2-fvm-adapter-clean]
    paths:
      - ".github/workflows/agent-u3-b2-review-fix-executor.yml"

permissions:
  contents: read

concurrency:
  group: agent-u3-b2-review-fix-executor-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-executor-lane:
    if: ${{ false }}
    runs-on: macos-15
    steps:
      - run: echo "Review-fix executor completed and was superseded."
