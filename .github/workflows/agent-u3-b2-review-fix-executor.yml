name: Agent U3 B2 Review Fix Executor

on:
  push:
    branches: [agent/u3-b2-review-fix-executor]
    paths:
      - ".github/workflows/agent-u3-b2-review-fix-executor.yml"

permissions:
  contents: read

concurrency:
  group: agent-u3-b2-review-fix-executor
  cancel-in-progress: true

jobs:
  release-runner:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Release temporary executor lane
        shell: pwsh
        run: Write-Host "Temporary executor superseded by PR review-fix bridge."
