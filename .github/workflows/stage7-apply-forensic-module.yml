name: Stage 7 Apply Forensic Module

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-module:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/stage7-pipeline-4mpa-subthreshold-forensics
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python .github/scripts/apply_forensic_module.py
      - uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: Generate forensic diagnostics module
          file_pattern: src/liquid_gas_transient/hem_pipeline_4mpa_subthreshold_forensics.py
