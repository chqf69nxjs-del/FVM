name: Stage 7 P2 HNE Shadow Pipeline A2.3 Closeout

on:
  push:
    branches:
      - agent/stage7-p2-hne-shadow-pipeline-a2-3-closeout
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage7-p2-hne-shadow-pipeline-a2-3-closeout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p2-hne-shadow-pipeline-a2-3-closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
      ANALYSIS_SOURCE_GIT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.5.2' 'pytest==9.1.1'

      - name: Assert frozen A2.3 authority and closeout change envelope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ANALYSIS_SOURCE_GIT_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python - <<'PY'
          import subprocess

          source_a2_3_sha = "799edb09faa1502e25837c97fa5d168ad79e492e"
          subprocess.check_call(
              ["git", "cat-file", "-e", source_a2_3_sha + "^{commit}"]
          )
          expected = {
              ".github/workflows/stage7-p2-hne-shadow-pipeline-a2-3-closeout.yml",
              "docs/verification/stage7_p2_hne_shadow_pipeline_a2_3_closeout.md",
              "src/liquid_gas_transient/hne_shadow_pipeline_closeout.py",
              "tests/test_stage7_p2_hne_shadow_pipeline_a2_3_closeout.py",
          }
          actual = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", source_a2_3_sha, "HEAD"],
                  text=True,
              ).splitlines()
          )
          assert actual == expected, (
              "P2-A2.3 closeout changed files outside the authority envelope: "
              f"expected={sorted(expected)} actual={sorted(actual)}"
          )
          print("p2_a2_3_authority_sha=" + source_a2_3_sha)
          print("p2_a2_3_closeout_change_envelope=confirmed")
          PY

      - name: Compile and clean generated bytecode
        run: |
          set -euo pipefail
          python -m compileall -q src tests
          git diff --check
          find src tests -type d -name __pycache__ -prune -exec rm -rf {} +
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Generate closeout evidence from a clean checkout
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          rm -rf artifacts/stage7/p2-hne-shadow-pipeline-a2-3-closeout
          python -m liquid_gas_transient.hne_shadow_pipeline_closeout \
            --output-dir artifacts/stage7/p2-hne-shadow-pipeline-a2-3-closeout

      - name: Gate frozen evidence and maturity boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          target = Path("artifacts/stage7/p2-hne-shadow-pipeline-a2-3-closeout")
          expected = {"summary.json", "operator_report.md", "manifest.json"}
          actual = {path.name for path in target.iterdir() if path.is_file()}
          assert actual == expected, (sorted(expected), sorted(actual))

          summary = json.loads((target / "summary.json").read_text(encoding="utf-8"))
          manifest = json.loads((target / "manifest.json").read_text(encoding="utf-8"))
          source = summary["source"]

          assert summary["closeout_ready"] is True
          assert summary["failed_gates"] == []
          assert all(summary["gate_results"].values())
          assert summary["closeout_outcome"] == (
              "A2_3_FORMALLY_CLOSED_WITH_HYDRODYNAMIC_COUPLING_GATE_CLOSED"
          )
          assert source["a2_3_sha"] == (
              "799edb09faa1502e25837c97fa5d168ad79e492e"
          )
          assert source["workflow_run_id"] == 31999652196
          assert source["workflow_conclusion"] == "success"
          assert source["artifact_id"] == 9277959046
          assert source["artifact_sha256"] == (
              "9af5b48eb941e55c027ca4ad6ca7aab74f8d7f7ab6fc7b8426f32066f9db547c"
          )
          assert source["analysis_sha256"] == (
              "4d20bf56f020eeed33d49f70722a00a9f2fc1445f80181fe52ab84de68e749f5"
          )
          assert summary["runtime_provenance"]["analysis_source_git_sha"] == (
              summary["runtime_provenance"]["checkout_git_sha"]
          )
          assert summary["runtime_provenance"]["git_status_porcelain"] == ""
          assert summary["coupling_authority"]["p_hne_to_flux"] is False
          assert summary["coupling_authority"]["c_hne_to_flux_or_cfl"] is False
          assert summary["coupling_authority"]["hydrodynamic_coupling_allowed"] is False
          for key in (
              "hydrodynamic_coupling_allowed",
              "physical_hne_vertical_slice",
              "working_vertical_slice",
              "verified",
              "accepted",
              "physically_validated",
              "design_use_accepted",
              "production_approved",
          ):
              assert summary["formal_status"][key] is False
          assert summary["next_authorized_action"] == (
              "PROCEED_TO_A2_4_1_NONEQUILIBRIUM_ACOUSTIC_CLOSURE_CONTRACT"
          )
          assert len(summary["authority_sha256"]) == 64

          assert manifest["declared_file_count"] == 3
          assert manifest["declared_file_names"] == [
              "summary.json",
              "operator_report.md",
              "manifest.json",
          ]
          assert set(manifest["payload_files"]) == {
              "summary.json",
              "operator_report.md",
          }
          assert manifest["authority_sha256"] == summary["authority_sha256"]
          assert manifest["source_a2_3_sha"] == source["a2_3_sha"]
          assert manifest["closeout_ready"] is True
          assert manifest["hydrodynamic_coupling_allowed"] is False
          print("p2_a2_3_closeout_authority_sha256=" + summary["authority_sha256"])
          print("p2_a2_3_closeout=ready")
          print("p2_a2_3_hydrodynamic_coupling_gate=closed")
          PY

      - name: Run focused closeout tests
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_stage7_p2_hne_shadow_pipeline_a2_3_closeout.py \
            --strict-markers \
            --junitxml=p2-a2-3-closeout-focused.xml

      - name: Assert focused JUnit is clean
        run: |
          set -euo pipefail
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("p2-a2-3-closeout-focused.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
          totals = {
              key: sum(int(s.attrib.get(key, 0)) for s in suites)
              for key in ("tests", "skipped", "failures", "errors")
          }
          print(totals)
          assert totals == {
              "tests": 5,
              "skipped": 0,
              "failures": 0,
              "errors": 0,
          }
          PY

      - name: Assert pristine tracked checkout after execution
        run: |
          set -euo pipefail
          status="$(git status --porcelain=v1 --untracked-files=no)"
          printf 'post_test_tracked_git_status=%s\n' "$status"
          test -z "$status"

      - name: Upload P2-A2.3 closeout evidence
        uses: actions/upload-artifact@v7
        with:
          name: stage7-p2-hne-shadow-pipeline-a2-3-closeout-${{ github.run_id }}
          path: |
            artifacts/stage7/p2-hne-shadow-pipeline-a2-3-closeout
            p2-a2-3-closeout-focused.xml
          if-no-files-found: error
          compression-level: 6
