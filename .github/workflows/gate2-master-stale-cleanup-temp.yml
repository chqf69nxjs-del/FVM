name: Gate 2 Master Stale Cleanup Temp

on:
  push:
    branches:
      - agent/stage7-central-record-sync-pr77-pr84
    paths:
      - .github/gate2_master_cleanup.py

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/stage7-central-record-sync-pr77-pr84
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Replace stale master tail
        run: python .github/gate2_master_cleanup.py
      - name: Validate
        run: |
          git diff --check
          grep -q 'Historical checkpoint after PR #75 — superseded' docs/verification/MASTER_VERIFICATION_INDEX.md
          ! grep -q 'pipeline depressurization:                      boundary verified; FVM transient not executed' docs/verification/MASTER_VERIFICATION_INDEX.md
          ! grep -q 'execute the fixed 5→2, 5→3, and 5→4 MPa short-run matrix' docs/verification/MASTER_VERIFICATION_INDEX.md
          grep -q 'Issue #85' docs/verification/MASTER_VERIFICATION_INDEX.md
          grep -q 'Issue #86' docs/verification/MASTER_VERIFICATION_INDEX.md
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/verification/MASTER_VERIFICATION_INDEX.md
          git commit -m 'Archive stale pre-PR #77 master checkpoint'
          git push origin HEAD:agent/stage7-central-record-sync-pr77-pr84
