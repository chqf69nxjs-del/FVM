name: Stage 7 Gate 3 Numeric Equivalence Reference

on:
  push:
    branches:
      - agent/stage7-gate3-numeric-equivalence-capture
  pull_request:
  workflow_dispatch:

env:
  PYTHONPATH: src
  PYTHONDONTWRITEBYTECODE: '1'
  MPLBACKEND: Agg
  ANALYSIS_SOURCE_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  GATE3_OUTPUT_DIR: ${{ runner.temp }}/stage7-gate3-numeric-reference
  GATE3_JUNIT_XML: ${{ runner.temp }}/gate3-numeric-capture.xml

jobs:
  capture-gate3-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pinned diagnostic runtime
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pytest 'numpy==2.5.1' 'CoolProp==8.0.0'

      - name: Report runtime
        run: |
          python - <<'PY'
          import platform
          import CoolProp
          import numpy
          print('platform', platform.platform())
          print('python', platform.python_version())
          print('numpy', numpy.__version__)
          print('CoolProp', CoolProp.__version__)
          PY

      - name: Assert pristine checkout before capture
        run: |
          echo "checkout_sha=$(git rev-parse HEAD)"
          status="$(git status --porcelain=v1 --untracked-files=all)"
          printf 'pre_capture_git_status=%s\n' "$status"
          test -z "$status"

      - name: Capture raw 128-cell CFL 0.10 histories
        run: |
          python -m liquid_gas_transient.hem_pipeline_gate3_numeric_capture \
            --output-dir "$GATE3_OUTPUT_DIR"

      - name: Inspect diagnostic boundaries and Ubuntu exact identity
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          target = Path(os.environ['GATE3_OUTPUT_DIR'])
          summary = json.loads(
              (target / 'gate3_numeric_capture_summary.json').read_text(
                  encoding='utf-8'
              )
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          assert summary['scope'] == 'diagnostic_only'
          assert summary['case_count'] == 3
          assert summary['n_cells'] == 128
          assert summary['cfl'] == 0.10
          assert summary['maximum_steps'] == 8000
          assert summary['exact_baseline_assertion_invoked'] is False
          assert summary['solver_logic_changed'] is False
          assert summary['algorithm_or_tolerance_changed'] is False
          assert summary['automatic_numeric_equivalence_acceptance'] is False
          assert summary['Gate_P2_passed'] is False
          assert summary['physical_validation'] is False
          assert summary['design_use_acceptance'] is False
          assert summary['production_hem_activation_approved'] is False

          for case in summary['cases']:
              comparison = case['authoritative_pr82_comparison']
              assert comparison['all_discrete_fields_exact'] is True
              assert comparison['all_numeric_fields_exact'] is True
              assert comparison['all_hash_fields_exact'] is True
              case_dir = target / case['case_id']
              for item in case['arrays'].values():
                  path = case_dir / item['file']
                  assert path.is_file()
                  assert path.stat().st_size > 0
          PY

      - name: Compile and run capture helper tests
        run: |
          python -m compileall -q src tests
          python -m pytest -q \
            tests/test_stage7_lco2_hem_pipeline_gate3_numeric_capture.py \
            --strict-markers \
            --junitxml="$GATE3_JUNIT_XML"
          git diff --check

      - name: Upload Gate 3 numeric reference
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stage7-gate3-numeric-reference-${{ github.run_id }}
          path: |
            ${{ env.GATE3_OUTPUT_DIR }}
            ${{ env.GATE3_JUNIT_XML }}
          if-no-files-found: error
