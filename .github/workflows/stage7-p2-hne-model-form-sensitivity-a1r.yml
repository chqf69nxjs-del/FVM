name: Stage 7 P2 HNE Model-Form Sensitivity A1R Audit

on:
  push:
    branches:
      - agent/stage7-p2-hne-model-form-sensitivity-a1r
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: src:tools/verification
  PYTHONDONTWRITEBYTECODE: "1"
  MPLBACKEND: Agg
  ANALYSIS_SOURCE_GIT_SHA: ${{ github.sha }}

jobs:
  p2-hne-model-form-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            'numpy==2.5.2' \
            'matplotlib==3.11.1' \
            'pytest==9.1.1' \
            'CoolProp==8.0.0'

      - name: Assert pristine checkout and frozen authorities
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ANALYSIS_SOURCE_GIT_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git rev-parse origin/main)" = "aa108961762c9ae70ee9940405024eb5188064b8"
          test "$(git rev-parse origin/agent/stage7-p1-numerical-sensitivity-closeout)" = "7ed7d71a35676a8160643eb7af81ecaebfe90e15"
          test "$(git rev-parse origin/agent/stage7-p2-hne-model-form-sensitivity-a1)" = "18d78f65c39047bde3bf06ceb61ca90fb6551b36"
          echo "p1_and_p2_a1_authorities=confirmed"

      - name: Execute P2-A1R closure audit
        run: |
          set -euo pipefail
          temporary_output="${RUNNER_TEMP}/stage7-p2-hne-model-form-sensitivity-a1r"
          repository_output="artifacts/stage7-p2-hne-model-form-sensitivity-a1r"
          rm -rf "$temporary_output" "$repository_output"
          set +e
          python -m liquid_gas_transient.hne_pipeline_model_form_audit \
            --output-dir "$temporary_output"
          analysis_exit=$?
          set -e
          tracked_status="$(git status --porcelain=v1 --untracked-files=no)"
          printf 'post_execution_tracked_git_status=%s\n' "$tracked_status"
          test -z "$tracked_status"
          mkdir -p "$repository_output"
          cp -a "$temporary_output/." "$repository_output/"
          echo "$analysis_exit" > artifacts/p2_a1r_analysis_exit_code.txt
          echo "analysis_exit_code=$analysis_exit"

      - name: Inspect A1R evidence and corrected interpretation
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          target = Path('artifacts/stage7-p2-hne-model-form-sensitivity-a1r')
          expected = {
              'audit_summary.json',
              'case_disequilibrium.csv',
              'front_relation_history.csv',
              'signed_quality_lag_history.csv',
              'closure_limitations.csv',
              'signed_quality_lag_envelope.png',
              'front_relation_counts.png',
              'operator_report.md',
              'audit_manifest.json',
          }
          assert {p.name for p in target.iterdir() if p.is_file()} == expected
          summary = json.loads((target / 'audit_summary.json').read_text(encoding='utf-8'))
          manifest = json.loads((target / 'audit_manifest.json').read_text(encoding='utf-8'))

          assert summary['source_p2_a1_branch_sha'] == '18d78f65c39047bde3bf06ceb61ca90fb6551b36'
          assert summary['source_p2_a1_model_form_sha256'] == 'c129b953129810053d0b9520241bc26cca4878201b894ce3d403b2d94f2004aa'
          assert summary['audit_ready'] is True
          assert summary['execution_status'] == 'A1R_AUDIT_READY_WITH_CLOSURE_LIMITATION'
          assert all(summary['gate_results'].values())
          assert summary['physical_hne_claim_allowed'] is False
          assert summary['interpretation']['tau_to_zero_limit'] == 'BITWISE_HEM_LIMIT_RETAINED'
          assert summary['interpretation']['finite_tau_quality_behavior'] == 'MIXED_SIGN_TRANSPORTED_EQUILIBRIUM_DISEQUILIBRIUM'
          assert summary['interpretation']['onset_delay_at_tested_resolution'] == 'RESOLVED_FOR_SLOW_TAU_ONLY'
          assert summary['interpretation']['kinetic_front_behavior'] == 'MIXED_LAG_AND_LEAD_UNDER_INDEPENDENT_QUALITY_TRANSPORT'
          assert summary['interpretation']['physical_hne_interpretation'] == 'NOT_AUTHORIZED'
          assert summary['next_phase_decision'] == 'PROCEED_TO_P2_A2_THERMODYNAMIC_CLOSURE_REFINEMENT_BEFORE_BROAD_TAU_SWEEP'

          by_id = {row['model_id']: row for row in summary['case_disequilibrium']}
          assert list(by_id) == [
              'HEM_EQUILIBRIUM',
              'HNE_TAU_NEAR_ZERO',
              'HNE_TAU_MEDIUM',
              'HNE_TAU_SLOW',
          ]
          assert by_id['HNE_TAU_NEAR_ZERO']['behavior_classification'] == 'HEM_LIMIT'
          medium = by_id['HNE_TAU_MEDIUM']
          slow = by_id['HNE_TAU_SLOW']
          assert medium['behavior_classification'] == 'NO_RESOLVED_ONSET_DELAY_WITH_TRANSIENT_FRONT_LEAD'
          assert slow['behavior_classification'] == 'RESOLVED_ONSET_DELAY_WITH_MIXED_FRONT_LAG_AND_LEAD'
          assert math.isclose(medium['onset_delay_s'], 0.0, rel_tol=0.0, abs_tol=0.0)
          assert math.isclose(slow['onset_delay_s'], 1.2027442149329152e-05, rel_tol=1e-12, abs_tol=1e-15)
          assert (medium['kinetic_absent_count'], medium['kinetic_behind_count'], medium['coincident_count'], medium['kinetic_ahead_count']) == (0, 0, 53, 12)
          assert (slow['kinetic_absent_count'], slow['kinetic_behind_count'], slow['coincident_count'], slow['kinetic_ahead_count']) == (2, 2, 46, 15)
          for row in (medium, slow):
              assert row['minimum_signed_quality_lag'] < 0.0
              assert row['maximum_signed_quality_lag'] > 0.0
              assert row['hydrodynamic_state_matches_hem'] is True
          assert summary['formal_status']['p2_model_form_vertical_slice'] is True
          assert summary['formal_status']['physical_hne_vertical_slice'] is False
          assert summary['formal_status']['verified'] is False
          assert summary['formal_status']['accepted'] is False
          assert summary['formal_status']['physically_validated'] is False
          assert summary['formal_status']['design_use_accepted'] is False
          assert summary['formal_status']['production_approved'] is False

          assert manifest['declared_file_count'] == 9
          assert set(manifest['declared_file_names']) == expected
          assert manifest['audit_ready'] is True
          assert manifest['audit_sha256'] == summary['audit_sha256']
          assert manifest['physical_hne_claim_allowed'] is False
          assert set(manifest['payload_files']) == expected - {'audit_manifest.json'}
          for item in manifest['payload_files'].values():
              assert item['size_bytes'] > 0
              assert len(item['sha256']) == 64

          print('P2_A1R_STATUS=' + summary['execution_status'])
          print('P2_A1R_SHA256=' + summary['audit_sha256'])
          print('medium_onset_delay_us=' + str(1e6 * medium['onset_delay_s']))
          print('slow_onset_delay_us=' + str(1e6 * slow['onset_delay_s']))
          print('medium_front_counts=', medium['kinetic_absent_count'], medium['kinetic_behind_count'], medium['coincident_count'], medium['kinetic_ahead_count'])
          print('slow_front_counts=', slow['kinetic_absent_count'], slow['kinetic_behind_count'], slow['coincident_count'], slow['kinetic_ahead_count'])
          PY

      - name: Compile and diff checks
        run: |
          set -euo pipefail
          python -m compileall -q src tests
          git diff --check

      - name: Run focused A1R tests
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_stage7_p2_hne_model_form_audit.py \
            --strict-markers \
            --junitxml=p2-a1r-focused.xml

      - name: Assert focused JUnit is clean
        run: |
          set -euo pipefail
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('p2-a1r-focused.xml').getroot()
          suites = [root] if root.tag == 'testsuite' else list(root.findall('testsuite'))
          totals = {
              key: sum(int(s.attrib.get(key, 0)) for s in suites)
              for key in ('tests', 'skipped', 'failures', 'errors')
          }
          print(totals)
          assert totals == {'tests': 5, 'skipped': 0, 'failures': 0, 'errors': 0}
          PY

      - name: Require ready exit and no maturity promotion
        run: |
          set -euo pipefail
          test "$(cat artifacts/p2_a1r_analysis_exit_code.txt)" = "0"
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(
              Path('artifacts/stage7-p2-hne-model-form-sensitivity-a1r/audit_summary.json').read_text(encoding='utf-8')
          )
          assert summary['audit_ready'] is True
          assert all(summary['gate_results'].values())
          assert summary['physical_hne_claim_allowed'] is False
          assert summary['formal_status']['verified'] is False
          assert summary['formal_status']['accepted'] is False
          PY

      - name: Assert pristine tracked checkout after execution
        run: |
          set -euo pipefail
          status="$(git status --porcelain=v1 --untracked-files=no)"
          printf 'post_test_tracked_git_status=%s\n' "$status"
          test -z "$status"

      - name: Upload P2-A1R evidence
        uses: actions/upload-artifact@v7
        with:
          name: stage7-p2-hne-model-form-sensitivity-a1r-${{ github.run_id }}
          path: |
            artifacts/stage7-p2-hne-model-form-sensitivity-a1r
            artifacts/p2_a1r_analysis_exit_code.txt
            p2-a1r-focused.xml
          if-no-files-found: error
          compression-level: 6
