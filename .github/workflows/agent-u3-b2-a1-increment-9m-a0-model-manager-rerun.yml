name: Agent U3 B2 A1 Increment 9M A1 Delegate Composition

on:
  push:
    branches: [agent/u3-b2-a1-9m-a1]
    paths:
      - ".github/workflows/agent-u3-b2-a1-increment-9m-a0-model-manager-rerun.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: src:tools/verification
  PYTHONDONTWRITEBYTECODE: "1"
  A0_HEAD: 9a4983599b3235fbaebd8ef4bea33f6938bbdde6

jobs:
  test-a1:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"
      - name: Compile and protect existing sources
        run: |
          git diff --check "${A0_HEAD}" HEAD
          git diff --exit-code "${A0_HEAD}" HEAD -- \
            src/liquid_gas_transient/physics_model_manager.py \
            src/liquid_gas_transient/__init__.py \
            tools/verification/u3_b2_a1_increment_9l_two_state_boundary_state_machine.py
          python -m py_compile \
            tools/verification/u3_b2_a1_increment_9m_a1_delegate_composition.py
      - name: Check delegate-only structure
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('tools/verification/u3_b2_a1_increment_9m_a1_delegate_composition.py').read_text()
          for name in ('_prepare_three_branch', '_prepare_finite', '_prepare_closed'):
              assert f'self._hook.{name}(' in source
              assert f'def {name}(' not in source
          for forbidden in ('import numpy', 'import CoolProp', 'FvmSolver', 'step == 484', 'step == 638'):
              assert forbidden not in source
          PY
      - name: Run A0 and A1 semantics
        run: |
          python -m pip install 'pytest==9.1.1'
          python -m pytest -q \
            tests/test_physics_model_manager_core.py \
            tests/test_physics_model_manager_observation.py \
            tests/test_physics_model_manager_rejections.py \
            tests/test_physics_model_manager_independence.py \
            tests/test_increment_9m_a1_delegate_composition.py

# rerun after correcting the A1 test parametrization
