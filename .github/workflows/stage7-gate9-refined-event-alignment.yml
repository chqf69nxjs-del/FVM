name: Stage 7 Gate 9 Refined CFL Event Alignment

on:
  pull_request:
    paths:
      - "src/liquid_gas_transient/hem_gate9_refined_event_alignment.py"
      - "tests/test_stage7_lco2_hem_gate9_refined_event_alignment.py"
      - "docs/verification/stage7_gate9_d4_refined_event_alignment.md"
      - ".github/workflows/stage7-gate9-refined-event-alignment.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage7-gate9-d4-refined-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: src
  PYTHONDONTWRITEBYTECODE: "1"
  MPLBACKEND: Agg
  ANALYSIS_SOURCE_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  gate9-d4-refined-event-alignment:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install fixed dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy matplotlib pytest 'CoolProp==8.0.0'

      - name: Assert pristine checkout
        run: |
          echo "checkout_sha=$(git rev-parse HEAD)"
          status="$(git status --porcelain=v1 --untracked-files=all)"
          printf 'pre_execution_git_status=%s\n' "$status"
          test -z "$status"

      - name: Execute refined CFL diagnostic OFF/ON pairs
        run: |
          temporary_output="${RUNNER_TEMP}/stage7-gate9-d4-refined"
          repository_output="artifacts/stage7-gate9-d4-refined"
          rm -rf "$temporary_output" "$repository_output"
          python -m liquid_gas_transient.hem_gate9_refined_event_alignment \
            --output-dir "$temporary_output"
          tracked_status="$(git status --porcelain=v1 --untracked-files=no)"
          printf 'post_execution_tracked_git_status=%s\n' "$tracked_status"
          test -z "$tracked_status"
          mkdir -p "$repository_output"
          cp -a "$temporary_output/." "$repository_output/"

      - name: Inspect refined D4 evidence contract
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          target = Path('artifacts/stage7-gate9-d4-refined')
          summary = json.loads(
              (target / 'summary.json').read_text(encoding='utf-8')
          )
          assert summary['schema_version'] == (
              'stage7_gate9_d4_refined_columns_v1'
          )
          assert summary['scope'] == (
              'verification_only_event_aligned_refined_cfl_columns'
          )
          assert summary['locked_cfl_columns'] == [0.05, 0.025]
          assert summary['column_count'] == 2
          assert summary['column_artifact_directories'] == [
              'cfl_0p050',
              'cfl_0p025',
          ]
          for key in (
              'all_gate8_identities_reproduced_exactly',
              'all_diagnostic_off_on_identities_passed',
              'all_rusanov_reconstruction_guards_passed',
              'all_cfl_decisions_match_production_dt',
              'all_timeline_records_have_source_time',
              'all_formal_stops_honored_without_continuation',
              'refined_event_alignment_complete',
          ):
              assert summary[key] is True, key
          assert summary['Gate_9_execution_complete'] is False
          assert summary['crossing_depth_root_cause_approved'] is False
          assert summary['physical_validation'] is False
          assert summary['design_use_acceptance'] is False

          by_cfl = {float(row['cfl']): row for row in summary['columns']}
          expected = {
              0.05: {
                  'outcome': 'GUARD_FAILURE',
                  'step': 249,
                  'time': 7.967173062790038e-4,
                  'quality': 1.1006096906989802e-7,
                  'window': list(range(241, 250)),
                  'state': 'd18e4bdf1477c29f1183b2f3276c84e086f6cfef80c336a7f6f13616769c5a29',
                  'signature': '1292331d53eddd7ec700d8a76bc3900a501c40f4671c758b0ae4bd5c9487cfde',
              },
              0.025: {
                  'outcome': 'ACCEPTED_FIRST_CROSSING',
                  'step': 499,
                  'time': 7.981201399992095e-4,
                  'quality': 1.3949366092287805e-6,
                  'window': list(range(491, 500)),
                  'state': 'cb2d5859775d1b1c736e936af798c36cd8d20c73d926de9ed47bcc0aadb1f688',
                  'signature': '5af1d089f4139b209a7bfc192a4fc5d6afda9da4031a60a1d13f0ddf683e6dd7',
              },
          }
          for cfl, contract in expected.items():
              row = by_cfl[cfl]
              assert row['formal_outcome'] == contract['outcome']
              assert row['candidate_step'] == contract['step']
              assert row['candidate_time_s'] == contract['time']
              assert row['candidate_cells'] == [29]
              assert row['maximum_candidate_quality'] == contract['quality']
              assert row['window_steps'] == contract['window']
              assert row['available_pre_step_count'] == 8
              assert row['available_post_step_count'] == 0
              assert row['post_window_status'] == (
                  'NOT_AVAILABLE_DUE_TO_FORMAL_STOP'
              )
              assert row['exact_cell_stage_record_count'] == 180
              assert row['d1_cell_stage_record_count'] == 108
              assert row['interface_flux_record_count'] == 45
              assert row['cfl_decision_record_count'] == 9
              assert row['aligned_acoustic_record_count'] > 0
              assert row['gate8_identity_reproduced_exactly'] is True
              assert row['diagnostic_off_on_identity'] is True
              assert row['all_acoustic_records_have_step_cell_stage_dt'] is True
              assert row['all_cfl_decisions_match_production_dt'] is True
              assert row['all_timeline_records_have_source_time'] is True
              assert row['rusanov_reconstruction_guard_passed'] is True
              assert row['forced_post_guard_continuation'] is False
              identity = row['solver_identity_on']
              assert identity['final_state_sha256'] == contract['state']
              assert identity['run_signature_sha256'] == contract['signature']

          with (target / 'per_cfl_candidate_metrics.csv').open(
              newline='', encoding='utf-8'
          ) as handle:
              metrics = list(csv.DictReader(handle))
          assert len(metrics) == 2
          assert {float(row['cfl']) for row in metrics} == {0.05, 0.025}

          for token in ('0p050', '0p025'):
              column = target / f'cfl_{token}'
              expected_files = {
                  'summary.json',
                  'event_aligned_exact_cell_stage_history.csv',
                  'event_aligned_d1_cell_stage_history.csv',
                  'event_aligned_interface_flux_history.csv',
                  'event_aligned_acoustic_history.csv',
                  'event_aligned_cfl_decision_history.csv',
                  'candidate_event_timeline.csv',
                  'candidate_summary.json',
                  'artifact_sha256.txt',
              }
              assert expected_files == {path.name for path in column.iterdir()}
              payload = json.loads(
                  (column / 'summary.json').read_text(encoding='utf-8')
              )
              assert payload['exact_cell_stage_record_count'] == 180
              assert payload['d1_cell_stage_record_count'] == 108
              assert payload['interface_flux_record_count'] == 45
              assert payload['cfl_decision_record_count'] == 9
              assert payload['aligned_acoustic_record_count'] > 0
          PY

      - name: Compile and diff checks
        run: |
          python -m compileall -q src tests
          git diff --check

      - name: Run dedicated refined D4 tests
        run: |
          python -m pytest -q \
            tests/test_stage7_lco2_hem_gate9_refined_event_alignment.py \
            --strict-markers \
            --junitxml=gate9-d4-refined-dedicated.xml

      - name: Run related Stage 7 regressions
        run: |
          python -m pytest -q \
            tests/test_stage7_gate9_contract.py \
            tests/test_stage7_lco2_hem_pipeline_post_crossing_cfl_sensitivity_full.py \
            tests/test_stage7_lco2_hem_gate9_instrumentation_scaffold.py \
            tests/test_stage7_lco2_hem_gate9_rusanov_decomposition.py \
            tests/test_stage7_lco2_hem_gate9_acoustic_attempt_diagnostics.py \
            tests/test_stage7_lco2_hem_gate9_event_alignment.py \
            tests/test_stage7_lco2_hem_gate9_refined_event_alignment.py \
            --strict-markers \
            --junitxml=related-stage7.xml

      - name: Run full repository tests
        run: |
          python -m pytest -q --strict-markers --junitxml=full-repository.xml

      - name: Assert authoritative JUnit is clean
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          for name in (
              'gate9-d4-refined-dedicated.xml',
              'related-stage7.xml',
              'full-repository.xml',
          ):
              root = ET.parse(Path(name)).getroot()
              suites = (
                  [root]
                  if root.tag == 'testsuite'
                  else list(root.findall('testsuite'))
              )
              totals = {
                  key: sum(int(s.attrib.get(key, 0)) for s in suites)
                  for key in ('tests', 'skipped', 'failures', 'errors')
              }
              print(name, totals)
              assert totals['skipped'] == 0
              assert totals['failures'] == 0
              assert totals['errors'] == 0
          PY

      - name: Upload refined D4 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stage7-gate9-d4-refined-${{ github.run_id }}
          path: |
            artifacts/stage7-gate9-d4-refined
            gate9-d4-refined-dedicated.xml
            related-stage7.xml
            full-repository.xml
          if-no-files-found: warn
