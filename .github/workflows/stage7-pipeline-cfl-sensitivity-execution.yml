name: Stage 7 Pipeline CFL Sensitivity Execution

on:
  push:
    branches:
      - agent/stage7-gate4-low-cfl-matrix
  pull_request:
  workflow_dispatch:

env:
  PYTHONPATH: src
  PYTHONDONTWRITEBYTECODE: '1'
  MPLBACKEND: Agg
  ANALYSIS_SOURCE_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  execute-fixed-low-cfl-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install runtime dependencies without modifying checkout
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy matplotlib pytest 'CoolProp==8.0.0'
      - name: Smoke check
        run: |
          python - <<'PY'
          import CoolProp, matplotlib, numpy
          print('CoolProp', CoolProp.__version__)
          print('matplotlib', matplotlib.__version__)
          print('NumPy', numpy.__version__)
          PY
      - name: Assert pristine checkout before numerical execution
        run: |
          echo "checkout_sha=$(git rev-parse HEAD)"
          status="$(git status --porcelain=v1 --untracked-files=all)"
          printf 'pre_execution_git_status=%s\n' "$status"
          test -z "$status"
      - name: Execute authoritative fixed nine-run CFL matrix
        run: |
          python -m liquid_gas_transient.hem_pipeline_cfl_sensitivity_evidence \
            --output-dir artifacts/stage7-pipeline-cfl-sensitivity
      - name: Inspect traceable Gate 4 artifacts
        run: |
          python - <<'PY'
          import csv
          import json
          import os
          from pathlib import Path
          from PIL import Image

          target = Path('artifacts/stage7-pipeline-cfl-sensitivity')
          summary = json.loads(
              (target / 'pipeline_cfl_sensitivity_summary.json').read_text(
                  encoding='utf-8'
              )
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          assert summary['case_count'] == 9
          assert summary['n_cells'] == 128
          assert summary['dx_m'] == 1.0 / 128.0
          assert summary['cfl_values'] == [0.10, 0.05, 0.025]
          assert summary['cfl_step_caps'] == {
              '0.100': 8000,
              '0.050': 16000,
              '0.025': 32000,
          }
          assert summary['cfl_0p10_baseline_reproduced_exactly'] is True
          assert summary['only_cfl_and_step_cap_varied'] is True
          assert summary['gate4_execution_completed_in_ci'] is True
          assert summary['local_pc_checkpoint_completed'] is True
          assert summary['low_cfl_result_accepted'] is False
          assert summary['central_record_promotion_allowed'] is False
          assert summary['CFL_independent_crossing_verified'] is False
          assert summary['Gate_P2_passed'] is False
          assert len(summary['cases']) == 9
          assert summary['four_mpa_classifications']

          identity = summary['analysis_identity']
          assert identity == {
              'analysis_id': 'stage7_pipeline_cfl_sensitivity_matrix',
              'model': 'HEM',
              'backend': 'coolprop_co2',
              'version': '8.0.0',
          }
          provenance = summary['provenance']
          assert provenance['source_git_sha'] == os.environ['ANALYSIS_SOURCE_GIT_SHA']
          assert provenance['checkout_git_sha']
          assert provenance['git_status_porcelain'] == ''
          assert provenance['property_backend_version'] == '8.0.0'

          with (target / 'pipeline_cfl_sensitivity_cases.csv').open(
              newline='', encoding='utf-8'
          ) as handle:
              rows = list(csv.DictReader(handle))
          assert len(rows) == 9
          assert {row['cfl'] for row in rows} == {'0.1', '0.05', '0.025'}
          assert all(row['analysis_model'] == 'HEM' for row in rows)
          assert all(row['property_backend_version'] == '8.0.0' for row in rows)
          assert all(row['checkout_is_clean'] == 'True' for row in rows)
          assert all(row['local_pc_checkpoint_completed'] == 'True' for row in rows)
          assert all(row['low_cfl_result_accepted'] == 'False' for row in rows)
          assert all(row['central_record_promotion_allowed'] == 'False' for row in rows)
          assert all(row['CFL_independent_crossing_verified'] == 'False' for row in rows)

          expected_plots = {
              'cfl_qeq_vs_cfl.png',
              'cfl_saturation_margin_vs_cfl.png',
              'cfl_crossing_time_position.png',
              'cfl_sound_speed_jump.png',
          }
          for name in expected_plots:
              path = target / name
              assert path.is_file(), name
              with Image.open(path) as image:
                  metadata = image.info
              assert metadata['analysis_id'] == identity['analysis_id']
              assert metadata['case'] == 'pipeline_liquid_control_p5m5_to_p4m5'
              assert metadata['model'] == identity['model']
              assert metadata['backend'] == identity['backend']
              assert metadata['version'] == identity['version']
              assert metadata['source_git_sha'] == provenance['source_git_sha']
              assert metadata['low_cfl_result_accepted'] == 'false'
          PY
      - name: Compile and diff checks
        run: |
          python -m compileall -q src tests
          git diff --check
      - name: Run dependency-free Gate 4 contract and artifact tests
        run: |
          python -m pytest -q \
            tests/test_stage7_lco2_hem_pipeline_cfl_sensitivity_contract.py \
            tests/test_stage7_lco2_hem_pipeline_cfl_0p10_baseline.py \
            tests/test_stage7_lco2_hem_pipeline_cfl_sensitivity_evidence.py \
            --strict-markers \
            --junitxml=gate4-pure.xml
      - name: Run related Stage 7 regressions
        run: |
          python -m pytest -q \
            tests/test_stage7_lco2_hem_pipeline_depressurization_increment2.py \
            tests/test_stage7_lco2_hem_pipeline_4mpa_subthreshold_forensics.py \
            tests/test_stage7_lco2_hem_pipeline_4mpa_subthreshold_forensics_contract.py \
            tests/test_stage7_lco2_hem_pipeline_4mpa_mesh_sensitivity.py \
            tests/test_stage7_lco2_hem_pipeline_cfl_sensitivity_contract.py \
            tests/test_stage7_lco2_hem_pipeline_cfl_0p10_baseline.py \
            tests/test_stage7_lco2_hem_pipeline_cfl_sensitivity_evidence.py \
            --strict-markers \
            --junitxml=related-stage7.xml
      - name: Run full repository tests
        run: |
          python -m pytest -q --strict-markers --junitxml=full-repository.xml
      - name: Assert no authoritative skips, failures, or errors
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          for name in ('gate4-pure.xml', 'related-stage7.xml', 'full-repository.xml'):
              root = ET.parse(Path(name)).getroot()
              suites = [root] if root.tag == 'testsuite' else list(root.findall('testsuite'))
              values = {
                  key: sum(int(s.attrib.get(key, 0)) for s in suites)
                  for key in ('tests', 'skipped', 'failures', 'errors')
              }
              print(name, values)
              assert values['skipped'] == 0
              assert values['failures'] == 0
              assert values['errors'] == 0
          PY
      - name: Upload Gate 4 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stage7-pipeline-cfl-sensitivity-${{ github.run_id }}
          path: |
            artifacts/stage7-pipeline-cfl-sensitivity
            gate4-pure.xml
            related-stage7.xml
            full-repository.xml
          if-no-files-found: warn
