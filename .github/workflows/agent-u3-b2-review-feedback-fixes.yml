name: Agent U3 B2 Review Feedback Fixes

on:
  push:
    branches: [agent/u3-b2-fvm-adapter-clean]
    paths:
      - ".github/workflows/agent-u3-b2-review-feedback-fixes.yml"
  pull_request:
    types: [synchronize, reopened]
    branches: [main]
    paths:
      - ".github/workflows/agent-u3-b2-review-feedback-fixes.yml"

permissions:
  contents: write

concurrency:
  group: agent-u3-b2-review-feedback-fixes
  cancel-in-progress: true

jobs:
  apply-review-fixes:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPYCACHEPREFIX: /tmp/u3-b2-review-fix-pycache
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v7
        with:
          ref: agent/u3-b2-fvm-adapter-clean
          fetch-depth: 0

      - name: Apply exact review fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          # P2: FvmSolver.run() must record the accepted dt returned by step().
          solver_path = Path("src/liquid_gas_transient/solver.py")
          solver = solver_path.read_text(encoding="utf-8")
          solver = replace_once(
              solver,
              "            dt = self.compute_dt(t_end)\n"
              "            if dt <= 0.0:\n"
              "                break\n"
              "            self.step(dt)\n"
              "            if self.step_count % sample_every == 0 or self.t >= t_end:\n"
              "                history.append(self.diagnostics(dt=dt))\n",
              "            candidate_dt = self.compute_dt(t_end)\n"
              "            if candidate_dt <= 0.0:\n"
              "                break\n"
              "            accepted_dt = self.step(candidate_dt)\n"
              "            if self.step_count % sample_every == 0 or self.t >= t_end:\n"
              "                history.append(self.diagnostics(dt=accepted_dt))\n",
              "accepted dt history",
          )
          solver_path.write_text(solver, encoding="utf-8")

          # P1/P2 tests: availability marker, non-CoolProp halving history regression,
          # and selective skips for only the CoolProp-dependent tests.
          test_path = Path("tests/test_stage7_u3_b2_fvm_discharge_adapter.py")
          tests = test_path.read_text(encoding="utf-8")
          tests = replace_once(
              tests,
              "import ast\nimport math\n",
              "import ast\nimport importlib.util\nimport math\n",
              "importlib availability import",
          )
          tests = replace_once(
              tests,
              "from liquid_gas_transient.eos import LinearLiquidEOS\n"
              "from liquid_gas_transient.grid import UniformGrid\n",
              "from liquid_gas_transient.eos import LinearLiquidEOS\n"
              "from liquid_gas_transient.flux import rusanov_flux\n"
              "from liquid_gas_transient.grid import UniformGrid\n",
              "rusanov import",
          )
          tests = replace_once(
              tests,
              "ADAPTER_SOURCE = Path(\n"
              "    \"src/liquid_gas_transient/u3_b2_fvm_discharge_adapter.py\"\n"
              ")\n\n\n",
              "ADAPTER_SOURCE = Path(\n"
              "    \"src/liquid_gas_transient/u3_b2_fvm_discharge_adapter.py\"\n"
              ")\n"
              "COOLPROP_AVAILABLE = importlib.util.find_spec(\"CoolProp\") is not None\n"
              "requires_coolprop = pytest.mark.skipif(\n"
              "    not COOLPROP_AVAILABLE,\n"
              "    reason=\"CoolProp is not installed in this environment\",\n"
              ")\n\n\n",
              "CoolProp availability marker",
          )

          history_test = '''\n\nclass _RejectFirstTrialHook:\n    maximum_halvings = 1\n    failure_outcome = BOUNDARY_UPDATE_POSITIVITY_FAILURE\n\n    def __init__(self) -> None:\n        self.validation_calls = 0\n\n    def limit_dt(self, *, candidate_dt: float, **kwargs) -> float:\n        return candidate_dt\n\n    def evaluate_flux(self, *, U, eos, **kwargs):\n        return np.asarray(rusanov_flux(U[-1:], U[-1:], eos)[0], dtype=float)\n\n    def validate_trial(self, **kwargs) -> None:\n        self.validation_calls += 1\n        if self.validation_calls == 1:\n            raise ValueError("synthetic first-trial rejection")\n\n\ndef test_run_history_records_accepted_halved_dt() -> None:\n    grid = UniformGrid(PipeGeometry(length_m=1.0, diameter_m=0.1), 8)\n    eos = LinearLiquidEOS()\n    U = make_conserved(\n        np.full(grid.n_cells, eos.rho_ref),\n        np.zeros(grid.n_cells),\n        np.full(grid.n_cells, eos.e_ref),\n        np.zeros(grid.n_cells),\n    )\n    hook = _RejectFirstTrialHook()\n    solver = FvmSolver(\n        grid=grid,\n        eos=eos,\n        U=U,\n        cfl=0.2,\n        left_boundary=TransmissiveBoundary(),\n        right_boundary=TransmissiveBoundary(),\n        right_external_face_flux_override=hook,\n        enable_phase_budget=False,\n        enable_energy_budget=False,\n        enable_interface_budget=False,\n    )\n    candidate_dt = solver.compute_dt()\n    accepted_dt = 0.5 * candidate_dt\n    history = solver.run(t_end=candidate_dt, max_steps=2, sample_every=1)\n    assert hook.validation_calls == 3\n    assert len(history) == 3\n    first = history[1]\n    assert first["dt_s"] == pytest.approx(accepted_dt)\n    assert first["time_s"] == pytest.approx(accepted_dt)\n    prim = solver.eos.primitive_from_conserved(solver.U)\n    expected_cfl = float(\n        np.max((np.abs(prim.u) + prim.c) * accepted_dt / grid.dx)\n    )\n    assert first["cfl_max"] == pytest.approx(expected_cfl)\n    assert history[2]["dt_s"] == pytest.approx(accepted_dt)\n    assert history[2]["time_s"] == pytest.approx(candidate_dt)\n'''
          tests = replace_once(
              tests,
              "    assert solver.step_count == 1\n\n\n"
              "def test_face_matrix_matches_independent_reference() -> None:\n",
              "    assert solver.step_count == 1\n"
              + history_test
              + "\n\n@requires_coolprop\n"
              "def test_face_matrix_matches_independent_reference() -> None:\n",
              "halving history regression insertion",
          )

          for function_name in (
              "test_exact_closed_and_zero_drop_identities",
              "test_one_step_actual_solver_matches_independent_reference",
              "test_declared_face_guards_are_atomic_outcomes",
              "test_stagnation_reconstruction_guard_is_atomic",
              "test_twelve_halving_exhaustion_is_atomic",
              "test_face_application_order_keeps_vapor_flux_exact_zero",
          ):
              tests = replace_once(
                  tests,
                  f"def {function_name}() -> None:\n",
                  f"@requires_coolprop\ndef {function_name}() -> None:\n",
                  f"CoolProp marker for {function_name}",
              )
          test_path.write_text(tests, encoding="utf-8")

          # P1: Japanese-first retained authority report.
          authority_path = Path(
              "src/liquid_gas_transient/u3_b2_fvm_discharge_adapter_authoritative.py"
          )
          authority = authority_path.read_text(encoding="utf-8")
          start = authority.index("    report = [\n")
          end_marker = (
              '    (output_dir / "report.md").write_text('
              '"\\n".join(report), encoding="utf-8")\n'
          )
          end = authority.index(end_marker, start) + len(end_marker)
          japanese_report = '''    report = [\n        "# Stage 7 U3 B2 — FVM流出面Adapter authority",\n        "",\n        "production側の単相Adapterを、固定sourceから再生成した独立U3 B2 Referenceと比較した。",\n        "Adapter sourceはB2 Reference moduleをimportせず、B2固有のface mappingと",\n        "one-step更新を別経路で実装している。本authorityの対象はface mappingと、",\n        "32-cell配管における実際の保存形FVM 1 stepのみである。",\n        "",\n        "## 結果",\n        "",\n        f"- Adapter source SHA: `{source_git_sha}`",\n        f"- pinned Reference source SHA: `{reference_source_git_sha}`",\n        (\n            "- historical Reference Artifact: "\n            f"ID `{reference_artifact_id}` / ZIP SHA256 "\n            f"`{reference_artifact_zip_sha256}`"\n        ),\n        f"- property backend: `{provider.backend_name} {provider.version}`",\n        f"- face rows: `{len(face_rows)}`",\n        f"- conserved-flux comparisons: `{len(face_comparisons)}` / 全件PASS",\n        "- actual FvmSolver one-step comparison: `PASS`",\n        f"- Guard rows: `{len(guard_rows)}` / outcome・atomicityとも全件PASS",\n        f"- dedicated JUnit: `{junit['dedicated_junit.xml']}`",\n        f"- related JUnit: `{junit['related_junit.xml']}`",\n        f"- full JUnit: `{junit['full_repository_junit.xml']}`",\n        "",\n        "## merge後の昇格候補",\n        "",\n        "expected-head mergeとcentral record synchronizationの完了後に限り、",\n        "本authorityは次のformal flag昇格を支持できる。",\n        "",\n        "```text",\n        "u3_b2_fvm_adapter_implemented = true",\n        "single_phase_fvm_discharge_mapping_verified = true",\n        "```",\n        "",\n        "## 未承認の範囲",\n        "",\n        "次のformal flagはfalseのまま維持する。",\n        "",\n        "```text",\n        "u3_b2_finite_pipe_execution_complete = false",\n        "single_phase_finite_pipe_coupling_verified = false",\n        "u3_b2_verification_benchmark_accepted = false",\n        "physical_discharge_boundary_approved = false",\n        "physical_validation = false",\n        "design_use_acceptance = false",\n        "production_hem_activation_approved = false",\n        "```",\n        "",\n        "本結果はfinite-pipe応答、物理精度、設計利用またはproduction readinessを承認しない。",\n        "",\n    ]\n    (output_dir / "report.md").write_text(\n        "\\n".join(report), encoding="utf-8"\n    )\n'''
          authority = authority[:start] + japanese_report + authority[end:]
          authority_path.write_text(authority, encoding="utf-8")

          # Japanese-first checked-in verification report, preserving scope and claims.
          doc_path = Path("docs/verification/stage7_u3_b2_fvm_discharge_adapter.md")
          doc_path.write_text('''# Stage 7 U3 B2 — FVM流出面Adapter\n\n## 1. 現在の状態\n\n```text\nIMPLEMENTATION CANDIDATE\nFACE / ONE-STEP AUTHORITY PENDING\nFINITE-PIPE NOT EXECUTED\n```\n\n本incrementでは、accepted U3 B1単相流出componentを、一次元保存形FVM solverの右外部面へ接続する。対象はVerificationのみであり、物理的にValidation済みのCO2 blowdown boundaryを承認しない。\n\n## 2. 固定済みauthority\n\n```text\nIssue: #135\nB2 Contract: #136 / 75661d9464ea079203b97e8274321d7d7ab2b9c1 / cffc32c257f58942e602614d69b6dad49bd1add8\nB2 Reference: #138 / 0e2c8188961175b3c2cd56836296e713735bf8d9 / 4a70a831bb317ea70218e93801c469a12d7e046e\naccepted B1 Adapter source: 5939f152180fbc6ce9a638eeca670b34e1a6650f\nReference authority run / Artifact: 31203989733 / 9007750537\nReference ZIP SHA256: 1816e60920052391cb9ffde9242597b56571c9ed113c60ece8aa9f32cdb8c7cd\n```\n\nB1 equation、coefficient placement、critical-search rule、case condition、Guard disposition、accepted toleranceは変更しない。authority workflowは、現在のB1 Adapter file blobがaccepted source SHA上のblobと同一であることを要求する。\n\n## 3. 実装独立性\n\n```text\nAdapter imports U3 B2 Reference module:       false\nshared B2 face-mapping helper:                 false\nshared B2 one-step helper:                     false\nshared B2 inventory helper:                    false\nshared B2 acoustic helper:                     false\naccepted B1 Adapter reused as upstream law:    true\nReference used only as comparison target:      true\n```\n\nproduction側はCoolProp `AbstractState`の`Dmass / Umass`および`Hmass / Smass`経路を使用する。独立Referenceは別の`PropsSI`経路を維持する。\n\n## 4. Solverへの接続順序\n\n```text\nghost-state Rusanov\n→ internal-interface override\n→ B2 right external-face override\n→ trial conservative update\n→ single-phase / positivity validation\n→ accepted boundary budget\n→ committed conservative state\n```\n\nhookが`None`の場合は既存solver経路を保持する。候補時間刻みは、既存CFL、adjacent-cell質量・energyの10% removal limit、および`t_end - t`の最小値とする。trial拒否時は最大12回まで決定論的に半減し、全試行が失敗した場合は`BOUNDARY_UPDATE_POSITIVITY_FAILURE`を返す。失敗時はsolver state、time、step count、boundary budgetを変更しない。\n\n`FvmSolver.run()`の履歴には、候補dtではなく`step()`が実際に採用したhalving後のdtを記録する。\n\n## 5. 右外部面への直接mapping\n\n```text\nA_open   = A_pipe * opening\nA_closed = A_pipe - A_open\n\nI_dot_total\n  = m_dot_B1 * u_eff_B1\n  + p_d * A_open\n  + p_i * A_closed\n\nF_right\n  = [m_dot_B1 / A_pipe,\n     I_dot_total / A_pipe,\n     E_dot_B1 / A_pipe,\n     0]\n```\n\ndischarge ghost primitiveは合成しない。advective momentum streamとstatic pressure forceは別々に追跡する。closed caseとlocked static-coordinate zero-drop caseでは、`F_right = [0, p_i, 0, 0]`をexactに保持する。\n\n## 6. Face / one-step authority条件\n\n正式workflowは、pinned sourceと同一の独立Referenceを再生成し、次を証明する。\n\n```text\n13 face rows\n52 conserved-flux comparisons\n1 actual 32-cell / CFL 0.10 FvmSolver step\n7 Guard outcomes\nmaximum 12-halving atomic exhaustion\nexact single-phase rho*xv = 0\naccepted B1 Adapter source/blob identity\n```\n\nテストはdedicated Adapter、related U3、full repositoryの3層とし、CoolProp 8.0.0を固定導入したauthority環境ではJUnitのskip / failure / errorを`0 / 0 / 0`とする。CoolProp未導入環境ではCoolProp依存testだけを明示skipする。\n\n保持Artifactには、summary、3 contract copies、runtime/Git provenance、face/one-step/Guard CSV、parity figure、report、3 JUnit、完全な内部SHA256 manifestを含める。\n\nprovenanceでは、analysis/checkout/Reference/accepted B1 Adapter/Adapterの各source SHA、B1 Adapter pinned/current blob identity、historical Reference Artifact ID/ZIP SHA256、contract source/artifact SHA256、runtime versions、workflow run identity、checkout cleanlinessを分離して保持する。\n\n## 7. merge後の昇格候補\n\n最終headに対するauthority SUCCESS、Artifact監査、review closeout、expected-head mergeの後に限り、次を昇格候補とする。\n\n```text\nu3_b2_fvm_adapter_implemented = true\nsingle_phase_fvm_discharge_mapping_verified = true\n```\n\n## 8. 未承認の範囲\n\n次はfalseのまま維持する。\n\n```text\nu3_b2_finite_pipe_execution_complete = false\nsingle_phase_finite_pipe_coupling_verified = false\nu3_b2_verification_benchmark_accepted = false\nphysical_discharge_boundary_approved = false\ntwo_phase_critical_discharge_accuracy_approved = false\nintegrated_blowdown_model_approved = false\nphysical_validation = false\ndesign_use_acceptance = false\nproduction_hem_activation_approved = false\n```\n\n本incrementはfinite-pipe応答、inventory/acoustic closure、mesh/CFL characterization、物理精度、commercial-code agreement、実験Validation、design applicabilityまたはproduction readinessを承認しない。\n''', encoding="utf-8")

          # Dedicated inventory becomes 11 and appended report heading is Japanese.
          workflow_path = Path(
              ".github/workflows/stage7-u3-b2-fvm-adapter-face-one-step.yml"
          )
          workflow = workflow_path.read_text(encoding="utf-8")
          workflow = replace_once(
              workflow,
              '"dedicated_junit.xml": (10, 10),',
              '"dedicated_junit.xml": (11, 11),',
              "dedicated exact test count",
          )
          workflow = replace_once(
              workflow,
              '"\\n\\n## Authoritative workflow provenance\\n\\n"',
              '"\\n\\n## 正式workflow provenance\\n\\n"',
              "Japanese workflow report heading",
          )
          workflow_path.write_text(workflow, encoding="utf-8")
          PY

          rm -f .github/workflows/agent-u3-b2-review-feedback-fixes.yml
          python -m py_compile \
            src/liquid_gas_transient/solver.py \
            src/liquid_gas_transient/u3_b2_fvm_discharge_adapter_authoritative.py \
            tests/test_stage7_u3_b2_fvm_discharge_adapter.py
          git diff --check
          test ! -e .github/workflows/agent-u3-b2-review-feedback-fixes.yml
          grep -q 'accepted_dt = self.step(candidate_dt)' src/liquid_gas_transient/solver.py
          grep -q 'dedicated_junit.xml": (11, 11)' \
            .github/workflows/stage7-u3-b2-fvm-adapter-face-one-step.yml

      - name: Run dependency-free review regression subset
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_stage7_u3_b2_fvm_discharge_adapter.py \
            -k 'adapter_does_not_import or solver_without_hook or run_history_records or inventory_orientation' \
            --strict-markers

      - name: Commit review fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Address U3 B2 Adapter review feedback"
          git push origin HEAD:agent/u3-b2-fvm-adapter-clean
