name: Stage 7 Gate 9 D3 Acoustic Attempts

on:
  pull_request:
    paths:
      - "src/liquid_gas_transient/hem_acoustic_attempt_diagnostics.py"
      - "tests/test_stage7_lco2_hem_gate9_acoustic_attempt_diagnostics.py"
      - "docs/verification/stage7_gate9_d3_acoustic_attempt_diagnostics.md"
      - ".github/workflows/stage7-gate9-acoustic-attempts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage7-gate9-d3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: src
  PYTHONDONTWRITEBYTECODE: "1"
  MPLBACKEND: Agg
  ANALYSIS_SOURCE_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  gate9-d3-acoustic-attempts:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install fixed dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy matplotlib pytest 'CoolProp==8.0.0'

      - name: Assert pristine checkout
        run: |
          echo "checkout_sha=$(git rev-parse HEAD)"
          status="$(git status --porcelain=v1 --untracked-files=all)"
          printf 'pre_execution_git_status=%s\n' "$status"
          test -z "$status"

      - name: Execute D3 diagnostic OFF/ON identity pair
        run: |
          temporary_output="${RUNNER_TEMP}/stage7-gate9-d3"
          repository_output="artifacts/stage7-gate9-d3"
          rm -rf "$temporary_output" "$repository_output"
          python -m liquid_gas_transient.hem_acoustic_attempt_diagnostics \
            --output-dir "$temporary_output"
          tracked_status="$(git status --porcelain=v1 --untracked-files=no)"
          printf 'post_execution_tracked_git_status=%s\n' "$tracked_status"
          test -z "$tracked_status"
          mkdir -p "$repository_output"
          cp -a "$temporary_output/." "$repository_output/"

      - name: Inspect D3 evidence contract
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          target = Path('artifacts/stage7-gate9-d3')
          summary = json.loads((target / 'summary.json').read_text(encoding='utf-8'))
          assert summary['schema_version'] == 'stage7_gate9_d3_acoustic_attempts_increment1_v1'
          assert summary['scope'] == 'verification_only_transparent_acoustic_evaluator_proxy'
          assert summary['case_id'] == 'pipeline_crossing_candidate_p5m5_to_p2m5'
          assert summary['cfl'] == 0.10
          assert summary['property_backend_name'] == 'coolprop_co2'
          assert summary['property_backend_design_status'] == (
              'VERIFICATION_ONLY_NOT_APPROVED_FOR_DESIGN_USE'
          )
          assert summary['production_acoustic_evaluation_count'] > 0
          assert summary['evaluation_result_record_count'] > 0
          assert summary['all_evaluations_have_final_record'] is True
          assert summary['acoustic_event_record_count'] > 0
          assert summary['stencil_attempt_record_count'] > 0
          assert summary['density_attempt_record_count'] > 0
          assert summary['energy_attempt_record_count'] > 0
          assert summary['existing_max_step_halvings'] == 12
          assert summary['maximum_observed_halving_index'] <= 12
          assert summary['halving_limit_preserved'] is True
          assert summary['diagnostic_off_on_identity'] is True
          assert summary['event_alignment_status'] == (
              'PENDING_D4_EVENT_ALIGNED_STEP_CELL_STAGE_MAPPING'
          )
          candidate = summary['candidate_summary']
          assert candidate['candidate_step'] == 125
          assert candidate['candidate_time_s'] == 7.999325695335248e-4
          assert candidate['candidate_cells'] == [29]
          assert candidate['maximum_candidate_q_equilibrium'] == 3.773646403587342e-6
          assert candidate['formal_outcome'] == 'ACCEPTED_FIRST_CROSSING'
          assert summary['production_sound_speed_formula_changed'] is False
          assert summary['central_stencil_loop_changed'] is False
          assert summary['maximum_halving_count_changed'] is False
          assert summary['one_sided_fallback_added'] is False
          assert summary['trial_state_clipping_added'] is False
          assert summary['property_evaluation_order_changed'] is False
          assert summary['Gate_9_execution_complete'] is False
          assert summary['physical_validation'] is False
          assert summary['design_use_acceptance'] is False

          with (target / 'acoustic_attempt_history.csv').open(
              newline='', encoding='utf-8'
          ) as handle:
              rows = list(csv.DictReader(handle))
          assert len(rows) == summary['acoustic_event_record_count']
          assert {row['event_kind'] for row in rows} >= {
              'STENCIL_ATTEMPT', 'EVALUATION_RESULT'
          }
          assert all(
              row['halving_index'] == '' or 0 <= int(row['halving_index']) <= 12
              for row in rows
          )
          PY

      - name: Compile and diff checks
        run: |
          python -m compileall -q src tests
          git diff --check

      - name: Run dedicated D3 tests
        run: |
          python -m pytest -q \
            tests/test_stage7_lco2_hem_gate9_acoustic_attempt_diagnostics.py \
            --strict-markers \
            --junitxml=gate9-d3-dedicated.xml

      - name: Run related Stage 7 regressions
        run: |
          python -m pytest -q \
            tests/test_stage7_lco2_hem_equilibrium_sound_speed.py \
            tests/test_stage7_gate9_contract.py \
            tests/test_stage7_lco2_hem_pipeline_depressurization_increment2.py \
            tests/test_stage7_lco2_hem_gate9_instrumentation_scaffold.py \
            tests/test_stage7_lco2_hem_gate9_rusanov_decomposition.py \
            tests/test_stage7_lco2_hem_gate9_acoustic_attempt_diagnostics.py \
            --strict-markers \
            --junitxml=related-stage7.xml

      - name: Run full repository tests
        run: |
          python -m pytest -q --strict-markers --junitxml=full-repository.xml

      - name: Assert authoritative JUnit is clean
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          for name in (
              'gate9-d3-dedicated.xml',
              'related-stage7.xml',
              'full-repository.xml',
          ):
              root = ET.parse(Path(name)).getroot()
              suites = [root] if root.tag == 'testsuite' else list(root.findall('testsuite'))
              totals = {
                  key: sum(int(s.attrib.get(key, 0)) for s in suites)
                  for key in ('tests', 'skipped', 'failures', 'errors')
              }
              print(name, totals)
              assert totals['skipped'] == 0
              assert totals['failures'] == 0
              assert totals['errors'] == 0
          PY

      - name: Upload D3 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stage7-gate9-d3-${{ github.run_id }}
          path: |
            artifacts/stage7-gate9-d3
            gate9-d3-dedicated.xml
            related-stage7.xml
            full-repository.xml
          if-no-files-found: warn
