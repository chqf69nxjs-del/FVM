name: Stage 7 Pipeline Depressurization Increment 2 Validation

on:
  push:
    branches:
      - agent/stage7-pipeline-depressurization-first-crossing
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage7-pipeline-depressurization-increment2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-pipeline-increment2:
    name: validate-pipeline-increment2
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MPLBACKEND: Agg
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e .
          python -m pip install pytest "CoolProp==8.0.0"

      - name: Smoke check environment
        run: |
          python - <<'PY'
          import CoolProp
          import CoolProp.CoolProp as CP
          import numpy as np

          rho = CP.PropsSI("Dmass", "P", 5.0e6, "T", 280.0, "CO2")
          print("CoolProp:", CoolProp.__version__)
          print("NumPy:", np.__version__)
          print("CO2 density smoke kg/m3:", rho)
          assert CoolProp.__version__ == "8.0.0"
          assert np.isfinite(rho) and rho > 0.0
          PY

      - name: Compile and diff checks
        run: |
          python -m compileall -q src tests
          git diff --check

      - name: Run dependency-free Increment 2 tests
        run: |
          mkdir -p artifacts/junit
          python -m pytest -q \
            tests/test_stage7_lco2_hem_pipeline_depressurization_increment2.py \
            -m "not coolprop_installed" \
            --strict-markers \
            --junitxml=artifacts/junit/increment2-pure.xml

      - name: Generate authoritative Increment 2 artifacts
        run: |
          mkdir -p artifacts/stage7-pipeline-increment2
          python -m liquid_gas_transient.hem_pipeline_depressurization_first_crossing \
            --output-dir artifacts/stage7-pipeline-increment2 \
            | tee artifacts/stage7-pipeline-increment2/runner_stdout.txt

      - name: Print observed fixed-matrix outcomes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts/stage7-pipeline-increment2")
          payload = json.loads(
              (root / "stage7_lco2_hem_pipeline_depressurization_increment2.json").read_text(
                  encoding="utf-8"
              )
          )
          print(json.dumps(payload["outcome_counts"], indent=2, sort_keys=True))
          for case in payload["cases"]:
              print(
                  case["case_id"],
                  "outcome=", case["outcome"],
                  "steps=", case["step_count"],
                  "time=", case["final_time_s"],
                  "crossing_cells=", case["crossing_cell_indices"],
                  "max_q=", case["maximum_crossing_quality"],
                  "failure=", case["failure_reason"],
              )
          PY

      - name: Run installed-CoolProp Increment 2 tests
        run: |
          python -m pytest -q \
            tests/test_stage7_lco2_hem_pipeline_depressurization_increment2.py \
            -m coolprop_installed \
            --strict-markers \
            --junitxml=artifacts/junit/increment2-coolprop.xml

      - name: Validate generated artifact contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts/stage7-pipeline-increment2")
          payload = json.loads(
              (root / "stage7_lco2_hem_pipeline_depressurization_increment2.json").read_text(
                  encoding="utf-8"
              )
          )
          assert payload["case_count"] == 3
          assert payload["pipeline_depressurization_executed"] is True
          assert payload["all_fixed_cases_completed"] is False
          assert payload["fixed_matrix_explicit_outcomes_retained"] is True
          assert payload["gate_p2_passed"] is False
          assert payload["outcome_counts"]["ACCEPTED_FIRST_CROSSING"] == 2
          assert payload["outcome_counts"]["GUARD_FAILURE"] == 1
          assert payload["subthreshold_crossing_case_ids"] == [
              "pipeline_liquid_control_p5m5_to_p4m5"
          ]
          assert payload["two_mpa_candidate_outcome"] == "ACCEPTED_FIRST_CROSSING"
          assert payload["algorithms_or_tolerances_tuned"] is False
          assert payload["production_default_changed"] is False
          assert payload["production_hem_activation_approved"] is False
          assert payload["physical_validation"] is False
          assert payload["design_use_acceptance"] is False
          assert len(payload["boundary_path"]) == 195
          by_id = {case["case_id"]: case for case in payload["cases"]}
          assert by_id[
              "pipeline_crossing_candidate_p5m5_to_p2m5"
          ]["outcome"] == "ACCEPTED_FIRST_CROSSING"
          assert by_id[
              "pipeline_moderate_diagnostic_p5m5_to_p3m5"
          ]["outcome"] == "ACCEPTED_FIRST_CROSSING"
          control = by_id["pipeline_liquid_control_p5m5_to_p4m5"]
          assert control["outcome"] == "GUARD_FAILURE"
          assert "below the fixed minimum" in control["failure_reason"]
          assert control["crossing_cell_indices"]
          assert 0.0 < control["maximum_crossing_quality"] < 1.0e-6
          for case in payload["cases"]:
              assert case["preflight_accepted_sample_count"] == 65
              assert case["reverse_flow_fallback_count"] == 0
          PY

      - name: Run related pre-existing Stage 7 HEM tests
        run: |
          python -m pytest -q \
            tests/test_stage7_lco2_hem_pipeline_depressurization_spec.py \
            tests/test_stage7_lco2_hem_pipeline_depressurization_boundary_increment1.py \
            tests/test_stage7_lco2_hem_liquid_to_two_phase_minimal_fvm_dry_run.py \
            tests/test_stage7_lco2_hem_liquid_to_two_phase_projected_fvm_dry_run.py \
            tests/test_stage7_lco2_hem_liquid_to_two_phase_first_crossing_case_ab.py \
            --strict-markers \
            --junitxml=artifacts/junit/increment2-related.xml

      - name: Run full repository tests
        run: |
          python -m pytest -q \
            --strict-markers \
            --junitxml=artifacts/junit/full-repository.xml

      - name: Assert no skipped or failed authoritative tests
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          for path in sorted(Path("artifacts/junit").glob("*.xml")):
              root = ET.parse(path).getroot()
              cases = root.findall(".//testcase")
              skipped = root.findall(".//skipped")
              failures = root.findall(".//failure")
              errors = root.findall(".//error")
              print(
                  path.name,
                  f"testcases={len(cases)}",
                  f"skipped={len(skipped)}",
                  f"failures={len(failures)}",
                  f"errors={len(errors)}",
              )
              assert cases
              assert not skipped
              assert not failures
              assert not errors
          PY

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stage7-pipeline-depressurization-increment2-${{ github.run_id }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 14
