name: Stage 7 U3 B2 Finite-Pipe Baseline Preflight R1

on:
  push:
    branches:
      - agent/stage7-u3-b2-finite-pipe-baseline-preflight-r1
    paths:
      - src/liquid_gas_transient/u3_b2_fvm_discharge_finite_pipe.py
      - tests/test_stage7_u3_b2_finite_pipe.py
      - docs/verification/stage7_u3_b2_finite_pipe_baseline.md
      - .github/workflows/stage7-u3-b2-finite-pipe-baseline-preflight-r1.yml
  pull_request:
    branches:
      - agent/stage7-p2-hne-controlled-finite-pipe-coupling-a3-2
    paths:
      - src/liquid_gas_transient/u3_b2_fvm_discharge_finite_pipe.py
      - tests/test_stage7_u3_b2_finite_pipe.py
      - docs/verification/stage7_u3_b2_finite_pipe_baseline.md
      - .github/workflows/stage7-u3-b2-finite-pipe-baseline-preflight-r1.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage7-u3-b2-finite-pipe-baseline-preflight-r1-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: src
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONPYCACHEPREFIX: /tmp/u3-b2-finite-pipe-pycache
  MPLBACKEND: Agg
  ANALYSIS_SOURCE_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_A3_2_SHA: af141cf8decd208ce84a4e3d9a1e0234f1d97aa2
  ACCEPTED_ADAPTER_SOURCE_SHA: 732b7259ac3738c47f7eb7cbd23d8e49195a0d7b

jobs:
  baseline-preflight:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.ANALYSIS_SOURCE_GIT_SHA }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            'numpy==2.5.1' \
            'matplotlib==3.11.1' \
            'pytest==9.1.1' \
            'CoolProp==8.0.0'

      - name: Assert source, Adapter identity, and four-file envelope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${ANALYSIS_SOURCE_GIT_SHA}"
          git cat-file -e "${BASE_A3_2_SHA}^{commit}"
          adapter=src/liquid_gas_transient/u3_b2_fvm_discharge_adapter.py
          pinned="$(git rev-parse "${ACCEPTED_ADAPTER_SOURCE_SHA}:${adapter}")"
          current="$(git rev-parse "HEAD:${adapter}")"
          test "${pinned}" = "${current}"
          git diff --name-only "${BASE_A3_2_SHA}" HEAD | sort > /tmp/actual.txt
          printf '%s\n' \
            '.github/workflows/stage7-u3-b2-finite-pipe-baseline-preflight-r1.yml' \
            'docs/verification/stage7_u3_b2_finite_pipe_baseline.md' \
            'src/liquid_gas_transient/u3_b2_fvm_discharge_finite_pipe.py' \
            'tests/test_stage7_u3_b2_finite_pipe.py' \
            | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile and independence checks
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${PYTHONPYCACHEPREFIX}"
          python -m py_compile \
            src/liquid_gas_transient/u3_b2_fvm_discharge_finite_pipe.py \
            tests/test_stage7_u3_b2_finite_pipe.py
          git diff --check
          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path('src/liquid_gas_transient/u3_b2_fvm_discharge_finite_pipe.py')
          tree = ast.parse(source.read_text(encoding='utf-8'))
          imported = []
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imported.extend(alias.name for alias in node.names)
              elif isinstance(node, ast.ImportFrom):
                  imported.append(node.module or '')
          assert not any('u3_b2_fvm_discharge_reference' in name for name in imported)
          PY
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Run focused and related U3 tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_stage7_u3_b2_finite_pipe.py \
            --strict-markers \
            --junitxml=finite_pipe_dedicated_junit.xml
          python -m pytest -q \
            tests/test_stage7_u3_b1_critical_state_contract.py \
            tests/test_stage7_u3_b1_critical_state_reference.py \
            tests/test_stage7_u3_b1_critical_state_authoritative.py \
            tests/test_stage7_u3_b1_critical_state_adapter.py \
            tests/test_stage7_u3_b2_fvm_discharge_coupling_contract.py \
            tests/test_stage7_u3_b2_fvm_discharge_coupling_extension_contract.py \
            tests/test_stage7_u3_b2_fvm_discharge_reference.py \
            tests/test_stage7_u3_b2_fvm_discharge_adapter.py \
            tests/test_stage7_u3_b2_finite_pipe.py \
            --strict-markers \
            --junitxml=finite_pipe_related_junit.xml

      - name: Execute locked three-family baseline
        shell: bash
        run: |
          set -euo pipefail
          output=artifacts/stage7-u3-b2-finite-pipe-baseline-preflight-r1
          rm -rf "${output}"
          python -m liquid_gas_transient.u3_b2_fvm_discharge_finite_pipe \
            --contract docs/verification/stage7_u3_b2_fvm_discharge_coupling_contract_v1.json \
            --extension-contract docs/verification/stage7_u3_b2_fvm_discharge_coupling_event_provenance_contract_v1.json \
            --b1-contract docs/verification/stage7_u3_b1_critical_state_contract_v1.json \
            --output-dir "${output}" \
            --source-git-sha "${ANALYSIS_SOURCE_GIT_SHA}"

      - name: Gate evidence and JUnit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import hashlib
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          target = Path('artifacts/stage7-u3-b2-finite-pipe-baseline-preflight-r1')
          expected = {
              'summary.json', 'report.md', 'benchmark_contract.json',
              'event_provenance_contract.json', 'b1_component_contract.json',
              'baseline_run_summary.csv', 'baseline_step_history.csv',
              'baseline_probe_history.csv', 'baseline_acoustic_events.csv',
              'artifact_sha256.txt',
          }
          assert {path.name for path in target.iterdir()} == expected
          summary = json.loads((target / 'summary.json').read_text(encoding='utf-8'))
          assert summary['schema_version'] == 'stage7_u3_b2_finite_pipe_baseline_v1'
          assert summary['analysis_source_git_sha'] == '${{ env.ANALYSIS_SOURCE_GIT_SHA }}'
          assert summary['property_backend'] == 'CoolProp'
          assert summary['property_backend_version'] == '8.0.0'
          assert summary['run_count'] == 3
          assert summary['all_baseline_runs_passed'] is True
          assert summary['candidate_baseline_finite_pipe_execution_passed'] is True
          for key in (
              'u3_b2_finite_pipe_execution_complete',
              'single_phase_finite_pipe_coupling_verified',
              'u3_b2_verification_benchmark_accepted',
              'physical_validation',
              'design_use_acceptance',
              'production_hem_activation_approved',
          ):
              assert summary[key] is False

          with (target / 'baseline_run_summary.csv').open(newline='', encoding='utf-8') as handle:
              runs = list(csv.DictReader(handle))
          assert len(runs) == 3
          for field in (
              'formal_outcome_matches_contract', 'mass_inventory_passed',
              'energy_inventory_passed', 'momentum_inventory_passed',
              'right_momentum_decomposition_passed', 'vapor_identity_passed',
          ):
              assert all(row[field] == 'True' for row in runs)

          with (target / 'baseline_acoustic_events.csv').open(newline='', encoding='utf-8') as handle:
              events = list(csv.DictReader(handle))
          assert len(events) == 6
          assert all(row['comparison_passed'] == 'True' for row in events)

          manifest = {}
          for line in (target / 'artifact_sha256.txt').read_text(encoding='utf-8').splitlines():
              digest, name = line.split('  ', 1)
              manifest[name] = digest
          assert set(manifest) == expected - {'artifact_sha256.txt'}
          for name, digest in manifest.items():
              assert hashlib.sha256((target / name).read_bytes()).hexdigest() == digest

          for name in ('finite_pipe_dedicated_junit.xml', 'finite_pipe_related_junit.xml'):
              root = ET.parse(name).getroot()
              suites = [root] if root.tag == 'testsuite' else list(root.findall('testsuite'))
              totals = {
                  key: sum(int(suite.attrib.get(key, 0)) for suite in suites)
                  for key in ('tests', 'skipped', 'failures', 'errors')
              }
              assert totals['tests'] > 0
              assert totals['failures'] == 0
              assert totals['errors'] == 0
              print(name, totals)
          print('run_count=' + str(summary['run_count']))
          print('accepted_steps=' + str(summary['total_accepted_steps']))
          PY
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stage7-u3-b2-finite-pipe-baseline-preflight-r1-${{ github.run_id }}
          path: |
            artifacts/stage7-u3-b2-finite-pipe-baseline-preflight-r1
            finite_pipe_dedicated_junit.xml
            finite_pipe_related_junit.xml
          if-no-files-found: warn
          compression-level: 6
