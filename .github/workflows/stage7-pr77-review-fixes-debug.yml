name: Stage 7 PR 77 Review Fixes Debug

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-review-fixes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run patch script and capture diagnostics
        shell: bash
        run: |
          set +e
          awk '
            /python - <<'"'"'PY'"'"'/{capture=1; next}
            capture && /^          PY$/{exit}
            capture {sub(/^          /, ""); print}
          ' .github/workflows/stage7-pr77-review-fixes.yml > /tmp/pr77_review_fixes.py
          python /tmp/pr77_review_fixes.py > /tmp/pr77-review-fixes.log 2>&1
          status=$?
          echo "exit_status=$status" >> /tmp/pr77-review-fixes.log
          cat /tmp/pr77-review-fixes.log
          exit 0

      - name: Upload diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: stage7-pr77-review-fixes-debug-${{ github.run_id }}
          path: /tmp/pr77-review-fixes.log
          if-no-files-found: error
          retention-days: 2
