name: Stage 7 Pipeline Mesh Sensitivity Validation

on:
  push:
    branches:
      - agent/stage7-pipeline-4mpa-mesh-sensitivity
  pull_request:
  workflow_dispatch:

env:
  PYTHONPATH: src
  MPLBACKEND: Agg

jobs:
  validate-mesh-sensitivity:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e '.[plotting]'
          python -m pip install pytest 'CoolProp==8.0.0'
      - name: Smoke check
        run: |
          python - <<'PY'
          import CoolProp, matplotlib, numpy
          print('CoolProp', CoolProp.__version__)
          print('matplotlib', matplotlib.__version__)
          print('numpy', numpy.__version__)
          PY
      - name: Compile and diff checks
        run: |
          python -m compileall -q src tests
          git diff --check
      - name: Run dependency-free mesh contract tests
        run: |
          python -m pytest -q \
            tests/test_stage7_lco2_hem_pipeline_4mpa_mesh_sensitivity.py \
            --strict-markers \
            --junitxml=mesh-pure.xml
      - name: Generate authoritative nine-run mesh artifacts
        run: |
          python -m liquid_gas_transient.hem_pipeline_4mpa_mesh_sensitivity \
            --output-dir artifacts/stage7-pipeline-mesh-sensitivity
      - name: Inspect authoritative mesh summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('artifacts/stage7-pipeline-mesh-sensitivity/4mpa_mesh_sensitivity_summary.json')
          summary = json.loads(path.read_text(encoding='utf-8'))
          print(json.dumps(summary, indent=2, sort_keys=True))
          assert summary['case_count'] == 9
          assert summary['mesh_cell_counts'] == [32, 64, 128]
          assert summary['mesh_step_caps'] == {'32': 2000, '64': 4000, '128': 8000}
          assert summary['thirty_two_cell_baseline_reproduced_exactly'] is True
          assert summary['only_mesh_fields_varied'] is True
          assert summary['CFL'] == 0.10
          assert summary['Gate_P2_passed'] is False
          assert summary['four_mpa_classifications']
          assert len(summary['cases']) == 9
          PY
      - name: Run PR77 and PR79 regression tests
        run: |
          python -m pytest -q \
            tests/test_stage7_lco2_hem_pipeline_depressurization_increment2.py \
            tests/test_stage7_lco2_hem_pipeline_4mpa_subthreshold_forensics.py \
            tests/test_stage7_lco2_hem_pipeline_4mpa_subthreshold_forensics_contract.py \
            --strict-markers \
            --junitxml=related-stage7.xml
      - name: Run full repository tests
        run: |
          python -m pytest -q --strict-markers --junitxml=full-repository.xml
      - name: Assert authoritative tests were not skipped or failed
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          for name in ('mesh-pure.xml', 'related-stage7.xml', 'full-repository.xml'):
              root = ET.parse(Path(name)).getroot()
              suites = [root] if root.tag == 'testsuite' else list(root.findall('testsuite'))
              values = {
                  key: sum(int(s.attrib.get(key, 0)) for s in suites)
                  for key in ('tests', 'skipped', 'failures', 'errors')
              }
              print(name, values)
              assert values['skipped'] == 0
              assert values['failures'] == 0
              assert values['errors'] == 0
          PY
      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stage7-pipeline-mesh-sensitivity-${{ github.run_id }}
          path: |
            artifacts/stage7-pipeline-mesh-sensitivity
            mesh-pure.xml
            related-stage7.xml
            full-repository.xml
          if-no-files-found: warn
