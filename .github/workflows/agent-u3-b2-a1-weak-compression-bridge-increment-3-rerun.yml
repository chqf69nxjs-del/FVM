name: Agent U3 B2 A1 Weak Compression Bridge Increment 3 Rerun

on:
  push:
    branches: [agent/u3-b2-a1-wave-curve-review]
    paths:
      - "docs/verification/stage7_u3_b2_a1_weak_compression_bridge_v0_1_increment_3_scope_roundoff_correction.md"
      - "tools/verification/u3_b2_a1_weak_compression_bridge_short_run_scope_roundoff.py"
      - ".github/workflows/agent-u3-b2-a1-weak-compression-bridge-increment-3-rerun.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-u3-b2-a1-weak-compression-bridge-increment-3-rerun
  cancel-in-progress: true

env:
  PYTHONPATH: src:tools/verification
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONPYCACHEPREFIX: /tmp/u3-b2-a1-weak-compression-inc3-rerun-pycache
  SOURCE_SHA: ${{ github.sha }}
  PARENT_SOURCE_SHA: c2149f208541ef91cf7150cdb1f08d5d0e9e628b

jobs:
  rerun-branch-aware-short-horizon:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact corrected model-review source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"

      - name: Install fixed dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            'numpy==2.5.1' \
            'CoolProp==8.0.0'

      - name: Verify narrow roundoff correction scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test -f docs/verification/stage7_u3_b2_a1_weak_compression_bridge_v0_1_increment_3_scope_roundoff_correction.md
          test -f tools/verification/u3_b2_a1_weak_compression_bridge_short_run_scope_roundoff.py
          python -m py_compile \
            tools/verification/u3_b2_characteristic_port_diagnostic.py \
            tools/verification/u3_b2_characteristic_port_root_robustness.py \
            tools/verification/u3_b2_characteristic_port_root_robustness_v4.py \
            tools/verification/u3_b2_characteristic_port_dynamic_short_model.py \
            tools/verification/u3_b2_characteristic_port_dynamic_short_hook.py \
            tools/verification/u3_b2_characteristic_port_dynamic_short_metrics.py \
            tools/verification/u3_b2_characteristic_port_two_l_over_c0.py \
            tools/verification/u3_b2_a1_wave_curve_model.py \
            tools/verification/u3_b2_a1_wave_curve_checkpoint_review.py \
            tools/verification/u3_b2_a1_neutral_endpoint_resume.py \
            tools/verification/u3_b2_a1_post_endpoint_branch_classification.py \
            tools/verification/u3_b2_a1_weak_compression_bridge_diagnostic.py \
            tools/verification/u3_b2_a1_weak_compression_bridge_one_step.py \
            tools/verification/u3_b2_a1_weak_compression_bridge_short_run.py \
            tools/verification/u3_b2_a1_weak_compression_bridge_short_run_scope_roundoff.py
          mapfile -t actual < <(
            git diff --name-only "${PARENT_SOURCE_SHA}" HEAD | sort
          )
          mapfile -t expected < <(printf '%s\n' \
            '.github/workflows/agent-u3-b2-a1-weak-compression-bridge-increment-3-rerun.yml' \
            'docs/verification/stage7_u3_b2_a1_weak_compression_bridge_v0_1_increment_3_scope_roundoff_correction.md' \
            'tools/verification/u3_b2_a1_weak_compression_bridge_short_run_scope_roundoff.py' | sort)
          diff -u \
            <(printf '%s\n' "${expected[@]}") \
            <(printf '%s\n' "${actual[@]}")
          git diff --check "${PARENT_SOURCE_SHA}" HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Rerun 32 accepted branch-aware FvmSolver steps
        shell: bash
        run: |
          set -euo pipefail
          output=artifacts/u3-b2-a1-weak-compression-bridge-increment-3-rerun
          rm -rf "${output}"
          python tools/verification/u3_b2_a1_weak_compression_bridge_short_run_scope_roundoff.py \
            --contract docs/verification/stage7_u3_b2_fvm_discharge_coupling_contract_v1.json \
            --b1-contract docs/verification/stage7_u3_b1_critical_state_contract_v1.json \
            --model-review-spec docs/verification/stage7_u3_b2_a1_weak_compression_bridge_v0_1_increment_3_model_review.md \
            --output-dir "${output}" \
            --source-git-sha "${SOURCE_SHA}"

      - name: Inspect corrected Increment 3 evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import hashlib
          import json
          import os
          from pathlib import Path

          import numpy as np

          import u3_b2_characteristic_port_root_robustness_v4 as robustness_v4

          target = Path(
              "artifacts/u3-b2-a1-weak-compression-bridge-increment-3-rerun"
          )
          expected = {
              "short_run_steps.csv",
              "short_run_roots.csv",
              "local_wave_scans.csv",
              "positive_pressure_scans.csv",
              "branch_transitions.csv",
              "short_run_states.npz",
              "summary.json",
              "report.md",
              "artifact_sha256.txt",
          }
          assert {path.name for path in target.iterdir()} == expected

          summary = json.loads(
              (target / "summary.json").read_text(encoding="utf-8")
          )
          root_tol = float(
              robustness_v4.robustness.ROOT_MASS_RESIDUAL_ABSOLUTE_KG_S
          )
          allowed = {
              "RAREFACTION",
              "NEUTRAL_ENDPOINT",
              "WEAK_COMPRESSION",
          }
          assert summary["source_git_sha"] == os.environ["SOURCE_SHA"]
          assert summary["schema_version"] == (
              "stage7_u3_b2_a1_weak_compression_bridge_v0_1_increment_3"
          )
          assert summary["parent_increment_2_reproduced"] is True
          assert summary["solver_step_before"] == 337
          assert summary["solver_step_after"] == 369
          assert summary["requested_accepted_steps"] == 32
          assert summary["accepted_steps_completed"] == 32
          assert len(summary["branch_sequence"]) == 32
          assert set(summary["branch_sequence"]).issubset(allowed)
          assert sum(summary["branch_counts"].values()) == 32
          assert summary["clear_branch_chatter_detected"] is False
          assert summary["stop_classification"] is None
          assert summary["stop_reason"] is None
          assert summary["outcome"] == (
              "WEAK_COMPRESSION_INCREMENT_3_32_STEP_PASS"
          )
          assert summary["increment_3_32_step_gate_passed"] is True
          if summary["maximum_weak_compression_chi"] is not None:
              assert 0.0 < summary["maximum_weak_compression_chi"] <= 1.0e-6
          assert summary["maximum_absolute_root_mass_residual_kg_s"] <= root_tol
          assert summary["maximum_root_mach"] < 1.0
          assert summary["minimum_root_velocity_m_s"] >= 0.0
          assert summary["final_minimum_density_kg_m3"] > 0.0
          assert summary["final_rho_xv_exact_zero"] is True
          assert summary["finite_compression_branch_approved"] is False
          assert summary["full_two_l_over_c0_passed"] is False
          assert summary["formal_state_promoted"] is False
          assert summary["u3_b2_finite_pipe_execution_complete"] is False
          assert summary["single_phase_finite_pipe_coupling_verified"] is False
          assert summary["u3_b2_verification_benchmark_accepted"] is False
          assert summary["physical_validation"] is False
          assert summary["design_use_acceptance"] is False
          assert summary["production_hem_activation_approved"] is False

          with (target / "short_run_steps.csv").open(
              newline="", encoding="utf-8"
          ) as handle:
              steps = list(csv.DictReader(handle))
          assert len(steps) == 32
          assert [int(row["requested_step"]) for row in steps] == list(
              range(338, 370)
          )
          assert [int(row["solver_step_count"]) for row in steps] == list(
              range(338, 370)
          )
          assert steps[0]["increment_2_state_exactly_reproduced"] == "True"
          assert all(row["accepted_step"] == "True" for row in steps)
          assert all(row["step_passed"] == "True" for row in steps)
          assert all(
              row["increment_3_per_step_gate_passed"] == "True"
              for row in steps
          )
          assert all(
              row["branch_classification"] in allowed for row in steps
          )
          assert all(
              abs(float(row["root_mass_residual_kg_s"])) <= root_tol
              for row in steps
          )
          assert all(row["rho_xv_exact_zero"] == "True" for row in steps)
          assert all(
              row["reverse_flow_guard_triggered"] == "False"
              for row in steps
          )
          assert all(
              row["reverse_velocity_detected"] == "False" for row in steps
          )
          assert all(row["outlet_phase_passed"] == "True" for row in steps)
          assert all(row["step_mass_passed"] == "True" for row in steps)
          assert all(row["step_momentum_passed"] == "True" for row in steps)
          assert all(row["step_energy_passed"] == "True" for row in steps)
          assert all(row["cumulative_mass_passed"] == "True" for row in steps)
          assert all(
              row["cumulative_momentum_passed"] == "True" for row in steps
          )
          assert all(row["cumulative_energy_passed"] == "True" for row in steps)

          with (target / "positive_pressure_scans.csv").open(
              newline="", encoding="utf-8"
          ) as handle:
              positive_scan = list(csv.DictReader(handle))
          assert len(positive_scan) >= 3
          assert all(
              row["scan_coordinate_correction"]
              == "requested_scan_coordinate_authoritative_realized_pressure_recorded"
              for row in positive_scan
          )
          assert all(
              row["within_weak_compression_scope"] == "True"
              for row in positive_scan
          )
          assert all(
              0.0 <= float(row["requested_chi"]) <= 1.0e-6
              for row in positive_scan
          )
          cap_rows = [
              row for row in positive_scan
              if float(row["requested_chi"]) == 1.0e-6
          ]
          assert len(cap_rows) >= 1
          assert all(
              row["within_weak_compression_scope"] == "True"
              for row in cap_rows
          )

          with (target / "short_run_roots.csv").open(
              newline="", encoding="utf-8"
          ) as handle:
              roots = list(csv.DictReader(handle))
          assert len(roots) == 32
          assert all(
              abs(float(row["root_mass_residual_kg_s"])) <= root_tol
              for row in roots
          )
          assert all(
              row["energy_port_closure_passed"] == "True" for row in roots
          )

          with (target / "branch_transitions.csv").open(
              newline="", encoding="utf-8"
          ) as handle:
              transitions = list(csv.DictReader(handle))
          assert len(transitions) == 32
          assert transitions[0]["from_solver_step"] == "337"
          assert transitions[-1]["to_solver_step"] == "369"
          assert all(
              row["clear_branch_chatter_detected"] == "False"
              for row in transitions
          )

          with np.load(target / "short_run_states.npz") as states:
              before = states["U_start"]
              after = states["U_final"]
              assert before.shape == (32, 4)
              assert after.shape == (32, 4)
              assert not np.array_equal(before, after)
              assert np.all(np.isfinite(after))
              assert np.all(after[:, 0] > 0.0)
              assert np.all(after[:, 3] == 0.0)
              assert int(states["solver_step_before"][0]) == 337
              assert int(states["solver_step_after"][0]) == 369

          manifest = {}
          for line in (target / "artifact_sha256.txt").read_text(
              encoding="utf-8"
          ).splitlines():
              digest, name = line.split("  ", 1)
              manifest[name] = digest
          assert set(manifest) == expected - {"artifact_sha256.txt"}
          for name, digest in manifest.items():
              assert hashlib.sha256((target / name).read_bytes()).hexdigest() == digest

          notice = (
              "branches={branch_counts}; transitions={branch_transition_count}; "
              "max_weak_chi={maximum_weak_compression_chi}; "
              "max_root_residual_kg_s={maximum_absolute_root_mass_residual_kg_s}; "
              "final_step={solver_step_after}; "
              "final_time_s={solver_time_after_s:.17g}; "
              "final_outlet_pressure_pa={final_outlet_pressure_pa:.17g}; "
              "final_outlet_velocity_m_s={final_outlet_velocity_m_s:.17g}; "
              "max_step_mass_residual_kg={maximum_absolute_step_mass_residual_kg:.17g}; "
              "max_step_momentum_residual_kg_m_s={maximum_absolute_step_momentum_residual_kg_m_s:.17g}; "
              "max_step_energy_residual_J={maximum_absolute_step_energy_residual_J:.17g}"
          ).format(**summary)
          print(f"::notice title=Corrected Weak Compression Increment 3 result::{notice}")
          PY

      - name: Upload corrected Increment 3 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: u3-b2-a1-weak-compression-bridge-increment-3-rerun-${{ github.run_id }}
          path: artifacts/u3-b2-a1-weak-compression-bridge-increment-3-rerun
          if-no-files-found: warn
